 30–33, печ. 29–32)", "step_title": "Морфология и классификация дельтовых систем", "summary_2_3_sentences": "Дельта формируется в месте впадения реки в морской или озёрный бассейн и объединяет три главные морфологические зоны: дельтовую равнину (рукава, береговые валы, заливы), фронт дельты (песчаные устьевые и береговые бары) и продельту (морские глины, рис. 1.14). По классификации У. Гэллоуэя (рис. 1.15–1.16) дельты подразделяются по преобладающему процессу во фронтальной части на флювиальные (речные), волновые и приливные.", "primary_difficulty": "spatial_3d_geometry", "secondary_difficulty": "terminology_bridge", "primary_difficulty_code": "Р", "secondary_difficulty_code": "В", "estimated_minutes": 8, "mechanism": "При выходе речного потока в стоячий или динамичный бассейн падает транспортирующая способность: грубый песок осаждается у устья (фронт дельты), а тонкая взвесь уносится в продельту; энергия волн и приливов перераспределяет этот песок вдоль или поперёк берега.", "practice": "Седиментолог определяет доминирующий процесс (река, волны или приливы) по треугольнику Гэллоуэя (рис. 1.16), чтобы спрогнозировать форму, протяжённость и связность песчаных коллекторов на месторождении.", "nuances": "После отмирания дельтовой лопасти морская трансгрессия размывает её кровлю и формирует трансгрессивные береговые бары поверх старых русел (рис. 1.14, элемент 4).", "deeper_branch": "Связь гранулометрии речного стока (гравий/песок vs ил) с формой дельтового конуса и типом фаций (рис. 1.16).", "quotes_and_pages": [{"unit_id": "ctrl_baraboshkin_b_p030_fig_1_13_04", "pdf_page": 30, "printed_page": "29", "verbatim_quote": "Рис. 1.13. Русловой аллювий реки с блуждающим руслом, быстро сменяющийся пелитовым аллювием отмирающего русла. Нижняя юра, скв. Склоновая-21.", "editorial_paraphrase": "Изложение по источнику (стр. 30): Дельта формируется в месте впадения реки в морской или озёрный бассейн и объединяет три главные морфологические зоны: дельтовую равнину (рукава, береговые валы, заливы), фронт дельты (песчаные устьевые и береговые бары) и продельту (морские глины, рис.", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p031_fig_1_14_04", "pdf_page": 31, "printed_page": "30", "verbatim_quote": "Рис. 1.14. Морфология и фации дельты [8]. 1 — береговые валы; 2 — рукав реки; 3 — внутридельтовый залив; 4 — береговые бары, трансгрессируя, перерабатывают лопасть мертвой дельты; 5 — продельтовая глина", "editorial_paraphrase": "Анализ единицы Рис. 1.14 на стр. 31 (1.2 Дельты [Deltas] · Рис. 1.14).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p032_fig_1_15_03", "pdf_page": 32, "printed_page": "31", "verbatim_quote": "Рис. 1.15. Схема основных типов дельт [8]. 1 — паралические илы и торф; 2 — морские илы; 3 — русловые и отмелевые пески", "editorial_paraphrase": "Анализ единицы Рис. 1.15 на стр. 32 (1.2 Дельты [Deltas] · Рис. 1.15).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p033_fig_1_16_03", "pdf_page": 33, "printed_page": "32", "verbatim_quote": "Рис. 1.16. Классификация современных дельт по преобладающему процессу во фронтальной части дельты и преобладающей размерности речного стока [18]", "editorial_paraphrase": "Анализ единицы Рис. 1.16 на стр. 33 (1.2 Дельты [Deltas] · Рис. 1.16).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p030_par_01", "pdf_page": 30, "printed_page": "29", "verbatim_quote": "1.2. Дельты [Deltas]", "editorial_paraphrase": "Анализ единицы paragraph на стр. 30 (Глава 1, §1.2. Дельты [Deltas]: флювиальные, волновые и приливные системы (PDF 30–44, печ. 29–43) · абзац #1).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p030_par_02", "pdf_page": 30, "printed_page": "29", "verbatim_quote": "с отдельными опрокинутыми передовыми слоями — антидюны [antidune]. Средние направления наклонов косой слоистости сильно меняются от русла к руслу.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 30 (Глава 1, §1.2. Дельты [Deltas]: флювиальные, волновые и приливные системы (PDF 30–44, печ. 29–43) · абзац #2).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p030_par_03", "pdf_page": 30, "printed_page": "29", "verbatim_quote": "Наиболее характерная особенность — двойная эрозионная поверхность (выше и ниже прослоев глин). Эти отложения отмерших русел служат диагностическим признаком осадков ветвящихся рек. Распознавание их весьма важно, поскольку можно предположить, что глины имеют шнурковую геометрию и не препятствуют миграции флюидов и формированию залежей углеводородов. Верхняя и нижняя границы таких отложений могут быть сейсмическими рефлекторами, поскольку на их контактах с вмещающими породами наблюдаются значительные контрасты скорости прохождения волн, но внутренние отражающие горизонты обнаруживаются редко.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 30 (Глава 1, §1.2. Дельты [Deltas]: флювиальные, волновые и приливные системы (PDF 30–44, печ. 29–43) · абзац #3).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p030_cap_1_13_04", "pdf_page": 30, "printed_page": "29", "verbatim_quote": "Рис. 1.13. Русловой аллювий реки с блуждающим руслом, быстро сменяющийся пелитовым аллювием отмирающего русла. Нижняя юра, скв. Склоновая-21.", "editorial_paraphrase": "Анализ единицы Рис. 1.13 на стр. 30 (Глава 1, §1.2. Дельты [Deltas]: флювиальные, волновые и приливные системы (PDF 30–44, печ. 29–43) · подпись Рис. 1.13).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p030_par_05", "pdf_page": 30, "printed_page": "29", "verbatim_quote": "Дельта — конус выноса обломочного материала, приносимого рекой, возникающий в месте достижения рекой базиса эрозии. Геометрия дельт определяется, взаимодействием флювиальных, морских (озерных) процессов, а также другими факторами: величиной речного стока, климатом, характером и амплитудой тектонических движений, рельефом, высотой волн и приливных течений. Дельты состоят из:", "editorial_paraphrase": "Анализ единицы paragraph на стр. 30 (1.2 Дельты [Deltas] · абзац #5).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p030_par_06", "pdf_page": 30, "printed_page": "29", "verbatim_quote": "- субаэральной части конуса дельты [subaerial delta] — дельтовой равнины, - авандельты [avandelta] — крутонаклонной подводной грубообломочной части конуса дельты; - продельты [prodelta] — пологой тонкообломочной (алеврито-пелитовой) части конуса дельты (Рис. 1.14).", "editorial_paraphrase": "Анализ единицы paragraph на стр. 30 (1.2 Дельты [Deltas] · абзац #6).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p030_par_07", "pdf_page": 30, "printed_page": "29", "verbatim_quote": "© Центр профессиональной переподготовки специалистов нефтегазового дела ТПУ", "editorial_paraphrase": "Анализ единицы paragraph на стр. 30 (1.2 Дельты [Deltas] · абзац #7).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p031_par_01", "pdf_page": 31, "printed_page": "30", "verbatim_quote": "1.2. Дельты [Deltas]", "editorial_paraphrase": "Анализ единицы paragraph на стр. 31 (1.2 Дельты [Deltas] · абзац #1).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p031_par_02", "pdf_page": 31, "printed_page": "30", "verbatim_quote": "Морфология границы дельтовой равнины и авандельты — фронта дельты — отражает динамику взаимодействия бассейновых и речных процессов. Наиболее популярная классификация дельт подразделяет их на три группы именно в соответствии с доминирующим процессом во фронтальной части дельты (Рис. 1.15, Рис. 1.16):", "editorial_paraphrase": "Анализ единицы paragraph на стр. 31 (1.2 Дельты [Deltas] · абзац #2).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p031_par_03", "pdf_page": 31, "printed_page": "30", "verbatim_quote": "- преимущественно флювиальные [fluvial ие тонкодисперсного растительного детрита, прослои углей и палеопочв в кровле циклита.", "nuances": "Из-за резкого переключения (авульсии) рукавов флювиальные песчаные тела имеют пальцеобразную форму и часто экранированы межрукавными глинами и углями, что затрудняет межскважинную корреляцию.", "deeper_branch": "Разрез каменноугольного дельтового рукава Тагфорд в Шропшире (рис. 1.18, PDF стр. 36) как эталонная вертикальная последовательность фаций флювиальной дельты.", "quotes_and_pages": [{"unit_id": "ctrl_baraboshkin_b_p039_par_02", "pdf_page": 39, "printed_page": "38", "verbatim_quote": "весь берег, и, если поверхность скольжения распространяется ниже основания протоки, сползшие осадки могут сохраниться ниже фаций русла.", "editorial_paraphrase": "Изложение по источнику (стр. 39): Преимущественно флювиальные дельты (рис.", "numbers_and_units": [], "conditions": ["весь берег, и, если поверхность скольжения распространяется ниже основания протоки, сползшие осадки могут сохраниться ниже фаций русла."]}, {"unit_id": "ctrl_baraboshkin_b_p036_tbl_02", "pdf_page": 36, "printed_page": "35", "verbatim_quote": "|   | Основные факты | Интерпретация  |\n| --- | --- | --- |\n|  9 | Алевролиты красные, грубозернистые, с норами беспозвоночных и обильными известковыми конкрециями; в верхах-песчаники красные, очень тонкозернистые, волнисто- или горизонтально-слоистые, с норами беспозвоночных | Вертикально наращивающиеся осадки поймы в период разливов. Прирусловый вал перекрыт осадками поймы. Изменчивый уровень грунтовых вод в периоды осушения поймы  |\n|  8 | Заполненное и покрытое осадками русло. Тонкозернистые песчаники, красные, горизонтально-слоистые, с локально развитыми поверхностями эрозионного вреза. С", "editorial_paraphrase": "Анализ единицы Таблица (стр. 36) на стр. 36 (1.2.1 Преимущественно флювиальные дельты [Fluvial deltas] · таблица #2).", "numbers_and_units": [{"value": "4.8", "unit": "м"}, {"value": "2.2", "unit": "м"}], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p034_par_02", "pdf_page": 34, "printed_page": "33", "verbatim_quote": "Ассоциации флювиальной дельтовой равнины (Рис. 1.18) включают фации крупных флювиальных дельтовых рукавов, промоин, внутридельтовых заливов, которые часто встречаются в виде серии мелких разрезов регрессивного типа, отражающих повторные заполнения заливов. Эти разрезы характеризуются небольшой мощностью (4–10м) и начинаются с аргиллитов — алевролитов, осажденных из взвеси в пределах всей внутридельтовой области во время паводковых периодов. Отложения полностью биотурбированы, но иногда сохраняется тонкая ленточная слоистость; обильны растительные остатки и солоновато- и пресноводная фауна. Часто встречаются конкреции или прослои сидерита. Аргиллиты и алевролиты могут слагать весь разрез заполненного залива, но обычно разрезы завершаются маломощными песчаниками намывных валов, лопастей конусов выноса промоин берегов, сочетания малый устьевой бар — канал промыва или переработанных волнами кос.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 34 (1.2.1 Преимущественно флювиальные дельты [Fluvial deltas] · абзац #2).", "numbers_and_units": [{"value": "4–10", "unit": "м"}], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p035_par_02", "pdf_page": 35, "printed_page": "34", "verbatim_quote": "**В разрезах намывных валов** [washover levee] преобладают тонкие слои песчаников с эрозионной подошвой, мелкой рябью или горизонтальной слоистостью, образованных паводковыми наводнениями или небольшими конусами выноса промоин. Они постепенно переходят в аргиллиты и алевролиты, осажденные из взвеси во время спада паводков. В сторону от края канала отдельные слои становятся тоньше, размер зерен уменьшается, иногда наблюдался наклон осадков. Тенденция увеличения размера зерен вверх по разрезу отражает внедрение намывного вала в залив. Образование больших конусов выноса промоин, когда за один раз осаждается около 1м осадка, ускоряет и завершает заполнение залива.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 35 (1.2.1 Преимущественно флювиальные дельты [Fluvial deltas] · абзац #2).", "numbers_and_units": [{"value": "1", "unit": "м"}], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p035_par_05", "pdf_page": 35, "printed_page": "34", "verbatim_quote": "**Разрезы каналов промоин [channels]** характеризуются мощностью 1–4м и слагаются фациями заполнения канала, которые содержат многочисленные поверхности размыва, глинистые прослои и следы появления временных донных форм, что отражает слабое течение, приводящее к «осушению» канала во время низкой воды. Переработка осадка ветровыми волнами приводит к формированию маломощных волновых разрезов с увеличением размера зерен кверху, что отражает миграцию береговых отмелей. Каждый из этих разрезов заканчивается маломощным и невыдержанным песчаным телом, но часто они объединяются в обширный пласт песчаника, занимающий всю внутридельтовую область. Ближе к верхней части разрезов нередко встречаются палеопочвы или торф.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 35 (1.2.1 Преимущественно флювиальные дельты [Fluvial deltas] · абзац #5).", "numbers_and_units": [{"value": "1–4", "unit": "м"}], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p034_fig_1_17_03", "pdf_page": 34, "printed_page": "33", "verbatim_quote": "Рис. 1.17. Потоковая косая слоистость в дельтовых песчаниках. Верхняя юра, скв. Западно-Монсеевская-30.", "editorial_paraphrase": "Анализ единицы Рис. 1.17 на стр. 34 (1.2.1 Преимущественно флювиальные дельты [Fluvial deltas] · Рис. 1.17).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p036_fig_1_18_03", "pdf_page": 36, "printed_page": "35", "verbatim_quote": "Рис. 1.18. Разрез каменноугольного дельтового рукава флювиальной дельты, Тагфорд, Шропшир [2]", "editorial_paraphrase": "Анализ единицы Рис. 1.18 на стр. 36 (1.2.1 Преимущественно флювиальные дельты [Fluvial deltas] · Рис. 1.18).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl , § 1.2.2–1.2.3. Волновые и приливные дельты (PDF стр. 40–44, печ. 39–43)", "step_title": "Волновые и приливные дельтовые системы", "summary_2_3_sentences": "В волновых дельтах (§1.2.2, рис. 1.23) речной песок перерабатывается прибоем и вдольбереговыми течениями в хорошо отсортированные береговые бары, вытянутые параллельно берегу; последующая трансгрессия срезает кровлю бара (рис. 1.23 б–в). В приливных дельтах (§1.2.3, рис. 1.24–1.25) сильные двунаправленные приливно-отливные течения формируют сеть приливных проток, устьевых баров и вытянутых приливных песчаных гряд (пример эоценовой свиты Мисоа, Венесуэла).", "primary_difficulty": "spatial_3d_geometry", "secondary_difficulty": "conceptual_mechanism", "primary_difficulty_code": "Р", "secondary_difficulty_code": "В", "estimated_minutes": 9, "mechanism": "Волны перемывают песок вдоль берега, вымывая глину и создавая высокопроницаемые баровые полосы; приливы работают как двунаправленный насос с паузами стоячей воды, формируя вытянутые перпендикулярно берегу приливные гряды (рис. 1.25) с тонкими глинистыми прослоями.", "practice": "Геолог выделяет волновые дельты как наиболее латерально выдержанные и однородные коллекторы вдоль берега, а в приливных дельтах учитывает анизотропию проницаемости вдоль приливных гряд и проток (рис. 1.24–1.25).", "nuances": "При последующей трансгрессии верхняя часть разреза волновой дельты может быть размыта (рис. 1.23 б–в), оставляя в геологической летописи усечённый разрез; на стр. 44 (печ. 43) начинается переход к §1.3 «Озёрные обстановки».", "deeper_branch": "Трёхмерная фациальная зональность приливной дельты свиты Мисоа (рис. 1.25): переход от комплекса проток (a) к переработанным устьевым барам (b), проксимальным (c) и дистальным (d) приливным грядам.", "quotes_and_pages": [{"unit_id": "ctrl_baraboshkin_b_p040_par_02", "pdf_page": 40, "printed_page": "39", "verbatim_quote": "дельты фиксируется по интенсивной зоне биотурбации, иногда сопровождаемой тонкими слоями сланца или известняка, что отражает уменьшенные скорости осадконакопления. Фация отмирания в верхней части фронта дельты включает маломощный интервал интенсивно биотурбированных кварцевых песчаников, интерпретируемых как трансгрессивные остатки барьерных островов. Эти песчаники могут быть сцементированы кальцитом, образованным за счет растворения раковин, и содержать глауконит. Слои изменяются по мощности от 0,5 до 3,0м и могут изредка заключать в себе отчетливую эрозионную поверхность, родственную эрозионной поверхности предфронтальной зоны пляжа. В средней и нижней частях дельтовой равнины отлагается тонкий горизонт аргиллитов и алевролитов с обильной морской и солоноватоводной фауной, тогда как верхняя часть дельтовой равнины осушается. В условиях тропического гумидного климата поверхность верхней части дельтовой равнины покрывают обширные слои лигнита или торфа, образуя маркирующие горизонты.", "editorial_paraphrase": "Изложение по источнику (стр. 40): В волновых дельтах (§1.", "numbers_and_units": [{"value": "3.0", "unit": "м"}], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p041_par_06", "pdf_page": 41, "printed_page": "40", "verbatim_quote": "Дельтовые рукава, подверженные действию приливов, отличаются незначительной извилистостью, разветвленной и иногда воронкообразной формой с высоким отношением ширины к глубине, резко отличной от формы дельтовых рукавов с параллельными профилями берегов областей малых приливов. В протоках преобладают дюнные пластовые формы, а в местах их слияния выше точек впадения в море образуется комплекс «внутренних дельт», состоящий из переплетения песчаных баров и илистых отмелей. Он возникает в результате осаждения значительной части твердого стока в тех местах, где рукава разветвляются и флювиальный поток подпруживается приливным течением. В нижних спрямленных участках проток в их осевых частях наблюдаются образованные течением бары. В некоторых дельтах гряды имеют в длину несколько километров, в ширину несколько сотен метров и в высоту 10–20м и отражают перемещение поставляемого рекой материала приливным течением. Они сходны с грядами приливных течений мелководных шельфовых морей.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 41 (1.2.3 Преимущественно приливные дельты [Tide-dominated deltas] · абзац #6).", "numbers_and_units": [{"value": "10–20", "unit": "м"}], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p043_par_04", "pdf_page": 43, "printed_page": "42", "verbatim_quote": "**Приливные протоки** менее склонны изменять направление и отмирать, но могут мигрировать. Форма и размеры песчаных тел являются функцией размера и формы рукавов и степени их латеральной миграции: от удлиненных песчаных тел длиной 4–5км и шириной 0,5–1,5км мощностью до 10м, до песчаных тел шириной 20км и длиной 50км.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 43 (1.2.3 Преимущественно приливные дельты [Tide-dominated deltas] · абзац #4).", "numbers_and_units": [{"value": "4–5", "unit": "км"}, {"value": "0.5–1.5", "unit": "км"}, {"value": "10", "unit": "м"}, {"value": "20", "unit": "км"}, {"value": "50", "unit": "км"}], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p044_par_04", "pdf_page": 44, "printed_page": "43", "verbatim_quote": "**Основными чертами фронта дельты** являются приливные гряды, радиально расположенные по отношению к устьям рукавов. Они могут достигать в длину 2км, ширину 300м и 10–22м по высоте. В каналах между грядами встречаются отмели и бары с донными формами рельефа, согласующимися с направлением паводковых и приливно-отливных течений. В идеализированном разрезе этой дельты пески приливных гряд верхов регрессивного типа разреза фронта дельты характеризуются двунаправленной мульдообразной косой слоистостью со случайными глинистыми слойками и многочисленными мелкими каналами.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 44 (1.2.3 Преимущественно приливные дельты [Tide-dominated deltas] · абзац #4).", "numbers_and_units": [{"value": "2", "unit": "км"}, {"value": "300", "unit": "м"}, {"value": "10–22", "unit": "м"}], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p041_fig_1_23_04", "pdf_page": 41, "printed_page": "40", "verbatim_quote": "Рис. 1.23. Развитие разрезов фронта дельты в волновой дельтовой системе, мел Техаса. а — разрез максимального продвижения фронта дельты; б — изменение разреза во время следующей трансгрессии; в — окончательный сохранившийся разрез [4]", "editorial_paraphrase": "Анализ единицы Рис. 1.23 на стр. 41 (1.2.2 Преимущественно волновые дельты [Wave-dominated deltas] · Рис. 1.23).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p042_tbl_02", "pdf_page": 42, "printed_page": "41", "verbatim_quote": "|   | Основные факты | Интерпретация  |\n| --- | --- | --- |\n|  9 | Алевролиты мощные, темно-красные, грубозернистые, с линзами и выдержанными пластами тонкозернистых косослоистых песчаников. В ряде горизонтов - норы беспозвоночных. Трещины усыхания отсутствуют. Обильные известковые конкреции | Вертикально наращивающиеся осадки, накапливающиеся в пойме в основном в периоды разливов, с прослоями более грубозернистых осадков оснований при русловых валов или врезанных „сухих“ дельт (в местах прорыва при русловых валов). Присутствие конкреции позволяет предполагать изменчивость уровня грунтовых вод", "editorial_paraphrase": "Анализ единицы Таблица (стр. 42) на стр. 42 (1.2.3 Преимущественно приливные дельты [Tide-dominated deltas] · таблица #2).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p042_fig_1_24_03", "pdf_page": 42, "printed_page": "41", "verbatim_quote": "Рис. 1.24. Разрез каменноугольного дельтового рукава приливной дельты, Лидни, Глостершир [2]", "editorial_paraphrase": "Анализ единицы Рис. 1.24 на стр. 42 (1.2.3 Преимущественно приливные дельты [Tide-dominated deltas] · Рис. 1.24).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p043_fig_1_25_03", "pdf_page": 43, "printed_page": "42", "verbatim_quote": "Рис. 1.25. Трехмерная модель фронта дельты и нижней дельтовой равнины приливной дельты эоценовой свиты Мисоа (Венесуэла), показывающая приливные протоки и межпротоковые пространства. Внутри проток последовательность фаций меняется от комплекса собственно проток (а) до сильно переработанного приливами комплекса устьевых баров проток (b) и проксимальных приливных песчаных гряд, подверженных воздействию приливов (c), до дистальных песчаных гряд (d), где количество осадка ограничено и приливные течения ослаблены [18]", "editorial_paraphrase": "Анализ единицы Рис. 1.25 на стр. 43 (1.2.3 Преимущественно приливные дельты [Tide-dominated deltas] · Рис. 1.25).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p044_fig_1_26_08", "pdf_page": 44, "printed_page": "43", "verbatim_quote": "Рис. 1.26. Модель механизмов распределения и типов осадков при седиментации в олиготрофных озерах с годичной температурной стратификацией на примере Бриенцского озера, Швейцария [4]", "editorial_paraphrase": "Анализ единицы Рис. 1.26 на стр. 44 (1.3 Озерные обстановки [Lacustrine environments] · Рис. 1.26).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p040_par_01", "pdf_page": 40, "printed_page": "39", "verbatim_quote": "1.2. Дельты [Deltas]", "editorial_paraphrase": "Анализ единицы paragraph на стр. 40 (1.2.1 Преимущественно флювиальные дельты [Fluvial deltas] · абзац #1).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p040_par_03", "pdf_page": 40, "printed_page": "39", "verbatim_quote": "**Ассоциации дельтовой равнины волновых дельт** (Рис. 1.23) включают песчаники флювиальных русловых каналов и отложения внутридельтовых заливов, близкие равнинам флювиальных дельт, поскольку преимущественно волновые дельты характеризуются пляжево-баровыми побережьями, защищающими дельтовую равнину от сильных штормов. Местами в мелководных заливах дельтовой равнины могут действовать вызванные ветрами волны.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 40 (1.2.2 Преимущественно волновые дельты [Wave-dominated deltas] · абзац #3).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p040_par_04", "pdf_page": 40, "printed_page": "39", "verbatim_quote": "**Фронт дельт** представлен разрезами с увеличением зернистости вверх, похожими на разрезы продвигающихся пляжевых фронтов. Тонкозернистый элемент в основании разреза фронта дельты может включать генерированные штормами турбидиты, а в средней и верхних частях разреза преобладают хорошо сортированные песчаники с выпуклой косой слоистостью, волновой слоистостью ряби, параллельной и косой слоистостью. Наблюдаемая биотурбация может быть весьма заметной и приводить к существенному нарушению первичных текстур. Разрезы эродированы песчаниками флювиальных дельтовых рукавов, по крайней мере, местами, и верхняя фация пляжа в составе фаций песчаников может лучше развиться на флангах этих рукавов, что предполагает сосредоточение пляжевых валов около них, как в современных волновых дельтах.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 40 (1.2.2 Преимущественно волновые дельты [Wave-dominated deltas] · абзац #4).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p040_par_05", "pdf_page": 40, "printed_page": "39", "verbatim_quote": "Волновые процессы способны перераспределять большую часть осадка, поэтому характерны правильная пляжевая береговая линия с незначительными отклонениями в районе устья рукавов и достаточно крутой склон фронта дельты. Здесь не образуются устьевые бары, а изобаты параллельны береговой линии. В продвижение обычно вовлекается весь фронт дельты. Позади береговой линии встречаются отмершие береговые валы, а в пределах дельтовой равнины часто располагаются золовые дюны и удлиненные лагуны между валами. В плане валы разделены на отдельные группы несогласиями, которые отражают изменения в положении береговой линии, вызванные сменой направления вдольберегового течения или положения дельтовых рукавов. Завершается разрез хорошо сортированным песком с параллельной и слабонаклонной слоистостью, представляющим высокоэнергетическую фацию", "editorial_paraphrase": "Анализ единицы paragraph на стр. 40 (1.2.2 Преимущественно волновые дельты [Wave-dominated deltas] · абзац #5).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p040_par_06", "pdf_page": 40, "printed_page": "39", "verbatim_quote": "© Центр профессиональной переподготовки специалистов нефтегазового дела ТПУ", "editorial_paraphrase": "Анализ единицы paragraph на стр. 40 (1.2.2 Преимущественно волновые дельты [Wave-dominated deltas] · абзац #6).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p041_par_01", "pdf_page": 41, "printed_page": "40", "verbatim_quote": "1.2. Дельты [Deltas]", "editorial_paraphrase": "Анализ единицы paragraph на стр. 41 (1.2.2 Преимущественно волновые дельты [Wave-dominated deltas] · абзац #1).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_baraboshkin_b_p041_par_02", "pdf_page": 41, "printed_page": "40", "verbatim_quote": "пляжа.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 41 (1.2.2 Преимущественно волновые дельты [Wave-dominated deltas] · абзац #2).", "numbers_and_units": [], "conditions": []}], "epistemic_split": {"observation": "Схема эволюции разреза волновой дельты мела Техаса (рис. 1.23), разрез приливного рукава Лидни (рис. 1.24) и 3D-модель Мисоа (рис. 1.25).", "inference": "Разделение волновых (баровых) и приливных (протоково-грядовых) дельтовых коллекторов и прогноз их сохранившейся толщины.", "assumption": "Учёт постседиментационного трансгрессивного размыва кровли (рис. 1.23) при корреляции разрезов."}, "field_provenance": {"source_heading": "source_verbatim", "step_title": "editorial_synthesis_3_7_words", "summary_2_3_sentences": "editorial_synthesis_grounded_in_quotes", "mechanism": "source_grounded_domain_explanation", "practice aim_id": "baraboshkin_s1_2_node_03_claim_01", "artifact_path": "illustrations/baraboshkin_s1_2_step_03_illust.svg"}]}, "scene_specs": [], "steps": [{"step_id": "baraboshkin_s1_2_step_01", "node_id": "baraboshkin_s1_2_node_01", "order": 1, "estimated_minutes": 8, "difficulty_codes": ["Р", "В"], "source_heading": "Глава 1, § 1.2. Дельты [Deltas]: морфология и классификация Гэллоуэя (PDF стр. 30–33, печ. 29–32)", "step_title": "Морфология и классификация дельтовых систем", "summary_2_3_sentences": "Дельта формируется в месте впадения реки в морской или озёрный бассейн и объединяет три главные морфологические зоны: дельтовую равнину (рукава, береговые валы, заливы), фронт дельты (песчаные устьевые и береговые бары) и продельту (морские глины, рис. 1.14). По классификации У. Гэллоуэя (рис. 1.15–1.16) дельты подразделяются по преобладающему процессу во фронтальной части на флювиальные (речные), волновые и приливные.", "explanation_paragraphs": [{"role": "Физико-геологический механизм", "text": "При выходе речного потока в стоячий или динамичный бассейн падает транспортирующая способность: грубый песок осаждается у устья (фронт дельты), а тонкая взвесь уносится в продельту; энергия волн и приливов перераспределяет этот песок вдоль или поперёк берега.", "unit_id": "ctrl_baraboshkin_b_p030_fig_1_13_04", "pdf_page": 30, "printed_page": "29", "source_citation": "Источник: PDF стр. 30 (печ. стр. 29), ед. ctrl_baraboshkin_b_p030_fig_1_13_04", "verbatim_quote": "Рис. 1.13. Русловой аллювий реки с блуждающим руслом, быстро сменяющийся пелитовым аллювием отмирающего русла. Нижняя юра, скв. Склоновая-21."}, {"role": "Практика работы специалиста", "text": "Седиментолог определяет доминирующий процесс (река, волны или приливы) по треугольнику Гэллоуэя (рис. 1.16), чтобы спрогнозировать форму, протяжённость и связность песчаных коллекторов на месторождении.", "unit_id": "ctrl_baraboshkin_b_p031_fig_1_14_04", "pdf_page": 31, "printed_page": "30", "source_citation": "Источник: PDF стр. 31", "verbatim_quote": "Рис. 1.14. Морфология и фации дельты [8]. 1 — береговые валы; 2 — рукав реки; 3 — внутридельтовый залив; 4 — береговые бары, трансгрессируя, перерабатывают лопасть мертвой дельты; 5 — продельтовая глина"}, {"role": "Пороговая идея и перенос в данные", "text": "Тип дельты (флювиальная, волновая или приливная) задаёт 3D-архитектуру резервуара: направление максимальной проницаемости поворачивается на 90° между волновыми и флювиальными системами. Перенос в данные: На рис. 1.14–1.16 (PDF стр. 31–33, печ. 30–32): сопоставление морфологических элементов дельты (береговые валы, рукава, заливы, продельтовая глина) с плановой геометрией коллекторов.", "unit_id": "ctrl_baraboshkin_b_p030_fig_1_13_04", "pdf_page": 30, "printed_page": "29", "source_citation": "Источник: PDF стр. 30 (печ. стр. 29)", "verbatim_quote": "Рис. 1.13. Русловой аллювий реки с блуждающим руслом, быстро сменяющийся пелитовым аллювием отмирающего русла. Нижняя юра, скв. Склоновая-21."}], "first_use_terms": [{"term": "Продельта", "definition": "Глинистая область осаждения тонкой взвеси перед фронтом дельты, служащая подстилающим флюидоупором", "first_introduced_pdf_page": 30, "first_introduced_printed_page": "29", "cis_symbol": "Продельта", "west_symbol": "Prodelta", "west_term": "Prodelta mudstone zone", "unit": "фация"}, {"term": "Фронт дельты", "definition": "Область резкого торможения речного потока и накопления песчаных устьевых и береговых баров", "first_introduced_pdf_page": 30, "first_introduced_printed_page": "29", "cis_symbol": "Фронт дельты", "west_symbol": "Delta front", "west_term": "Delta-front sand belt", "unit": "фация"}], "formulas_decoded": [{"title": "Продельта", "cis_formula": "Продельта (фация)", "west_formula": "Prodelta — Prodelta mudstone zone", "variables": {"Продельта": "Глинистая область осаждения тонкой взвеси перед фронтом дельты, служащая подстилающим флюидоупором (СНГ)", "Prodelta": "Международное обозначение SPE/API (Prodelta mudstone zone)"}, "source_ref": "PDF стр. 30 (печ. стр. 29)"}, {"title": "Фронт дельты", "cis_formula": "Фронт дельты (фация)", "west_formula": "Delta front — Delta-front sand belt", "variables": {"Фронт дельты": "Область резкого торможения речного потока и накопления песчаных устьевых и береговых баров (СНГ)", "Delta front": "Международное обозначение SPE/API (Delta-front sand belt)"}, "source_ref": "PDF стр. 30 (печ. стр. 29)"}], "applicability_conditions": ["После отмирания дельтовой лопасти морская трансгрессия размывает её кровлю и формирует трансгрессивные береговые бары поверх старых русел (рис. 1.14, элемент 4)."], "worked_example": {"status": "present", "not_applicable_reason": "", "problem_number": "Классификация дельты по рис. 1.14–1.16 (PDF стр. 30–33, печ. 29–32)", "figure_ref": "Рис. 1.14, Рис. 1.15, Рис. 1.16", "pdf_page": 30, "printed_page": "29", "conditions": "Сопоставление трёх основных типов дельт по преобладающему процессу во фронтальной части.", "steps": ["По рис. 1.15–1.16 выделяем флювиальный (рукава), волновой (береговые валы) и приливный (протоки и гряды) типы.", "Для каждого типа фиксируем доминирующую ориентацию песчаных тел."], "result": "Определён каркас фациальной классификации дельт для прогноза коллекторов."}, "textbook_problems": [], "tables": [{"title": "Сводная таблица параметров и терминологического моста (Шаг 1)", "headers": ["Параметр / Термин", "Обозначение СНГ", "Международный аналог (West)", "Единицы", "Определение и страница источника"], "rows": [["Продельта", "Продельта", "Prodelta (Prodelta mudstone zone)", "фация", "Глинистая область осаждения тонкой взвеси перед фронтом дельты, служащая подстилающим флюидоупором [стр. 30]"], ["Фронт дельты", "Фронт дельты", "Delta front (Delta-front sand belt)", "фация", "Область резкого торможения речного потока и накопления песчаных устьевых и береговых баров [стр. 30]"]]}], "modern_context": [{"historical_item": "Двумерные схемы дельт (рис. 1.14–1.16)", "historical_context": "Качественное сопоставление по керн  стока и формируют протяжённые распределительные рукава с потоковой косой слоистостью, перекрытые палеопочвами, углями и прослоями с растительным детритом. Проградация флювиальной дельты создаёт укрупняющиеся вверх (Coarsening-upward) разрезы фронта дельты, которые в кровле прорезаются и перекрываются мельчающими вверх (Fining-upward) отложениями дельтовых рукавов (рис. 1.18).", "explanation_paragraphs": [{"role": "Физико-геологический механизм", "text": "Выдвижение (проградация) речных рукавов в бассейн накладывает песчаные устьевые бары поверх глин продельты; по мере заполнения и зарастания отмирающего рукава на его кровле формируются болотные угли (рис. 1.21) и палеопочвы с корнями растений (рис. 1.20).", "unit_id": "ctrl_baraboshkin_b_p039_par_02", "pdf_page": 39, "printed_page": "38", "source_citation": "Источник: PDF стр. 39 (печ. стр. 38), ед. ctrl_baraboshkin_b_p039_par_02", "verbatim_quote": "весь берег, и, если поверхность скольжения распространяется ниже основания протоки, сползшие осадки могут сохраниться ниже фаций русла."}, {"role": "Практика работы специалиста", "text": "Геолог диагностирует флювиальную дельту по керну Западной Сибири (рис. 1.17, 1.19–1.22): потоковая косая слоистость в песчаниках, обилие тонкодисперсного растительного детрита, прослои углей и палеопочв в кровле циклита.", "unit_id": "ctrl_baraboshkin_b_p036_tbl_02", "pdf_page": 36, "printed_page": "35", "source_citation": "Источник: PDF стр. 36", "verbatim_quote": "|   | Основные факты | Интерпретация  |\n| --- | --- | --- |\n|  9 | Алевролиты красные, грубозернистые, с норами беспозвоночных и обильными известковыми конкрециями; в верхах-песчаники красные, очень тонкозернистые, волнисто- или горизонтально-слоистые, с норами беспозвоночных | Вертикально наращивающиеся осадки поймы в период разливов. Прирусловый вал перекрыт осадками поймы. Изменчивый уровень грунтовых вод в периоды осушения поймы  |\n|  8 | Заполненное и покрытое осадками русло. Тонкозернистые песчаники, красные, горизонтально-слоистые, с локально развитыми поверхностями эрозионного вреза. С"}, {"role": "Пороговая идея и перенос в данные", "text": "Во флювиальной дельте сосуществуют два противоположных тренда зернистости: устьевой бар укрупняется вверх (CU), а прорезающий его распределительный рукав мельчает вверх (FU) и часто венчается углём. Перенос в данные: На рис. 1.17–1.22 (PDF стр. 34–39, печ. 33–38): привязка диагностических текстур керна (косая слоистость, детрит, уголь, палеопочва) к форме каротажных кривых ГК/ПС.", "unit_id": "ctrl_baraboshkin_b_p039_par_02", "pdf_page": 39, "printed_page": "38", "source_citation": "Источник: PDF стр. 39 (печ. стр. 38)", "verbatim_quote": "весь берег, и, если поверхность скольжения распространяется ниже основания протоки, сползшие осадки могут сохраниться ниже фаций русла."}, {"role": "Сверка чтения с оригиналом (исправление OCR)", "text": "В тексте курса учтено исправление OCR по PDF-оригиналу: стр. 34: «скв. Западно-Монсеевская-30» → «скв. Западно-Моисеевская-30» (Исправление опечатки OCR в названии скважины на рис. 1.17 («Монсеевская» -> «Моисеевская», ср. рис. 1.20–1.21).)", "unit_id": "ctrl_baraboshkin_b_p039_par_02", "pdf_page": 34, "printed_page": "33", "source_citation": "Лист исправлений OCR: PDF стр. 34", "verbatim_quote": "скв. Западно-Моисеевская-30"}], "first_use_terms": [{"term": "Флювиальная дельта", "definition": "Дельта с доминированием речного стока, формирующая вытянутые пальцеобразные рукава и устьевые бары", "first_introduced_pdf_page": 34, "first_introduced_printed_page": "33", "cis_symbol": "Флювиальная дельта", "west_symbol": "Fluvial-dominated delta", "west_term": "River-dominated delta", "unit": "фация"}, {"term": "Палеопочва и угольный прослой", "definition": "Индикаторы зарастания и субаэральной экспозиции отмирающего дельтового рукава", "first_introduced_pdf_page": 34, "first_introduced_printed_page": "33", "cis_symbol": "Палеопочва", "west_symbol": "Paleosol / coal seam", "west_term": "Delta-plain paleosol and coal", "unit": "маркер"}], "formulas_decoded": [{"title": "Флювиальная дельта", "cis_formula": "Флювиальная дельта (фация)", "west_formula": "Fluvial-dominated delta — River-dominated delta", "variables": {"Флювиальная дельта": "Дельта с доминированием речного стока, формирующая вытянутые пальцеобразные рукава и устьевые бары (СНГ)", "Fluvial-dominated delta": "Международное обозначение SPE/API (River-dominated delta)"}, "source_ref": "PDF стр. 34 (печ. стр. 33)"}, {"title": "Палеопочва и угольный прослой", "cis_formula": "Палеопочва (маркер)", "west_formula": "Paleosol / coal seam — Delta-plain paleosol and coal", "variables": {"Палеопочва": "Индикаторы зарастания и субаэральной экспозиции отмирающего дельтового рукава (СНГ)", "Paleosol / coal seam": "Международное обозначение SPE/API (Delta-plain paleosol and coal)"}, "source_ref": "PDF стр. 34 (печ. стр. 33)"}], "applicability_conditions": ["Из-за резкого переключения (авульсии) рукавов флювиальные песчаные тела имеют пальцеобразную форму и часто экранированы межрукавными глинами и углями, что затрудняет межскважинную корреляцию.", "весь берег, и, если поверхность скольжения распространяется ниже основания протоки, сползшие осадки могут сохраниться ниже фаций русла."], "worked_example": {"status": "present", "not_applicable_reason": "", "problem_number": "Разбор флювиального разреза (PDF стр. 34–39, печ. 33–38)", "figure_ref": "Рис. 1.18, Рис. 1.20, Рис. 1.21", "pdf_page": 34, "printed_page": "33", "conditions": "Разрез дельтового рукава (Тагфорд, рис. 1.18) и керн скв. Западно-Моисеевская-30.", "steps": ["Внизу фиксируем фоновые аргиллиты и косослоистые песчаники рукава.", "В кровле отмечаем прослой угля (рис. 1.21) и палеопочву (рис. 1.20) зарастающей дельты."], "result": "Диагностирован завершённый цикл развития флювиального дельтового рукава."}, "textbook_problems": [], "tables": [{"title": "Сводная таблица параметров и терминологического моста (Шаг 2)", "headers": ["Параметр / Термин", "Обозначение СНГ", "Международный аналог (West)", "Единицы", "Определение и страница источника"], "rows": [["Флювиальная дельта", "Флювиальная дельта", "Fluvial-dominated delta (River-dominated delta)", "фация", "Дельта с доминированием речного стока, формирующая вытянутые пальцеобразные рукава и устьевые бары [стр. 34]"], ["Палеопочва и угольный прослой", "Палеопочва", "Paleosol / coal seam (Delta-plain paleosol and coal)", "маркер", "Индикаторы зарастания и субаэральной экспозиции отмирающего дельтового рукава [стр. 34]"]]}], "modern_context": [{"historical_item": "Фотодокументация керна (рис. 1.17–1.22)", "historical_context": "Ручное описание текстур и детрита", "modern_analog": "Высокоразрешающее сканирование керна в УФ/видимом свете + FMI-микроимиджеры", "modern_context": "Автоматическое определение азимута падения косых слойков для трассирования рукавов", "pdf_page": 34}], "it_analogy_and_limits": "Аналогия с ветвящимся графом направленных каналов (DAG), где старые ветки периодически «архивируются» (перекрываются углём и палеопочвой), а поток переключается в новое русло.", "typical_error": "Путаница между устьевым баром (постепенная подошва, тренд CU) и дельтовым рукавом (резкий эрозионный врез, тренд FU) приводит к неверной оценке связности коллекторов и прорывам воды.", "epistemic_split": {"observation": "Фотографии керна юрских скважин (Западно-Моисеевская-30, Северо-Пионерская-1, Крапивинская-102, рис. 1.17, 1.19–1.22) и разрез рис. 1.18.", "inference": "Выделение фаций дельтового рукава, устьевого бара, болотных углей и палеопочв зарастающей дельты.", "assumption": "Интерпретация опирается на отсутствие признаков активной волновой (HCS) или приливной (двойные глинистые слойки) переработки."}, "specialist_manual_steps": ["Выявить в керне потоковую косую слоистость и слоистость ряби течений (рис. 1.17, 1.19).", "Проверить кровлю циклита на наличие палеопочв (рис. 1.20), прослоев углей (рис. 1.21) и растительного детрита (рис. 1.22).", "Отделить проградационный устьевой бар (CU) от эрозионного рукава (FU) по характеру нижней границы (рис. 1.18)."], "decision_points": ["Трассирование узких флювиальных рукавов между разведочными скважинами.", "Учёт угольных и глинистых прослоев как вертикальных флюидоупоров."], "inefficiency_lens": {"inputs": ["Фотографии керна юрских скважин (Западно-Моисеевская-30, Северо-Пионерская-1, Крапивинская-102, рис. 1.17, 1.19–1.22) и разрез рис. 1.18.", "Источник: стр. 34–39"], "manual_steps": ["Выявить в керне потоковую косую слоистость и слоистость ряби течений (рис. 1.17, 1.19).", "Проверить кровлю циклита на наличие палеопочв (рис. 1.20), прослоев углей (рис. 1.21) и растительного детрита (рис. 1.22).", "Отделить проградационный устьевой бар (CU) от эрозионного рукава (FU) по характеру нижней границы (рис. 1.18)."], "expert_judgment_points": ["Трассирование узких флювиальных рукавов между разведочными скважинами.", "Учёт угольных и глинистых прослоев как вертикальных флюидоупоров."], "estimated_time_min": 18, "typical_errors": ["Путаница между устьевым баром (постепенная подошва, тренд CU) и дельтовым рукавом (резкий эрозионный врез, тренд FU) приводит к неверной оценке связности коллекторов и прорывам воды."], "origin_tag": "author_number"}, "deeper_branch": "Разрез каменноугольного дельтового рукава Тагфорд в Шропшире (рис. 1.18, PDF стр. 36) как эталонная вертикальная последовательность фаций флювиальной дельты.", "illustration": {"illustration_id": "baraboshkin_s1_2_step_02_illust", "node_id": "baraboshkin_s1_2_node_02", "step_id": "baraboshkin_s1_2_step_02", "title": "Классификация дельт У. Гэллоуэя и проградационный циклит устьевого бара Coarsening-upward (CU)", "visual_class": "B", "format_kind": "interactive_svg", "source_ref": "рис. 1.15 и рис. 1.18, стр. 30, 32 (треугольник дельт Гэллоуэя и тренд Coarsening-upward)", "redraw_caption": "перерисовано по рис. 1.15, стр. 30", "pdf_page": 30, "printed_page": "38", "claim_id": "baraboshkin_s1_2_node_02_claim_01", "asset_rel_path": "illustrations/bar ля закрытия базового скана учебника)."}, "video_url": null, "video_vtt_url": null, "video_aspect": null, "media_passport_id": null, "ocr_corrections_applied": [{"correction_id": "ocr_brb_01", "book_file": "ctrl_baraboshkin_b.md", "pdf_page": 34, "printed_page": "33", "original_ocr": "скв. Западно-Монсеевская-30", "corrected_reading": "скв. Западно-Моисеевская-30", "rationale": "Исправление опечатки OCR в названии скважины на рис. 1.17 («Монсеевская» -> «Моисеевская», ср. рис. 1.20–1.21).", "applied_in_node_id": "baraboshkin_s1_2_node_02", "applied_in_step_id": "baraboshkin_s1_2_step_02"}], "practicum": null, "data_decision_card": null}, {"step_id": "baraboshkin_s1_2_step_03", "node_id": "baraboshkin_s1_2_node_03", "order": 3, "estimated_minutes": 9, "difficulty_codes": ["Р", "В"], "source_heading": "Глава 1, § 1.2.2–1.2.3. Волновые и приливные дельты (PDF стр. 40–44, печ. 39–43)", "step_title": "Волновые и приливные дельтовые системы", "summary_2_3_sentences": "В волновых дельтах (§1.2.2, рис. 1.23) речной песок перерабатывается прибоем и вдольбереговыми течениями в хорошо отсортированные береговые бары, вытянутые параллельно берегу; последующая трансгрессия срезает кровлю бара (рис. 1.23 б–в). В приливных дельтах (§1.2.3, рис. 1.24–1.25) сильные двунаправленные приливно-отливные течения формируют сеть приливных проток, устьевых баров и вытянутых приливных песчаных гряд (пример эоценовой свиты Мисоа, Венесуэла).", "explanation_paragraphs": [{"role": "Физико-геологический механизм", "text": "Волны перемывают песок вдоль берега, вымывая глину и создавая высокопроницаемые баровые полосы; приливы работают как двунаправленный насос с паузами стоячей воды, формируя вытянутые перпендикулярно берегу приливные гряды (рис. 1.25) с тонкими глинистыми прослоями.", "unit_id": "ctrl_baraboshkin_b_p040_par_02", "pdf_page": 40, "printed_page": "39", "source_citation": "Источник: PDF стр. 40 (печ. стр. 39), ед. ctrl_baraboshkin_b_p040_par_02", "verbatim_quote": "дельты фиксируется по интенсивной зоне биотурбации, иногда сопровождаемой тонкими слоями сланца или известняка, что отражает уменьшенные скорости осадконакопления. Фация отмирания в верхней части фронта дельты включает маломощный интервал интенсивно биотурбированных кварцевых песчаников, интерпретируемых как трансгрессивные остатки барьерных островов. Эти песчаники могут быть сцементированы кальцитом, образованным за счет растворения раковин, и содержать глауконит. Слои изменяются по мощности от 0,5 до 3,0м и могут изредка заключать в себе отчетливую эрозионную поверхность, родственную эрозионной поверхности предфронтальной зоны пляжа. В средней и нижней частях дельтовой равнины отлагается тонкий горизонт аргиллитов и алевролитов с обильной морской и солоноватоводной фауной, тогда как верхняя часть дельтовой равнины осушается. В условиях тропического гумидного климата поверхность верхней части дельтовой равнины покрывают обширные слои лигнита или торфа, образуя маркирующие горизонты."}, {"role": "Практика работы специалиста", "text": "Геолог выделяет волновые дельты как наиболее латерально выдержанные и однородные коллекторы вдоль берега, а в приливных дельтах учитывает анизотропию проницаемости вдоль приливных гряд и проток (рис. 1.24–1.25).", "unit_id": "ctrl_baraboshkin_b_p041_par_06", "pdf_page": 41, "printed_page": "40", "source_citation": "Источник: PDF стр. 41", "verbatim_quote": "Дельтовые рукава, подверженные действию приливов, отличаются незначительной извилистостью, разветвленной и иногда воронкообразной формой с высоким отношением ширины к глубине, резко отличной от формы дельтовых рукавов с параллельными профилями берегов областей малых приливов. В протоках преобладают дюнные пластовые формы, а в местах их слияния выше точек впадения в море образуется комплекс «внутренних дельт», состоящий из переплетения песчаных баров и илистых отмелей. Он возникает в результате осаждения значительной части твердого стока в тех местах, где рукава разветвляются и флювиальный поток подпруживается приливным течением. В нижних спрямленных участках проток в их осевых частях наблюдаются образованные течением бары. В некоторых дельтах гряды имеют в длину несколько километров, в ширину несколько сотен метров и в высоту 10–20м и отражают перемещение поставляемого рекой материала приливным течением. Они сходны с грядами приливных течений мелководных шельфовых морей."}, {"role": "Пороговая идея и перенос в данные", "text": "Волновая переработка повышает качество и латеральную связность коллектора вдоль берега, а приливная переработка вытягивает песчаные гряды в сторону моря и вносит ритмичную глинистую расчленённость. Перенос в данные: На рис. 1.23–1.25 (PDF стр. 41–43, печ. 40–42): переход от 1D-разреза скважины к 3D-модели ориентации баров и приливных гряд (зоны a–d на рис. 1.25).", "unit_id": "ctrl_baraboshkin_b_p040_par_02", "pdf_page": 40, "printed_page": "39", "source_citation": "Источник: PDF стр. 40 (печ. стр. 39)", "verbatim_quote": "дельты фиксируется по интенсивной зоне биотурбации, иногда сопровождаемой тонкими слоями сланца или известняка, что отражает уменьшенные скорости осадконакопления. Фация отмирания в верхней части фронта дельты включает маломощный интервал интенсивно биотурбированных кварцевых песчаников, интерпретируемых как трансгрессивные остатки барьерных островов. Эти песчаники могут быть сцементированы кальцитом, образованным за счет растворения раковин, и содержать глауконит. Слои изменяются по мощности от 0,5 до 3,0м и могут изредка заключать в себе отчетливую эрозионную поверхность, родственную эрозионной поверхности предфронтальной зоны пляжа. В средней и нижней частях дельтовой равнины отлагается тонкий горизонт аргиллитов и алевролитов с обильной морской и солоноватоводной фауной, тогда как верхняя часть дельтовой равнины осушается. В условиях тропического гумидного климата поверхность верхней части дельтовой равнины покрывают обширные слои лигнита или торфа, образуя маркирующие горизонты."}], "first_use_terms": [{"term": "Волновая дельта", "definition": "Дельта с доминированием волнового прибоя, формирующая выдержанные береговые бары параллельно берегу", "first_introduced_pdf_page": 40, "first_introduced_printed_page": "39", "cis_symbol": "Волновая дельта", "west_symbol": "Wave-dominated delta", "west_term": "Wave-dominated deltaic system", "unit": "фация"}, {"term": "Приливная дельта", "definition": "Дельта с доминированием приливно-отливных течений, образующая приливные протоки и песчаные гряды", "first_introduced_pdf_page": 40, "first_introduced_printed_page": "39", "cis_symbol": "Приливная дельта", "west_symbol": "Tide-dominated delta", "west_term": "Tide-dominated estuarine/deltaic system", "unit": "фация"}], "formulas_decoded": [{"title": "Волновая дельта", "cis_formula": "Волновая дельта (фация)", "west_formula": "Wave-dominated delta — Wave-dominated deltaic system", "variables": {"Волновая дельта": "Дельта с доминированием волнового прибоя, формирующая выдержанные береговые бары параллельно берегу (СНГ)", "Wave-dominated delta": "Международное обозначение SPE/API (Wave-dominated deltaic system)"}, "source_ref": "PDF стр. 40 (печ. стр. 39)"}, {"title": "Приливная дельта", "cis_formula": "Приливная дельта (фация)", "west_formula": "Tide-dominated delta — Tide-dominated estuarine/deltaic system", "variables": {"Приливная дельта": "Дельта с доминированием приливно-отливных течений, образующая приливные протоки и песчаные гряды (СНГ)", "Tide-dominated delta": "Международное обозначение SPE/API (Tide-dominated estuarine/deltaic system)"}, "source_ref": "PDF стр. 40 (печ. стр. 39)"}], "applicability_conditions": ["При последующей трансгрессии верхняя часть разреза волновой дельты может быть размыта (рис. 1.23 б–в), оставляя в геологической летописи усечённый разрез; на стр. 44 (печ. 43) начинается переход к §1.3 «Озёрные обстановки»."], "worked_example": {"status": "present", "not_applicable_reason": "", "problem_number": "Сопоставление волновой и приливной дельт (PDF стр. 40–43, печ. 39–42)", "figure_ref": "Рис. 1.23, Рис. 1.24, Рис. 1.25", "pdf_page": 40, "printed_page": "39", "conditions": "Развитие фронта волновой дельты мела Техаса (рис. 1.23) и 3D-модель приливной дельты Мисоа (рис. 1.25).", "steps": ["По рис. 1.23 прослеживаем три стадии: максимальная проградация (а), трансгрессивный размыв (б), сохранившийся разрез (в).", "По рис. 1.25 выделяем переход от проток (a) к проксимальным (c) и дистальным (d) приливным грядам."], "result": "Определены ключевые различия архитектуры коллекторов волновых и приливных дельт."}, "textbook_problems": [], "tables": [{"title": "Сводная таблица параметров и терминологического моста (Шаг 3)", "headers": ["Параметр / Термин", "Обозначение СНГ", "Международный аналог (West)", "Единицы", "Определение и страница источника"], "rows": [["Волновая дельта", "Волновая дельта", "Wave-dominated delta (Wave-dominated deltaic system)", "фация", "Дельта с доминированием волнового прибоя, формирующая выдержанные береговые бары параллельно берегу [стр. 40]"], ["Приливная дельта", "Приливная дельта", "Tide-dominated delta (Tide-dominated estuarine/deltaic system)", "фация", "Дельта с доминированием приливно-отливных течений, образующая приливные протоки и песчаные гряды [стр. 40]"]]}], "modern_context": [{"historical_item": "Классические 3D-блок-диаграммы (рис. 1.23–1.25)", "historical_context": "Концептуальная геологическая модель на бумаге", "modern_analog": "Многоточечное стохастическое моделирование (MPS) с обучающим изображением (Training Image)", "modern_context": "Генерация реалистичных 3D-реализаций баров и приливных гряд с учётом скважинных данных", "pdf_page": 40}], "it_analogy_and_limits": "Аналогия с балансировкой нагрузки: волны работают как горизонтальный балансировщик вдоль береговой линии, выравнивая толщину песка, а приливы — как двунаправленные каналы с периодическими паузами (глинистыми слойками).", "typical_error": "Ошибочно считать, что сохранившийся в скважине разрез дельты всегда полный: на рис. 1.2 ], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: Тип дельты (флювиальная, волновая или приливная) задаёт 3D-архитектуру резервуара: направление максимальной проницаемости поворачивается на 90° между волновыми и флювиальными системами.", "explanation": "Дельта формируется в месте впадения реки в морской или озёрный бассейн и объединяет три главные морфологические зоны: дельтовую равнину (рукава, береговые валы, заливы), фронт дельты (песчаные устьевые и береговые бары) и продельту (морские глины, рис. 1.14). По классификации У. Гэллоуэя (рис. 1.15–1.16) дельты подразделяются по преобладающему процессу во фронтальной части на флювиальные (речные), волновые и приливные. (Практическая седиментология (терригенные коллектора), Глава 1, § 1.2. Дельты [Deltas]: морфология и классификация Гэллоуэя (PDF стр. 30–33, печ. 29–32), PDF стр. 30 (печ. стр. 29)).", "error_analysis": {"1": "Это известная ошибка интерпретации: Ошибочно считать все дельтовые отложения однородными песчаными пластами: флювиальные лопасти узкие и расчленённые, тогда как волновые дельты образуют протяжённые бары параллельно берегу.", "2": "Игнорирование граничных условий (После отмирания дельтовой лопасти морская трансгрессия размывает её кровлю и формирует трансгрессивные береговые бары поверх старых русел (рис. 1.14, элемент 4).) приводит к неверному решению.", "3": "В действительности механизм основан на том, что При выходе речного потока в стоячий или динамичный бассейн падает транспортирующая способность: грубый песок осаждается у устья (фронт дельты), а тонкая взвесь уносится в продельту; энергия волн и приливов перераспределяет этот песок вдоль или поперёк берега."}, "hint_steps": ["Обратите внимание на наблюдение: Схема морфологии дельты (рис. 1.14), типовые планы основных дельт (рис. 1.15) и треугольная классификация (рис. 1.16).", "Учтите физический механизм: При выходе речного потока в стоячий или динамичный бассейн падает транспортирующая способность: грубый песок осаждается у устья (фронт дельты), а тонкая взвесь уносится в продельту; энергия волн и приливов перераспределяет этот песок вдоль или поперёк берега.", "Пороговая идея шага: Тип дельты (флювиальная, волновая или приливная) задаёт 3D-архитектуру резервуара: направление максимальной проницаемости поворачивается на 90° между волновыми и флювиальными системами."], "source_ref": "Практическая седиментология (терригенные коллектора), Глава 1, § 1.2. Дельты [Deltas]: морфология и классификация Гэллоуэя (PDF стр. 30–33, печ. 29–32), PDF стр. 30 (печ. стр. 29)", "verbatim_quote": "Рис. 1.13. Русловой аллювий реки с блуждающим руслом, быстро сменяющийся пелитовым аллювием отмирающего русла. Нижняя юра, скв. Склоновая-21."}, {"task_id": "t3_ctrl_baraboshkin_b_task_sc_02", "course_id": "t3_ctrl_baraboshkin_b", "node_id": "baraboshkin_s1_2_node_02", "step_id": "baraboshkin_s1_2_step_02", "claim_id": "baraboshkin_s1_2_node_02_claim_01", "pdf_page": 39, "printed_page": "38", "task_type": "single_choice", "difficulty_level": "базовый", "prompt": "Какое утверждение точно отражает ключевой физико-геологический принцип шага «Флювиальные дельты и проградационные разрезы» (Глава 1, § 1.2.1. Преимущественно флювиальные дельты [Fluvial deltas] (PDF стр. 34–39, печ. 33–38))?", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": ["Верно по источнику: Во флювиальной дельте сосуществуют два противоположных тренда зернистости: устьевой бар укрупняется вверх (CU), а прорезающий его распределительный рукав мельчает вверх (FU) и часто венчается углём.", "Типичное заблуждение: Путаница между устьевым баром (постепенная подошва, тренд CU) и дельтовым рукавом (резкий эрозионный врез, тренд FU) приводит к неверной оценке связности коллекторов и прорывам воды.", "Параметры методики применяются без учёта граничных условий и литологии пласта", "Физический механизм не зависит от структуры порового пространства и свойств флюида"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: Во флювиальной дельте сосуществуют два противоположных тренда зернистости: устьевой бар укрупняется вверх (CU), а прорезающий его распределительный рукав мельчает вверх (FU) и часто венчается углём.", "explanation": "Преимущественно флювиальные дельты (рис. 1.17–1.22) характеризуются доминированием речного стока и формируют протяжённые распределительные рукава с потоковой косой слоистостью, перекрытые палеопочвами, углями и прослоями с растительным детритом. Проградация флювиальной дельты создаёт укрупняющиеся вверх (Coarsening-upward) разрезы фронта дельты, которые в кровле прорезаются и перекрываются мельчающими вверх (Fining-upward) отложениями дельтовых рукавов (рис. 1.18). (Практическая седиментология (терригенные коллектора), Глава 1, § 1.2.1. Преимущественно флювиальные дельты [Fluvial deltas] (PDF стр. 34–39, печ. 33–38), PDF стр. 39 (печ. стр. 38)).", "error_analysis": {"1": "Это известная ошибка интерпретации: Путаница между устьевым баром (постепенная подошва, тренд CU) и дельтовым рукавом (резкий эрозионный врез, тренд FU) приводит к неверной оценке связности коллекторов и прорывам воды.", "2": "Игнорирование граничных условий (Из-за резкого переключения (авульсии) рукавов флювиальные песчаные тела имеют пальцеобразную форму и часто экранированы межрукавными глинами и углями, что затрудняет межскважинную корреляцию.) приводит к неверному решению.", "3": "В действительности механизм основан на том, что Выдвижение (проградация) речных рукавов в бассейн накладывает песчаные устьевые бары поверх глин продельты; по мере заполнения и зарастания отмирающего рукава на его кровле формируются болотные угли (рис. 1.21) и палеопочвы с корнями растений (рис. 1.20)."}, "hint_steps": ["Обратите внимание на наблюдение: Фотографии керна юрских скважин (Западно-Моисеевская-30, Северо-Пионерская-1, Крапивинская-102, рис. 1.17, 1.19–1.22) и разрез рис. 1.18.", "Учтите физический механизм: Выдвижение (проградация) речных рукавов в бассейн накладывает песчаные устьевые бары поверх глин продельты; по мере заполнения и зарастания отмирающего рукава на его кровле формируются болотные угли (рис. 1.21) и палеопочвы с корнями растений (рис. 1.20).", "Пороговая идея шага: Во флювиальной дельте сосуществуют два противоположных тренда зернистости: устьевой бар укрупняется вверх (CU), а прорезающий его распределительный рукав мельчает вверх (FU) и часто венчается углём."], "source_ref": "Практическая седиментология (терригенные коллектора), Глава 1, § 1.2.1. Преимущественно флювиальные дельты [Fluvial deltas] (PDF стр. 34–39, печ. 33–38), PDF стр. 39 (печ. стр. 38)", "verbatim_quote": "весь берег, и, если поверхность скольжения распространяется ниже основания протоки, сползшие осадки могут сохраниться ниже фаций русла."}, {"task_id": "t3_ctrl_baraboshkin_b_task_sc_03", "course_id": "t3_ctrl_baraboshkin_b", "node_id": "baraboshkin_s1_2_node_03", "step_id": "baraboshkin_s1_2_step_03", "claim_id": "baraboshkin_s1_2_node_03_claim_01", "pdf_page": 40, "printed_page": "39", "task_type": "single_choice", "difficulty_level": "инженерный", "prompt": "Какое утверждение точно отражает ключевой физико-геологический принцип шага «Волновые и приливные дельтовые системы» (Глава 1, § 1.2.2–1.2.3. Волновые и приливные дельты (PDF стр. 40–44, печ. 39–43))?", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": ["Верно по источнику: Волновая переработка повышает качество и латеральную связность коллектора вдоль берега, а приливная переработка вытягивает песчаные гряды в сторону моря и вносит ритмичную глинистую расчленённость.", "Типичное заблуждение: Ошибочно считать, что сохранившийся в скважине разрез дельты всегда полный: на рис. 1.23 показано, как следующая трансгрессия срезает верхнюю часть берегового бара.", "Параметры методики применяются без учёта граничных условий и литологии пласта", "Физический механизм не зависит от структуры порового пространства и свойств флюида"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: Волновая переработка повышает качество и латеральную связность коллектора вдоль берега, а приливная переработка вытягивает песчаные гряды в сторону моря и вносит ритмичную глинистую расчленённость.", "explanation": "В волновых дельтах (§1.2.2, рис. 1.23) речной песок перерабатывается прибоем и вдольбереговыми течениями в хорошо отсортированные береговые бары, вытянутые параллельно берегу; последующая трансгрессия срезает кровлю бара (рис. 1.23 б–в). В приливных дельтах (§1.2.3, рис. 1.24–1.25) сильные двунаправленные приливно-отливные течения формируют сеть приливных проток, устьевых баров и вытянутых приливных песчаных гряд (пример эоценовой свиты Мисоа, Венесуэла). (Практическая седиментология (терригенные коллектора), Глава 1, § 1.2.2–1.2.3. Волновые и приливные дельты (PDF стр. 40–44, печ. 39–43), PDF стр. 40 (печ. стр. 39)).", "error_analysis": {"1": "Это известная ошибка интерпретации: Ошибочно считать, что сохранившийся в скважине разрез дельты всегда полный: на рис. 1.23 показано, как следующая трансгрессия срезает верхнюю часть берегового бара.", "2": "Игнорирование граничных условий (При последующей трансгрессии верхняя часть разреза волновой дельты может быть размыта (рис. 1.23 б–в), оставляя в геологической летописи усечённый разрез; на стр. 44 (печ. 43) начинается переход к §1.3 «Озёрные обстановки».) приводит к неверному решению.", "3": "В действительности механизм основан на том, что Волны перемывают песок вдоль берега, вымывая глину и создавая высокопроницаемые баровые полосы; приливы работают как двунаправленный насос с паузами стоячей воды, формируя вытянутые перпендикулярно берегу приливные гряды (рис. 1.25) с тонкими глинистыми прослоями."}, "hint_steps": ["Обратите внимание на наблюдение: Схема эволюции разреза волновой дельты мела Техаса (рис. 1.23), разрез приливного рукава Лидни (рис. 1.24) и 3D-модель Мисоа (рис. 1.25).", "Учтите физический механизм: Волны перемывают песок вдоль берега, вымывая глину и создавая высокопроницаемые баровые полосы; приливы работают как двунаправленный насос с паузами стоячей воды, формируя вытянутые перпендикулярно берегу приливные гряды (рис. 1.25) с тонкими глинистыми прослоями.", "Пороговая идея шага: Волновая переработка повышает качество и латеральную связность коллектора вдоль берега, а приливная переработка вытягивает песчаные гряды в сторону моря и вносит ритмичную глинистую расчленённость."], "source_ref": "Практическая седиментология (терригенные коллектора), Глава 1, § 1.2.2–1.2.3. Волновые и приливные дельты (PDF стр. 40–44, печ. 39–43), PDF стр. 40 (печ. стр. 39)", "verbatim_quote": "дельты фиксируется по интенсивной зоне биотурбации, иногда сопровождаемой тонкими слоями сланца или известняка, что отражает уменьшенные скорости осадконакопления. Фация отмирания в верхней части фронта дельты включает маломощный интервал интенсивно биотурбированных кварцевых песчаников, интерпретируемых как трансгрессивные остатки барьерных островов. Эти песчаники могут быть сцементированы кальцитом, образованным за счет растворения раковин, и содержать глауконит. Слои изменяются по мощности от 0,5 до 3,0м и могут изредка заключать в себе отчетливую эрозионную поверхность, родственную эрозионной поверхности предфронтальной зоны пляжа. В средней и нижней частях дельтовой равнины отлагается тонкий горизонт аргиллитов и алевролитов с обильной морской и солоноватоводной фауной, тогда как верхняя часть дельтовой равнины осушается. В условиях тропического гумидного климата поверхность верхней части дельтовой равнины покрывают обширные слои лигнита или торфа, образуя маркирующие горизонты."}, {"task_id": "t3_ctrl_baraboshkin_b_task_sc_04", "c Практическая седиментология (терригенные коллектора), Глава 1, § 1.2. Дельты [Deltas]: морфология и классификация Гэллоуэя (PDF стр. 30–33, печ. 29–32), PDF стр. 30 (печ. стр. 29)).", "error_analysis": {"1": "Это известная ошибка интерпретации: Ошибочно считать все дельтовые отложения однородными песчаными пластами: флювиальные лопасти узкие и расчленённые, тогда как волновые дельты образуют протяжённые бары параллельно берегу.", "2": "Игнорирование граничных условий (После отмирания дельтовой лопасти морская трансгрессия размывает её кровлю и формирует трансгрессивные береговые бары поверх старых русел (рис. 1.14, элемент 4).) приводит к неверному решению.", "3": "В действительности механизм основан на том, что При выходе речного потока в стоячий или динамичный бассейн падает транспортирующая способность: грубый песок осаждается у устья (фронт дельты), а тонкая взвесь уносится в продельту; энергия волн и приливов перераспределяет этот песок вдоль или поперёк берега."}, "hint_steps": ["Обратите внимание на наблюдение: Схема морфологии дельты (рис. 1.14), типовые планы основных дельт (рис. 1.15) и треугольная классификация (рис. 1.16).", "Учтите физический механизм: При выходе речного потока в стоячий или динамичный бассейн падает транспортирующая способность: грубый песок осаждается у устья (фронт дельты), а тонкая взвесь уносится в продельту; энергия волн и приливов перераспределяет этот песок вдоль или поперёк берега.", "Пороговая идея шага: Тип дельты (флювиальная, волновая или приливная) задаёт 3D-архитектуру резервуара: направление максимальной проницаемости поворачивается на 90° между волновыми и флювиальными системами."], "source_ref": "Практическая седиментология (терригенные коллектора), Глава 1, § 1.2. Дельты [Deltas]: морфология и классификация Гэллоуэя (PDF стр. 30–33, печ. 29–32), PDF стр. 30 (печ. стр. 29)", "verbatim_quote": "Рис. 1.13. Русловой аллювий реки с блуждающим руслом, быстро сменяющийся пелитовым аллювием отмирающего русла. Нижняя юра, скв. Склоновая-21."}, {"task_id": "t3_ctrl_baraboshkin_b_task_sc_05", "course_id": "t3_ctrl_baraboshkin_b", "node_id": "baraboshkin_s1_2_node_02", "step_id": "baraboshkin_s1_2_step_02", "claim_id": "baraboshkin_s1_2_node_02_claim_01", "pdf_page": 39, "printed_page": "38", "task_type": "single_choice", "difficulty_level": "инженерный", "prompt": "Какое утверждение точно отражает ключевой физико-геологический принцип шага «Флювиальные дельты и проградационные разрезы» (Глава 1, § 1.2.1. Преимущественно флювиальные дельты [Fluvial deltas] (PDF стр. 34–39, печ. 33–38))?", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": ["Верно по источнику: Во флювиальной дельте сосуществуют два противоположных тренда зернистости: устьевой бар укрупняется вверх (CU), а прорезающий его распределительный рукав мельчает вверх (FU) и часто венчается углём.", "Типичное заблуждение: Путаница между устьевым баром (постепенная подошва, тренд CU) и дельтовым рукавом (резкий эрозионный врез, тренд FU) приводит к неверной оценке связности коллекторов и прорывам воды.", "Параметры методики применяются без учёта граничных условий и литологии пласта", "Физический механизм не зависит от структуры порового пространства и свойств флюида"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: Во флювиальной дельте сосуществуют два противоположных тренда зернистости: устьевой бар укрупняется вверх (CU), а прорезающий его распределительный рукав мельчает вверх (FU) и часто венчается углём.", "explanation": "Преимущественно флювиальные дельты (рис. 1.17–1.22) характеризуются доминированием речного стока и формируют протяжённые распределительные рукава с потоковой косой слоистостью, перекрытые палеопочвами, углями и прослоями с растительным детритом. Проградация флювиальной дельты создаёт укрупняющиеся вверх (Coarsening-upward) разрезы фронта дельты, которые в кровле прорезаются и перекрываются мельчающими вверх (Fining-upward) отложениями дельтовых рукавов (рис. 1.18). (Практическая седиментология (терригенные коллектора), Глава 1, § 1.2.1. Преимущественно флювиальные дельты [Fluvial deltas] (PDF стр. 34–39, печ. 33–38), PDF стр. 39 (печ. стр. 38)).", "error_analysis": {"1": "Это известная ошибка интерпретации: Путаница между устьевым баром (постепенная подошва, тренд CU) и дельтовым рукавом (резкий эрозионный врез, тренд FU) приводит к неверной оценке связности коллекторов и прорывам воды.", "2": "Игнорирование граничных условий (Из-за резкого переключения (авульсии) рукавов флювиальные песчаные тела имеют пальцеобразную форму и часто экранированы межрукавными глинами и углями, что затрудняет межскважинную корреляцию.) приводит к неверному решению.", "3": "В действительности механизм основан на том, что Выдвижение (проградация) речных рукавов в бассейн накладывает песчаные устьевые бары поверх глин продельты; по мере заполнения и зарастания отмирающего рукава на его кровле формируются болотные угли (рис. 1.21) и палеопочвы с корнями растений (рис. 1.20)."}, "hint_steps": ["Обратите внимание на наблюдение: Фотографии керна юрских скважин (Западно-Моисеевская-30, Северо-Пионерская-1, Крапивинская-102, рис. 1.17, 1.19–1.22) и разрез рис. 1.18.", "Учтите физический механизм: Выдвижение (проградация) речных рукавов в бассейн накладывает песчаные устьевые бары поверх глин продельты; по мере заполнения и зарастания отмирающего рукава на его кровле формируются болотные угли (рис. 1.21) и палеопочвы с корнями растений (рис. 1.20).", "Пороговая идея шага: Во флювиальной дельте сосуществуют два противоположных тренда зернистости: устьевой бар укрупняется вверх (CU), а прорезающий его распределительный рукав мельчает вверх (FU) и часто венчается углём."], "source_ref": "Практическая седиментология (терригенные коллектора), Глава 1, § 1.2.1. Преимущественно флювиальные дельты [Fluvial deltas] (PDF стр. 34–39, печ. 33–38), PDF стр. 39 (печ. стр. 38)", "verbatim_quote": "весь берег, и, если поверхность скольжения распространяется ниже основания протоки, сползшие осадки могут сохраниться ниже фаций русла."}, {"task_id": "t3_ctrl_baraboshkin_b_task_ord_01", "course_id": "t3_ctrl_baraboshkin_b", "node_id": "baraboshkin_s1_2_node_01", "step_id": "baraboshkin_s1_2_step_01", "claim_id": "baraboshkin_s1_2_node_01_claim_01", "pdf_page": 30, "printed_page": "29", "task_type": "ordering", "difficulty_level": "инженерный", "prompt": "Расположите ручные действия специалиста на шаге «Морфология и классификация дельтовых систем» в методически правильном порядке (поддерживается перетаскивание и кнопки Вверх/Вниз с клавиатуры):", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": [], "ordering_items": ["Выделить в разрезе три ключевые зоны дельты: продельту, фронт дельты и дельтовую равнину (рис. 1.14).", "Оценить признаки волновой или приливной переработки осадков и определить положение дельты на треугольнике рис. 1.16.", "Спрогнозировать направление вытянутости песчаных тел (вдоль или поперёк палеоберега)."], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": ["Выделить в разрезе три ключевые зоны дельты: продельту, фронт дельты и дельтовую равнину (рис. 1.14).", "Оценить признаки волновой или приливной переработки осадков и определить положение дельты на треугольнике рис. 1.16.", "Спрогнозировать направление вытянутости песчаных тел (вдоль или поперёк палеоберега)."], "answer_key_display": "1) Выделить в разрезе три ключевые зоны дельты: продельту, фронт дельты и дельтовую равнину (рис. 1.14). → 2) Оценить признаки волновой или приливной переработки осадков и определить положение дельты на треугольнике рис. 1.16. → 3) Спрогнозировать направление вытянутости песчаных тел (вдоль или поперёк палеоберега).", "explanation": "Методический порядок диктуется цепочкой «проверка условий и первичных данных → расчёт/построение → контроль результата» (Практическая седиментология (терригенные коллектора), Глава 1, § 1.2. Дельты [Deltas]: морфология и классификация Гэллоуэя (PDF стр. 30–33, печ. 29–32), PDF стр. 30).", "error_analysis": {"order_mismatch": "Нарушена последовательность подготовки данных: нельзя снимать итоговый параметр до проверки граничных условий и приведения единиц."}, "hint_steps": ["Первый шаг всегда связан с проверкой первичных данных, масштабов или условий применимости.", "Второй шаг выполняет основное преобразование, расчёт или построение по палетке/формуле.", "Заключительный шаг — снятие целевого параметра и проверка критерия принятия решения."], "source_ref": "Практическая седиментология (терригенные коллектора), Глава 1, § 1.2. Дельты [Deltas]: морфология и классификация Гэллоуэя (PDF стр. 30–33, печ. 29–32), PDF стр. 30", "verbatim_quote": "Рис. 1.13. Русловой аллювий реки с блуждающим руслом, быстро сменяющийся пелитовым аллювием отмирающего русла. Нижняя юра, скв. Склоновая-21."}, {"task_id": "t3_ctrl_baraboshkin_b_task_ord_02", "course_id": "t3_ctrl_baraboshkin_b", "node_id": "baraboshkin_s1_2_node_02", "step_id": "baraboshkin_s1_2_step_02", "claim_id": "baraboshkin_s1_2_node_02_claim_01", "pdf_page": 39, "printed_page": "38", "task_type": "ordering", "difficulty_level": "инженерный", "prompt": "Расположите ручные действия специалиста на шаге «Флювиальные дельты и проградационные разрезы» в методически правильном порядке (поддерживается перетаскивание и кнопки Вверх/Вниз с клавиатуры):", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": [], "ordering_items": ["Выявить в керне потоковую косую слоистость и слоистость ряби течений (рис. 1.17, 1.19).", "Проверить кровлю циклита на наличие палеопочв (рис. 1.20), прослоев углей (рис. 1.21) и растительного детрита (рис. 1.22).", "Отделить проградационный устьевой бар (CU) от эрозионного рукава (FU) по характеру нижней границы (рис. 1.18)."], "matching_pairs": [] новая или приливная) задаёт 3D-архитектуру резервуара: направление максимальной проницаемости поворачивается на 90° между волновыми и флювиальными системами.", "Шаг 3 (Вывод): сформулируйте решение с учётом точки контроля — Вывод и решение специалиста: Выбор типа дельтовой концептуальной модели для 3D-геологического моделирования."], "source_ref": "Практическая седиментология (терригенные коллектора), Глава 1, § 1.2. Дельты [Deltas]: морфология и классификация Гэллоуэя (PDF стр. 30–33, печ. 29–32), PDF стр. 30", "verbatim_quote": "Рис. 1.13. Русловой аллювий реки с блуждающим руслом, быстро сменяющийся пелитовым аллювием отмирающего русла. Нижняя юра, скв. Склоновая-21."}, {"task_id": "t3_ctrl_baraboshkin_b_task_case_02", "course_id": "t3_ctrl_baraboshkin_b", "node_id": "baraboshkin_s1_2_node_02", "step_id": "baraboshkin_s1_2_step_02", "claim_id": "baraboshkin_s1_2_node_02_claim_01", "pdf_page": 39, "printed_page": "38", "task_type": "case_decision", "difficulty_level": "продвинутый", "prompt": "Кейс принятия решения по данным («признаки → правило → вывод») по шагу «Флювиальные дельты и проградационные разрезы».\n1) Признаки (данные): Фотографии керна юрских скважин (Западно-Моисеевская-30, Северо-Пионерская-1, Крапивинская-102, рис. 1.17, 1.19–1.22) и разрез рис. 1.18. Кроме того, зафиксировано: На рис. 1.17–1.22 (PDF стр. 34–39, печ. 33–38): привязка диагностических текстур керна (косая слоистость, детрит, уголь, палеопочва) к форме каротажных кривых ГК/ПС.\n2) Правило (критерий по учебнику, стр. 39): Во флювиальной дельте сосуществуют два противоположных тренда зернистости: устьевой бар укрупняется вверх (CU), а прорезающий его распределительный рукав мельчает вверх (FU) и часто венчается углём. (с учётом ограничения: Из-за резкого переключения (авульсии) рукавов флювиальные песчаные тела имеют пальцеобразную форму и часто экранированы межрукавными глинами и углями, что затрудняет межскважинную корреляцию.)\nКакой инженерный вывод следует сделать специалисту?", " ис. 1.17, 1.19–1.22) и разрез рис. 1.18. Кроме того, зафиксировано: На рис. 1.17–1.22 (PDF стр. 34–39, печ. 33–38): привязка диагностических текстур керна (косая слоистость, детрит, уголь, палеопочва) к форме каротажных кривых ГК/ПС. → Правило (критерий по учебнику, стр. 39): Во флювиальной дельте сосуществуют два противоположных тренда зернистости: устьевой бар укрупняется вверх (CU), а прорезающий его распределительный рукав мельчает вверх (FU) и часто венчается углём. (с учётом ограничения: Из-за резкого переключения (авульсии) рукавов флювиальные песчаные тела имеют пальцеобразную форму и часто экранированы межрукавными глинами и углями, что затрудняет межскважинную корреляцию.) → Вывод и решение специалиста: Трассирование узких флювиальных рукавов между разведочными скважинами. (Практическая седиментология (терригенные коллектора), Глава 1, § 1.2.1. Преимущественно флювиальные дельты [Fluvial deltas] (PDF стр. 34–39, печ. 33–38), PDF стр. 39).", "error_analysis": {"1": "Применение методики без проверки граничного условия приводит к грубой ошибке в подсчётных параметрах.", "2": "Сработала типичная ловушка: Путаница между устьевым баром (постепенная подошва, тренд CU) и дельтовым рукавом (резкий эрозионный врез, тренд FU) приводит к неверной оценке связности коллекторов и прорывам воды.", "3": "Все условия применимости выполнены, поэтому отказ от интерпретации необоснован."}, "hint_steps": ["Шаг 1 (Признаки): выделите ключевой диагностический сигнал в данных — На рис. 1.17–1.22 (PDF стр. 34–39, печ. 33–38): привязка диагностических текстур керна (косая слоистость, детрит, уголь, палеопочва) к форме каротажных кривых ГК/ПС.", "Шаг 2 (Правило): сопоставьте сигнал с пороговым критерием — Во флювиальной дельте сосуществуют два противоположных тренда зернистости: устьевой бар укрупняется вверх (CU), а прорезающий его распределительный рукав мельчает вверх (FU) и часто венчается углём.", "Шаг 3 (Вывод): сформулируйте решение с учётом точки контроля — Вывод и решение сп
