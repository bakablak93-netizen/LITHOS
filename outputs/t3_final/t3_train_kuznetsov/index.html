id": "t3_train_kuznetsov", "node_id": "kuznetsov_ch10_node_02", "step_id": "kuznetsov_ch10_step_02", "claim_id": "kuznetsov_ch10_node_02_claim_01", "pdf_page": 205, "printed_page": "205", "task_type": "case_decision", "difficulty_level": "продвинутый", "prompt": "Кейс принятия решения по данным («признаки → правило → вывод») по шагу «Литолого фациальная зональность и пустотность рифов».\n1) Признаки (данные): Петрографический состав керна (доля биогермных, детритовых, брекчиевых и доломитизированных разностей) и тип пустот в шлифах. Кроме того, зафиксировано: В петрографическом журнале керна: резкая смена неслоистых массивных кристаллических доломитов ядра на косослоистые известняковые брекчии предрифового склона и тонкослоистые микрозернистые известняки лагуны.\n2) Правило (критерий по учебнику, стр. 205): В зрелом рифовом комплексе обломочных известняков разрушения (50–80 %) гораздо больше, чем самого прижизненного биогермного каркаса (10–20 %). (с учётом ограничения: Первичная пористость каркаса нередко быстро залечивается субаквальной цементацией и спаритом, поэтому лучшие ФЕС формируются именно там, где на первичную проницаемость наложились вторичное выщелачивание и доломитизация.)\nКакой инженерный вывод следует сделать специалисту?", "case_observation": "Признаки (данные): Петрографический состав керна (доля биогермных, детритовых, брекчиевых и доломитизированных разностей) и тип пустот в шлифах. Кроме того, зафиксировано: В петрографическом журнале керна: резкая смена неслоистых массивных кристаллических доломитов ядра на косослоистые известняковые брекчии предрифового склона и тонкослоистые микрозернистые известняки лагуны.", "case_rule": "Правило (критерий по учебнику, стр. 205): В зрелом рифовом комплексе обломочных известняков разрушения (50–80 %) гораздо больше, чем самого прижизненного биогермного каркаса (10–20 %). (с учётом ограничения: Первичная пористость каркаса нередко быстро залечивается субаквальной цементацией и спаритом, поэтому лучшие ФЕС формируются именно там, где на первичную проницаемость наложились вторичное выщелачивание и доломитизация.)", "case_conclusion": "Вывод и решение специалиста: Выбор модели кольцевой зональности (для атоллов с центральной лагуной) либо линейно-асимметричной модели (для барьерных систем).", "options": ["Признаки подтверждают критерий применимости → Вывод и решение специалиста: Выбор модели кольцевой зональности (для атоллов с центральной лагуной) либо линейно-асимметричной модели (для барьерных систем).", "Игнорировать граничное условие (Первичная пористость каркаса нередко быстро залечивается субаквальной ) и применить формулу вслепую", "Принять ошибочную трактовку: Ошибочно искать коллектор только в прижизненных коралловых/водорослевых каркасах", "Отказаться от количественной интерпретации при выполнении всех условий применимости"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Ход решения: Признаки → Правило → Вывод: Признаки подтверждают критерий применимости → Вывод и решение специалиста: Выбор модели кольцевой зональности (для атоллов с центральной лагуной) либо линейно-асимметричной модели (для барьерных систем).", "explanation": "По цепочке «признаки → правило → вывод»: Признаки (данные): Петрографический состав керна (доля биогермных, детритовых, брекчиевых и доломитизированных разностей) и тип пустот в шлифах. Кроме того, зафиксировано: В петрографическом журнале керна: резкая смена неслоистых массивных кристаллических доломитов ядра на косослоистые известняковые брекчии предрифового склона и тонкослоистые микрозернистые известняки лагуны. → Правило (критерий по учебнику, стр. 205): В зрелом рифовом комплексе обломочных известняков разрушения (50–80 %) гораздо больше, чем самого прижизненного биогермного каркаса (10–20 %). (с учётом ограничения: Первичная пористость каркаса нередко быстро залечивается субаквальной цементацией и спаритом, поэтому лучшие ФЕС формируются именно там, где на первичную проницаемость наложились вторичное выщелачивание и доломитизация.) → Вывод и решение специалиста: Выбор модели кольцевой зональности (для атоллов с центральной лагуной) либо линейно-асимметричной модели (для барьерных систем). (Литология природных резервуаров нефти и газа, Глава 10, § 10.2. Литология и коллекторские свойства слагающих рифы пород (стр. 202–205), PDF стр. 205).", "error_analysis": {"1": "Применение методики без проверки граничного условия приводит к грубой ошибке в подсчётных параметрах.", "2": "Сработала типичная ловушка: Ошибочно искать коллектор только в прижизненных коралловых/водорослевых каркасах: каркас часто зацементирован спаритом, а главными коллекторами служат доломитизированные и выщелоченные детритовые зоны ядра и шлейфа.", "3": "Все условия применимости выполнены, поэтому отказ от интерпретации необоснован."}, "hint_steps": ["Шаг 1 (Признаки): выделите ключевой диагностический сигнал в данных — В петрографическом журнале керна: резкая смена неслоистых массивных кристаллических доломитов ядра на косослоистые известняковые брекчии предрифового склона и тонкослоистые микрозернистые известняки лагуны.", "Шаг 2 (Правило): сопоставьте сигнал с пороговым критерием — В зрелом рифовом комплексе обломочных известняков разрушения (50–80 %) гораздо больше, чем самого прижизненного биогермного каркаса (10–20 %).", "Шаг 3 (Вывод): сформулируйте решение с учётом точки контроля — Вывод и решение специалиста: Выбор модели кольцевой зональности (для атоллов с центральной лагуной) либо линейно-асимметричной модели (для барьерных систем)."], "source_ref": "Литология природных резервуаров нефти и газа, Глава 10, § 10.2. Литология и коллекторские свойства слагающих рифы пород (стр. 202–205), PDF стр. 205", "verbatim_quote": "Большое значение имеет также вторичная пористость. Наиболее важной является каверновая пустотность, образующаяся при активном выщелачивании, в том числе карстовом. Высокая способность к выщелачиванию обусловлена во многом свойствами самих рифов – их высокой первичной проницаемостью, массивностью строения и практически отсутствием глинистых и иных экранирующих пачек, чистотой химического состава пород и другими факторами, что определяет активный водообмен, растворение и вынос вещества. Высокой карстуемости рифов способствует их гипсометрическое положение – они всегда располагаются выше синхронных отложений, а в процессе роста нередко выходят выше уровня моря, т.е. начинают карстоваться уже при своем образовании. В результате возникают каверны разных форм, происхождения (унаследованные, разработанные) и размеров – от долей миллиметра до крупных карстовых пещер. Уникальный дебит в 42000 м³/сут скв. 4 месторождения Серро-Асуль в поясе Голден-Лейк Мексики, связанного с меловым рифом, обусловлен тем, что скважина вскрыла карстовую пещеру, сформированную в этом рифе. При этом вместе с нефтью выносились обломки сталактитов."}, {"task_id": "t3_train_kuznetsov_task_case_03", "course_id": "t3_train_kuznetsov", "node_id": "kuznetsov_ch10_node_03", "step_id": "kuznetsov_ch10_step_03", "claim_id": "kuznetsov_ch10_node_03_claim_01", "pdf_page": 206, "printed_page": "206", "task_type": "case_decision", "difficulty_level": "продвинутый", "prompt": "Кейс принятия решения по данным («признаки → правило → вывод») по шагу «Строение резервуаров одиночных рифов и атоллов».\n1) Признаки (данные): Геологический разрез по профилю скважин 6-32 .. 12-28 рифа Рейнбоу «А» (рис. 10.2) и карты пористости/проницаемости Карачаганака (рис. 10.3–10.4). Кроме того, зафиксировано: На разрезе рис. 10.2 (стр. 206): купол высотой 0–240 м по скв. 6-32, 2-32, 7-32, 10-32, 12-33, 12-28; в центральном ядре пористость 10–15 % (до 35 %), на периферии и в лагунных линзах — 3–5 %.\n2) Правило (критерий по учебнику, стр. 206): При переходе от одиночного купола к атоллу геометрический центр структуры превращается из зоны лучшего коллектора в зону худшего (лагунного) коллектора, а лучшие ФЕС смещаются на периферийное кольцо. (с учётом ограничения: Даже в массивном рифе присутствуют внутрирезервуарные низкопроницаемые прослои лагунных микрозернистых известняков, однако они не выдержаны по площади и не нарушают единого гидродинамического резервуара.)\nКакой инженерный вывод следует сделать специалисту?", "case_observation": "Признаки (данные): Геологический разрез по профилю скважин 6-32 .. 12-28 рифа Рейнбоу «А» (рис. 10.2) и карты пористости/проницаемости Карачаганака (рис. 10.3–10.4). Кроме того, зафиксировано: На разрезе рис. 10.2 (стр. 206): купол высотой 0–240 м по скв. 6-32, 2-32, 7-32, 10-32, 12-33, 12-28; в центральном ядре пористость 10–15 % (до 35 %), на периферии и в лагунных линзах — 3–5 %.", "case_rule": "Правило (критерий по учебнику, стр. 206): При переходе от одиночного купола к атоллу геометрический центр структуры превращается из зоны лучшего коллектора в зону худшего (лагунного) коллектора, а лучшие ФЕС смещаются на периферийное кольцо. (с учётом ограничения: Даже в массивном рифе присутствуют внутрирезервуарные низкопроницаемые прослои лагунных микрозернистых известняков, однако они не выдержаны по площади и не нарушают единого гидродинамического резервуара.)", "case_conclusion": "Вывод и решение специалиста: Размещение добывающих скважин: в центральном своде для куполовидного рифа либо по кольцевому гребню для атолла.", "options": ["Признаки подтверждают критерий применимости → Вывод и решение специалиста: Размещение добывающих скважин: в центральном своде для куполовидного рифа либо по кольцевому гребню для атолла.", "Игнорировать граничное условие (Даже в массивном рифе присутствуют внутрирезервуарные низкопроницаемые) и применить формулу вслепую", "Принять ошибочную трактовку: Бурение строго в геометрическом центре крупного атолловидного рифа по аналогии с", "Отказаться от количественной интерпретации при выполнении всех условий применимости"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Ход решения: Признаки → Правило → Вывод: Признаки подтверждают критерий применимости → Вывод и решение специалиста: Размещение добывающих скважин: в центральном своде для куполовидного рифа либо по кольцевому гребню для атолла.", "explanation": "По цепочке «признаки → правило → вывод»: Признаки (данные): Геологический разрез по профилю скважин 6-32 .. 12-28 рифа Рейнбоу «А» (рис. 10.2) и карты пористости/проницаемости Карачаганака (рис. 10.3–10.4). Кроме того, зафиксировано: На разрезе рис. 10.2 (стр. 206): купол высотой 0–240 м по скв. 6-32, 2-32, 7-32, 10-32, 12-33, 12-28; в центральном ядре пористость 10–15 % (до 35 %), на периферии и в лагунных линзах — 3–5 %. → Правило (критерий по учебнику, стр. 206): При переходе от одиночного купола к атоллу геометрический центр структуры превращается из зоны лучшего коллектора в зону худшего (лагунного) коллектора, а лучшие ФЕС смещаются на периферийное кольцо. (с учётом ограничения: Даже в массивном рифе присутствуют внутрирезервуарные низкопроницаемые прослои лагунных микрозернистых известняков, однако они не выдержаны по площади и не нарушают единого гидродинамического резервуара.) → Вывод и решение специалиста: Размещение добывающих скважин: в центральном своде для куполовидного рифа либо по кольцевому гребню для атолла. (Литология природных резервуаров нефти и газа, Глава 10, § 10.3. Строение рифовых резервуаров: купола и атоллы (стр. 205–212), PDF стр. 206).", "error_analysis": {"1": "Применение методики без проверки граничного условия приводит к грубой ошибке в подсчётных параметрах.", "2": "Сработала типичная ловушка: Бурение строго в геометрическом центре крупного атолловидного рифа по аналогии с антиклинальной складкой приводит к попаданию в низкопористые глинисто-микрозернистые фации центральной лагуны.", "3": "Все условия применимости выполнены, поэтому отказ от интерпретации необоснован."}, "hint_steps": ["Шаг 1 (Признаки): выделите ключевой диагностический сигнал в данных — На разрезе рис. 10.2 (стр. 206): купол высотой 0–240 м по скв. 6-32, 2-32, 7-32, 10-32, 12-33, 12-28; в центральном ядре пористость 10–15 % (до 35 %), на периферии и в лагунных линзах — 3–5 %.", "Шаг 2 (Правило): сопоставьте сигнал с пороговым критерием — При переходе от одиночного купола к атоллу геометрический центр структуры превращается из зоны лучшего коллектора в зону худшего (лагунного) коллектора, а лучшие ФЕС смещаются на периферийное кольцо.", "Шаг 3 (Вывод): сформулируйте решение с учётом точки контроля — Вывод и решение специалиста: Размещение добывающих скважин: в центральном своде для куполовидного рифа либо по кольцевому гребню для атолла."], "source_ref": "Литология природных резервуаров нефти и газа, Глава 10, § 10.3. Строение рифовых резервуаров: купола и атоллы (стр. 205–212), PDF стр. 206", "verbatim_quote": "━━━ FORMAT 4: CROSS-SECTION / РАЗРЕЗ ━━━\nОриентация разреза: СЗ (слева) — ЮВ (справа).\nВертикальная ось: $H$, м; отметки 0, 50, 100, 150, 200, 250 м. Значения высоты увеличиваются вверх. Горизонтальный масштаб не указан.\nСкважины вдоль разреза, слева направо:\n- 6–32 — чёрная точка.\n- 2–32 — чёрная точка.\n- 7–32 — чёрная точка.\n- 10–32 — чёрная точка.\n- 12–33 — чёрная точка.\n- 12–28 — ромб.\nРазрез изображает куполообразное тело, возвышающееся от отметки около 0 м до примерно 240 м. Внешняя граница тела круто поднимается с обеих сторон; в верхней части образуется округлая вершина. Внутри показан"}, {"task_id": "t3_train_kuznetsov_task_calc_01", "course_id": "t3_train_kuznetsov", "node_id": "kuznetsov_ch10_node_02", "step_id": "kuznetsov_ch10_step_02", "claim_id": "kuznetsov_ch10_node_02_claim_01", "pdf_page": 205, "printed_page": "205", "task_type": "calculation", "difficulty_level": "продвинутый", "prompt": "По данным §10.3 (стр. 205, рис. 10.2) в одиночном куполовидном рифе Рейнбоу «А» (Канада) нефтенасыщенная мощность составляет 90 м, а газонасыщенная шапка — 60 м при общей высоте рифа 250 м. Вычислите суммарную продуктивную (нефтегазонасыщенную) высоту залежи в этом рифе (в метрах).", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": [], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "м", "calculation_tolerance": 1.0, "correct_answer": 150.0, "answer_key_display": "150.0 м", "explanation": "Согласно §10.3 (стр. 205), из общей высоты пиннакла 200–250 м 90 м нефтенасыщены и 60 м газонасыщены; суммарный продуктивный этаж составляет 90 + 60 = 150 м. (Литология природных резервуаров нефти и газа, Глава 10, § 10.2. Литология и коллекторские свойства слагающих рифы пород (стр. 202–205), PDF стр. 205).", "error_analysis": {"wrong_value": "Проверьте перевод единиц измерения в систему расчёта (м) и порядок действий в формуле."}, "hint_steps": ["Проверьте параметры эталонного рифа Рейнбоу «А» в §10.3 (стр. 205).", "Сложите толщину нефтенасыщенной зоны (90 м) и газовой шапки (60 м).", "90 м + 60 м = 150 м."], "source_ref": "Литология природных резервуаров нефти и газа, Глава 10, § 10.2. Литология и коллекторские свойства слагающих рифы пород (стр. 202–205), PDF стр. 205", "verbatim_quote": "Большое значение имеет также вторичная пористость. Наиболее важной является каверновая пустотность, образующаяся при активном выщелачивании, в том числе карстовом. Высокая способность к выщелачиванию обусловлена во многом свойствами самих рифов – их высокой первичной проницаемостью, массивностью строения и практически отсутствием глинистых и иных экранирующих пачек, чистотой химического состава пород и другими факторами, что определяет активный водообмен, растворение и вынос вещества. Высокой карстуемости рифов способствует их гипсометрическое положение – они всегда располагаются выше синхронных отложений, а в процессе роста нередко выходят выше уровня моря, т.е. начинают карстоваться уже при своем образовании. В результате возникают каверны разных форм, происхождения (унаследованные, разработанные) и размеров – от долей миллиметра до крупных карстовых пещер. Уникальный дебит в 42000 м³/сут скв. 4 месторождения Серро-Асуль в поясе Голден-Лейк Мексики, связанного с меловым рифом, обусловлен тем, что скважина вскрыла карстовую пещеру, сформированную в этом рифе. При этом вместе с нефтью выносились обломки сталактитов."}, {"task_id": "t3_train_kuznetsov_task_calc_02", "course_id": "t3_train_kuznetsov", "node_id": "kuznetsov_ch10_node_03", "step_id": "kuznetsov_ch10_step_03", "claim_id": "kuznetsov_ch10_node_03_claim_01", "pdf_page": 206, "printed_page": "206", "task_type": "calculation", "difficulty_level": "продвинутый", "prompt": "В крупном рифовом комплексе (§10.2, стр. 202) доля прижизненных биогермных каркасных известняков составляет 20 %, а остальной объём массива сложен обломочными и детритовыми известняками разрушения. Какова доля обломочных/детритовых разностей в таком рифе (в %)?", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": [], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "%", "calculation_tolerance": 1.0, "correct_answer": 80.0, "answer_key_display": "80.0 %", "explanation": "По данным §10.2 (стр. 202), содержание биогермных известняков в сложных рифовых комплексах не превышает 10–20 %, а ведущее значение по распространённости имеют обломочные разности (до 60–80 %). (Литология природных резервуаров нефти и газа, Глава 10, § 10.3. Строение рифовых резервуаров: купола и атоллы (стр. 205–212), PDF стр. 206).", "error_analysis": {"wrong_value": "Проверьте перевод единиц измерения в систему расчёта (%) и порядок действий в формуле."}, "hint_steps": ["Вспомните баланс пород рифового комплекса из §10.2 (стр. 202).", "Вычтите долю каркасных биогермных пород (20 %) из 100 %.", "100 % − 20 % = 80 %."], "source_ref": "Литология природных резервуаров нефти и газа, Глава 10, § 10.3. Строение рифовых резервуаров: купола и атоллы (стр. 205–212), PDF стр. 206", "verbatim_qu ов нефти и газа, Глава 10, § 10.1. Краткие сведения о геологии рифов и их типах (стр. 200–202), PDF стр. 201); пункт 3 воспроизводит типичное заблуждение.", "error_analysis": {"2": "Типичное заблуждение: Типичная ошибка геологов-поисковиков — принимать любой пластовый биоморфный известняк (биостром) за риф и проектировать бурение на несуществующий купольный свод.", "3": "Нарушение границ применимости делает расчёт недостоверным."}, "hint_steps": ["Сверьте наблюдения и допущения шага «Иерархия органогенных построек биостромы биогермы рифы».", "Отбросьте типичное заблуждение: Типичная ошибка геологов-поисковиков — принимать любой пластовый биоморфный известняк (био", "В данном задании верны два утверждения."], "source_ref": "Литология природных резервуаров нефти и газа, Глава 10, § 10.1. Краткие сведения о геологии рифов и их типах (стр. 200–202), PDF стр. 201", "verbatim_quote": "━━━ FORMAT 12: CONCEPTUAL DIAGRAM / КОНЦЕПТУАЛЬНАЯ СХЕМА ━━━\nСхематический поперечный разрез симметричной куполообразной структуры с дугообразно изогнутыми внутренними слоями. В центральной верхней части показан крупный свод; по его бокам расположены наклонные полосы с косыми линейными элементами. Нижняя часть с обеих сторон содержит горизонтально-слоистые участки, над которыми показаны наклонные зоны с овальными элементами; литология не определяется без легенды. По левому краю имеется вертикальная двусторонняя стрелка с обозначением «N». Верхняя и нижняя границы рисунка обозначены горизонталь"}, {"task_id": "t3_train_kuznetsov_task_multi_02", "course_id": "t3_train_kuznetsov", "node_id": "kuznetsov_ch10_node_02", "step_id": "kuznetsov_ch10_step_02", "claim_id": "kuznetsov_ch10_node_02_claim_01", "pdf_page": 205, "printed_page": "205", "task_type": "multi_select", "difficulty_level": "инженерный", "prompt": "Выберите ВСЕ верные утверждения по шагу «Литолого фациальная зональность и пустотность рифов» (стр. 205):", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": [" . Высокая способность к выщелачиванию обусловлена во многом свойствами самих рифов – их высокой первичной проницаемостью, массивностью строения и практически отсутствием глинистых и иных экранирующих пачек, чистотой химического состава пород и другими факторами, что определяет активный водообмен, растворение и вынос вещества. Высокой карстуемости рифов способствует их гипсометрическое положение – они всегда располагаются выше синхронных отложений, а в процессе роста нередко выходят выше уровня моря, т.е. начинают карстоваться уже при своем образовании. В результате возникают каверны разных форм, происхождения (унаследованные, разработанные) и размеров – от долей миллиметра до крупных карстовых пещер. Уникальный дебит в 42000 м³/сут скв. 4 месторождения Серро-Асуль в поясе Голден-Лейк Мексики, связанного с меловым рифом, обусловлен тем, что скважина вскрыла карстовую пещеру, сформированную в этом рифе. При этом вместе с нефтью выносились обломки сталактитов."}, {"task_id": "t3_train_kuznetsov_task_blank_01", "course_id": "t3_train_kuznetsov", "node_id": "kuznetsov_ch10_node_02", "step_id": "kuznetsov_ch10_step_02", "claim_id": "kuznetsov_ch10_node_02_claim_01", "pdf_page": 205, "printed_page": "205", "task_type": "fill_in_blank", "difficulty_level": "базовый", "prompt": "Заполните пропуск (термин или обозначение из шага «Литолого фациальная зональность и пустотность рифов», стр. 205): «_______ — это крутой внешний склон рифа, сложенный грубообломочными известняковыми брекчиями, конгломератами и гравелитами».", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": [], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": ["предрифовый шлейф", "фация 2", "fore-reef talus"], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": "Предрифовый шлейф", "answer_key_display": "Предрифовый шлейф (допускаются также: предрифовый шлейф, фация 2, fore-reef talus)", "explanation": "По определению при первом употреблении на с 02", "course_id": "t3_train_kuznetsov", "node_id": "kuznetsov_ch10_node_03", "step_id": "kuznetsov_ch10_step_03", "claim_id": "kuznetsov_ch10_node_03_claim_01", "pdf_page": 206, "printed_page": "206", "task_type": "fill_in_blank", "difficulty_level": "базовый", "prompt": "Заполните пропуск (термин или обозначение из шага «Строение резервуаров одиночных рифов и атоллов», стр. 206): «_______ — это островершинный одиночный куполовидный риф небольшой площади и большой относительной высоты».", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": [], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": ["пиннакл", "пиннакл", "pinnacle reef"], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": "Пиннакл", "answer_key_display": "Пиннакл (допускаются также: пиннакл, пиннакл, pinnacle reef)", "explanation": "По определению при первом употреблении на стр. 206: Пиннакл — Островершинный одиночный куполовидный риф небольшой площади и большой относительной высоты (Литология природных резервуаров нефти и газа, Глава 10, § 10.3. Строение рифовых резервуаров: купола и атоллы (стр. 205–212), PDF стр. 206).", "error_analysis": {"wrong_text": "Проверьте орфографию опорного термина или его каноническое обозначение (СНГ/Запад) в глоссарии шага."}, "hint_steps": ["Откройте блок опорных терминов шага «Строение резервуаров одиночных рифов и атоллов».", "СНГ-обозначение: Пиннакл, западное: Pinnacle reef.", "Первое слово ответа: «Пиннакл»."], "source_ref": "Литология природных резервуаров нефти и газа, Глава 10, § 10.3. Строение рифовых резервуаров: купола и атоллы (стр. 205–212), PDF стр. 206", "verbatim_quote": "━━━ FORMAT 4: CROSS-SECTION / РАЗРЕЗ ━━━\nОриентация разреза: СЗ (слева) — ЮВ (справа).\nВертикальная ось: $H$, м; отметки 0, 50, 100, 150, 200, 250 м. Значения высоты увеличиваются вверх. Горизонтальный масштаб не указан.\nСкважины вдоль разреза, слева направо:\n- 6–32 — чёрная точка.\n- 2–32 — чёрная точка.\n- 7–32 — чёрная точка.\n- 10–32 — чёрная точка.\n- 12–33 — чёрная точка.\n- 12–28 — ромб.\nРазрез изображает куполообразное тело, возвышающееся от отметки около 0 м до примерно 240 м. Внешняя граница тела круто поднимается с обеих сторон; в верхней части образуется округлая вершина. Внутри показан"}], "flashcards": [{"card_id": "kuznetsov_ch10_step_01_card_01", "node_id": "kuznetsov_ch10_node_01", "step_id": "kuznetsov_ch10_step_01", "front_question": "Что означает термин «Биостром» (Биостром) и каков его международный эквивалент?", "back_answer": "Пластовое или плосколинзовидное карбонатное тело из остатков организмов in-situ, не выраженное в рельефе дна. Международный эквивалент (SPE): Biostrome (Biostrome (bedded organic build-up)). Единица: м.", "term_or_formula": "Биостром ↔ Biostrome", "pdf_page": 200, "printed_page": "200", "source_ref": "Литология природных резервуаров нефти и газа, стр. 200"}, {"card_id": "kuznetsov_ch10_step_01_card_02", "node_id": "kuznetsov_ch10_node_01", "step_id": "kuznetsov_ch10_step_01", "front_question": "Что означает термин «Биогерм» (Биогерм) и каков его международный эквивалент?", "back_answer": "Холмовидная органогенная постройка, возвышавшаяся над дном, но не достигавшая зоны волнового разрушения. Международный эквивалент (SPE): Bioherm (Bioherm (mound build-up)). Единица: м.", "term_or_formula": "Биогерм ↔ Bioherm", "pdf_page": 200, "printed_page": "200", "source_ref": "Литология природных резервуаров нефти и газа, стр. 200"}, {"card_id": "kuznetsov_ch10_step_01_card_03", "node_id": "kuznetsov_ch10_node_01", "step_id": "kuznetsov_ch10_step_01", "front_question": "Что означает термин «Риф» (Риф) и каков его международный эквивалент?", "back_answer": "Крупный карбонатный массив из каркасных организмов и продуктов их волнового разрушения, возвышающийся над синхронными осадками. Международный эквивалент (SPE): Reef (Wave-resistant reef complex). Единица: м.", "term_or_formula": "Риф ↔ Reef", "pdf_page": 200, "printed_page": "200", "source_ref": "Литология природных резервуаров нефти и газа, стр. 200"}, {"card_id": "kuznetsov_ch10_step_01_card_04", "node_id": "kuznetsov_ch10_node_01", "step_id": "kuznetsov_ch10_step_01", "front_question": "Пороговая идея и типичная ошибка шага «Иерархия органогенных построек биостромы биогермы рифы»", "back_answer": "Идея: Риф — это не просто скопление раковин, а автономизированная экосистема-волнолом, сама создающая расчленённый рельеф дна и собственные фациальные зоны разрушения (шлейф) и затишья (лагуну).\nОшибка, которую нужно избегать: Типичная ошибка геологов-поисковиков — принимать любой пластовый биоморфный известняк (биостром) за риф и проектировать бурение на несуществующий купольный свод.", "term_or_formula": "Иерархия органогенных построек биостромы биогермы рифы", "pdf_page": 201, "printed_page": "201", "source_ref": "Литология природных резервуаров нефти и газа, PDF стр. 201 (печ. стр. 201)"}, {"card_id": "kuznetsov_ch10_step_02_card_05", "node_id": "kuznetsov_ch10_node_02", "step_id": "kuznetsov_ch10_step_02", "front_question": "Что означает термин «Предрифовый шлейф» (Фация 2) и каков его международный эквивалент?", "back_answer": "Крутой внешний склон рифа, сложенный грубообломочными известняковыми брекчиями, конгломератами и гравелитами. Международный эквивалент (SPE): Fore-reef talus (Fore-reef apron / reef talus). Единица: фация.", "term_or_formula": "Фация 2 ↔ Fore-reef talus", "pdf_page": 203, "printed_page": "203", "source_ref": "Литология природных резервуаров нефти и газа, стр. 203"}, {"card_id": "kuznetsov_ch10_step_02_card_06", "node_id": "kuznetsov_ch10_node_02", "step_id": "kuznetsov_ch10_step_02", "front_question": "Что означает термин «Лагунная фация атолла» (Лагуна) и каков его международный эквивалент?", "back_answer": "Внутренняя замкнутая или полузамкнутая зона атолла со слоистыми микрозернистыми и шламовыми известняками. Международный эквивалент (SPE): Back-reef lagoon (Lagoonal micritic facies). Единица: фация.", "term_or_formula": "Лагуна ↔ Back-reef lagoon", "pdf_page": 203, "printed_page": "203", "source_ref": "Литология природных резервуаров нефти и газа, стр. 203"}, {"card_id": "kuznetsov_ch10_step_02_card_07", "node_id": "kuznetsov_ch10_node_02", "step_id": "kuznetsov_ch10_step_02", "front_question": "Что означает термин «Каверновая пустотность» (Каверны) и каков его международный эквивалент?", "back_answer": "Вторичные пустоты растворения и карстового выщелачивания размером от долей миллиметра до пещер. Международный эквивалент (SPE): Vuggy / karst porosity (Secondary vuggy & cavern porosity). Единица: %.", "term_or_formula": "Каверны ↔ Vuggy / karst porosity", "pdf_page": 203, "printed_page": "203", "source_ref": "Литология природных резервуаров нефти и газа, стр. 203"}, {"card_id": "kuznetsov_ch10_step_02_card_08", "node_id": "kuznetsov_ch10_node_02", "step_id": "kuznetsov_ch10_step_02", "front_question": "Пороговая идея и типичная ошибка шага «Литолого фациальная зональность и пустотность рифов»", "back_answer": "Идея: В зрелом рифовом комплексе обломочных известняков разрушения (50–80 %) гораздо больше, чем самого прижизненного биогермного каркаса (10–20 %).\nОшибка, которую нужно избегать: Ошибочно искать коллектор только в прижизненных коралловых/водорослевых каркасах: каркас часто зацементирован спаритом, а главными коллекторами служат доломитизированные и выщелоченные детритовые зоны ядра и шлейфа.", "term_or_formula": "Литолого фациальная зональность и пустотность рифов", "pdf_page": 205, "printed_page": "205", "source_ref": "Литология природных резервуаров нефти и газа, PDF стр. 205 (печ. стр. 205)"}, {"card_id": "kuznetsov_ch10_step_03_card_09", "node_id": "kuznetsov_ch10_node_03", "step_id": "kuznetsov_ch10_step_03", "front_question": "Что означает термин «Пиннакл» (Пиннакл) и каков его международный эквивалент?", "back_answer": "Островершинный одиночный куполовидный риф небольшой площади и большой относительной высоты. Международный эквивалент (SPE): Pinnacle reef (Pinnacle dome reef). Единица: м.", "term_or_formula": "Пиннакл ↔ Pinnacle reef", "pdf_page": 206, "printed_page": "206", "source_ref": "Литология природных резервуаров нефти и газа, стр. 206"}, {"card_id": "kuznetsov_ch10_step_03_card_10", "node_id": "kuznetsov_ch10_node_03", "step_id": "kuznetsov_ch10_step_03", "front_question": "Что означает термин «Массивный резервуар» (Массивный ПР) и каков его международный эквивалент?", "back_answer": "Природный резервуар большой толщины, гидродинамически единый во всём объёме без выдержанных флюидоупоров. Международный эквивалент (SPE): Massive reservoir (Single hydraulic massive reservoir). Единица: тип ПР.", "term_or_formula": "Массивный ПР ↔ Massive reservoir", "pdf_page": 206, "printed_page": "206", "source_ref": "Литология природных резервуаров нефти и газа, стр. 206"}, {"card_id": "kuznetsov_ch10_step_03_card_11", "node_id": "kuznetsov_ch10_node_03", "step_id": "kuznetsov_ch10_step_03", "front_question": "Пороговая идея и типичная ошибка шага «Строение резервуаров одиночных рифов и атоллов»", "back_answer": "Идея: При переходе от одиночного купола к атоллу геометрический центр структуры превращается из зоны лучшего коллектора в зону худшего (лагунного) коллектора, а лучшие ФЕС смещаются на периферийное кольцо.\nОшибка, которую нужно избегать: Бурение строго в геометрическом центре крупного атолловидного рифа по аналогии с антиклинальной складкой приводит к попаданию в низкопористые глинисто-микрозернистые фации центральной лагуны.", "term_or_formula": "Строение резервуаров одиночных рифов и атоллов", "pdf_page": 206, "printed_page": "206", "source_ref": "Литология природных резервуаров нефти и газа, PDF стр. 206 (печ. стр. 206)"}, {"card_id": "kuznetsov_ch10_step_04_card_12", "node_id": "kuznetsov_ch10_node_04", "step_id": "kuznetsov_ch10_step_04", "front_question": "Что означает термин «Структура облекания» (Облекание) и каков его международный эквивалент?", "back_answer": "Пологая антиклинальная форма в перекрывающих отложениях, повторяющая погребённый рельеф жёсткого рифового массива. Международный эквивалент (SPE): Draping structure (Compactional drape anticline over reef). Единица: структура.", "term_or_formula": "Облекание ↔ Draping structure", "pdf_page": 213, "printed_page": "213", "source_ref": "Литология природных резервуаров нефти и газа, стр. 213"}, {"card_id": "kuznetsov_ch10_step_04_card_13", "node_id": "kuznetsov_ch10_node_04", "step_id": "kuznetsov_ch10_step_04", "front_question": "Что означает термин «Литолого-морфологическая ловушка» (Рифовая ловушка) и каков его международный эквивалент?", "back_answer": "Ловушка УВ в выступе рифового массива, ограниченная сверху покрышкой, а сбоку — фациальным замещением. Международный эквивалент (SPE): Reef stratigraphic trap (Morphological / reef build-up trap). Единица: тип ловушки.", "term_or_formula": "Рифовая ловушка ↔ Reef stratigraphic trap", "pdf_page": 213, "printed_page": "213", "source_ref": "Литология природных резервуаров нефти и газа, стр. 213"}, {"card_id": "kuznetsov_ch10_step_04_card_14", "node_id": "kuznetsov_ch10_node_04", "step_id": "kuznetsov_ch10_step_04", "front_question": "Пороговая идея и типичная ошибка шага «Асимметричные барьерные рифы ловушки и разведка»", "back_answer": "Идея: В асимметричной барьерной системе зарифовая лагуна превращается из части резервуара в непроницаемый боковой экран (сульфаты, соли, плотные микрозернистые доломиты), запирающий залежь с регионального восстания.\nОшибка, которую нужно избегать: Нельзя интерпретировать сокращение мощности перекрывающей толщи над рифом как послерифовый тектонический свод: это седиментационная структура облекания и уплотнения вокруг жёсткого карбонатного ядра.", "term_or_formula": "Асимметричные барьерные рифы ловушки и разведка", "pdf_page": 213, "printed_page": "213", "source_ref": "Литология природных резервуаров нефти и газа, PDF стр. 213 (печ. стр. 213)"}], "summary_notes_markdown": "# Конспект главы: Глава 10. Природные резервуары рифов (§10.1–§10.4, PDF 200–222)\n**Книга:** Литология природных резервуаров нефти и газа (Кузнецов В. Г.)  \n**Файл источника:** `Кузнецов Литология природных резервуаров нефти и газа 2012.pdf` (SHA-256: `8cfa680b5ee6d307...`)  \n\n## Шаг 1. Иерархия органогенных построек биостромы биогермы рифы\n*Раздел источника:* Глава 10, § 10.1. Краткие сведения о геологии рифов и их типах (стр. 200–202) (PDF стр. 201 (печ. стр. 201))  \n**Суть:** Органогенные карбонатные постройки делятся на пластовые биостромы, холмовидные биогермы и волноустойчивые рифы (рис. 10.1). Рифы составляют малую долю осадочных пород, но концентрируют 10–12 % мировых запасов углеводородов благодаря огромной высоте массивных залежей (до 1500 м на Карачаганаке и 900–2100 м в зоне Ла Реформа).\n- **Механизм:** Колониальные каркасные организмы нарастают вверх к свету быстрее накопления синхронных осадков; в отличие от погружённого биогерма, настоящий риф выходит в зону волнового прибоя, разрушается волнами и формирует асимметричный или куполовидный комплекс с предрифовым обломочным шлейфом.\n- **Пороговая идея:** Риф — это не просто скопление раковин, а автономизированная экосистема-волнолом, сама создающая расчленённый рельеф дна и собственные фациальные зоны разрушения (шлейф) и затишья (лагуну).\n- **Типичная ошибка:** Типичная ошибка геологов-поисковиков — принимать любой пластовый биоморфный известняк (биостром) за риф и проектировать бурение на несуществующий купольный свод.\n- **Иллюстрация:** Схема строения органогенных построек: биостром (а), биогерм (б) и рифы (в, г) (перерисовано по рис. 10.1, стр. 201)\n\n## Шаг 2. Литолого фациальная зональность и пустотность рифов\n*Раздел источника:* Глава 10, § 10.2. Литология и коллекторские свойства слагающих рифы пород (стр. 202–205) (PDF стр. 205 (печ. стр. 205))  \n**Суть:** Хотя каркас рифа создают биогермные известняки (в крупных рифах их доля составляет лишь 10–20 %), основной объём массива (50–80 %) слагают обломочные, органогенно-детритовые и оолитовые породы. Сложное первичное пустотное пространство (сходное со «стогом соломы» по Т.А. Линку) многократно усиливается вторичным карстовым выщелачиванием и доломитизацией, создавая каверно-поровые коллекторы со сверхвысокими дебитами.\n- **Механизм:** Приподнятое положение рифа над дном и выход гребня выше уровня моря при регрессиях обеспечивают промывку чистых массивных карбонатов метеорными водами (карстование), а циркуляция магнезиальных рассолов вызывает перекристаллизацию и доломитизацию с ростом межкристаллической пористости.\n- **Пороговая идея:** В зрелом рифовом комплексе обломочных известняков разрушения (50–80 %) гораздо больше, чем самого прижизненного биогермного каркаса (10–20 %).\n- **Типичная ошибка:** Ошибочно искать коллектор только в прижизненных коралловых/водорослевых каркасах: каркас часто зацементирован спаритом, а главными коллекторами служат доломитизированные и выщелоченные детритовые зоны ядра и шлейфа.\n- **Иллюстрация:** Предметная анимация: первичная каркасная пористость и вторичное карстовое выщелачивание рифа (перерисовано по рис. 10.1–10.2, стр. 204)\n\n## Шаг 3. Строение резервуаров одиночных рифов и атоллов\n*Раздел источника:* Глава 10, § 10.3. Строение рифовых резервуаров: купола и атоллы (стр. 205–212) (PDF стр. 206 (печ. стр. 206))  \n**Суть:** В одиночных куполовидных рифах-пиннаклах (пример рифа Рейнбоу «А» в Канаде, рис. 10.2: мощность 200–250 м, 90 м нефти и 60 м газа) лучшие коллекторы концентрируются в центральной ядерной части массива (пористость до 15–35 %, проницаемость 0,2–3 мкм²). В крупных атолловидных массивах (Карачаганак, рис. 10.3–10.4; Интисар «Д») распределение коллекторов становится кольцевым: максимум пористости приурочен к периферийному рифовому гребню, а в центральной лагуне ФЕС ухудшаются.\n- **Механизм:** В небольшом куполе волновая гидродинамика и вторичное выщелачивание максимально перерабатывают центральную вершину, тогда как в атолле активный рост каркаса, волновое дробление и водообмен происходят по внешнему кольцу гребня, окружающему тиховодную илистую лагуну.\n- **Пороговая идея:** При переходе от одиночного купола к атоллу геометрический центр структуры превращается из зоны лучшего коллектора в зону худшего (лагунного) коллектора, а лучшие ФЕС смещаются на периферийное кольцо.\n- **Типичная ошибка:** Бурение строго в геометрическом центре крупного атолловидного рифа по аналогии с антиклинальной складкой приводит к попаданию в низкопористые глинисто-микрозернистые фации центральной лагуны.\n- **Иллюстрация:** Геологический разрез пиннакла Рейнбоу «А» (скв. 6-32 .. 12-28) и кольцевая зональность атолла (перерисовано по рис. 10.2, стр. 206)\n\n## Шаг 4. Асимметричные барьерные рифы ловушки и разведка\n*Раздел источника:* Глава 10, § 10.3–§ 10.4. Асимметричные рифовые системы, типы ловушек и разведка (стр. 213–222) (PDF стр. 213 (печ. стр. 213))  \n**Суть:** В асимметричных барьерных рифовых системах (Западно-Техасский пермский бассейн, девон Альберты, рис. 10.5–10.7) лучшие коллекторы формируются в пригребневой зоне ядра, тогда как в сторону глубоководного бассейна они резко сменяются плотными депрессионными породами, а в сторону лагуны — слоистыми сульфатно-карбонатными толщами, служащими боковым экраном. При разведке рифов ключевую роль играет выявление косвенных признаков: структур облекания в перекрывающих слоях, локального уменьшения мощности соленосной покрышки над сводом рифа и фациальной асимметрии.\n- **Механизм:** Рост барьерного рифа на бровке шельфа изолирует зарифовую лагуну, где в аридном климате осаждаются плотные доломиты и эвапориты (ангидриты, соли), формирующие как латеральный экран, так и региональную покрышку при последующем захоронении рифа.\n- **Пороговая идея:** В асимметричной барьерной системе зарифовая лагуна превращается из части резервуара в непроницаемый боковой экран (сульфаты, соли, плотные микрозернистые доломиты), запирающий залежь с регионального восстания.\n- **Типичная ошибка:** Нельзя интерпретировать сокращение мощности перекрывающей толщи над рифом как послерифовый тектонический свод: это седиментационная структура облекания и уплотнения вокруг жёсткого карбонатного ядра.\n- **Иллюстрация:** Асимметричный барьерный риф: структура облекания, лагунный эвапоритовый экран и точка бурения (перерисовано по рис. 10.5, стр. 214)\n", "media_passports": [], "bookmark_report": {"passed": true, "evaluation_mode": "internal_calibration", "book_file": "train_kuznetsov.md", "total_checked_objects": 140, "findings": [], "expert_review_queue": [{"finding_id": "BM-001", "verdict": "confirmed_violation", "defect_type": "expert_ambiguity", "severity": "EXPERT_REVIEW", "target_object": "claim:kuznetsov_ch10_node_01_claim_01", "problematic_fragment": "claim:kuznetsov_ch10_node_01_claim_01", "explanation": "Часть условных знаков на скане требует сверки с легендой", "proposed_fix": "Провести экспертную сверку с геологом/петрофизиком по оригинальному скану PDF.", "pdf_page": 201, "printed_page": "201", "supporting_quote": "Часть условных знаков на скане требует сверки с легендой", "rationale": "Часть условных знаков на скане требует сверки с легендой"}, {"finding_id": "BM-002", "verdict": "confirmed_violation", "defect_type": "expert_ambiguity", "severity": "EXPERT_REVIEW", "target_object": "claim:kuznetsov_ch10_node_03_claim_01", "problematic_fragment": "claim:kuznetsov_ch10_node_03_claim_01", "explanation": "Часть условных знаков на скане требует сверки с легендой", "proposed_fix": "Провести экспертную сверку с геологом/петрофизиком по оригинальному скану PDF.", "pdf_page": 206, "printed_page": "206", "supporting_quote": "Часть условных знаков на скане требует сверки с легендой", "rationale": "Часть условных знаков на скане требует сверки с легендой"}, {"finding_id": "BM-003", "verdict": "confirmed_violation", "defect_type": "expert_ambiguity", "severity": "EXPERT_REVIEW", "target_object": "claim:kuznetsov_ch10_node_03_claim_02", "problematic_fragment": "claim:kuznetsov_ch10_node_03_claim_02", "explanation": "Часть у         rhoFKey: "1.20",
        conclusionId: null,
        conclusionHintShown: false,
        transferId: null,
        transferHintShown: false
      }
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state = Object.assign(state, parsed);
          if (!state.practicum) {
            state.practicum = { forecastIdx: null, rhoFKey: "1.20", conclusionId: null, conclusionHintShown: false, transferId: null, transferHintShown: false };
          }
        }
      } catch (e) {}
      document.documentElement.setAttribute("data-theme", state.theme || "dark");
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
      updateProgressBadge();
    }

    function toggleTheme() {
      state.theme = state.theme === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", state.theme);
      saveState();
    }

    function returnToSavedStep() {
      state.activeTab = "steps";
      state.currentStepIdx = state.lastVisitedStepIdx || 0;
      saveState();
      renderAll();
    }

    function updateProgressBadge() {
      const totalSteps = COURSE.steps.length || 1;
      const doneSteps = Object.keys(state.completedSteps).length;
      const pct = Math.min(100, Math.round((doneSteps / totalSteps) * 100));
      const el = document.getElementById("progress-badge");
      if (el) el.textContent = "Прогресс главы: " + pct + "% (" + doneSteps + "/" + totalSteps + " шагов)";
    }

    function switchTab(tab) {
      state.activeTab = tab;
      saveState();
      renderAll();
    }

    function selectStep(idx) {
      state.currentStepIdx = idx;
      state.lastVisitedStepIdx = idx;
      state.completedSteps[COURSE.steps[idx].step_id] = true;
      saveState();
      renderAll();
    }

    function pickDataDecision(stepId, optId) {
      if (!state.dataDecisions) state.dataDecisions = {};
      state.dataDecisions[stepId] = optId;
      saveState();
      render();

    function setPracticumForecast(idx) {
      state.practicum.forecastIdx = idx;
      saveState();
      renderAll();
    }

    function setPracticumRhoF(key) {
      state.practicum.rhoFKey = String(key);
      saveState();
      renderAll();
    }

    function setPracticumConclusion(optId) {
      state.practicum.conclusionId = optId;
      saveState();
      renderAll();
    }

    function togglePracticumConclusionHint() {
      state.practicum.conclusionHintShown = true;
      saveState();
      renderAll();

      state.practicum.transferId = optId;
      saveState();
      renderAll();

      state.practicum.transferHintShown = true;
      saveState();
      renderAll();

    function renderPracticumBlock(pr) {

      const baseEntry = pCtrl.preset_states[pCtrl.baseline_key];
      const curKey = state.practicum.rhoFKey || pCtrl.baseline_key;
      const curEntry = pCtrl.preset_states[curKey] || baseEntry;
      const baseSt = baseEntry.state;
      const curSt = curEntry.state;

      let h = '<section id="practicum-two-probes" class="lithos-card" style="border:2px solid var(--lithos-cyan);">';

      h += '<span class="lithos-badge" style="border-color:var(--lithos-amber);color:var(--lithos-amber);">' + pr.data_origin_badge + '</span>';

      h += '<figcaption class="lithos-figcaption">Рисунок практикума: две каротажные кривые (ρ_БК и ρ_МБК) и разрез интервала 2408–2442 м из единого состояния модели (Симуляция по М.Г. Латышовой, 1991, §1, §20, стр. 9–16, 96–108).</figcaption></figure>';

      h += '</ul></div>';
      h += '<div style="padding:12px;border-radius:10px;background:var(--lithos-panel-bg);"><strong>Рассчитано и допущения модели:</strong><ul style="margin:6px 0 0 20px;">';

      // Шаг 2 практикума: Прогноз ДО раскрытия результата
      h += '<div class="lithos-card" style="background:var(--lithos-panel-bg);">';
      h += '<h3 style="margin-top:0;">Этап 2. Прогноз до раскрытия результата</h3>';
      h += '<p style="font-weight:700;">' + pr.step2_forecast.question + '</p>';
      pr.step2_forecast.options.forEach((opt, idx) => {
        const picked = state.practicum.forecastIdx === idx;
        h += '<button type="button" class="lithos-btn" style="display:block;width:100%;text-align:left;margin-bottom:8px;' + (picked ? 'border:2px solid var(--lithos-cyan);' : '') + '" onclick="setPracticumForecast(' + idx + ')">' + (idx + 1) + '. ' + opt + '</button>';
      });
      if (state.practicum.forecastIdx !== null) {
        h += '<p style="color:var(--lithos-emerald);font-weight:700;margin:8px 0 0 0;">' + pr.step2_forecast.forecast_feedback + '</p>';
      }
      h += '</div>';

      // Шаг 3 практикума: Изменение параметра ρ_ф и сравнение Исходного vs Изменённого состояния
      h += '<div class="lithos-card" style="background:var(--lithos-panel-bg);">';
      h += '<h3 style="margin-top:0;">Этап 3. Измените параметр и сравните исходное и изменённое состояния</h3>';
      h += '<p><strong>Параметр:</strong> ' + pCtrl.parameter_name + '. ' + pCtrl.parameter_rationale + '</p>';
      h += '<div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;">';
      pCtrl.presets.forEach((p) => {
        const pKey = Number(p.rho_f).toFixed(2);
        const isAct = pKey === curKey;
        h += '<button type="button" class="lithos-btn' + (isAct ? ' lithos-btn-primary' : '') + '" onclick="setPracticumRhoF(\'' + pKey + '\')">ρ_ф = ' + pKey + ' Ом·м (' + p.mud_type + ')</button>';
