), ядро (1), тыловой шлейф (3), мелководная лагуна справа (5) -->\n  <rect x=\"406\" y=\"322\" width=\"72\" height=\"16\" fill=\"#334155\" />\n  <polygon points=\"478,338 544,264 544,338\" fill=\"#D97706\" opacity=\"0.88\" />\n  <path d=\"M 540 338 L 548 258 L 604 258 L 612 338 Z\" fill=\"#10B981\" stroke=\"#A7F3D0\" stroke-width=\"1.8\" />\n  <polygon points=\"612,338 612,272 656,338\" fill=\"#7C3AED\" opacity=\"0.82\" />\n  <rect x=\"656\" y=\"294\" width=\"68\" height=\"44\" fill=\"#64748B\" opacity=\"0.55\" />\n  <text x=\"412\" y=\"316\" fill=\"#94A3B8\" font-size=\"10\">4 (бассейн)</text>\n  <text x=\"492\" y=\"326\" fill=\"#F8FAFC\" font-size=\"10\" font-weight=\"700\">2 (шлейф)</text>\n  <text x=\"554\" y=\"304\" fill=\"#0F172A\" font-size=\"11\" font-weight=\"700\">1 Ядро</text>\n  <text x=\"616\" y=\"326\" fill=\"#F8FAFC\" font-size=\"10\">3 (тыл)</text>\n  <text x=\"662\" y=\"318\" fill=\"#CBD5E1\" font-size=\"10\">5 (лагуна)</text>\n  <text x=\"404\" y=\"356\" class=\"lithos-svg-sub\">Резкая асимметрия: 4 депрессия → 2 шлейф → 1 ядро → 3 тыл → 5 лагуна</text>\n\n  <!-- Нижняя строка единой легенды и подписи перерисовки -->\n  <text x=\"22\" y=\"402\" class=\"lithos-svg-sub\">Подпись: перерисовано по рис. 10.1, стр. 201 · Легенда LITHOS: ■ #10B981 Нефть/Коллектор  ■ #0284C7 Вода  ■ #D97706 Отсечка/Давление  ■ #7C3AED Риф/Карбонат  ■ #64748B Экран</text>\n</svg>\n", "legend_items": [{"role": "oil_pay", "label": "Нефтенасыщенный коллектор / приток нефти", "color": "#10B981", "symbol": "K_нг, ρ_п (нефть), Q_н", "units": "д.е. / %, Ом·м, м³/сут", "origin": "Внутренняя легенда LITHOS (требуется сверка при поступлении внешнего стайлгайда организаторов)"}, {"role": "formation_water", "label": "Пластовая вода / водоносная зона / фильтрат", "color": "#0284C7", "symbol": "ρ_в, ρ_вп, K_в, ВНК", "units": "Ом·м, %, м", "origin": "Внутренняя легенда LITHOS"}, {"role": "gas_cap", "label": "Газовая шапка / газонасыщенная зона", "color": "#E11D48", "symbol": "ГЖК / ГВК, K_г", "units": "м, %", "origin": "Внутренняя легенда LITHOS"}, {"role": "cutoff_pressure", "label": "Граничная отсечка / профиль давления p(r)", "color": "#D97706", "symbol": "α_СП*, P_н*, p(r), R(t)", "units": "д.е., МПа, м", "origin": "Внутренняя легенда LITHOS"}, {"role": "carbonate_reef_core", "label": "Ядро рифа / биогермный каркас / каверно-поровый доломит", "color": "#7C3AED", "symbol": "Фация 1 (ядро), K_п.кав", "units": "%, мкм² (мД)", "origin": "Внутренняя легенда LITHOS"}, {"role": "shale_seal", "label": "Глинистая покрышка / эвапоритовый экран / неколлектор", "color": "#64748B", "symbol": "C_гл, экран, продельта", "units": "%, м", "origin": "Внутренняя легенда LITHOS"}], "scale_and_units": "Горизонтальный масштаб N (десятки–сотни м, первые км), вертикальный рельеф n (метры — десятки м), фации 1–5", "provenance_note": "Класс C: детерминированная кодовая генерация по источнику (рис. 10.1, стр. 201 (4 типа органогенных построек, фации 1–5)). Открытые датасеты Volve / F3 отмечены как дополнительная возможность (не требуются для закрытия базового скана учебника)."}, "video_url": null, "video_vtt_url": null, "video_aspect": null, "media_passport_id": null, "ocr_corrections_applied": [{"correction_id": "ocr_kuz_01", "book_file": "train_kuznetsov.md", "pdf_page": 201, "printed_page": "201", "original_ocr": "колониальных и прикрепляю- [разрыв страницы 200->201] щихся друг к другу организмов", "corrected_reading": "колониальных и прикрепляющихся друг к другу организмов", "rationale": "Склейка слова «прикрепляющихся», разорванного вставкой рисунка 10.1 на границе страниц 200 и 201.", "applied_in_node_id": "kuznetsov_ch10_node_01", "applied_in_step_id": "kuznetsov_ch10_step_01"}], "practicum": null, "data_decision_card": null}, {"step_id": "kuznetsov_ch10_step_02", "node_id": "kuznetsov_ch10_node_02", "order": 2, "estimated_minutes": 8, "difficulty_codes": ["М", "В"], "source_heading": "Глава 10, § 10.2. Литология и коллекторские свойства слагающих рифы пород (стр. 202–205)", "step_title": "Литолого фациальная зональность и пустотность рифов", "summary_2_3_sentences": "Хотя каркас рифа создают биогермные известняки (в крупных рифах их доля составляет лишь 10–20 %), основной объём массива (50–80 %) слагают обломочные, органогенно-детритовые и оолитовые породы. Сложное первичное пустотное пространство (сходное со «стогом соломы» по Т.А. Линку) многократно усиливается вторичным карстовым выщелачиванием и доломитизацией, создавая каверно-поровые коллекторы со сверхвысокими дебитами.", "explanation_paragraphs": [{"role": "Физико-геологический механизм", "text": "Приподнятое положение рифа над дном и выход гребня выше уровня моря при регрессиях обеспечивают промывку чистых массивных карбонатов метеорными водами (карстование), а циркуляция магнезиальных рассолов вызывает перекристаллизацию и доломитизацию с ростом межкристаллической пористости.", "unit_id": "train_kuznetsov_p205_par_03", "pdf_page": 205, "printed_page": "205", "source_citation": "Источник: PDF стр. 205 (печ. стр. 205), ед. train_kuznetsov_p205_par_03", "verbatim_quote": "Большое значение имеет также вторичная пористость. Наиболее важной является каверновая пустотность, образующаяся при активном выщелачивании, в том числе карстовом. Высокая способность к выщелачиванию обусловлена во многом свойствами самих рифов – их высокой первичной проницаемостью, массивностью строения и практически отсутствием глинистых и иных экранирующих пачек, чистотой химического состава пород и другими факторами, что определяет активный водообмен, растворение и вынос вещества. Высокой карстуемости рифов способствует их гипсометрическое положение – они всегда располагаются выше синхронных отложений, а в процессе роста нередко выходят выше уровня моря, т.е. начинают карстоваться уже при своем образовании. В результате возникают каверны разных форм, происхождения (унаследованные, разработанные) и размеров – от долей миллиметра до крупных карстовых пещер. Уникальный дебит в 42000 м³/сут скв. 4 месторождения Серро-Асуль в поясе Голден-Лейк Мексики, связанного с меловым рифом, обусловлен тем, что скважина вскрыла карстовую пещеру, сформированную в этом рифе. При этом вместе с нефтью выносились обломки сталактитов."}, {"role": "Практика работы специалиста", "text": "Литолог картирует смену фаций на коротких расстояниях: в одиночном куполе (ядро + шлейф), в атолле (кольцевое ядро вокруг слоистой лагуны) и в линейной системе (депрессия → предрифовый склон → ядро → тыловой шлейф → лагуна).", "unit_id": "train_kuznetsov_p205_par_06", "pdf_page": 205, "printed_page": "205", "source_citation": "Источник: PDF стр. 205", "verbatim_quote": "В качестве примера на рис. 10.2 приведены данные по резервуару хорошо изученного рифа Рейнбоу «А» в Канаде [Langton, Chin, 1968]. Это островершинный риф (пиннакл) общей мощностью 200–250 м, из которых 90 м нефтенасыщены и 60 м газонасыщены; округлый в пла-"}, {"role": "Пороговая идея и перенос в данные", "text": "В зрелом рифовом комплексе обломочных известняков разрушения (50–80 %) гораздо больше, чем самого прижизненного биогермного каркаса (10–20 %). Перенос в данные: В петрографическом журнале керна: резкая смена неслоистых массивных кристаллических доломитов ядра на косослоистые известняковые брекчии предрифового склона и тонкослоистые микрозернистые известняки лагуны.", "unit_id": "train_kuznetsov_p205_par_03", "pdf_page": 205, "printed_page": "205", "source_citation": "Источник: PDF стр. 205 (печ. стр. 205)", "verbatim_quote": "Большое значение имеет также вторичная пористость. Наиболее важной является каверновая пустотность, образующаяся при активном выщелачивании, в том числе карстовом. Высокая способность к выщелачиванию обусловлена во многом свойствами самих рифов – их высокой первичной проницаемостью, массивностью строения и практически отсутствием глинистых и иных экранирующих пачек, чистотой химического состава пород и другими факторами, что определяет активный водообмен, растворение и вынос вещества. Высокой карстуемости рифов способствует их гипсометрическое положение – они всегда располагаются выше синхронных отложений, а в процессе роста нередко выходят выше уровня моря, т.е. начинают карстоваться уже при своем образовании. В результате возникают каверны разных форм, происхождения (унаследованные, разработанные) и размеров – от долей миллиметра до крупных карстовых пещер. Уникальный дебит в 42000 м³/сут скв. 4 месторождения Серро-Асуль в поясе Голден-Лейк Мексики, связанного с меловым рифом, обусловлен тем, что скважина вскрыла карстовую пещеру, сформированную в этом рифе. При этом вместе с нефтью выносились обломки сталактитов."}, {"role": "Сверка чтения с оригиналом (исправление OCR)", "text": "В тексте курса учтено исправление OCR по PDF-оригиналу: стр. 203: «входят с состав асимметричных рифовых систем» → «входят в состав асимметричных рифовых систем» (Исправление опечатки OCR «с состав» -> «в состав» во втором абзаце стр. 203 (§10.2).); стр. 203: «колоний рифострояющих организмов» → «колоний рифостроящих организмов» (Исправление лишней буквы «я» в термине «рифостроящих» (стр. 203, §10.2).)", "unit_id": "train_kuznetsov_p205_par_03", "pdf_page": 203, "printed_page": "203", "source_citation": "Лист исправлений OCR: PDF стр. 203", "verbatim_quote": "входят в состав асимметричных рифовых систем"}], "first_use_terms": [{"term": "Предрифовый шлейф", "definition": "Крутой внешний склон рифа, сложенный грубообломочными известняковыми брекчиями, конгломератами и гравелитами", "first_introduced_pdf_page": 203, "first_introduced_printed_page": "203", "cis_symbol": "Фация 2", "west_symbol": "Fore-reef talus", "west_term": "Fore-reef apron / reef talus", "unit": "фация"}, {"term": "Лагунная фация атолла", "definition": "Внутренняя замкнутая или полузамкнутая зона атолла со слоистыми микрозернистыми и шламовыми известняками", "first_introduced_pdf_page": 203, "first_introduced_printed_page": "203", "cis_symbol": "Лагуна", "west_symbol": "Back-reef lagoon", "west_term": "Lagoonal micritic facies", "unit": "фация"}, {"term": "Каверновая пустотность", "definition": "Вторичные пустоты растворения и карстового выщелачивания размером от долей миллиметра до пещер", "first_introduced_pdf_page": 203, "first_introduced_printed_page": "203", "cis_symbol": "Каверны", "west_symbol": "Vuggy / karst porosity", "west_term": "Secondary vuggy & cavern porosity", "unit": "%"}], "formulas_decoded": [{"title": "Предрифовый шлейф", "cis_formula": "Фация 2 (фация)", "west_formula": "Fore-reef talus — Fore-reef apron / reef talus", "variables": {"Фация 2": "Крутой внешний склон рифа, сложенный грубообломочными известняковыми брекчиями, конгломератами и гравелитами (СНГ)", "Fore-reef talus": "Международное обозначение SPE/API (Fore-reef apron / reef talus)"}, "source_ref": "PDF стр. 203 (печ. стр. 203)"}, {"title": "Лагунная фация атолла", "cis_formula": "Лагуна (фация)", "west_formula": "Back-reef lagoon — Lagoonal micritic facies", "variables": {"Лагуна": "Внутренняя замкнутая или полузамкнутая зона атолла со слоистыми микрозернистыми и шламовыми известняками (СНГ)", "Back-reef lagoon": "Международное обозначение SPE/API (Lagoonal micritic facies)"}, "source_ref": "PDF стр. 203 (печ. стр. 203)"}, {"title": "Каверновая пустотность", "cis_formula": "Каверны (%)", "west_formula": "Vuggy / karst porosity — Secondary vuggy & cavern porosity", "variables": {"Каверны": "Вторичные пустоты растворения и карстового выщелачивания размером от долей миллиметра до пещер (СНГ)", "Vuggy / karst porosity": "Международное обозначение SPE/API (Secondary vuggy & cavern porosity)"}, "source_ref": "PDF стр. 203 (печ. стр. 203)"}], "applicability_conditions": ["Первичная пористость каркаса нередко быстро залечивается субаквальной цементацией и спаритом, поэтому лучшие ФЕС формируются именно там, где на первичную проницаемость наложились вторичное выщелачивание и доломитизация."], "worked_example": {"status": "present", "not_applicable_reason": "", "problem_number": "Анализ скважины 4 месторождения Серро-Асуль (§10.2, стр. 205)", "figure_ref": "Стр. 205", "pdf_page": 203, "printed_page": "203", "conditions": "Скважина 4 в меловом рифе пояса Голден-Лейк (Мексика) вскрыла прикровельную зону массива.", "steps": ["В процессе роста и осушения риф подвергся интенсивному карстовому растворению с образованием пещер и сталактитов.", "При вскрытии карстовой полости получен фонтанный приток нефти с выносом обломков сталактитов."], "result": "Зафиксирован уникальный дебит скважины 42 000 м³/сут за счёт карстовой кавернозности рифа."}, "textbook_problems": [], "tables": [{"title": "Сводная таблица параметров и терминологического моста (Шаг 2)", "headers": ["Параметр / Термин", "Обозначение СНГ", "Международный аналог (West)", "Единицы", "Определение и страница источника"], "rows": [["Предрифовый шлейф", "Фация 2", "Fore-reef talus (Fore-reef apron / reef talus)", "фация", "Крутой внешний склон рифа, сложенный грубообломочными известняковыми брекчиями, конгломератами и гравелитами [стр. 203]"], ["Лагунная фация атолла", "Лагуна", "Back-reef lagoon (Lagoonal micritic facies)", "фация", "Внутренняя замкнутая или полузамкнутая зона атолла со слоистыми микрозернистыми и шламовыми известняками [стр. 203]"], ["Каверновая пустотность", "Каверны", "Vuggy / karst porosity (Secondary vuggy & cavern porosity)", "%", "Вторичные пустоты растворения и карстового выщелачивания размером от долей миллиметра до пещер [стр. 203]"]]}], "modern_context": [{"historical_item": "Описание каверн по выносу инструмента и керну", "historical_context": "Косвенная фиксация провалов бурового снаряда и потери циркуляции", "modern_analog": "Электрические и акустические микроимиджеры (FMI / UBI) в сочетании с ЯМР", "modern_context": "Количественный подсчёт спектра размеров каверн и доли вторичной пустотности в стволе скважины", "pdf_page": 203}], "it_analogy_and_limits": "Аналогия с рефакторингом унаследованного кода: первичный каркас («стог соломы» по Линку) быстро забивается патчами (цементацией), но регулярная «сборка мусора» метеорными водами (карстовое выщелачивание) расчищает высокоскоростные магистрали. Граница: слишком агрессивная перекристаллизация может и ухудшить матрицу.", "typical_error": "Ошибочно искать коллектор только в прижизненных коралловых/водорослевых каркасах: каркас часто зацементирован спаритом, а главными коллекторами служат доломитизированные и выщелоченные детритовые зоны ядра и шлейфа.", "epistemic_split": {"observation": "Петрографический состав керна (доля биогермных, детритовых, брекчиевых и доломитизированных разностей) и тип пустот в шлифах.", "inference": "Реконструкция фациальной зоны (ядро, предрифовый шлейф, тыльно-рифовый склон, лагуна) и прогноз зоны максимального вторичного выщелачивания.", "assumption": "Прямая генетическая связь между первичной проницаемостью рифовых фаций и интенсивностью наложенного карстового водообмена."}, "specialist_manual_steps": ["Определить по керну соотношение биогермных (каркасных) и обломочных/детритовых разностей известняков.", "Выделить признаки субаэральной экспозиции, карстовых каверн и вторичной доломитизации.", "Сопоставить позицию скважины с профилем зональности (купол, атолл или асимметричный барьер)."], "decision_points": ["Выбор модели кольцевой зональности (для атоллов с центральной лагуной) либо линейно-асимметричной модели (для барьерных систем).", "Оценка риска катастрофических поглощений бурового раствора при вскрытии карстовых полостей в кровле рифа."], "inefficiency_lens": {"inputs": ["Петрографический состав керна (доля биогермных, детритовых, брекчиевых и доломитизированных разностей) и тип пустот в шлифах.", "Источник: стр. 203–205"], "manual_steps": ["Определить по керну соотношение биогермных (каркасных) и обломочных/детритовых разностей известняков.", "Выделить признаки субаэральной экспозиции, карстовых каверн и вторичной доломитизации.", "Сопоставить позицию скважины с профилем зональности (купол, атолл или асимметричный барьер)."], "expert_judgment_points": ["Выбор d_reading": "входят в состав асимметричных рифовых систем", "rationale": "Исправление опечатки OCR «с состав» -> «в состав» во втором абзаце стр. 203 (§10.2).", "applied_in_node_id": "kuznetsov_ch10_node_02", "applied_in_step_id": "kuznetsov_ch10_step_02"}, {"correction_id": "ocr_kuz_03", "book_file": "train_kuznetsov.md", "pdf_page": 203, "printed_page": "203", "original_ocr": "колоний рифострояющих организмов", "corrected_reading": "колоний рифостроящих организмов", "rationale": "Исправление лишней буквы «я» в термине «рифостроящих» (стр. 203, §10.2).", "applied_in_node_id": "kuznetsov_ch10_node_02", "applied_in_step_id": "kuznetsov_ch10_step_02"}], "practicum": null, "data_decision_card": {"title": "Решение на данных: распознавание рифовой фации, эволюции и геометрии резервуара (рис. 10.2)", "origin_and_assumptions": "Данные разреза рифа Рейнбоу А (В.Г. Кузнецов, 2012, Гл. 10, стр. 206, рис. 10.2) + интерактивная спецификация фациальной модели (распознавание фаций, эволюция биогерма во времени, геометрия 0–1500 м × H=250 м).", "observed_features": [{"label": "Группа I (гребень/каркас рифа)", "value": "Ф = 10–30%, k = 50–2000·10⁻¹⁵ м² (высокоёмкий каверно-поровый коллектор)"}, {"label": "Группа II (пририфовый шлейф)", "value": "Ф = 15–35%, k = 30–30000·10⁻¹⁵ м² (максимальная проницаемость)"}, {"label": "Группа V (внутрибассейновые битуминозные породы)", "value": "Ф = 3–8%, k < 3·10⁻¹⁵ м² (флюидоупор / покрышка)"}, {"label": "Геометрия по профилю СЗ–ЮВ", "value": "Высота H до 230–250 м на базе ~1500 м (резкий фациальный клин)"}], "decision_rule": "Если по керну и разрезу в центральной куполообразной зоне фиксируются строматопорово-коралловые известняки (группы I–II, Ф ≥ 10%, k ≥ 30 мД), а по периферии — темноцветные битуминозные микрозернистые разности (группа V, k < 3 мД), то скважину закладывают в гребень/шлейф (I–II) с учётом резкого выклинивания к борту.", "rule_limits": "Правило теряет силу при полной вторичной цементации каверн ангидритом/галитом или при инверсии пористости на глубоком погружении без учёта трещиноватости.", "interactive_spec": {"modes": ["1. Распознавание рифовых фаций (I–V)", "2. Эволюция во времени (биостром → биогерм → риф)", "3. Геометрия резервуара (СЗ–ЮВ, 1500×250 м)"], "note": "Закрывает видеоёмкий узел Кузнецова без отдельного MP4 через интерактивную фациальную схему и проверку на данных."}, "question": "Куда по этим данным следует сместить проектную добывающую скважину и почему?", "options": [{"id": "kuz_v", "label": "На борт в группу V (Ф=3–8%), чтобы избежать обводнения", "correct": false, "feedback": "Неверно: группа V имеет k < 3·10⁻¹⁵ м² — это практически непроницаемая вмещающая порода/покрышка."}, {"id": "kuz_i_ii", "label": "В ядро и пририфовый шлейф (группы I–II, k до 2000–30000·10⁻¹⁵ м²), контролируя отметку флюидного контакта", "correct": true, "feedback": "Верно! Наилучшие фильтрационно-ёмкостные свойства сосредоточены в органогенном каркасе (I) и обломочном шлейфе (II)."}]}}, {"step_id": "kuznetsov_ch10_step_03", "node_id": "kuznetsov_ch10_node_03", "order": 3, "estimated_minutes": 8, "difficulty_codes": ["В", "И"], "source_heading": "Глава 10, § 10.3. Строение рифовых резервуаров: купола и атоллы (стр. 205–212)", "step_title": "Строение резервуаров одиночных рифов и атоллов", "summary_2_3_sentences": "В одиночных куполовидных рифах-пиннаклах (пример рифа Рейнбоу «А» в Канаде, рис. 10.2: мощность 200–250 м, 90 м нефти и 60 м газа) лучшие коллекторы концентрируются в центральной ядерной части массива (пористость до 15–35 %, проницаемость 0,2–3 мкм²). В крупных атолловидных массивах (Карачаганак, рис. 10.3–10.4; Интисар «Д») распределение коллекторов становится кольцевым: максимум пористости приурочен к периферийному рифовому гребню, а в центральной лагуне ФЕС ухудшаются.", "explanation_paragraphs": [{"role": "Физико-геологический механизм", "text": "В небольшом куполе волновая гидродинамика и вторичное выщелачивание максимально перерабатывают центральную вершину, тогда как в атолле активный рост каркаса, волновое дробление и водообмен происходят по внешнему кольцу гребня, окружающему тиховодную илистую лагуну.", "unit_id": "train_kuznetsov_p206_vlmfig_01", "pdf_page": 206, "printed_page": "206", "source_citation": "Источник: PDF стр. 206 (печ. стр. 206), ед. train_kuznetsov_p206_vlmfig_01", "verbatim_quote": "━━━ FORMAT 4: CROSS-SECTION / РАЗРЕЗ ━━━\nОриентация разреза: СЗ (слева) — ЮВ (справа).\nВертикальная ось: $H$, м; отметки 0, 50, 100, 150, 200, 250 м. Значения высоты увеличиваются вверх. Горизонтальный масштаб не указан.\nСкважины вдоль разреза, слева направо:\n- 6–32 — чёрная точка.\n- 2–32 — чёрная точка.\n- 7–32 — чёрная точка.\n- 10–32 — чёрная точка.\n- 12–33 — чёрная точка.\n- 12–28 — ромб.\nРазрез изображает куполообразное тело, возвышающееся от отметки около 0 м до примерно 240 м. Внешняя граница тела круто поднимается с обеих сторон; в верхней части образуется округлая вершина. Внутри показан"}, {"role": "Практика работы специалиста", "text": "Геолог строит карты пористости и эффективных мощностей с учётом морфотипа: для пиннакла закладывает эксплуатационные скважины в своде (скв. 7-32, 10-32 на рис. 10.2), а для атолла — вдоль кольцевого биогермного вала (рис. 10.3, 10.4).", "unit_id": "train_kuznetsov_p206_vlmfig_03", "pdf_page": 206, "printed_page": "206", "source_citation": "Источник: PDF стр. 206", "verbatim_quote": "━━━ FORMAT 4: CROSS-SECTION / РАЗРЕЗ ━━━\nВертикальная ось: $H$, м; значения от 0 внизу до 250 вверху, высота возрастает вверх.\nГоризонтальная шкала: 0, 500, 1000, 1500 м. Направление профиля не указано.\nСкважины (слева направо): 6-32, 2-32, 7-32, 10-32, 12-33, 12-28, 2-28. Скважины 6-32, 2-32, 7-32, 10-32 и 12-33 обозначены чёрными кружками; 12-28 и 2-28 — светлыми ромбами.\nВ разрезе показано куполообразное тело с кровлей около $H=270$ м и подошвой около $H=0$ м. Контуры тела ступенчато расширяются вниз; максимальная ширина наблюдается в интервале приблизительно $H=50$–100 м. Внутри выделены л"}, {"role": "Пороговая идея и перенос в данные", "text": "При переходе от одиночного купола к атоллу геометрический центр структуры превращается из зоны лучшего коллектора в зону худшего (лагунного) коллектора, а лучшие ФЕС смещаются на периферийное кольцо. Перенос в данные: На разрезе рис. 10.2 (стр. 206): купол высотой 0–240 м по скв. 6-32, 2-32, 7-32, 10-32, 12-33, 12-28; в центральном ядре пористость 10–15 % (до 35 %), на периферии и в лагунных линзах — 3–5 %.", "unit_id": "train_kuznetsov_p206_vlmfig_01", "pdf_page": 206, "printed_page": "206", "source_citation": "Источник: PDF стр. 206 (печ. стр. 206)", "verbatim_quote": "━━━ FORMAT 4: CROSS-SECTION / РАЗРЕЗ ━━━\nОриентация разреза: СЗ (слева) — ЮВ (справа).\nВертикальная ось: $H$, м; отметки 0, 50, 100, 150, 200, 250 м. Значения высоты увеличиваются вверх. Горизонтальный масштаб не указан.\nСкважины вдоль разреза, слева направо:\n- 6–32 — чёрная точка.\n- 2–32 — чёрная точка.\n- 7–32 — чёрная точка.\n- 10–32 — чёрная точка.\n- 12–33 — чёрная точка.\n- 12–28 — ромб.\nРазрез изображает куполообразное тело, возвышающееся от отметки около 0 м до примерно 240 м. Внешняя граница тела круто поднимается с обеих сторон; в верхней части образуется округлая вершина. Внутри показан"}], "first_use_terms": [{"term": "Пиннакл", "definition": "Островершинный одиночный куполовидный риф небольшой площади и большой относительной высоты", "first_introduced_pdf_page": 206, "first_introduced_printed_page": "206", "cis_symbol": "Пиннакл", "west_symbol": "Pinnacle reef", "west_term": "Pinnacle dome reef", "unit": "м"}, {"term": "Массивный резервуар", "definition": "Природный резервуар большой толщины, гидродинамически единый во всём объёме без выдержанных флюидоупоров", "first_introduced_pdf_page": 206, "first_introduced_printed_page": "206", "cis_symbol": "Массивный ПР", "west_symbol": "Massive reservoir", "west_term": "Single hydraulic massive reservoir", "unit": "тип ПР"}], "formulas_decoded": [{"title": "Пиннакл", "cis_formula": "Пиннакл (м)", "west_formula": "Pinnacle reef — Pinnacle dome reef", "variables": {"Пиннакл": "Островершинный одиночный куполовидный риф небольшой площади и большой относительной высоты (СНГ)", "Pinnacle reef": "Международное обозначение SPE/API (Pinnacle dome reef)"}, "source_ref": "PDF стр. 206 (печ. стр. 206)"}, {"title": "Массивный резервуар", "cis_formula": "Массивный ПР (тип ПР)", "west_formula": "Massive reservoir — Single hydraulic massive reservoir", "variables": {"Массивный ПР": "Природный резервуар большой толщины, гидродинамически единый во всём объёме без выдержанных флюидоупоров (СНГ)", "Massive reservoir": "Международное обозначение SPE/API (Single hydraulic massive reservoir)"}, "source_ref": "PDF стр. 206 (печ. стр. 206)"}], "applicability_conditions": ["Даже в массивном рифе присутствуют внутрирезервуарные низкопроницаемые прослои лагунных микрозернистых известняков, однако они не выдержаны по площади и не нарушают единого гидродинамического резервуара."], "worked_example": {"status": "present", "not_applicable_reason": "", "problem_number": "Разбор рифа Рейнбоу «А» по рис. 10.2 (§10.3, стр. 205–207)", "figure_ref": "Рис. 10.2 (стр. 206)", "pdf_page": 206, "printed_page": "206", "conditions": "Одиночный девонский риф Рейнбоу «А» (Канада), пересечённый профилем скважин 6-32, 2-32, 7-32, 10-32, 12-33, 12-28.", "steps": ["Общая мощность массива составляет 200–250 м (в том числе 90 м нефтенасыщены и 60 м газонасыщены), размеры в плане 1,4×1,8 км.", "В центральных кавернозных доломитах ядра пористость составляет 10–15 % (местами до 35 %), проницаемость 0,2–3 мкм².", "На периферии и в лагунных микрозернистых прослоях пористость падает до 3–5 %, проницаемость — до тысячных долей мкм²."], "result": "Построена зональная модель купольного резервуара с максимумом ФЕС в центральной ядерной зоне."}, "textbook_problems": [], "tables": [{"title": "Сводная таблица параметров и терминологического моста (Шаг 3)", "headers": ["Параметр / Термин", "Обозначение СНГ", "Международны y_2_3_sentences": "В асимметричных барьерных рифовых системах (Западно-Техасский пермский бассейн, девон Альберты, рис. 10.5–10.7) лучшие коллекторы формируются в пригребневой зоне ядра, тогда как в сторону глубоководного бассейна они резко сменяются плотными депрессионными породами, а в сторону лагуны — слоистыми сульфатно-карбонатными толщами, служащими боковым экраном. При разведке рифов ключевую роль играет выявление косвенных признаков: структур облекания в перекрывающих слоях, локального уменьшения мощности соленосной покрышки над сводом рифа и фациальной асимметрии.", "explanation_paragraphs": [{"role": "Физико-геологический механизм", "text": "Рост барьерного рифа на бровке шельфа изолирует зарифовую лагуну, где в аридном климате осаждаются плотные доломиты и эвапориты (ангидриты, соли), формирующие как латеральный экран, так и региональную покрышку при последующем захоронении рифа.", "unit_id": "train_kuznetsov_p213_vlmfig_01", "pdf_page": 213, "printed_page": "213", "source_citation": "Источник: PDF стр. 213 (печ. стр. 213), ед. train_kuznetsov_p213_vlmfig_01", "verbatim_quote": "━━━ FORMAT 4: CROSS-SECTION / РАЗРЕЗ ━━━\nВертикальный разрез. Горизонтальная ориентация, горизонтальный масштаб и линия разреза не указаны.\nВертикальная ось: $H$, км; значения отрицательные: от −0,4 до −1,2 км. Глубина возрастает вниз.\nПодписанные уровни/границы:\n- −0,4; −0,5; −0,6; −0,7; −0,8; −0,9; −1,0; −1,1; −1,2 км.\n- Наклонная сплошная линия: поднимается от около −1,1 км в левой части до около −0,78 км, затем образует несколько локальных поднятий и понижается к около −0,7 км справа.\n- Наклонная штриховая линия: прослеживается в центральной части, приблизительно от −0,85 до −0,9 км.\n- Гор"}, {"role": "Практика работы специалиста", "text": "Поисковик использует сейсмические и буровые критерии обнаружения рифа: клиноформное примыкание предрифовых толщ, антиклиналь облекания в надрифовых горизонтах и сокращение толщины эвапоритовой покрышки над вершиной рифа.", "unit_id": "train_kuznetsov_p213_vlmfig_02", "pdf_page": 213, "printed_page": "213", "source_citation": "Источник: PDF стр. 213", "verbatim_quote": "━━━ FORMAT 12: CONCEPTUAL DIAGRAM / КОНЦЕПТУАЛЬНАЯ СХЕМА ━━━\nВертикальная ось: $H$, км; значения отрицательные, от −0,5 вверху до −1,2 внизу. Направление вниз соответствует увеличению глубины (абсолютные отметки становятся более отрицательными).\nПоказан профиль куполообразного поднятия. Сплошной внешний контур имеет вершину приблизительно на отметке −0,65 км и понижается по обоим крыльям до −1,0…−1,2 км. Внутри показаны несколько криволинейных поверхностей и штриховые линии, наклонённые вниз вправо.\nНа своде и крыльях нанесены условные знаки в виде коротких наклонных штрихов; литология не опре"}, {"role": "Пороговая идея и перенос в данные", "text": "В асимметричной барьерной системе зарифовая лагуна превращается из части резервуара в непроницаемый боковой экран (сульфаты, соли, плотные микрозернистые доломиты), запирающий залежь с регионального восстания. Перенос в данные: На разрезах рис. 10.5–10.7 (стр. 214–219): резкая асимметрия профиля «депрессия → предрифовый шлейф → ядро рифа → зарифовая лагуна с эвапоритами».", "unit_id": "train_kuznetsov_p213_vlmfig_01", "pdf_page": 213, "printed_page": "213", "source_citation": "Источник: PDF стр. 213 (печ. стр. 213)", "verbatim_quote": "━━━ FORMAT 4: CROSS-SECTION / РАЗРЕЗ ━━━\nВертикальный разрез. Горизонтальная ориентация, горизонтальный масштаб и линия разреза не указаны.\nВертикальная ось: $H$, км; значения отрицательные: от −0,4 до −1,2 км. Глубина возрастает вниз.\nПодписанные уровни/границы:\n- −0,4; −0,5; −0,6; −0,7; −0,8; −0,9; −1,0; −1,1; −1,2 км.\n- Наклонная сплошная линия: поднимается от около −1,1 км в левой части до около −0,78 км, затем образует несколько локальных поднятий и понижается к около −0,7 км справа.\n- Наклонная штриховая линия: прослеживается в центральной части, приблизительно от −0,85 до −0,9 км.\n- Гор"}], "first_use_terms": [{"term": "Структура облекания", "definition": "Пологая антиклинальная форма в перекрывающих отложениях, повторяющая погребённый рельеф жёсткого рифового массива", "first_introduced_pdf_page": 213, "first_introduced_printed_page": "213", "cis_symbol": "Облекание", "west_symbol": "Draping structure", "west_term": "Compactional drape anticline over reef", "unit": "структура"}, {"term": "Литолого-морфологическая ловушка", "definition": "Ловушка УВ в выступе рифового массива, ограниченная сверху покрышкой, а сбоку — фациальным замещением", "first_introduced_pdf_page": 213, "first_introduced_printed_page": "213", "cis_symbol": "Рифовая ловушка", "west_symbol": "Reef stratigraphic trap", "west_term": "Morphological / reef build-up trap", "unit": "тип ловушки"}], "formulas_decoded": [{"title": "Структура облекания", "cis_formula": "Облекание (структура)", "west_formula": "Draping structure — Compactional drape anticline over reef", "variables": {"Облекание": "Пологая антиклинальная форма в перекрывающих отложениях, повторяющая погребённый рельеф жёсткого рифового массива (СНГ)", "Draping structure": "Международное обозначение SPE/API (Compactional drape anticline over reef)"}, "source_ref": "PDF стр. 213 (печ. стр. 213)"}, {"title": "Литолого-морфологическая ловушка", "cis_formula": "Рифовая ловушка (тип ловушки)", "west_formula": "Reef stratigraphic trap — Morphological / reef build-up trap", "variables": {"Рифовая ловушка": "Ловушка УВ в выступе рифового массива, ограниченная сверху покрышкой, а сбоку — фациальным замещением (СНГ)", "Reef stratigraphic trap": "Международное обозначение SPE/API (Morphological / reef build-up trap)"}, "source_ref": "PDF стр. 213 (печ. стр. 213)"}], "applicability_conditions": ["Скважина, пробуренная всего в нескольких сотнях метров от гребня барьерного рифа в сторону депрессии, попадает в маломощные глубоководные доманикиты, а в сторону лагуны — в непроницаемые эвапориты.", "Максимальная высота, а следовательно, и объем ловушки в общем случае определяется величиной превышения рифа над внерифовыми отложениями (при условии, что рифсодержащий стратиграфический комплекс перекрыт непроницаемыми толщами – покрышками).", "Если зарифовые отложения представлены непроницаемыми породами, то последние могут создавать дополнительный экран и тем самым увеличивать высоту и объем ловушки.", "В случае региональных наклонов ловушка смещается вверх по восстанию, и залежи располагаются лишь в одной части рифа."], "worked_example": {"status": "present", "not_applicable_reason": "", "problem_number": "Анализ асимметричных рифовых систем (§10.3–10.4, стр. 213–222)", "figure_ref": "Рис. 10.5, Рис. 10.7", "pdf_page": 213, "printed_page": "213", "conditions": "Барьерная рифовая система на границе карбонатной платформы и глубоководной впадины.", "steps": ["Со стороны бассейна фиксируется крутой предрифовый склон с обломочным шлейфом.", "В гребневой зоне выделяется массивный каверно-поровый резервуар ядра.", "В тыловой зоне лагунные эвапориты и плотные известняки формируют боковой экран ловушки."], "result": "Обоснована точка заложения поисковой скважины в пригребневой зоне асимметричного рифа."}, "textbook_problems": [], "tables": [{"title": "Сводная таблица параметров и терминологического моста (Шаг 4)", "headers": ["Параметр / Термин", "Обозначение СНГ", "Международный аналог (West)", "Единицы", "Определение и страница источника"], "rows": [["Структура облекания", "Облекание", "Draping structure (Compactional drape anticline over reef)", "структура", "Пологая антиклинальная форма в перекрывающих отложениях, повторяющая погребённый рельеф жёсткого рифового массива [стр. 213]"], ["Литолого-морфологическая ловушка", "Рифовая ловушка", "Reef stratigraphic trap (Morphological / reef build-up trap)", "тип ловушки", "Ловушка УВ в выступе рифового массива, ограниченная сверху покрышкой, а сбоку — фациальным замещением [стр. 213]"]]}], "modern_context": [{"historical_item": "Структурное бурение по маркирующим надрифовым горизонтам", "historical_context": "Пои pay", "label": "Нефтенасыщенный коллектор / приток нефти", "color": "#10B981", "symbol": "K_нг, ρ_п (нефть), Q_н", "units": "д.е. / %, Ом·м, м³/сут", "origin": "Внутренняя легенда LITHOS (требуется сверка при поступлении внешнего стайлгайда организаторов)"}, {"role": "formation_water", "label": "Пластовая вода / водоносная зона / фильтрат", "color": "#0284C7", "symbol": "ρ_в, ρ_вп, K_в, ВНК", "units": "Ом·м, %, м", "origin": "Внутренняя легенда LITHOS"}, {"role": "gas_cap", "label": "Газовая шапка / газонасыщенная зона", "color": "#E11D48", "symbol": "ГЖК / ГВК, K_г", "units": "м, %", "origin": "Внутренняя легенда LITHOS"}, {"role": "cutoff_pressure", "label": "Граничная отсечка / профиль давления p(r)", "color": "#D97706", "symbol": "α_СП*, P_н*, p(r), R(t)", "units": "д.е., МПа, м", "origin": "Внутренняя легенда LITHOS"}, {"role": "carbonate_reef_core", "label": "Ядро рифа / биогермный каркас / каверно-поровый доломит", "color": "#7C3AED", "symbol": "Фация 1 (ядро), K_п.кав", "units": "%, мкм² (мД)", "origin": "Внутренняя легенда LITHOS"}, {"role": "shale_seal", "label": "Глинистая покрышка / эвапоритовый экран / неколлектор", "color": "#64748B", "symbol": "C_гл, экран, продельта", "units": "%, м", "origin": "Внутренняя легенда LITHOS"}], "scale_and_units": "Профиль «депрессия → предрифовый шлейф → ядро рифа → зарифовая лагуна (ангидриты/соли)»", "provenance_note": "Класс C: детерминированная кодовая генерация по источнику (рис. 10.5, стр. 214 и §10.4, стр. 216–220 (асимметричная рифовая система и ловушка)). Открытые датасеты Volve / F3 отмечены как дополнительная возможность (не требуются для закрытия базового скана учебника)."}, "video_url": null, "video_vtt_url": null, "video_aspect": null, "media_passport_id": null, "ocr_corrections_applied": [], "practicum": null, "data_decision_card": null}], "tasks": [{"task_id": "t3_train_kuznetsov_task_sc_01", "course_id": "t3_train_kuznetsov", "node_id": "kuznetsov_ch10_node_01", "step_id": "kuznetsov_ch10_step_01", "claim_id": "kuznetsov_ch10_node_01_claim_01", "pdf_page": 201, "printed_page": "201", "task_type": "single_choice", "difficulty_level": "базовый", "prompt": "Какое утверждение точно отражает ключевой физико-геологический принцип шага «Иерархия органогенных построек биостромы биогермы рифы» (Глава 10, § 10.1. Краткие сведения о геологии рифов и их типах (стр. 200–202))?", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": ["Верно по источнику: Риф — это не просто скопление раковин, а автономизированная экосистема-волнолом, сама создающая расчленённый рельеф дна и собственные фациальные зоны разрушения (шлейф) и затишья (лагуну).", "Типичное заблуждение: Типичная ошибка геологов-поисковиков — принимать любой пластовый биоморфный известняк (биостром) за риф и проектировать бурение на несуществующий купольный свод.", "Параметры методики применяются без учёта граничных условий и литологии пласта", "Физический механизм не зависит от структуры порового пространства и свойств флюида"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: Риф — это не просто скопление раковин, а автономизированная экосистема-волнолом, сама создающая расчленённый рельеф дна и собственные фациальные зоны разрушения (шлейф) и затишья (лагуну).", "explanation": "Органогенные карбонатные постройки делятся на пластовые биостромы, холмовидные биогермы и волноустойчивые рифы (рис. 10.1). Рифы составляют малую долю осадочных пород, но концентрируют 10–12 % мировых запасов углеводородов благодаря огромной высоте массивных залежей (до 1500 м на Карачаганаке и 900–2100 м в зоне Ла Реформа). (Литология природных резервуаров нефти и газа, Глава 10, § 10.1. Краткие сведения о геологии рифов и их типах (стр. 200–202), PDF стр. 201 (печ. стр. 201)).", "error_analysis": {"1": "Это известная ошибка интерпретации: Типичная ошибка геологов-поисковиков — принимать любой пластовый биоморфный известняк (биостром) за риф и проектировать бурение на несуществующий купольный свод.", "2": "Игнорирование граничных условий (Нельзя называть «рифом» любой известняк с биоморфной фауной: без превышения мощности над синхронными отложениями и без волноприбойного обломочного шлейфа это биостром или банка, не образующая рифовой ловушки.) приводит к неверному решению.", "3": "В действительности механизм основан на том, что Колониальные каркасные организмы нарастают вверх к свету быстрее накопления синхронных осадков; в отличие от погружённого биогерма, настоящий риф выходит в зону волнового прибоя, разрушается волнами и формирует асимметричный или куполовидный комплекс с предрифовым обломочным шлейфом."}, "hint_steps": ["Обратите внимание на наблюдение: Геометрия карбонатного тела на разрезе, соотношение его мощности с синхронными слоями и наличие грубообломочного шлейфа (рис. 10.1).", "Учтите физический механизм: Колониальные каркасные организмы нарастают вверх к свету быстрее накопления синхронных осадков; в отличие от погружённого биогерма, настоящий риф выходит в зону волнового прибоя, разрушается волнами и формирует асимметричный или куполовидный комплекс с предрифовым обломочным шлейфом.", "Пороговая идея шага: Риф — это не просто скопление раковин, а автономизированная экосистема-волнолом, сама создающая расчленённый рельеф дна и собственные фациальные зоны разрушения (шлейф) и затишья (лагуну)."], "source_ref": "Литология природных резервуаров нефти и газа, Глава 10, § 10.1. Краткие сведения о геологии рифов и их типах (стр. 200–202), PDF стр. 201 (печ. стр. 201)", "verbatim_quote": "━━━ FORMAT 12: CONCEPTUAL DIAGRAM / КОНЦЕПТУАЛЬНАЯ СХЕМА ━━━\nСхематический поперечный разрез симметричной куполообразной структуры с дугообразно изогнутыми внутренними слоями. В центральной верхней части показан крупный свод; по его бокам расположены наклонные полосы с косыми линейными элементами. Нижняя часть с обеих сторон содержит горизонтально-слоистые участки, над которыми показаны наклонные зоны с овальными элементами; литология не определяется без легенды. По левому краю имеется вертикальная двусторонняя стрелка с обозначением «N». Верхняя и нижняя границы рисунка обозначены горизонталь"}, {"task_id": "t3_train_kuznetsov_task_sc_02", "course_id": "t3_train_kuznetsov", "node_id": "kuznetsov_ch10_node_02", "step_id": "kuznetsov_ch10_step_02", "claim_id": "kuznetsov_ch10_node_02_claim_01", "pdf_page": 205, "printed_page": "205", "task_type": "single_choice", "difficulty_level": "базовый", "prompt": "Какое утверждение точно отражает ключевой физико-геологический принцип шага «Литолого фациальная зональность и пустотность рифов» (Глава 10, § 10.2. Литология и коллекторские свойства слагающих рифы пород (стр. 202–205))?", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": ["Верно по источнику: В зрелом рифовом комплексе обломочных известняков разрушения (50–80 %) гораздо больше, чем самого прижизненного биогермного каркаса (10–20 %).", "Типичное заблуждение: Ошибочно искать коллектор только в прижизненных коралловых/водорослевых каркасах: каркас часто зацементирован спаритом, а главными коллекторами служат доломитизированные и выщелоченные детритовые зоны ядра и шлейфа.", "Параметры методики применяются без учёта граничных условий и литологии пласта", "Физический механизм не зависит от структуры порового пространства и свойств флюида"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: В зрелом рифовом комплексе обломочных известняков разрушения (50–80 %) гораздо больше, чем самого прижизненного биогермного каркаса (10–20 %).", "explanation": "Хотя каркас рифа создают биогермные известняки (в крупных рифах их доля составляет лишь 10–20 %), основной объём массива (50–80 %) слагают обломочные, органогенно-детритовые и оолитовые породы. Сложное первичное пустотное пространство (сходное со «стогом соломы» по Т.А. Линку) многократно усиливается вторичным карстовым выщелачиванием и доломитизацией, создавая каверно-поровые коллекторы со сверхвысокими дебитами. (Литология природных резервуаров нефти и газа, Глава 10, § 10.2. Литология и коллекторские свойства слагающих рифы пород (стр. 202–205), PDF стр. 205 (печ. стр. 205)).", "error_analysis": {"1": "Это известная ошибка интерпретации: Ошибочно искать коллектор только в прижизненных коралловых/водорослевых каркасах: каркас часто зацементирован спаритом, а главными коллекторами служат доломитизированные и выщелоченные детритовые зоны ядра и шлейфа.", "2": "Игнорирование граничных условий (Первичная пористость каркаса нередко быстро залечивается субаквальной цементацией и спаритом, поэтому лучшие ФЕС формируются именно там, где на первичную проницаемость наложились вторичное выщелачивание и доломитизация.) приводит к неверному решению.", "3": "В действительности механизм основан на том, что Приподнятое положение рифа над дном и выход гребня выше уровня моря при регрессиях обеспечивают промывку чистых массивных карбонатов метеорными водами (карстование), а циркуляция магнезиальных рассолов вызывает перекристаллизацию и доломитизацию с ростом межкристаллической пористости."}, "hint_steps": ["Обратите внимание на наблюдение: Петрографический состав керна (доля биогермных, детритовых, брекчиевых и доломитизированных разностей) и тип пустот в шлифах.", "Учтите физический механизм: Приподнятое положение рифа над дном и выход гребня выше уровня моря при регрессиях обеспечивают промывку чистых массивных карбонатов метеорными водами (карстование), а циркуляция магнезиальных рассолов вызывает перекристаллизацию и доломитизацию с ростом межкристаллической пористости.", "Пороговая идея шага: В зрелом рифовом комплексе обломочных известняков разрушения (50–80 %) гораздо больше, чем самого прижизненного биогермного каркаса (10–20 %)."], "source_ref": "Литология природных резервуаров нефти и газа, Глава 10, § 10.2. Литология и коллекторские свойства слагающих рифы пород (стр. 202–205), PDF стр. 205 (печ. стр. 205)", "verbatim_quote": "Большое значение имеет также вторичная пористость. Наиболее важной является каверновая пустотность, образующаяся при активном выщелачивании, в том числе карстовом. Высокая способность к выщелачиванию обусловлена во многом свойствами самих рифов – их высокой первичной проницаемостью, массивностью строения и практически отсутствием глинистых и иных экранирующих пачек, чистотой химического состава пород и другими факторами, что определяет активный водообмен, растворение и вынос вещества. Высокой карстуемости рифов способствует их гипсометрическое положение – они всегда располагаются выше синхронных отложений, а в процессе роста нередко выходят выше уровня моря, т.е. начинают карстоваться уже при своем образовании. В результате возникают каверны разных форм, происхождения (унаследованные, разработанные) и размеров – от долей миллиметра до крупных карстовых пещер. Уникальный дебит в 42000 м³/сут скв. 4 месторождения Серро-Асуль в поясе Голден-Лейк Мексики, связанного с меловым рифом, обусловлен тем, что скважина вскрыла карстовую пещеру, сформированную в этом рифе. При этом вместе с нефтью выносились обломки сталактитов."}, {"task_id": "t3_train_kuznetsov_task_sc_03", "course_id": "t3_train_kuznetsov", "node_id": "kuznetsov_ch10_node_03", "step_id": "kuznetsov_ch10_step_03", "claim_id": "kuznetsov_ch10_node_03_claim_01", "pdf_page": 206, "printed_page": "206", "task_type": "single_choice", "difficulty_level": "инженерный", "prompt": "Какое утверждение точно отражает ключевой физико-геологический принцип шага «Строение резервуаров одиночных рифов и атоллов» (Глава 10, § 10.3. Строение рифовых резервуаров: купола и атоллы (стр. 205–212))?", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": ["Верно по источнику: При переходе от одиночного купола к атоллу геометрический центр структуры превращается из зоны лучшего коллектора в зону худшего (лагунного) коллектора, а лучшие ФЕС смещаются на периферийное кольцо.", "Типичное заблуждение: Бурение строго в геометрическом центре крупного атолловидного рифа по аналогии с антиклинальной складкой приводит к попаданию в низкопористые глинисто-микрозернистые фации центральной лагуны.", "Параметры методики применяются без учёта граничных условий и литологии пласта", "Физический механизм не зависит от структуры порового пространства и свойств флюида"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: При переходе от одиночного купола к атоллу геометрический центр структуры превращается из зоны лучшего коллектора в зону худшего (лагунного) коллектора, а лучшие ФЕС смещаются на периферийное кольцо.", "explanation": "В одиночных куполовидных рифах-пиннаклах (пример рифа Рейнбоу «А» в Канаде, рис. 10.2: мощность 200–250 м, 90 м нефти и 60 м газа) лучшие коллекторы концентрируются в центральной ядерной части массива (пористость до 15–35 %, проницаемость 0,2–3 мкм²). В крупных атолловидных массивах (Карачаганак, рис. 10.3–10.4; Интисар «Д») распределение коллекторов становится кольцевым: максимум пористости приурочен к периферийному рифовому гребню, а в центральной лагуне ФЕС ухудшаются. (Литология природных резервуаров нефти и газа, Глава 10, § 10.3. Строение рифовых резервуаров: купола и атоллы (стр. 205–212), PDF стр. 206 (печ. стр. 206)).", "error_analysis": {"1": "Это известная ошибка интерпретации: Бурение строго в геометрическом центре крупного атолловидного рифа по аналогии с антиклинальной складкой приводит к попаданию в низкопористые глинисто-микрозернистые фации центральной лагуны.", "2": "Игнорирование граничных условий (Даже в массивном рифе присутствуют внутрирезервуарные низкопроницаемые прослои лагунных микрозернистых известняков, однако они не выдержаны по площади и не нарушают единого гидродинамического резервуара.) приводит к неверному решению.", "3": "В действительности механизм основан на том, что В небольшом куполе волновая гидродинамика и вторичное выщелачивание максимально перерабатывают центральную вершину, тогда как в атолле активный рост каркаса, волновое дробление и водообмен происходят по внешнему кольцу гребня, окружающему тиховодную илистую лагуну."}, "hint_steps": ["Обратите внимание на наблюдение: Геологический разрез по профилю скважин 6-32 .. 12-28 рифа Рейнбоу «А» (рис. 10.2) и карты пористости/проницаемости Карачаганака (рис. 10.3–10.4).", "Учтите физический механизм: В небольшом куполе волновая гидродинамика и вторичное выщелачивание максимально перерабатывают центральную вершину, тогда как в атолле активный рост каркаса, волновое дробление и водообмен происходят по внешнему кольцу гребня, окружающему тиховодную илистую лагуну.", "Пороговая идея шага: При переходе от одиночного купола к атоллу геометрический центр структуры превращается из зоны лучшего коллектора в зону худшего (лагунного) коллектора, а лучшие ФЕС смещаются на периферийное кольцо."], "source_ref": "Литология природных резервуаров нефти и газа, Глава 10, § 10.3. Строение рифовых резервуаров: купола и атоллы (стр. 205–212), PDF стр. 206 (печ. стр. 206)", "verbatim_quote": "━━━ FORMAT 4: CROSS-SECTION / РАЗРЕЗ ━━━\nОриентация разреза: СЗ (слева) — ЮВ (справа).\nВертикальная ось: $H$, м; отметки 0, 50, 100, 150, 200, 250 м. Значения высоты увеличиваются вверх. Горизонтальный масштаб не указан.\nСкважины вдоль разреза, слева направо:\n- 6–32 — чёрная точка.\n- 2–32 — чёрная точка.\n- 7–32 — чёрная точка.\n- 10–32 — чёрная точка.\n- 12–33 — чёрная точка.\n- 12–28 — ромб.\nРазрез изображает куполообразное тело, возвышающееся от отметки около 0 м до примерно 240 м. Внешняя граница тела круто поднимается с обеих сторон; в верхней части образуется округлая вершина. Внутри показан"}, {"task_id": "t3_train_kuznetsov_task_sc_04", "course_id": "t3_train_kuznetsov", "node_id": "kuznetsov_ch10_node_04", "step_id": "kuznetsov_ch10_step_04", "claim_id": "kuznetsov_ch10_node_04_claim_01", "pdf_page": 213, "printed_page": "213", "task_type": "single_choice", "difficulty_level": "инженерный", "prompt": "Какое утверждение точно отражает ключевой физико-геологический принцип шага «Асимметричные барьерные рифы ловушки и разведка» (Глава 10, § 10.3–§ 10.4. Асимметричные рифовые системы, типы ловушек и разведка (стр. 213–222))?", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": ["Верно по источнику: В асимметричной барьерной системе зарифовая лагуна превращается из части резервуара в непроницаемый боковой экран (сульфаты, соли, плотные микрозернистые доломиты), запирающий залежь с регионального восстания.", "Типичное заблуждение: Нельзя интерпретировать сокращение мощности перекрывающей толщи над рифом как послерифовый тектонический свод: это седиментационная структура облекания и уплотнения вокруг жёсткого карбонатного ядра.", "Параметры методики применяются без учёта граничных условий и литологии пласта", "Физический механизм не зависит от структуры порового пространства и свойств флюида"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: В асимметричной барьерной системе зарифовая лагуна превращается из части резервуара в непроницаемый боковой экран (сульфаты, соли, плотные микрозернистые доломиты), запирающий залежь с регионального восстания.", "explanation": "В асимметричных барьерных рифовых системах (Западно-Техасский пермский бассейн, девон Альберты, рис. 10.5–10.7) лучшие коллекторы формируются в пригребневой зоне ядра, тогда как в сторону глубоководного бассейна они резко сменяются плотными депрессионными породами, а в сторону лагуны — слоистыми сульфатно-карбонатными толщами, служащими боковым экраном. При разведке рифов ключевую роль играет выявление косвенных признаков: структур облекания в перекрывающих слоях, локального уменьшения мощности соленосной покрышки над сводом рифа и фациальной асимметрии. (Литология природных резервуаров нефти и газа, Глава 10, § 10.3–§ 10.4. Асимметричные рифовые системы, типы ловушек и разведка (стр. 213–222), PDF стр. 213 (печ. стр. 213)).", "error_analysis": {"1": "Это известная ошибка интерпретации: Нельзя интерпретировать сокращение мощности перекрывающей толщи над рифом как послерифовый тектонический свод: это седиментационная структура облекания и уплотнения вокруг жёсткого карбонатного ядра.", "2": "Игнорирование граничных условий (Скважина, пробуренная всего в нескольких сотнях метров от гребня барьерного рифа в сторону депрессии, попадает в маломощные глубоководные доманикиты, а в сторону лагуны — в непроницаемые эвапориты.) приводит к неверному решению.", "3": "В действительности механизм основан на том, что Рост барьерного рифа на бровке шельфа изолирует зарифовую лагуну, где в аридном климате осаждаются плотные доломиты и эвапориты (ангидриты, соли), формирующие как латеральный экран, так и региональную покрышку при последующем захоронении рифа."}, "hint_steps": ["Обратите внимание на наблюдение: Поперечный разрез асимметричной рифовой системы (рис. 10.5–10.7), мощности перекрывающих соленосных/глинистых толщ и сейсмические отражения.", "Учтите физический механизм: Рост барьерного рифа на бровке шельфа изолирует зарифовую лагуну, где в аридном климате осаждаются плотные доломиты и эвапориты (ангидриты, соли), формирующие как латеральный экран, так и региональную покрышку при последующем захоронении рифа.", "Пороговая идея шага: В асимметричной барьерной системе зарифовая лагуна превращается из части резервуара в непроницаемый боковой экран (сульфаты, соли, плотные микрозернистые доломиты), запирающий залежь с регионального восстания."], "source_ref": "Литология природных резервуаров нефти и газа, Глава 10, § 10.3–§ 10.4. Асимметричные рифовые системы, типы ловушек и разведка (стр. 213–222), PDF стр. 213 (печ. стр. 213)", "verbatim_quote": "━━━ FORMAT 4: CROSS-SECTION / РАЗРЕЗ ━━━\nВертикальный разрез. Горизонтальная ориентация, горизонтальный масштаб и линия разреза не указаны.\nВертикальная ось: $H$, км; значения отрицательные: от −0,4 до −1,2 км. Глубина возрастает вниз.\nПодписанные уровни/границы:\n- −0,4; −0,5; −0,6; −0,7; −0,8; −0,9; −1,0; −1,1; −1,2 км.\n- Наклонная сплошная линия: поднимается от около −1,1 км в левой части до около −0,78 км, затем образует несколько локальных поднятий и понижается к около −0,7 км справа.\n- Наклонная штриховая линия: прослеживается в центральной части, приблизительно от −0,85 до −0,9 км.\n- Гор"}, {"task_id": "t3_train_kuznetsov_task_sc_05", "course_id": "t3_train_kuznetsov", "node_id": "kuznetsov_ch10_node_01", "step_id": "kuznetsov_ch10_step_01", "claim_id": "kuznetsov_ch10_node_01_claim_01", "pdf_page": 201, "printed_page": "201", "task_type": "single_choice", "difficulty_level": "инженерный", "prompt": "Какое утверждение точно отражает ключевой физико-геологический принцип шага «Иерархия органогенных построек биостромы биогермы рифы» (Глава 10, § 10.1. Краткие сведения о геологии рифов и их типах (стр. 200–202))?", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": ["Верно по источнику: Риф — это не просто скопление раковин, а автономизированная экосистема-волнолом, сама создающая расчленённый рельеф дна и собственные фациальные зоны разрушения (шлейф) и затишья (лагуну).", "Типичное заблуждение: Типичная ошибка геологов-поисковиков — принимать любой пластовый биоморфный известняк (биостром) за риф и проектировать бурение на несуществующий купольный свод.", "Параметры методики применяются без учёта граничных условий и литологии пласта", "Физический механизм не зависит от структуры порового пространства и свойств флюида"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: Риф — это не просто скопление раковин, а автономизированная экосистема-волнолом, сама создающая расчленённый рельеф дна и собственные фациальные зоны разрушения (шлейф) и затишья (лагуну).", "explanation": "Органогенные карбонатные постройки делятся на пластовые биостромы, холмовидные биогермы и волноустойчивые рифы (рис. 10.1). Рифы составляют малую долю осадочных пород, но концентрируют 10–12 % мировых запасов углеводородов благодаря огромной высоте массивных залежей (до 1500 м на Карачаганаке и 900–2100 м в зоне Ла Реформа). (Литология природных резервуаров нефти и газа, Глава 10, § 10.1. Краткие сведения о геологии рифов и их типах (стр. 200–202), PDF стр. 201 (печ. стр. 201)).", "error_analysis": {"1": "Это известная ошибка интерпретации: Типичная ошибка геологов-поисковиков — принимать любой пластовый биоморфный известняк (биостром) за риф и проектировать бурение на несуществующий купольный свод.", "2": "Игнорирование граничных условий (Нельзя называть «рифом» любой известняк с биоморфной фауной: без превышения мощности над синхронными отложениями и без волноприбойного обломочного шлейфа это биостром или банка, не образующая рифовой ловушки.) приводит к неверному решению.", "3": "В действительности механизм основан на том, что Колониальные каркасные организмы нарастают вверх к свету быстрее накопления синхронных осадков; в отличие от погружённого биогерма, настоящий риф выходит в зону волнового прибоя, разрушается волнами и формирует асимметричный или куполовидный комплекс с предрифовым обломочным шлейфом."}, "hint_steps": ["Обратите внимание на наблюдение: Геометрия карбонатного тела на разрезе, соотношение его мощности с синхронными слоями и наличие грубообломочного шлейфа (рис. 10.1).", "Учтите физический механизм: Колониальные каркасные организмы нарастают вверх к свету быстрее накопления синхронных осадков; в отличие от погружённого биогерма, настоящий риф выходит в зону волнового прибоя, разрушается волнами и формирует асимметричный или куполовидный комплекс с предрифовым обломочным шлейфом.", "Пороговая идея шага: Риф — это не просто скопление раковин, а автономизированная экосистема-волнолом, сама создающая расчленённый рельеф дна и собственные фациальные зоны разрушения (шлейф) и затишья (лагуну)."], "source_ref": "Литология природных резервуаров нефти и газа, Глава 10, § 10.1. Краткие сведения о геологии рифов и их типах (стр. 200–202), PDF стр. 201 (печ. стр. 201)", "verbatim_quote": "━━━ FORMAT 12: CONCEPTUAL DIAGRAM / КОНЦЕПТУАЛЬНАЯ СХЕМА ━━━\nСхематический поперечный разрез симметричной куполообразной структуры с дугообразно изогнутыми внутренними слоями. В центральной верхней части показан крупный свод; по его бокам расположены наклонные полосы с косыми линейными элементами. Нижняя часть с обеих сторон содержит горизонтально-слоистые участки, над которыми показаны наклонные зоны с овальными элементами; литология не определяется без легенды. По левому краю имеется вертикальная двусторонняя стрелка с обозначением «N». Верхняя и нижняя границы рисунка обозначены горизонталь"}, {"task_id": "t3_train_kuznetsov_task_ord_01", "course_id": "t3_train_kuznetsov", "node_id": "kuznetsov_ch10_node_01", "step_id": "kuznetsov_ch10_step_01", "claim_id": "kuznetsov_ch10_node_01_claim_01", "pdf_page": 201, "printed_page": "201", "task_type": "ordering", "difficulty_level": "инженерный", "prompt": "Расположите ручные действия специалиста на шаге «Иерархия органогенных построек биостромы биогермы рифы» в методически правильном порядке (поддерживается перетаскивание и кнопки Вверх/Вниз с клавиатуры):", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": [], "ordering_items": ["Сопоставить мощность карбонатной постройки с мощностью синхронных вмещающих отложений по скважинам и сейсмике.", "Проверить по керну наличие грубообломочных пород предрифового шлейфа (фация 2 на рис. 10.1).", "Определить симметрию поперечного сечения: одиночный купол/атолл (рис. 10.1 в) или асимметричный барьерный край (рис. 10.1 г)."], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": ["Сопоставить мощность карбонатной постройки с мощностью синхронных вмещающих отложений по скважинам и сейсмике.", "Проверить по керну наличие грубообломочных пород предрифового шлейфа (фация 2 на рис. 10.1).", "Определить симметрию поперечного сечения: одиночный купол/атолл (рис. 10.1 в) или асимметричный барьерный край (рис. 10.1 г)."], "answer_key_display": "1) Сопоставить мощность карбонатной постройки с мощностью синхронных вмещающих отложений по скважинам и сейсмике. → 2) Проверить по керну наличие грубообломочных пород предрифового шлейфа (фация 2 на рис. 10.1). → 3) Определить симметрию поперечного сечения: одиночный купол/атолл (рис. 10.1 в) или асимметричный барьерный край (рис. 10.1 г).", "explanation": "Методический порядок диктуется цепочкой «проверка условий и первичных данных → расчёт/построение → контроль результата» (Литология природных резервуаров нефти и газа, Глава 10, § 10.1. Краткие сведения о геологии рифов и их типах (стр. 200–202), PDF стр. 201).", "error_analysis": {"order_mismatch": "Нарушена последовательность подготовки данных: нельзя снимать итоговый параметр до проверки граничных условий и приведения единиц."}, "hint_steps": ["Первый шаг всегда связан с проверкой первичных данных, масштабов или условий применимости.", "Второй шаг выполняет основное преобразование, расчёт или построение по палетке/формуле.", "Заключительный шаг — снятие целевого параметра и проверка критерия принятия решения."], "source_ref": "Литология природных резервуаров нефти и газа, Глава 10, § 10.1. Краткие сведения о геологии рифов и их типах (стр. 200–202), PDF стр. 201", "verbatim_quote": "━━━ FORMAT 12: CONCEPTUAL DIAGRAM / КОНЦЕПТУАЛЬНАЯ СХЕМА ━━━\nСхематический поперечный разрез симметричной куполообраз верн и вторичной доломитизации. → 3) Сопоставить позицию скважины с профилем зональности (купол, атолл или асимметричный барьер).", "explanation": "Методический порядок диктуется цепочкой «проверка условий и первичных данных → расчёт/построение → контроль результата» (Литология природных резервуаров нефти и газа, Глава 10, § 10.2. Литология и коллекторские свойства слагающих рифы пород (стр. 202–205), PDF стр. 205).", "error_analysis": {"order_mismatch": "Нарушена последовательность подготовки данных: нельзя снимать итоговый параметр до проверки граничных условий и приведения единиц."}, "hint_steps": ["Первый шаг всегда связан с проверкой первичных данных, масштабов или условий применимости.", "Второй шаг выполняет основное преобразование, расчёт или построение по палетке/формуле.", "Заключительный шаг — снятие целевого параметра и проверка критерия принятия решения."], "source_ref": "Литология природных резервуаров нефти и газа, Глава 10, § 10.2. Литология и коллекторские свойства слагающих рифы пород (стр. 202–205), PDF стр. 205", "verbatim_quote": "Большое значение имеет также вторичная пористость. Наиболее важной является каверновая пустотность, образующаяся при активном выщелачивании, в том числе карстовом. Высокая способность к выщелачиванию обусловлена во многом свойствами самих рифов – их высокой первичной проницаемостью, массивностью строения и практически отсутствием глинистых и иных экранирующих пачек, чистотой химического состава пород и другими факторами, что определяет активный водообмен, растворение и вынос вещества. Высокой карстуемости рифов способствует их гипсометрическое положение – они всегда располагаются выше синхронных отложений, а в процессе роста нередко выходят выше уровня моря, т.е. начинают карстоваться уже при своем образовании. В результате возникают каверны разных форм, происхождения (унаследованные, разработанные) и размеров – от долей миллиметра до крупных карстовых пещер. Уникальный дебит в 42000 м³/сут скв. 4 месторождения Серро-А ыборе модели резервуара.", "options": ["Признаки подтверждают критерий применимости → Вывод и решение специалиста: Разграничение биострома, биогерма и настоящего рифа при выборе модели резервуара.", "Игнорировать граничное условие (Нельзя называть «рифом» любой известняк с биоморфной фауной: без превы) и применить формулу вслепую", "Принять ошибочную трактовку: Типичная ошибка геологов-поисковиков — принимать любой пластовый биоморфный изве", "Отказаться от количественной интерпретации при выполнении всех условий применимости"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Ход решения: Признаки → Правило → Вывод: Признаки подтверждают критерий применимости → Вывод и решение специалиста: Разграничение биострома, биогерма и настоящего рифа при выборе модели резервуара.", "explanation": "По цепочке «признаки → правило → вывод»: Признаки (данные): Геометрия карбонатного тела на разрезе, соотношение его мощности с синхронными слоями и наличие грубообломочного шлейфа (рис. 10.1). Кроме того, зафиксировано: На схеме рис. 10.1 (стр. 201): сопоставление горизонтальных размеров N (десятки–сотни метров, до первых километров) и вертикального рельефа n (метры — десятки метров) для фаций 1–5. → Правило (критерий по учебнику, стр. 201): Риф — это не просто скопление раковин, а автономизированная экосистема-волнолом, сама создающая расчленённый рельеф дна и собственные фациальные зоны разрушения (шлейф) и затишья (лагуну). (с учётом ограничения: Нельзя называть «рифом» любой известняк с биоморфной фауной: без превышения мощности над синхронными отложениями и без волноприбойного обломочного шлейфа это биостром или банка, не образующая рифовой ловушки.) → Вывод и решение специалиста: Разграничение биострома, биогерма и настоящего рифа при выборе модели резервуара. (Литология природных резервуаров нефти и газа, Глава 10, § 10.1. Краткие сведения о геологии
