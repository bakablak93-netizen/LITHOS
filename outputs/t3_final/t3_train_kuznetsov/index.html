ные биогермы и волноустойчивые рифы (рис. 10.1). Рифы составляют малую долю осадочных пород, но концентрируют 10–12 % мировых запасов углеводородов благодаря огромной высоте массивных залежей (до 1500 м на Карачаганаке и 900–2100 м в зоне Ла Реформа).", "primary_difficulty": "spatial_3d_geometry", "secondary_difficulty": "conceptual_mechanism", "primary_difficulty_code": "В", "secondary_difficulty_code": "М", "estimated_minutes": 8, "mechanism": "Колониальные каркасные организмы нарастают вверх к свету быстрее накопления синхронных осадков; в отличие от погружённого биогерма, настоящий риф выходит в зону волнового прибоя, разрушается волнами и формирует асимметричный или куполовидный комплекс с предрифовым обломочным шлейфом.", "practice": "Геолог отличает биостром (мощность равна вмещающим слоям, нет рельефа) от биогерма и рифа (мощность превышает синхронные отложения, есть морфологический купол и фациальная зональность по рис. 10.1) перед постановкой поискового бурения.", "nuances": "Нельзя называть «рифом» любой известняк с биоморфной фауной: без превышения мощности над синхронными отложениями и без волноприбойного обломочного шлейфа это биостром или банка, не образующая рифовой ловушки.", "deeper_branch": "Различие одиночных куполовидных рифов/атоллов на локальных поднятиях дна и линейных асимметричных барьерных рифовых систем на тектонических уступах шельфа (рис. 10.1 в, г).", "quotes_and_pages": [{"unit_id": "train_kuznetsov_p201_vlmfig_04", "pdf_page": 201, "printed_page": "201", "verbatim_quote": "━━━ FORMAT 12: CONCEPTUAL DIAGRAM / КОНЦЕПТУАЛЬНАЯ СХЕМА ━━━\nСхематический поперечный разрез симметричной куполообразной структуры с дугообразно изогнутыми внутренними слоями. В центральной верхней части показан крупный свод; по его бокам расположены наклонные полосы с косыми линейными элементами. Нижняя часть с обеих сторон содержит горизонтально-слоистые участки, над которыми показаны наклонные зоны с овальными элементами; литология не определяется без легенды. По левому краю имеется вертикальная двусторонняя стрелка с обозначением «N». Верхняя и нижняя границы рисунка обозначены горизонталь", "editorial_paraphrase": "Изложение по источнику (стр. 201): Органогенные карбонатные постройки делятся на пластовые биостромы, холмовидные биогермы и волноустойчивые рифы (рис.", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p200_par_01", "pdf_page": 200, "printed_page": "200", "verbatim_quote": "Рифы являются весьма специфическим типом карбонатных отложений, где в максимальной степени проявляется биогенный способ образования и осаждения карбонатного материала. Составляя лишь очень малую долю карбонатных отложений вообще, и тем более осадочных образований в целом, они содержат порядка 10–12 % мировых запасов углеводородов. При относительно небольшой площади, высота залежей бывает очень значительной. Например, высота залежи месторождения Карачаганак превышает 1500 м, а на ряде месторождений зоны Ла Реформа Мексики колеблется в диапазоне 900–2100 м. Это определяет высокую плотность запасов, и высокую экономическую эффективность разработки таких залежей. Естественно поэтому повышенный интерес к рифам нефтяников, что, однако, приводит иногда к негативным последствиям и перекосам – за рифы принимаются карбонатные отложения вообще, особенно биоморфной структуры, ставятся ориентированные на рифы поисково-разведочные работы в областях, где рифов нет и т.д.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 200 (10.1. КРАТКИЕ СВЕДЕНИЯ О ГЕОЛОГИИ РИФОВ И ИХ ТИПАХ · абзац #1).", "numbers_and_units": [{"value": "1500", "unit": "м"}, {"value": "900–2100", "unit": "м"}], "conditions": []}, {"unit_id": "train_kuznetsov_p201_fig_10_1_06", "pdf_page": 201, "printed_page": "201", "verbatim_quote": "Рис. 10.1. Схема строения органогенных построек: биостромов (а), биогермов (б) и рифов: симметричных куполовидных (в) и асимметричных рифовых систем (г).", "editorial_paraphrase": "Анализ единицы Рис. 10.1 на стр. 201 (10.1. КРАТКИЕ СВЕДЕНИЯ О ГЕОЛОГИИ РИФОВ И ИХ ТИПАХ · Рис. 10.1).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p200_par_02", "pdf_page": 200, "printed_page": "200", "verbatim_quote": "В определенной степени это привело к неоправданному расширению понятия «риф», что и обусловило необходимость введения дополнительных терминов. Стало ясно, что существует определенная иерархия органогенных сооружений, и были введены новые соответствующие термины. Более или менее общепринятым стал термин «органогенная постройка» (organic build-up), как геологическое образование, созданное нараставшими друг на друга растительными и животными колониальными или нарастающими друг на друга организмами.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 200 (10.1. КРАТКИЕ СВЕДЕНИЯ О ГЕОЛОГИИ РИФОВ И ИХ ТИПАХ · абзац #2).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p200_par_03", "pdf_page": 200, "printed_page": "200", "verbatim_quote": "Органогенные постройки включают два типа – биостромы и биогермы (*рис. 10.1*) Биостром – геологическое тело, представляющее собой пласт, серию пластов или уплощенную линзу, образованное остатками организмов в прижизненном положении, т.е. сложенное карбонатными породами биогермной структуры. Мощность биострома примерно равна мощности окружающих синхронных отложений, поэтому эта постройка не была выражена в рельефе дна. Биогерм – холмовидное геологическое тело, образованное остатками колониальных и прикрепляю-", "editorial_paraphrase": "Анализ единицы paragraph на стр. 200 (10.1. КРАТКИЕ СВЕДЕНИЯ О ГЕОЛОГИИ РИФОВ И ИХ ТИПАХ · абзац #3).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p201_cap_10_1_06", "pdf_page": 201, "printed_page": "201", "verbatim_quote": "Рис. 10.1. Схема строения органогенных построек: биостромов (а), биогермов (б) и рифов: симметричных куполовидных (в) и асимметричных рифовых систем (г).", "editorial_paraphrase": "Анализ единицы Рис. 10.1 на стр. 201 (10.1. КРАТКИЕ СВЕДЕНИЯ О ГЕОЛОГИИ РИФОВ И ИХ ТИПАХ · подпись Рис. 10.1).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p201_leg_07", "pdf_page": 201, "printed_page": "201", "verbatim_quote": "Фации: 1 – ядра рифа (биогермные), 2 – предрифового шлейфа, 3 – тыльно-рифовые, 4 – в той или иной степени глубоководные межрифовые и предрифовые, 5 – мелководные внерифовые (внебиогермные).", "editorial_paraphrase": "Анализ единицы legend на стр. 201 (10.1. КРАТКИЕ СВЕДЕНИЯ О ГЕОЛОГИИ РИФОВ И ИХ ТИПАХ · экспликация/легенда рисунка).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p201_par_08", "pdf_page": 201, "printed_page": "201", "verbatim_quote": "N – десятки, сотни, иногда первые тысячи метров; n – метры, реже первые десятки метров", "editorial_paraphrase": "Анализ единицы paragraph на стр. 201 (10.1. КРАТКИЕ СВЕДЕНИЯ О ГЕОЛОГИИ РИФОВ И ИХ ТИПАХ · абзац #8).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p201_par_09", "pdf_page": 201, "printed_page": "201", "verbatim_quote": "щихся друг к другу организмов, т.е. также сложенное карбонатными породами биогермной структуры. Во время роста этот холм возвышался над дном бассейна, но не выходил выше уровня действия волн, поэтому в нем нет или точнее мало обломочных структур, тем более грубозернистых. В отличие от биострома мощность биогерма больше мощности синхронных отложений.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 201 (10.1. КРАТКИЕ СВЕДЕНИЯ О ГЕОЛОГИИ РИФОВ И ИХ ТИПАХ · абзац #9).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p201_par_10", "pdf_page": 201, "printed_page": "201", "verbatim_quote": "Рифы – это сложные геологические образования, возникающие в результате жизнедеятельности колониальных или нарастающих организмов и представляющие собой карбонатный массив, сложенный, по крайней мере частично, остатками организмов и продуктами их разрушения. Поскольку скорость роста рифа превышает скорость накопления окружающих осадков, его мощность больше мощности синхронных отложений и он возвышается над ними (см. рис. 10.1).", "editorial_paraphrase": "Анализ единицы paragraph на стр. 201 (10.1. КРАТКИЕ СВЕДЕНИЯ О ГЕОЛОГИИ РИФОВ И ИХ ТИПАХ · абзац #10).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p201_par_11", "pdf_page": 201, "printed_page": "201", "verbatim_quote": "Естественно, что для геологов-нефтяников наибольший интерес представляют рифы в узком буквальном смысле этого слова. Именно они, точнее строение их резервуаров и частично ловушек, описаны в настоящей работе. Более подробные сведения о геологии рифов и их нефтегазоносности приведены в работах В.Д. Ильина и Н.К. Фортунатовой", "editorial_paraphrase": "Анализ единицы paragraph на стр. 201 (10.1. КРАТКИЕ СВЕДЕНИЯ О ГЕОЛОГИИ РИФОВ И ИХ ТИПАХ · абзац #11).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p202_par_01", "pdf_page": 202, "printed_page": "202", "verbatim_quote": "[1988], В.Г. Кузнецова [1978, 1992], специальных сборниках [Ископаемые..., 1975, Литология..., 1975, Методы..., 1983] и др.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 202 (10.1. КРАТКИЕ СВЕДЕНИЯ О ГЕОЛОГИИ РИФОВ И ИХ ТИПАХ · абзац #1).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p202_par_02", "pdf_page": 202, "printed_page": "202", "verbatim_quote": "Сами рифы различаются по своей морфологии, положению в бассейне, т.е. тектонической и палеогеографической позиции.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 202 (10.1. КРАТКИЕ СВЕДЕНИЯ О ГЕОЛОГИИ РИФОВ И ИХ ТИПАХ · абзац #2).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p202_par_03", "pdf_page": 202, "printed_page": "202", "verbatim_quote": "Выделяется два основных типа рифов – одиночные рифы и асимметричные рифовые системы. Первые формируются как в мелководных, так и глубоководных обстановках на локальных поднятых морского дна – отмелях, образованных консидиментационными антиклинальными складками, затопленных барах, вулканических конусах и т.д. Они имеют примерно симметричное поперечное сечение. Вторые представляют собой вытянутые цепочки рифов, развивающихся на крутом перегибе морского дна, на границе мелководных и глубоководных участков бассейна.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 202 (10.1. КРАТКИЕ СВЕДЕНИЯ О ГЕОЛОГИИ РИФОВ И ИХ ТИПАХ · абзац #3).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p202_par_04", "pdf_page": 202, "printed_page": "202", "verbatim_quote": "Основу рифовых сооружений, а тем более биостромов и биогермов, составляют биогермные известняки, образованные остатками колониальных или нарастающих организмов, находящихся в положении роста. Являясь необходимыми для образования самого рифа, как холмовидной волноустойчивой структуры, биогермные известняки далеко не всегда преобладают в строении этих сооружений, причем четко устанавливается, что их процентное содержание относительно уменьшается от биогермов к сложным рифовым комплексам, где оно не превышает 10–20 %. В самих биогермных породах, особенно образованных колониальными каркасными и нарастающими организмами, остатки последних составляют лишь незначительную часть породы – пространство между нарастающими организмами или веточками колониальных преобладает в общем объеме породы и заполнено либо шламом, либо яснокристаллическим кальцитом (спаритом), либо остается пустым.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 202 (10.2. ЛИТОЛОГИЯ И КОЛЛЕКТОРСКИЕ СВОЙСТВА СЛАГАЮЩИХ РИФЫ ПОРОД · абзац #4).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p202_par_05", "pdf_page": 202, "printed_page": "202", "verbatim_quote": "В большинстве рифовых комплексов ведущее значение по распространенности имеют обломочные разности известняков, причем, их содержание часто превышает 50 % и нередко достигает 60–80 % и более. Крупнообломочные известняки в количественном отношении имеют подчиненное значение, однако характерны именно для рифовых фаций. Обломки состоят из биогермных и сопутствующих пород данного массива. Наиболее развиты такие породы на крутых склонах рифовых массивов, образуя предрифовые шлейфы. В ископаемом состоянии после цементации из них образуются известняковые брекчии и конгломераты.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 202 (10.2. ЛИТОЛОГИЯ И КОЛЛЕКТОРСКИЕ СВОЙСТВА СЛАГАЮЩИХ РИФЫ ПОРОД · абзац #5).", "numbers_and_units": [], "conditions": []}], "epistemic_split": {"observation": "Геометрия карбонатного тела на разрезе, соотношение его мощности с синхронными слоями и наличие грубообломочного шлейфа (рис. 10.1).", "inference": "Классификация объекта как биострома (а), биогерма (б), одиночного куполовидного рифа (в) или асимметричной рифовой системы (г).", "assumption": "Сохранение первичных морфологических соотношений мощностей после постседиментационного уплотнения вмещающих толщ."}, "field_provenance": {"source_heading": "source_verbatim", "step_title": "editorial_synthesis_3_7_words", "summary_2_3_sentences": "editorial_synthesis_grounded_in_quotes", "mechanism": "source_grounded_domain_explanation", "practice": "specialist_workflow_from_textbook", "nuances": "source_applicability_conditions", "deeper_branch": "advanced_textbook_extension", "quotes_and_pages": "source_verbatim_with_pdf_page", "epistemic_split": "epistemic_decomposition_t3", "inefficiency_lens": "specialist_workflow_lens", "core_terms": "passport_and_textbook_definitions", "worked_example": "textbook_worked_example", "computed_values": "not_applicable"}, "typed_links": [{"source_node_id": "kuznetsov_ch10_node_01", "target_node_id": "kuznetsov_ch10_node_01", "link_type": "refutes_misconception", "link_label_ru": "опровергает заблуждение", "rationale": "Типичная ошибка геологов-поисковиков — принимать любой пластовый биоморфный известняк (биостром) за риф и проектировать бурение на несуществующий купольный свод."}], "core_terms": [{"term": "Биостром", "definition": "Пластовое или плосколинзовидное карбонатное тело из остатков организмов in-situ, не выраженное в рельефе дна", "first_introduced_pdf_page": 200, "first_introduced_printed_page": "200", "cis_symbol": "Биостром", "west_symbol": "Biostrome", "west_term": "Biostrome (bedded organic build-up)", "unit": "м"}, {"term": "Биогерм", "definition": "Холмовидная органогенная постройка, возвышавшаяся над дном, но не достигавшая зоны волнового разрушения", "first_introduced_pdf_page": 200, "first_introduced_printed_page": "200", "cis_symbol": "Биогерм", "west_symbol": "Bioherm", "west_term": "Bioherm (mound build-up)", "unit": "м"}, {"term": "Риф", "definition": "Крупный карбонатный массив из каркасных организмов и продуктов их волнового разрушения, возвышающийся над синхронными осадками", "first_introduced_pdf_page": 200, "first_introduced_printed_page": "200", "cis_symbol": "Риф", "west_symbol": "Reef", "west_term": "Wave-resistant reef complex", "unit": "м"}], "threshold_concept": "Риф — это не просто скопление раковин, а автономизированная экосистема-волнолом, сама создающая расчленённый рельеф дна и собственные фациальные зоны разрушения (шлейф) и затишья (лагуну).", "misconception_to_fix": "Типичная ошибка геологов-поисковиков — принимать любой пластовый биоморфный известняк (биостром) за риф и проектировать бурение на несуществующий купольный свод.", "data_transfer": "На схеме рис. 10.1 (стр. 201): сопоставление горизонтальных размеров N (десятки–сотни метров, до первых километров) и вертикального рельефа n (метры — десятки метров) для фаций 1–5.", "it_analogy_and_limits": "Аналогия с архитектурой кластеров: биостром — плоский одноранговый слой (Flat Layer), биогерм — изолированный узел без внешнего балансировщика, а риф — иерархический кластер с ядром, внешним файрволом-волноломом (предрифовый шлейф) и внутренней подсетью (лагуной). Граница: геологическая постройка растёт и разрушается одновременно.", "specialist_manual_steps": ["Сопоставить мощность карбонатной постройки с мощностью синхронных вмещающих отложений по скважинам и сейсмике.", "Проверить по керну наличие грубообломочных пород предрифового шлейфа (фация 2 на рис. 10.1).", "Определить симметрию поперечного сечения: одиночный купол/атолл (рис. 10.1 в) или асимметричный барьерный край (рис. 10.1 г)."], "decision_points": ["Разграничение биострома, биогерма и настоящего рифа при выборе модели резервуара.", "Оценка потенциала плотности запасов по высоте массивной постройки (аналог Карачаганака >1500 м)."], "inefficiency_lens": {"inputs": ["Геометрия карбонатного тела на разрезе, соотношение его мощности с синхронными слоями и наличие грубообломочного шлейфа (рис. 10.1).", "Источник: стр. 200–202"], "manual_steps": ["Сопоставить мощность карбонатной постройки с мощностью синхронных вмещающих отложений по скважинам и сейсмике.", "Проверить по керну наличие грубообломочных пород предрифового шлейфа (фация 2 на рис. 10.1).", "Определить симметрию поперечного сечения: одиночный купол/атолл (рис. 10.1 в) или асимметричный барьерный край (рис. 10.1 г)."], "expert_judgment_points": ["Разграничение биострома, биогерма и настоящего рифа при выборе модели резервуара.", "Оценка потенциала плотности запасов по высоте массивной постройки (аналог Карачаганака >1500 м)."], "estimated_time_min": 16, "typical_errors": ["Типичная ошибка геологов-поисковиков — принимать любой пластовый биоморфный известняк (биостром) за риф и проектировать бурение на несуществующий купольный свод."], "origin_tag": "author_number"}, "worked_example": {"status": "present", "not_applicable_reason": "", "problem_number": "Анализ типов построек по рис. 10.1 (§10.1, стр. 200–202)", "figure_ref": "Рис. 10.1 (стр. 201)", "pdf_page": 200, "printed_page": "200", "conditions": "Четыре карбонатных разреза (а, б, в, г) с отметкой уровня моря и фациями 1–5.", "steps": ["В разрезе (а) мощность равна вмещающим слоям — это биостром.", "В разрезе (б) есть холм из фации 1 без обломочного шлейфа 2 — это биогерм.", "В разрезах (в) и (г) ядро 1 выходит к уровню моря и окаймлено шлейфом 2 и тыльно-рифовой фацией 3 — это рифы."], "result": "По рис. 10.1 однозначно диагностированы биостром, биогерм, симметричный риф и асимметричная рифовая система."}, "textbook_problems": [], "modern_equivalents": [{"historical_item": "Палеофациальное профилирование по бурению", "historical_context": "Построение концептуальных разрезов по редкой сетке скважин", "modern_analog": "3D сейсмическая геоморфология и атрибутный анализ (Seismic Facies / Acoustic Impedance)", "modern_context": "Выделение ядра рифа, предрифового шлейфа и клиноформ на кубах 3D-сейсмики", "pdf_page": 200}], "not_applicable_fields": [], "expert_review_flags": ["Единица train_kuznetsov_p201_vlmfig_04 (стр. 201) имеет статус 'legend_missing' — помечена для предметной сверки по PDF."], "covered_unit_ids": ["train_kuznetsov_p200_par_01", "train_kuznetsov_p200_par_02", "train_kuznetsov_p200_par_03", "train_kuznetsov_p201_vlmfig_04", "train_kuznetsov_p201_fig_10_1_06", "train_kuznetsov_p201_cap_10_1_06", "train_kuznetsov_p201_leg_07", "train_kuznetsov_p201_par_08", "train_kuznetsov_p201_par_09", "train_kuznetsov_p201_par_10", "train_kuznetsov_p201_par_11", "train_kuznetsov_p202_par_01", "train_kuznetsov_p202_par_02", "train_kuznetsov_p202_par_03", "train_kuznetsov_p202_par_04", "train_kuznetsov_p202_par_05", "train_kuznetsov_p202_par_06"], "claim_ids": ["kuznetsov_ch10_node_01_claim_01", "kuznetsov_ch10_node_01_claim_02", "kuznetsov_ch10_node_01_claim_03", "kuznetsov_ch10_node_01_claim_04", "kuznetsov_ch10_node_01_claim_05", "kuznetsov_ch10_node_01_claim_06", "kuznetsov_ch10_node_01_claim_07", "kuznetsov_ch10_node_01_claim_08", "kuznetsov_ch10_node_01_claim_09", "kuznetsov_ch10_node_01_claim_10", "kuznetsov_ch10_node_01_claim_11", "kuznetsov_ch10_node_01_claim_12", "kuznetsov_ch10_node_01_claim_13", "kuznetsov_ch10_node_01_claim_14", "kuznetsov_ch10_node_01_claim_15", "kuznetsov_ch10_node_01_claim_16"], "computed_values": []}, {"node_id": "kuznetsov_ch10_node_02", "chapter_id": "kuznetsov_ch10", "order": 2, "order_rationale": "Следует после узла #1, опираясь на уже введённые термины и переходя от механизма к количественной оценке и принятию решения (стр. 203–205).", "source_heading": "Глава 10, § 10.2. Литология и коллекторские свойства слагающих рифы пород (стр. 202–205)", "step_title": "Литолого фациальная зональность и пустотность рифов", "summary_2_3_sentences": "Хотя каркас рифа создают биогермные известняки (в крупных рифах их доля составляет лишь 10–20 %), основной объём массива (50–80 %) слагают обломочные, органогенно-детритовые и оолитовые породы. Сложное первичное пустотное пространство (сходное со «стогом соломы» по Т.А. Линку) многократно усиливается вторичным карстовым выщелачиванием и доломитизацией, создавая каверно-поровые коллекторы со сверхвысокими дебитами.", "primary_difficulty": "conceptual_mechanism", "secondary_difficulty": "spatial_3d_geometry", "primary_difficulty_code": "М", "secondary_difficulty_code": "В", "estimated_minutes": 8, "mechanism": "Приподнятое положение рифа над дном и выход гребня выше уровня моря при регрессиях обеспечивают промывку чистых массивных карбонатов метеорными водами (карстование), а циркуляция магнезиальных рассолов вызывает перекристаллизацию и доломитизацию с ростом межкристаллической пористости.", "practice": "Литолог картирует смену фаций на коротких расстояниях: в одиночном куполе (ядро + шлейф), в атолле (кольцевое ядро вокруг слоистой лагуны) и в линейной системе (депрессия → предрифовый склон → ядро → тыловой шлейф → лагуна).", "nuances": "Первичная пористость каркаса нередко быстро залечивается субаквальной цементацией и спаритом, поэтому лучшие ФЕС формируются именно там, где на первичную проницаемость наложились вторичное выщелачивание и доломитизация.", "deeper_branch": "Феномен гигантских карстовых каверн в рифах: пример скв. 4 месторождения Серро-Асуль (пояс Голден-Лейк, Мексика) с уникальным дебитом 42 000 м³/сут и выносом обломков сталактитов (стр. 205).", "quotes_and_pages": [{"unit_id": "train_kuznetsov_p205_par_03", "pdf_page": 205, "printed_page": "205", "verbatim_quote": "Большое значение имеет также вторичная пористость. Наиболее важной является каверновая пустотность, образующаяся при активном выщелачивании, в том числе карстовом. Высокая способность к выщелачиванию обусловлена во многом свойствами самих рифов – их высокой первичной проницаемостью, массивностью строения и практически отсутствием глинистых и иных экранирующих пачек, чистотой химического состава пород и другими факторами, что определяет активный водообмен, растворение и вынос вещества. Высокой карстуемости рифов способствует их гипсометрическое положение – они всегда располагаются выше синхронных отложений, а в процессе роста нередко выходят выше уровня моря, т.е. начинают карстоваться уже при своем образовании. В результате возникают каверны разных форм, происхождения (унаследованные, разработанные) и размеров – от долей миллиметра до крупных карстовых пещер. Уникальный дебит в 42000 м³/сут скв. 4 месторождения Серро-Асуль в поясе Голден-Лейк Мексики, связанного с меловым рифом, обусловлен тем, что скважина вскрыла карстовую пещеру, сформированную в этом рифе. При этом вместе с нефтью выносились обломки сталактитов.", "editorial_paraphrase": "Изложение по источнику (стр. 205): Хотя каркас рифа создают биогермные известняки (в крупных рифах их доля составляет лишь 10–20 %), основной объём массива (50–80 %) слагают обломочные, органогенно-детритовые и оолитовые породы.", "numbers_and_units": [{"value": "42000", "unit": "м³/сут"}], "conditions": []}, {"unit_id": "train_kuznetsov_p205_par_06", "pdf_page": 205, "printed_page": "205", "verbatim_quote": "В качестве примера на рис. 10.2 приведены данные по резервуару хорошо изученного рифа Рейнбоу «А» в Канаде [Langton, Chin, 1968]. Это островершинный риф (пиннакл) общей мощностью 200–250 м, из которых 90 м нефтенасыщены и 60 м газонасыщены; округлый в пла-", "editorial_paraphrase": "Анализ единицы paragraph на стр. 205 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · абзац #6).", "numbers_and_units": [{"value": "200–250", "unit": "м"}, {"value": "90", "unit": "м"}, {"value": "60", "unit": "м"}], "conditions": []}, {"unit_id": "train_kuznetsov_p203_par_01", "pdf_page": 203, "printed_page": "203", "verbatim_quote": "ными гидродинамическими условиями, а также деятельностью организмов.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 203 (10.2. ЛИТОЛОГИЯ И КОЛЛЕКТОРСКИЕ СВОЙСТВА СЛАГАЮЩИХ РИФЫ ПОРОД · абзац #1).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p203_par_02", "pdf_page": 203, "printed_page": "203", "verbatim_quote": "Очень характерной чертой является частая и нередко почти полная перекристаллизация и доломитизация рифов или их значительных участков.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 203 (10.2. ЛИТОЛОГИЯ И КОЛЛЕКТОРСКИЕ СВОЙСТВА СЛАГАЮЩИХ РИФЫ ПОРОД · абзац #2).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p203_par_03", "pdf_page": 203, "printed_page": "203", "verbatim_quote": "Чрезвычайно важная особенность рифовых сооружений – закономерное расположение различных литологических типов пород в теле массива, которое сопровождается подобным же зональным размещением фаунистических сообществ, причем смена пород и фауны происходит достаточно резко на коротких расстояниях. Эта зональность является закономерным следствием расчлененности рельефа в пределах рифового сооружения – наличием мелководного или даже выходящего выше уровня моря гребня и резким, часто очень значительным углублением водоема на рифовых склонах, которая ведет к существенным изменениям гидродинамики, освещенности, что и определяет разнообразие условий обитания организмов и обстановок седиментации, а следовательно, и типов осадков по их структуре, текстуре, гранулометрии и т.д.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 203 (10.2. ЛИТОЛОГИЯ И КОЛЛЕКТОРСКИЕ СВОЙСТВА СЛАГАЮЩИХ РИФЫ ПОРОД · абзац #3).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p203_par_04", "pdf_page": 203, "printed_page": "203", "verbatim_quote": "Сам характер литолого-фациальной зональности зависит от типа рифов: являются ли они одиночными или входят с состав асимметричных рифовых систем.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 203 (10.2. ЛИТОЛОГИЯ И КОЛЛЕКТОРСКИЕ СВОЙСТВА СЛАГАЮЩИХ РИФЫ ПОРОД · абзац #4).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p203_par_05", "pdf_page": 203, "printed_page": "203", "verbatim_quote": "По своей морфологии, типу поперечного сечения одиночные рифы могут быть куполовидными, плосковершинными и атоллами.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 203 (10.2. ЛИТОЛОГИЯ И КОЛЛЕКТОРСКИЕ СВОЙСТВА СЛАГАЮЩИХ РИФЫ ПОРОД · абзац #5).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p203_par_06", "pdf_page": 203, "printed_page": "203", "verbatim_quote": "Одиночные куполовидные рифы включают две основные литолого-фациальные зоны – ядра рифа и его склона (предрифовый шлейф). Фации рифового ядра сложены обычно биогермными известняками, где развиты уплощенные массивные и стелющиеся формы колоний рифострояющих организмов. Наряду с биогермными обычными также детритовые мелкообломочные породы – известняковые песчаники и алевролиты. Фации ядра рифа часто в результате вторичных процессов интенсивно перекристаллизованы и доломитизированы; тогда они сложены кристаллическими известняками и доломитами. По периферии рифа непосредственно вокруг ядра располагаются грубообломочные известняковые конгломераты и гравелиты предрифового шлейфа, которые далее замещаются все более тонкозернистыми детритовыми и шламовыми, а затем и микро-тонкозернистыми темноцветными и более глинистыми известняками. Отложения предрифового шлейфа часто обладают видимой первично не горизонтальной слоистостью. В целом отмечается четкая и достаточно простая зональность, симметричная относительно центральной части рифа.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 203 (10.2. ЛИТОЛОГИЯ И КОЛЛЕКТОРСКИЕ СВОЙСТВА СЛАГАЮЩИХ РИФЫ ПОРОД · абзац #6).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p203_par_07", "pdf_page": 203, "printed_page": "203", "verbatim_quote": "В атолловидных рифах и атоллах появляются новые фациальные зоны, и характер зональности становится более сложным. Биогермные и мелкообломочные породы ядра рифа располагаются уже не в центре, а образуют кольцо или овал по периферии рифового комплекса. Как и в куполовидных рифах, они обрамляются с внешней стороны обломочными известняками. Однако рифовый гребень – существенно биогермные породы ядра рифа – возвышается не только над дном бассейна, но и над окруженной этим гребнем частью водоема – лагуной. Поэтому на обрат-", "editorial_paraphrase": "Анализ единицы paragraph на стр. 203 (10.2. ЛИТОЛОГИЯ И КОЛЛЕКТОРСКИЕ СВОЙСТВА СЛАГАЮЩИХ РИФЫ ПОРОД · абзац #7).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p204_par_01", "pdf_page": 204, "printed_page": "204", "verbatim_quote": "ных – неморских тыльнорифовых склонах рифового гребня также формируются обломочные известняки, хотя и более тонкие, чем на предрифовых склонах. Отложения этой фации представлены обычно светлыми микрозернистыми известняками часто с тонкой правильной горизонтальной слоистостью, нередко с прослоями детритовых и шламовых известняков. Мощности лагунных отложений, как правило, меньше мощности ядра и в отличие от последних они обладают слоистостью разного масштаба. Таким образом, в атолловидных рифах устанавливается кольцевая зональность с лагунными фациями в центре.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 204 (10.2. ЛИТОЛОГИЯ И КОЛЛЕКТОРСКИЕ СВОЙСТВА СЛАГАЮЩИХ РИФЫ ПОРОД · абзац #1).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p204_par_02", "pdf_page": 204, "printed_page": "204", "verbatim_quote": "Рифовые системы представляют собой более или менее протяженную цепь, состоящую из ряда соединяющихся или отдельных рифов различной формы. Приуроченность рифовых систем к уступам в рельефе дна, т.е. асимметричным формам, определяет их значительную геоморфологическую, структурную, фациальную и литолого-коллекторскую асимметрию в поперечном сечении.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 204 (10.2. ЛИТОЛОГИЯ И КОЛЛЕКТОРСКИЕ СВОЙСТВА СЛАГАЮЩИХ РИФЫ ПОРОД · абзац #2).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p204_par_03", "pdf_page": 204, "printed_page": "204", "verbatim_quote": "В какой-то степени в линейно вытянутых рифовых системах отмечается аналогичный атоллам характер литолого-экологической зональности, однако отдельные фациальные зоны располагаются не по кольцу, а линейно вытянуты параллельно простиранию всей системы. Кроме того, если в атоллах фации располагаются более или менее симметрично относительно его центра, то в линейно вытянутой системе отмечается резкая асимметрия, так как ее фациальный профиль представляет собой как бы половину профиля атолла: депрессионные бассейновые фации – предрифовые фации – фации ядра рифа – тыльно-рифовые фации – зарифовые лагунные или мелководно-морские фации.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 204 (10.2. ЛИТОЛОГИЯ И КОЛЛЕКТОРСКИЕ СВОЙСТВА СЛАГАЮЩИХ РИФЫ ПОРОД · абзац #3).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p204_par_04", "pdf_page": 204, "printed_page": "204", "verbatim_quote": "Разнообразие структурно-генетических типов пород и их частная интенсивная вторичная переработка определяют и разнообразие типов коллекторов, их качества, характера и структуры пустотного пространства. Спецификой является важная роль пустот, так или иначе связанных с наличием скелетных остатков организмов. Первичная пористость весьма разнообразна. Она создается, прежде всего, пустотами во внутренних полостях скелетов органических остатков – кораллов, гидроидов, водорослей, пелеципод, брахиопод, гастропод, фораминифер и т.д., а также пространством между каркасными органическими остатками – веточками мшанок, кораллов и др. Эту пористость Т.А. Линк [Link, 1950] образно сравнил со стогом соломы, придавленной сверху грузом. Отдельные полые соломинки имеют свою пористость, а их беспорядочное нагромождение приводит к образованию еще более крупных пустот. Сюда же относятся щелевидные и линзовидные пустоты между отдельными наслоениями корковых и инкрустирующих организмов, например строматолитовых и водорослевых слойков, а также щелевидные пустоты на контакте скелетов органических остатков, и прежде всего раковин, с вмещающим детритовым, шламовым и другим илистым карбонатным материалом.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 204 (10.2. ЛИТОЛОГИЯ И КОЛЛЕКТОРСКИЕ СВОЙСТВА СЛАГАЮЩИХ РИФЫ ПОРОД · абзац #4).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p204_par_05", "pdf_page": 204, "printed_page": "204", "verbatim_quote": "Важное значение имеет межгранулярная первичная пористость в обломочных, органогенно-обломочных и оолитовых известняках. В первичное пустотное пространство рифов входят также довольно многочис-", "editorial_paraphrase": "Анализ единицы paragraph на стр. 204 (10.2. ЛИТОЛОГИЯ И КОЛЛЕКТОРСКИЕ СВОЙСТВА СЛАГАЮЩИХ РИФЫ ПОРОД · абзац #5).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p205_par_01", "pdf_page": 205, "printed_page": "205", "verbatim_quote": "ленные и нередко крупные пещеровидные пустоты, формирующиеся в волноприбойных каналах, нишах и рифовых туннелях, а также образующиеся при неравномерном и неполном срастании отдельных биогермов и колоний и т.д. К первичным могут быть отнесены также пустоты, образующиеся в результате деятельности сверлильщиков.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 205 (10.2. ЛИТОЛОГИЯ И КОЛЛЕКТОРСКИЕ СВОЙСТВА СЛАГАЮЩИХ РИФЫ ПОРОД · абзац #1).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p205_par_02", "pdf_page": 205, "printed_page": "205", "verbatim_quote": "Первичная пористость в чистом виде и в полном объеме практически не сохраняется и уже в процессе роста рифа может сокращаться за счет развития инкрустирующих водорослей, субаквальной цементации, заполнения пустот мелкими организмами и детритом, в результате диагенетического хемогенного и биохемогенного выпадения карбонатов и т.д.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 205 (10.2. ЛИТОЛОГИЯ И КОЛЛЕКТОРСКИЕ СВОЙСТВА СЛАГАЮЩИХ РИФЫ ПОРОД · абзац #2).", "numbers_and_units": [], "conditions": []}], "epistemic_split": {"observation": "Петрографический состав керна (доля биогермных, детритовых, брекчиевых и доломитизированных разностей) и тип пустот в шлифах.", "inference": "Реконструкция фациальной зоны (ядро, предрифовый шлейф, тыльно-рифовый склон, лагуна) и прогноз зоны максимального вторичного выщелачивания.", "assumption": "Прямая генетическая связь между первичной проницаемостью рифовых фаций и интенсивностью наложенного карстового водообмена."}, "field_provenance": {"source_heading": "source_verbatim", "step_title": "editorial_synthesis_3_7_words", "summary_2_3_sentences": "editorial_synthesis_grounded_in_quotes", "mechanism": "source_grounded_domain_explanation", "practice": "specialist_workflow_from_textbook", "nuances": "source_applicability_conditions", "deeper_branch": "advanced_textbook_extension", "quotes_and_pages": "source_verbatim_with_pdf_page", "epistemic_split": "epistemic_decomposition_t3", "inefficiency_lens": "specialist_workflow_lens", "core_terms": "passport_and_textbook_definitions", "worked_example": "textbook_worked_example", "computed_values": "not_applicable"}, "typed_links": [{"source_node_id": "kuznetsov_ch10_node_01", "target_node_id": "kuznetsov_ch10_node_02", "link_type": "prerequisite", "link_label_ru": "предпосылка", "rationale": "Узел 1 5_par_02", "train_kuznetsov_p205_par_03", "train_kuznetsov_p205_par_04", "train_kuznetsov_p205_par_05", "train_kuznetsov_p205_par_06"], "claim_ids": ["kuznetsov_ch10_node_02_claim_01", "kuznetsov_ch10_node_02_claim_02", "kuznetsov_ch10_node_02_claim_03", "kuznetsov_ch10_node_02_claim_04", "kuznetsov_ch10_node_02_claim_05", "kuznetsov_ch10_node_02_claim_06", "kuznetsov_ch10_node_02_claim_07", "kuznetsov_ch10_node_02_claim_08", "kuznetsov_ch10_node_02_claim_09", "kuznetsov_ch10_node_02_claim_10", "kuznetsov_ch10_node_02_claim_11", "kuznetsov_ch10_node_02_claim_12", "kuznetsov_ch10_node_02_claim_13", "kuznetsov_ch10_node_02_claim_14", "kuznetsov_ch10_node_02_claim_15", "kuznetsov_ch10_node_02_claim_16"], "computed_values": []}, {"node_id": "kuznetsov_ch10_node_03", "chapter_id": "kuznetsov_ch10", "order": 3, "order_rationale": "Следует после узла #2, опираясь на уже введённые термины и переходя от механизма к количественной оценке и принятию решения (стр. 206–212).", "source_heading": "Глава 10, § 10.3. Строение рифовых резервуаров: купола и атоллы (стр. 205–212)", "step_title": "Строение резервуаров одиночных рифов и атоллов", "summary_2_3_sentences": "В одиночных куполовидных рифах-пиннаклах (пример рифа Рейнбоу «А» в Канаде, рис. 10.2: мощность 200–250 м, 90 м нефти и 60 м газа) лучшие коллекторы концентрируются в центральной ядерной части массива (пористость до 15–35 %, проницаемость 0,2–3 мкм²). В крупных атолловидных массивах (Карачаганак, рис. 10.3–10.4; Интисар «Д») распределение коллекторов становится кольцевым: максимум пористости приурочен к периферийному рифовому гребню, а в центральной лагуне ФЕС ухудшаются.", "primary_difficulty": "spatial_3d_geometry", "secondary_difficulty": "multi_curve_reading", "primary_difficulty_code": "В", "secondary_difficulty_code": "И", "estimated_minutes": 8, "mechanism": "В небольшом куполе волновая гидродинамика и вторичное выщелачивание максимально перерабатывают центральную вершину, тогда как в атолле активный рост каркаса, волновое дробление и водообмен происходят по внешнему кольцу гребня, окружающему тиховодную илистую лагуну.", "practice": "Геолог строит карты пористости и эффективных мощностей с учётом морфотипа: для пиннакла закладывает эксплуатационные скважины в своде (скв. 7-32, 10-32 на рис. 10.2), а для атолла — вдоль кольцевого биогермного вала (рис. 10.3, 10.4).", "nuances": "Даже в массивном рифе присутствуют внутрирезервуарные низкопроницаемые прослои лагунных микрозернистых известняков, однако они не выдержаны по площади и не нарушают единого гидродинамического резервуара.", "deeper_branch": "Сопоставление девонского рифа Рейнбоу «А» (Канада), палеоценового рифа Интисар «Д» (Ливия) и разновозрастного подсолевого массива Карачаганак (Прикаспий, рис. 10.3–10.4).", "quotes_and_pages": [{"unit_id": "train_kuznetsov_p206_vlmfig_01", "pdf_page": 206, "printed_page": "206", "verbatim_quote": "━━━ FORMAT 4: CROSS-SECTION / РАЗРЕЗ ━━━\nОриентация разреза: СЗ (слева) — ЮВ (справа).\nВертикальная ось: $H$, м; отметки 0, 50, 100, 150, 200, 250 м. Значения высоты увеличиваются вверх. Горизонтальный масштаб не указан.\nСкважины вдоль разреза, слева направо:\n- 6–32 — чёрная точка.\n- 2–32 — чёрная точка.\n- 7–32 — чёрная точка.\n- 10–32 — чёрная точка.\n- 12–33 — чёрная точка.\n- 12–28 — ромб.\nРазрез изображает куполообразное тело, возвышающееся от отметки около 0 м до примерно 240 м. Внешняя граница тела круто поднимается с обеих сторон; в верхней части образуется округлая вершина. Внутри показан", "editorial_paraphrase": "Изложение по источнику (стр. 206): В одиночных куполовидных рифах-пиннаклах (пример рифа Рейнбоу «А» в Канаде, рис.", "numbers_and_units": [{"value": "250", "unit": "м"}, {"value": "0", "unit": "м"}, {"value": "240", "unit": "м"}, {"value": "0–50", "unit": "м"}], "conditions": []}, {"unit_id": "train_kuznetsov_p206_vlmfig_03", "pdf_page": 206, "printed_page": "206", "verbatim_quote": "━━━ FORMAT 4: CROSS-SECTION / РАЗРЕЗ ━━━\nВертикальная ось: $H$, м; значения от 0 внизу до 250 вверху, высота возрастает вверх.\nГоризонтальная шкала: 0, 500, 1000, 1500 м. Направление профиля не указано.\nСкважины (слева направо): 6-32, 2-32, 7-32, 10-32, 12-33, 12-28, 2-28. Скважины 6-32, 2-32, 7-32, 10-32 и 12-33 обозначены чёрными кружками; 12-28 и 2-28 — светлыми ромбами.\nВ разрезе показано куполообразное тело с кровлей около $H=270$ м и подошвой около $H=0$ м. Контуры тела ступенчато расширяются вниз; максимальная ширина наблюдается в интервале приблизительно $H=50$–100 м. Внутри выделены л", "editorial_paraphrase": "Анализ единицы Иллюстрация стр. 206 (#3) на стр. 206 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · иллюстрация #3).", "numbers_and_units": [{"value": "1500", "unit": "м"}, {"value": "100", "unit": "м"}], "conditions": []}, {"unit_id": "train_kuznetsov_p208_vlmfig_01", "pdf_page": 208, "printed_page": "208", "verbatim_quote": "━━━ FORMAT 4: CROSS-SECTION / РАЗРЕЗ ━━━\nГеологический разрез складчатого строения. Ориентация линии разреза, горизонтальный и вертикальный масштабы не указаны.\nВертикальная шкала отсутствует; направление возрастания глубины на изображении не указано. Отметки ВНК приведены как отрицательные абсолютные глубины, м.\nВертикальные линии с подписями, слева направо:\n- Скв. 4\n- 16\n- 1\n- 32\n- 23\n- 49\n- 27\n- 29\nПодписанные контакты:\n- ВНК −1249 м — в центральной части разреза.\n- ВНК −1258 м — в правой части разреза.\nСтроение: слоистые тела с различными крапами образуют левое поднятие, центральный прогиб", "editorial_paraphrase": "Анализ единицы Иллюстрация стр. 208 (#1) на стр. 208 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · иллюстрация #1).", "numbers_and_units": [{"value": "1249", "unit": "м"}, {"value": "1258", "unit": "м"}], "conditions": []}, {"unit_id": "train_kuznetsov_p212_vlmfig_01", "pdf_page": 212, "printed_page": "212", "verbatim_quote": "━━━ FORMAT 4: CROSS-SECTION / РАЗРЕЗ ━━━\nВерхний разрез.\nОриентация разреза не указана. По горизонтали показан масштаб: 0—10 км; промежуточные деления не подписаны. Вертикальная ось: $H$, м; отметки 0, 20, 40, 60, 80, 100 м. Положительные отметки увеличиваются вверх.\nВертикальные линии с треугольными отметками на поверхности, слева направо: 104, 3, 204, 1. У точки 3 проведена вертикальная штриховая линия. Через точку 204 проведена сплошная вертикальная линия до основания разреза.\nВ разрезе показаны слоистые тела с условными графическими крапами; литология не определяется без легенды. Слева сло", "editorial_paraphrase": "Анализ единицы Иллюстрация стр. 212 (#1) на стр. 212 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · иллюстрация #1).", "numbers_and_units": [{"value": "0—10", "unit": "км"}, {"value": "100", "unit": "м"}, {"value": "65", "unit": "м"}], "conditions": []}, {"unit_id": "train_kuznetsov_p211_vlmfig_01", "pdf_page": 211, "printed_page": "211", "verbatim_quote": "━━━ FORMAT 5: СТРАТИГРАФИЧЕСКАЯ КОЛОНКА ━━━\nСтратиграфическая колонка; изображение повернуто относительно нормальной ориентации. Числовые и текстовые обозначения в верхней табличной части частично неразборчивы.\n| Система/Отдел/Ярус | Свита/Толща | Индекс | Мощность, м | Крап | Описание |\n|---|---|---|---|---|---|\n| [нрзб] | [нрзб] | [нрзб] | [нрзб] | косая короткая штриховка | литология не определяется без легенды |\n| [нрзб] | [нрзб] | [нрзб] | [нрзб] | точечный крап | литология не определяется без легенды |\n| [нрзб] | [нрзб] | [нрзб] | [нрзб] | редкие короткие наклонные штрихи | литология не ", "editorial_paraphrase": "Анализ единицы Иллюстрация стр. 211 (#1) на стр. 211 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · иллюстрация #1).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p211_vlmfig_02", "pdf_page": 211, "printed_page": "211", "verbatim_quote": "━━━ FORMAT 9: ТЕХНИЧЕСКАЯ СХЕМА ━━━\nСхематический разрез с линзовидным тёмным телом неправильной формы в центральной части. Вмещающая область показана короткими горизонтальными штрихами.\nТёмное тело вытянуто вдоль разреза, расширяется в средней части и сужается к краям. По его периферии проведены многочисленные тонкие криволинейные линии, огибающие тело; в нижней части они образуют дугообразный изгиб. В правой нижней части показан участок с вертикальными и наклонными линиями, ограниченный криволинейной границей.\nЛитология не определяется без текстовой легенды.\n━━━ FORMAT 13: УСЛОВНЫЕ ОБОЗНАЧЕН", "editorial_paraphrase": "Анализ единицы Иллюстрация стр. 211 (#2) на стр. 211 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · иллюстрация #2).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p206_legend_02", "pdf_page": 206, "printed_page": "206", "verbatim_quote": "━━━ FORMAT 13: LEGEND/ УСЛОВНЫЕ ОБОЗНАЧЕНИЯ ━━━\n1. Короткие волнистые горизонтальные штрихи — значение не подписано; литология не определяется без легенды.\n2. Короткие горизонтальные штрихи, местами волнистые — значение не подписано; литология не определяется без легенды.\n3. Повторяющиеся V-образные значки — значение не подписано; литология не определяется без легенды.\n4. Мелкие пустые квадраты — значение не подписано; литология не определяется без легенды.\n5. Редкие толстые наклонные чёрные штрихи — значение не подписано; литология не определяется без легенды.\n6. Редкие короткие горизонтальны", "editorial_paraphrase": "Анализ единицы Легенда стр. 206 на стр. 206 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · легенда #2).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p208_legend_02", "pdf_page": 208, "printed_page": "208", "verbatim_quote": "━━━ FORMAT 13: LEGEND/ УСЛОВНЫЕ ОБОЗНАЧЕНИЯ ━━━\n1 — белый фон с короткими вертикальными штрихами; литология не определяется без легенды.\n2 — точечный крап; литология не определяется без легенды.\n3 — редкие знаки «+» и точки; литология не определяется без легенды.\n4 — короткие волнистые штрихи; литология не определяется без легенды.\n5 — густая перекрёстная сетка; литология не определяется без легенды.\n6 — белый фон без крапа; литология не определяется без легенды.\n7 — густая косая штриховка; литология не определяется без легенды.\n8 — косая штриховка в противоположном направлении; литология не о", "editorial_paraphrase": "Анализ единицы Легенда стр. 208 на стр. 208 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · легенда #2).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p212_legend_02", "pdf_page": 212, "printed_page": "212", "verbatim_quote": "━━━ FORMAT 13: LEGEND/ УСЛОВНЫЕ ОБОЗНАЧЕНИЯ ━━━\nУсловные обозначения расположены между верхним и нижним разрезами; текстовые расшифровки отсутствуют.\n1. Мелкие короткие штрихи и точки в прямоугольнике → значение не подписано.\n2. Линзовидный знак с точечным крапом → значение не подписано.\n3. Прямоугольник с горизонтальной линией, кружком и знаком, похожим на «a» → значение не подписано.\n4. Прямоугольник с кружками, вертикальными линиями и точками → значение не подписано.\n5. Прямоугольник с вертикальными параллельными полосами → значение не подписано.\n6. Прямоугольник с горизонтальными параллель", "editorial_paraphrase": "Анализ единицы Легенда стр. 212 на стр. 212 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · легенда #2).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p210_vlmfig_01", "pdf_page": 210, "printed_page": "210", "verbatim_quote": "━━━ FORMAT 3: КАРТА ━━━\nПанель а.\nКарта изолиний с условными обозначениями 1–10. Северное направление показано стрелкой «Ю»; стрелка ориентирована к левому верхнему краю изображения. Масштаб: 0–5 км.\nИзолинии с подписями абсолютных отметок: −4100, −4200, −4300, −4400, −4500, −4600, −4700, −4800, −4900, −5000, −5100, −5200, −5300, −5400, −5500, −5600, −5700, −5800.\nЗнак и подписи скважин: чёрные точки с числовыми значениями; часть подписей неразборчива.\nКонтуры образуют замкнутую вытянутую область; минимальные абсолютные отметки расположены в центральной и юго-восточной частях. Внешние штриховы", "editorial_paraphrase": "Анализ единицы Иллюстрация стр. 210 (#1) на стр. 210 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · иллюстрация #1).", "numbers_and_units": [{"value": "0–5", "unit": "км"}], "conditions": []}, {"unit_id": "train_kuznetsov_p207_par_01", "pdf_page": 207, "printed_page": "207", "verbatim_quote": "не с диаметром около 2 км. Пустотное пространство меж- и внутриформенное, имеются мелкие каверны (ваги), пустоты-шаблоны (молдик), трещины. В отложениях рифа выделено две основные фации – ядра рифа и околорифового шлейфа.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 207 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · абзац #1).", "numbers_and_units": [{"value": "2", "unit": "км"}], "conditions": []}, {"unit_id": "train_kuznetsov_p209_par_02", "pdf_page": 209, "printed_page": "209", "verbatim_quote": "Различно распределение коллекторов в разных возрастных интервалах рифа Карачаганак [«Геология и нефтегазоносность...», 1988]. В пермской части, когда это был куполовидный риф, в его центральной биогермной зоне доля пор размером более 0,1 мм в поровых коллекторах составляет 30–31 %, в то время как на склонах рифа она снижается до 18–19 %. Соответственно с этим средняя проницаемость поровых коллекторов в том же направлении снижается с 19–20 до 8·10⁻¹⁵ м². Аналогично и развитие кавернозности. Так, в фациях рифового ядра кавернозность по скважинам колеблется в пределах 21,8–39,4 % при среднем значении 31 %. На склонах она изменяется в диапазоне 5,2–21,7 % при среднем значении 16,8 %, а в отложениях шлейфа она составляет 9,4 % (данные одной скважины). Одновременно изменяется и эффективная мощность – в ядре рифа она составляет 67,6 % от общей, а на склоне лишь 27,8 %. Иная ситуация в нижнекаменноугольной части, где развит атолловидный риф. Доля кавернозных пород в разных скважинах рифового гребня составляет 13,2–57,5 % (среднее 42,4 %); для фаций внутририфовой лагуны эти величины составляют 0,5–10,6 % при среднем значении 6,8 %, а для рифового склона соответственно 10,1–40,4 % и 26,6 %. Эффективная мощность в рифовом кольце равна 61,1 %, а в лагуне только 38,9 %.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 209 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · абзац #2).", "numbers_and_units": [{"value": "0.1", "unit": "мм"}], "conditions": []}, {"unit_id": "train_kuznetsov_p211_par_04", "pdf_page": 211, "printed_page": "211", "verbatim_quote": "Отложения: 1 – биогермные, 2 – шлейфовые, 3 – глубоководного шельфа, 4 – мелководных шельфовых равнин, 5 – баровые, 6 – верхней части склона, 7 – внутренней части бассейна, 8 – черных сланцев, 9 – зон камучивания, 10 – иловых впадин, 11 – прибрежных лагун, 12 – породы коллекторы с пористостью более 6 % и проницаемостью более 0,0001 мкм², 13 – породы неколлекторы", "editorial_paraphrase": "Анализ единицы paragraph на стр. 211 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · абзац #4).", "numbers_and_units": [{"value": "0.0001", "unit": "мкм²"}], "conditions": []}, {"unit_id": "train_kuznetsov_p206_fig_10_2_04", "pdf_page": 206, "printed_page": "206", "verbatim_quote": "Рис. 10.2. Профильные разрезы рифа Рейнбоу А, Канада [Langton, Chin, 1968]: а – литолого-фациальный, б – типов коллекторов.", "editorial_paraphrase": "Анализ единицы Рис. 10.2 на стр. 206 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · Рис. 10.2).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p208_fig_10_3_03", "pdf_page": 208, "printed_page": "208", "verbatim_quote": "Рис. 10.3. Профильный разрез Карача-Еггинского и Шелканского рифов [Кошляк, Коваленко, 1967]:", "editorial_paraphrase": "Анализ единицы Рис. 10.3 на стр. 208 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · Рис. 10.3).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p210_fig_10_4_02", "pdf_page": 210, "printed_page": "210", "verbatim_quote": "Рис. 10.4. Месторождение Тенгиз, Прикаспийская впадина [Павлов, 1963]:", "editorial_paraphrase": "Анализ единицы Рис. 10.4 на стр. 210 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · Рис. 10.4).", "numbers_and_units": [], "conditions": []}], "epistemic_split": {"observation": "Геологический разрез по профилю скважин 6-32 .. 12-28 рифа Рейнбоу  типы ловушек и разведка (стр. 213–222)", "step_title": "Асимметричные барьерные рифы ловушки и разведка", "summary_2_3_sentences": "В асимметричных барьерных рифовых системах (Западно-Техасский пермский бассейн, девон Альберты, рис. 10.5–10.7) лучшие коллекторы формируются в пригребневой зоне ядра, тогда как в сторону глубоководного бассейна они резко сменяются плотными депрессионными породами, а в сторону лагуны — слоистыми сульфатно-карбонатными толщами, служащими боковым экраном. При разведке рифов ключевую роль играет выявление косвенных признаков: структур облекания в перекрывающих слоях, локального уменьшения мощности соленосной покрышки над сводом рифа и фациальной асимметрии.", "primary_difficulty": "spatial_3d_geometry", "secondary_difficulty": "procedural_decision", "primary_difficulty_code": "В", "secondary_difficulty_code": "П", "estimated_minutes": 8, "mechanism": "Рост барьерного рифа на бровке шельфа изолирует зарифовую лагуну, где в аридном климате осаждаются плотные доломиты и эвапориты (ангидриты, соли), формирующие как латеральный экран, так и региональную покрышку при последующем захоронении рифа.", "practice": "Поисковик использует сейсмические и буровые критерии обнаружения рифа: клиноформное примыкание предрифовых толщ, антиклиналь облекания в надрифовых горизонтах и сокращение толщины эвапоритовой покрышки над вершиной рифа.", "nuances": "Скважина, пробуренная всего в нескольких сотнях метров от гребня барьерного рифа в сторону депрессии, попадает в маломощные глубоководные доманикиты, а в сторону лагуны — в непроницаемые эвапориты.", "deeper_branch": "Эволюция плотности запасов и коэффициента эффективной мощности в ряду: биостром → одиночный купол → атолл → барьерная рифовая система (рис. 10.5–10.8).", "quotes_and_pages": [{"unit_id": "train_kuznetsov_p213_vlmfig_01", "pdf_page": 213, "printed_page": "213", "verbatim_quote": "━━━ FORMAT 4: CROSS-SECTION / РАЗРЕЗ ━━━\nВертикальный разрез. Горизонтальная ориентация, горизонтальный масштаб и линия разреза не указаны.\nВертикальная ось: $H$, км; значения отрицательные: от −0,4 до −1,2 км. Глубина возрастает вниз.\nПодписанные уровни/границы:\n- −0,4; −0,5; −0,6; −0,7; −0,8; −0,9; −1,0; −1,1; −1,2 км.\n- Наклонная сплошная линия: поднимается от около −1,1 км в левой части до около −0,78 км, затем образует несколько локальных поднятий и понижается к около −0,7 км справа.\n- Наклонная штриховая линия: прослеживается в центральной части, приблизительно от −0,85 до −0,9 км.\n- Гор", "editorial_paraphrase": "Изложение по источнику (стр. 213): В асимметричных барьерных рифовых системах (Западно-Техасский пермский бассейн, девон Альберты, рис.", "numbers_and_units": [{"value": "1.2", "unit": "км"}, {"value": "1.1", "unit": "км"}, {"value": "0.78", "unit": "км"}, {"value": "0.7", "unit": "км"}, {"value": "0.9", "unit": "км"}, {"value": "0.8", "unit": "км"}, {"value": "1.0", "unit": "км"}, {"value": "0.93", "unit": "км"}], "conditions": []}, {"unit_id": "train_kuznetsov_p213_vlmfig_02", "pdf_page": 213, "printed_page": "213", "verbatim_quote": "━━━ FORMAT 12: CONCEPTUAL DIAGRAM / КОНЦЕПТУАЛЬНАЯ СХЕМА ━━━\nВертикальная ось: $H$, км; значения отрицательные, от −0,5 вверху до −1,2 внизу. Направление вниз соответствует увеличению глубины (абсолютные отметки становятся более отрицательными).\nПоказан профиль куполообразного поднятия. Сплошной внешний контур имеет вершину приблизительно на отметке −0,65 км и понижается по обоим крыльям до −1,0…−1,2 км. Внутри показаны несколько криволинейных поверхностей и штриховые линии, наклонённые вниз вправо.\nНа своде и крыльях нанесены условные знаки в виде коротких наклонных штрихов; литология не опре", "editorial_paraphrase": "Анализ единицы Иллюстрация стр. 213 (#2) на стр. 213 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · иллюстрация #2).", "numbers_and_units": [{"value": "0.65", "unit": "км"}, {"value": "1.2", "unit": "км"}], "conditions": []}, {"unit_id": "train_kuznetsov_p213_vlmfig_03", "pdf_page": 213, "printed_page": "213", "verbatim_quote": "━━━ FORMAT 4: РАЗРЕЗ ━━━\nОриентация и горизонтальный масштаб не указаны. Вертикальная ось: $H$, км; значения от −0,6 до −1,2 км, отрицательные отметки увеличиваются вниз.\nНа разрезе показаны несколько волнистых границ и линзообразных тел. Литология не определяется без легенды: присутствуют сплошная чёрная заливка, точечный крап, горизонтальная штриховка и контуры без крапа.\nПодписанные элементы и уровни:\n- $A$ — верхняя волнистая граница в центральной части, около −0,65 км.\n- $I$ — верхний интервал между границами, в центральной части.\n- $II$ — средний интервал; подпись расположена около −0,82", "editorial_paraphrase": "Анализ единицы Иллюстрация стр. 213 (#3) на стр. 213 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · иллюстрация #3).", "numbers_and_units": [{"value": "1.2", "unit": "км"}, {"value": "0.65", "unit": "км"}, {"value": "0.82", "unit": "км"}, {"value": "0.94", "unit": "км"}, {"value": "1.0", "unit": "км"}, {"value": "0.95", "unit": "км"}, {"value": "0.99", "unit": "км"}, {"value": "1.15", "unit": "км"}, {"value": "1.05", "unit": "км"}, {"value": "1.11", "unit": "км"}, {"value": "0.70", "unit": "км"}, {"value": "0.85", "unit": "км"}, {"value": "1.04", "unit": "км"}, {"value": "0.96", "unit": "км"}], "conditions": []}, {"unit_id": "train_kuznetsov_p213_vlmfig_04", "pdf_page": 213, "printed_page": "213", "verbatim_quote": "━━━ FORMAT 4: CROSS-SECTION / РАЗРЕЗ ━━━\nСхематический разрез. Ориентация и горизонтальный масштаб не указаны.\nВертикальная ось: $H$, км; абсолютные отметки отрицательные, увеличиваются вниз: −0,7; −0,8; −0,9; −1,0; −1,1; −1,2 км.\nНа разрезе показана сводовая, дугообразная поверхность с вершиной приблизительно на отметке −0,75 км; ниже расположены несколько субпараллельных сплошных и штриховых границ, также образующих свод. В центральной части показаны линзовидные чёрные тела и прослои с точечным крапом. По краям изображены наклонные линии с короткими штрихами/насечками.\nПодписи на разрезе: А,", "editorial_paraphrase": "Анализ единицы Иллюстрация стр. 213 (#4) на стр. 213 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · иллюстрация #4).", "numbers_and_units": [{"value": "1.2", "unit": "км"}, {"value": "0.75", "unit": "км"}], "conditions": []}, {"unit_id": "train_kuznetsov_p218_par_02", "pdf_page": 218, "printed_page": "218", "verbatim_quote": "Чисто палеогеоморфологические ловушки чаще всего образуются в одиночных изолированных рифах или в одиночных куполовидных рифах, возникающих на асимметричной рифовой системе. Максимальная высота, а следовательно, и объем ловушки в общем случае определяется величиной превышения рифа над внерифовыми отложениями (при условии, что рифсодержащий стратиграфический комплекс перекрыт непроницаемыми толщами – покрышками). Если внерифовые отложения также представлены плотными непроницаемыми породами, высота ловушки увеличивается на величину мощности этих экранирующих отложений и образуется литолого-палеогеоморфологическая ловушка, замкнутый объем которой обусловлен сочетанием древнего рельефа с литологическим экранированием. Та часть рифового массива, которая находится гипсометрически ниже, чем залегают непроницаемые толщи, исключается из объема ловушки, так как является открытой и флюиды из нее могут удаляться.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 218 (10.4. ТИПЫ РИФОВЫХ ЛОВУШЕК И ЗАЛЕЖЕЙ НЕФТИ И ГАЗА И ОСНОВЫ МЕТОДИКИ ИХ РАЗВЕДКИ · абзац #2).", "numbers_and_units": [], "conditions": ["Максимальная высота, а следовательно, и объем ловушки в общем случае определяется величиной превышения рифа над внерифовыми отложениями (при условии, что рифсодержащий стратиграфический комплекс перекрыт непроницаемыми толщами – покрышками).", "Если внерифовые отложения также представлены плотными непроницаемыми породами, высота ловушки увеличивается на величину мощности этих экранирующих отложений и образуется литолого-палеогеоморфологическая ловушка, замкнутый объем которой обусловлен сочетанием древнего рельефа с литологическим экранированием."]}, {"unit_id": "train_kuznetsov_p218_par_07", "pdf_page": 218, "printed_page": "218", "verbatim_quote": "Если зарифовые отложения представлены непроницаемыми породами, то последние могут создавать дополнительный экран и тем самым увеличивать высоту и объем ловушки. В этом случае образуются литолого-палеогеоморфологические ловушки.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 218 (10.4. ТИПЫ РИФОВЫХ ЛОВУШЕК И ЗАЛЕЖЕЙ НЕФТИ И ГАЗА И ОСНОВЫ МЕТОДИКИ ИХ РАЗВЕДКИ · абзац #7).", "numbers_and_units": [], "conditions": ["Если зарифовые отложения представлены непроницаемыми породами, то последние могут создавать дополнительный экран и тем самым увеличивать высоту и объем ловушки."]}, {"unit_id": "train_kuznetsov_p219_par_01", "pdf_page": 219, "printed_page": "219", "verbatim_quote": "Таким образом, например, происходит увеличение первичной высоты одиночных рифов, что обусловливает соответствующее увеличение высоты и объема ловушек, а часто и смещение свода ловушки относительно первично наиболее высокой части рифового комплекса. В случае региональных наклонов ловушка смещается вверх по восстанию, и залежи располагаются лишь в одной части рифа.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 219 (10.4. ТИПЫ РИФОВЫХ ЛОВУШЕК И ЗАЛЕЖЕЙ НЕФТИ И ГАЗА И ОСНОВЫ МЕТОДИКИ ИХ РАЗВЕДКИ · абзац #1).", "numbers_and_units": [], "conditions": ["В случае региональных наклонов ловушка смещается вверх по восстанию, и залежи располагаются лишь в одной части рифа."]}, {"unit_id": "train_kuznetsov_p219_par_03", "pdf_page": 219, "printed_page": "219", "verbatim_quote": "Отдельную группу составляют структурные ловушки с рифовым резервуаром. При наложении локальных положительных структур на биостромные или малоамплитудные биогермные образования ведущим фактором формирования ловушек является именно тектонический, так как первичная седиментационная высота построек либо очень невелика и не может создать сколько-нибудь существенный объем ловушки, либо вообще отсутствует (при наличии биостромов).", "editorial_paraphrase": "Анализ единицы paragraph на стр. 219 (10.4. ТИПЫ РИФОВЫХ ЛОВУШЕК И ЗАЛЕЖЕЙ НЕФТИ И ГАЗА И ОСНОВЫ МЕТОДИКИ ИХ РАЗВЕДКИ · абзац #3).", "numbers_and_units": [], "conditions": ["При наложении локальных положительных структур на биостромные или малоамплитудные биогермные образования ведущим фактором формирования ловушек является именно тектонический, так как первичная седиментационная высота построек либо очень невелика и не может создать сколько-нибудь существенный объем ловушки, либо вообще отсутствует (при наличии биостромов)."]}, {"unit_id": "train_kuznetsov_p219_par_04", "pdf_page": 219, "printed_page": "219", "verbatim_quote": "Разнообразие рифовых ловушек, специфическое строение резервуаров определяет и разнообразие связанных с ними залежей нефти и газа. Наиболее простыми и весьма распространенными являются массивные залежи в теле рифа. Формы залежей в плане и распределение плотности запасов по площади таких месторождений обусловлены плановой конфигурацией рифов, особенностями распределения коллекторов в рифовом резервуаре, а также современной гипсометрией поверхности рифа. При наличии литологического экрана в зарифовых отложениях и зональном распределении пористости в рифовом комплексе могут возникать «висячие» залежи с наклонным водонефтяным контактом.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 219 (10.4. ТИПЫ РИФОВЫХ ЛОВУШЕК И ЗАЛЕЖЕЙ НЕФТИ И ГАЗА И ОСНОВЫ МЕТОДИКИ ИХ РАЗВЕДКИ · абзац #4).", "numbers_and_units": [], "conditions": ["При наличии литологического экрана в зарифовых отложениях и зональном распределении пористости в рифовом комплексе могут возникать «висячие» залежи с наклонным водонефтяным контактом."]}, {"unit_id": "train_kuznetsov_p221_par_01", "pdf_page": 221, "printed_page": "221", "verbatim_quote": "ту морфологии, сложное распределение коллекторов ведет к тому, что даже при обнаружении залежи первыми скважинами (в связи с плотностью внутририфовых и лагунных отложений это случается далеко не всегда) оценить ее и тем более составить проект разведки невозможно. Для проведения предварительной оценки и выявления особенностей строения залежей необходимо бурение дополнительных оценочных скважин по периферии ловушки. Если геологические и геофизические материалы дают возможность предполагать наличие относительно крупного плосковершинного или атолловидного рифа, имеет смысл уже первые скважины располагать на периферии предполагаемой ловушки, а бурение в центре отнести ко второму этапу оценочных работ.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 221 (10.4. ТИПЫ РИФОВЫХ ЛОВУШЕК И ЗАЛЕЖЕЙ НЕФТИ И ГАЗА И ОСНОВЫ МЕТОДИКИ ИХ РАЗВЕДКИ · абзац #1).", "numbers_and_units": [], "conditions": ["Если геологические и геофизические материалы дают возможность предполагать наличие относительно крупного плосковершинного или атолловидного рифа, имеет смысл уже первые скважины располагать на периферии предполагаемой ловушки, а бурение в центре отнести ко второму этапу оценочных работ."]}, {"unit_id": "train_kuznetsov_p222_par_02", "pdf_page": 222, "printed_page": "222", "verbatim_quote": "Если исходить из предположения о том, что более выгодной является такая сетка, которая освещала бы равномерно объем, а не площадь залежи [Габриэлянц и др., 1976], то в этом случае целесообразно концентрировать скважины в сводовой части залежи, где сосредоточены основные запасы, и разреживать в краевой. При этом, во-первых, для центральной части залежи, содержащей основные запасы, получаются более достоверные, определенные по большому числу скважин параметры для подсчета запасов и составления проекта разработки, во-вторых, ограничивается бурение малоэффективных с точки зрения разведки приконтурных скважин и, в-третьих, для последующей разработки создается определенный задел скважин, расположенных в благоприятных условиях с точки зрения производительности и обводненности.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 222 (10.4. ТИПЫ РИФОВЫХ ЛОВУШЕК И ЗАЛЕЖЕЙ НЕФТИ И ГАЗА И ОСНОВЫ МЕТОДИКИ ИХ РАЗВЕДКИ · абзац #2).", "numbers_and_units": [], "conditions": ["Если исходить из предположения о том, что более выгодной является такая сетка, которая освещала бы равномерно объем, а не площадь залежи [Габриэлянц и др., 1976], то в этом случае целесообразно концентрировать скважины в сводовой части залежи, где сосредоточены основные запасы, и разреживать в краевой."]}, {"unit_id": "train_kuznetsov_p214_par_04", "pdf_page": 214, "printed_page": "214", "verbatim_quote": "Пластовое залегание пачек пород-коллекторов, которые разделены плотными породами с низкой матричной пористостью и проницаемостью, установлено на газоконденсатном месторождении Карачаганак. Например, в пермском разрезе скв. 2 эффективная мощность составляет 65 % и установлено по крайней мере пять пачек плотных пород (две в артинском, одна на границе сакмарского и артинского и две в ассельском ярусе) мощностью 25–50 м, а нижняя пачка – более 100 м. В скв. 10 в интервале 4020–4160 м вскрыта пачка плотных низкопористых пород (коэффициент пористости до 2–3 %, коэффициент матричной проницаемости не более 3·10⁻¹⁵ м²). Однако во всех плотных пачках установлена трещиноватость, и пористые пласты, видимо, динамически связаны между собой.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 214 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · абзац #4).", "numbers_and_units": [{"value": "25–50", "unit": "м"}, {"value": "100", "unit": "м"}, {"value": "4020–4160", "unit": "м"}], "conditions": []}, {"unit_id": "train_kuznetsov_p222_par_04", "pdf_page": 222, "printed_page": "222", "verbatim_quote": "Для небольших куполовидных рифов часто нерентабельно планировать специальную сетку скважин. Нередко достаточно пробурить с одного основания дополнительно несколько стволов с отклонениями от забоев на 400–500 м. Подобный куст скважин может осветить площадь до 1 км². Разведка удлиненных подковообразных залежей может быть осуществлена рядом многоствольных скважин, заложенных по оси рифа. Для залежей второй группы рациональна кольцевая система с разбуриванием периферии рифа, т.е. зоны максимальной концентрации запасов. Разведка залежей, связанных с асимметричными рифами, может проводиться системой продольных или коротких поперечных профилей с некоторой концентрацией скважин в гребневой и фронтально-рифовой зонах, где сосредоточены основные запасы.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 222 (10.4. ТИПЫ РИФОВЫХ ЛОВУШЕК И ЗАЛЕЖЕЙ НЕФТИ И ГАЗА И ОСНОВЫ МЕТОДИКИ ИХ РАЗВЕДКИ · абзац #4).", "numbers_and_units": [{"value": "400–500", "unit": "м"}], "conditions": []}, {"unit_id": "train_kuznetsov_p214_fig_10_8_08", "pdf_page": 214, "printed_page": "214", "verbatim_quote": "Рис. 10.8. Принципиальные схемы строения природных резервуаров, морфологии ловушек различных морфолого-генетических типов рифов и рекомендуемое размещение разведочных скважин:", "editorial_paraphrase": "Анализ единицы Рис. 10.8 на стр. 214 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · Рис. 10.8).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p215_tbl_01", "pdf_page": 215, "printed_page": "215", "verbatim_quote": "|  Морфология ловушки | План | Профиль | Система разведки  |\n| --- | --- | --- | --- |\n|  Симметричная | Конусовидная |  | Многоствольная  |\n|   |  Подковообразная |   |   |\n|  Атомметричная | Плосковершинная |  | Кольцевая  |\n|   |  Атолловидная |   |   |\n|  Асимметричная | Суплоценной вершиной |  | Профильная  |", "editorial_paraphrase": "Анализ единицы Таблица (стр. 215) на стр. 215 (10.3. СТРОЕНИЕ РИФОВЫХ РЕЗЕРВУАРОВ · таблица #1).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_kuznetsov_p217_tbl_01", "pdf_page": 217, "printed_page": "217", "verbatim_quote": "|  Типы | Изолированные куполовидные рифы | Асимметричные рифовые системы  |\n| --- | --- | --- |\n|  Палеогеоморфологические | Надеждино D₃f | Кунакбаево P₁  |\n|  Литолого-палеогеоморфологические | Чермасан D₃f |   |\n|  Структурно-палеогеоморфологические | Южный Умет P₁ | Зап 213", "claim_id": "kuznetsov_ch10_node_04_claim_01", "artifact_path": "illustrations/kuznetsov_ch10_step_04_illust.svg"}]}, "scene_specs": [], "steps": [{"step_id": "kuznetsov_ch10_step_01", "node_id": "kuznetsov_ch10_node_01", "order": 1, "estimated_minutes": 8, "difficulty_codes": ["В", "М"], "source_heading": "Глава 10, § 10.1. Краткие сведения о геологии рифов и их типах (стр. 200–202)", "step_title": "Иерархия органогенных построек биостромы биогермы рифы", "summary_2_3_sentences": "Органогенные карбонатные постройки делятся на пластовые биостромы, холмовидные биогермы и волноустойчивые рифы (рис. 10.1). Рифы составляют малую долю осадочных пород, но концентрируют 10–12 % мировых запасов углеводородов благодаря огромной высоте массивных залежей (до 1500 м на Карачаганаке и 900–2100 м в зоне Ла Реформа).", "explanation_paragraphs": [{"role": "Физико-геологический механизм", "text": "Колониальные каркасные организмы нарастают вверх к свету быстрее накопления синхронных осадков; в отличие от погружённого биогерма, настоящий риф выходит в зону волнового прибоя, разрушается волнами и формирует асимметричный или куполовидный комплекс с предрифовым обломочным шлейфом.", "unit_id": "train_kuznetsov_p201_vlmfig_04", "pdf_page": 201, "printed_page": "201", "source_citation": "Источник: PDF стр. 201 (печ. стр. 201), ед. train_kuznetsov_p201_vlmfig_04", "verbatim_quote": "━━━ FORMAT 12: CONCEPTUAL DIAGRAM / КОНЦЕПТУАЛЬНАЯ СХЕМА ━━━\nСхематический поперечный разрез симметричной куполообразной структуры с дугообразно изогнутыми внутренними слоями. В центральной верхней части показан крупный свод; по его бокам расположены наклонные полосы с косыми линейными элементами. Нижняя часть с обеих сторон содержит горизонтально-слоистые участки, над которыми показаны наклонные зоны с овальными элементами; литология не определяется без легенды. По левому краю имеется вертикальная двусторонняя стрелка с обозначением «N». Верхняя и нижняя границы рисунка обозначены горизонталь"}, {"role": "Практика работы специалиста", "text": "Геолог отличает биостром (мощность равна вмещающим слоям, нет рельефа) от биогерма и рифа (мощность превышает синхронные отложения, есть морфологический купол и фациальная зональность по рис. 10.1) перед постановкой поискового бурения.", "unit_id": "train_kuznetsov_p200_par_01", "pdf_page": 200, "printed_page": "200", "source_citation": "Источник: PDF стр. 200", "verbatim_quote": "Рифы являются весьма специфическим типом карбонатных отложений, где в максимальной степени проявляется биогенный способ образования и осаждения карбонатного материала. Составляя лишь очень малую долю карбонатных отложений вообще, и тем более осадочных образований в целом, они содержат порядка 10–12 % мировых запасов углеводородов. При относительно небольшой площади, высота залежей бывает очень значительной. Например, высота залежи месторождения Карачаганак превышает 1500 м, а на ряде месторождений зоны Ла Реформа Мексики колеблется в диапазоне 900–2100 м. Это определяет высокую плотность запасов, и высокую экономическую эффективность разработки таких залежей. Естественно поэтому повышенный интерес к рифам нефтяников, что, однако, приводит иногда к негативным последствиям и перекосам – за рифы принимаются карбонатные отложения вообще, особенно биоморфной структуры, ставятся ориентированные на рифы поисково-разведочные работы в областях, где рифов нет и т.д."}, {"role": "Пороговая идея и перенос в данные", "text": "Риф — это не просто скопление раковин, а автономизированная экосистема-волнолом, сама создающая расчленённый рельеф дна и собственные фациальные зоны разрушения (шлейф) и затишья (лагуну). Перенос в данные: На схеме рис. 10.1 (стр. 201): сопоставление горизонтальных размеров N (десятки–сотни метров, до первых километров) и вертикального рельефа n (метры — десятки метров) для фаций 1–5.", "unit_id": "train_kuznetsov_p201_vlmfig_04", "pdf_page": 201, "printed_page": "201", "source_citation": "Источник: PDF стр. 201 (печ. стр. 201)", "verbatim_quote": "━━━ FORMAT 12: CONCEPTUAL DIAGRAM / КОНЦЕПТУАЛЬНАЯ СХЕМА ━━━\nСхематический поперечный разрез симметричной куполообразной структуры с дугообразно изогнутыми внутренними слоями. В центральной верхней части показан крупный свод; по его бокам расположены наклонные полосы с косыми линейными элементами. Нижняя часть с обеих сторон содержит горизонтально-слоистые участки, над которыми показаны наклонные зоны с овальными элементами; литология не определяется без легенды. По левому краю имеется вертикальная двусторонняя стрелка с обозначением «N». Верхняя и нижняя границы рисунка обозначены горизонталь"}, {"role": "Сверка чтения с оригиналом (исправление OCR)", "text": "В тексте курса учтено исправление OCR по PDF-оригиналу: стр. 201: «колониальных и прикрепляю- [разрыв страницы 200->201] щихся друг к другу организмов» → «колониальных и прикрепляющихся друг к другу организмов» (Склейка слова «прикрепляющихся», разорванного вставкой рисунка 10.1 на границе страниц 200 и 201.)", "unit_id": "train_kuznetsov_p201_vlmfig_04", "pdf_page": 201, "printed_page": "201", "source_citation": "Лист исправлений OCR: PDF стр. 201", "verbatim_quote": "колониальных и прикрепляющихся друг к другу организмов"}], "first_use_terms": [{"term": "Биостром", "definition": "Пластовое или плосколинзовидное карбонатное тело из остатков организмов in-situ, не выраженное в рельефе дна", "first_introduced_pdf_page": 200, "first_introduced_printed_page": "200", "cis_symbol": "Биостром", "west_symbol": "Biostrome", "west_term": "Biostrome (bedded organic build-up)", "unit": "м"}, {"term": "Биогерм", "definition": "Холмовидная органогенная постройка, возвышавшаяся над дном, но не достигавшая зоны волнового разрушения", "first_introduced_pdf_page": 200, "first_introduced_printed_page": "200", "cis_symbol": "Биогерм", "west_symbol": "Bioherm", "west_term": "Bioherm (mound build-up)", "unit": "м"}, {"term": "Риф", "definition": "Крупный карбонатный массив из каркасных организмов и продуктов их волнового разрушения, возвышающийся над синхронными осадками", "first_introduced_pdf_page": 200, "first_introduced_printed_page": "200", "cis_symbol": "Риф", "west_symbol": "Reef", "west_term": "Wave-resistant reef complex", "unit": "м"}], "formulas_decoded": [{"title": "Биостром", "cis_formula": "Биостром (м)", "west_formula": "Biostrome — Biostrome (bedded organic build-up)", "variables": {"Биостром": "Пластовое или плосколинзовидное карбонатное тело из остатков организмов in-situ, не выраженное в рельефе дна (СНГ)", "Biostrome": "Международное обозначение SPE/API (Biostrome (bedded organic build-up))"}, "source_ref": "PDF стр. 200 (печ. стр. 200)"}, {"title": "Биогерм", "cis_formula": "Биогерм (м)", "west_formula": "Bioherm — Bioherm (mound build-up)", "variables": {"Биогерм": "Холмовидная органогенная постройка, возвышавшаяся над дном, но не достигавшая зоны волнового разрушения (СНГ)", "Bioherm": "Международное обозначение SPE/API (Bioherm (mound build-up))"}, "source_ref": "PDF стр. 200 (печ. стр. 200)"}, {"title": "Риф", "cis_formula": "Риф (м)", "west_formula": "Reef — Wave-resistant reef complex", "variables": {"Риф": "Крупный карбонатный массив из каркасных организмов и продуктов их волнового разрушения, возвышающийся над синхронными осадками (СНГ)", "Reef": "Международное обозначение SPE/API (Wave-resistant reef complex)"}, "source_ref": "PDF стр. 200 (печ. стр. 200)"}], "applicability_conditions": ["Нельзя называть «рифом» любой известняк с биоморфной фауной: без превышения мощности над синхронными отложениями и без волноприбойного обломочного шлейфа это биостром или банка, не образующая рифовой ловушки."], "worked_example": {"status": "present", "not_applicable_reason": "", "problem_number": "Анализ типов построек по рис. 10.1 (§10.1, стр. 200–202)", "figure_ref": "Рис. 10.1 (стр. 201)", "pdf_page": 200, "printed_page": "200", "conditions": "Четыре карбонатных разреза (а, б, в, г) с отметкой уровня моря и фациями 1–5.", "steps": ["В разрезе (а) мощность равна
