жно применить «промежуточную асимптотику», т. е. положить  $$\\rho/\\sqrt{\\pi t} \\ll 1 \\ll R/\\sqrt{\\pi t},$$", "editorial_paraphrase": "Анализ единицы formula на стр. 43 (Глава 1, §4. Нестационарное движение однородной сжимаемой жидкости. Линейная теория (PDF 38–51) · формула #2).", "numbers_and_units": [{"value": "10", "unit": "см"}], "conditions": []}, {"unit_id": "ctrl_barenblatt_p044_eq_07", "pdf_page": 44, "printed_page": "44", "verbatim_quote": "$$\\Delta p = p(r, t) - p(r, 0) = \\\\ = - Q\\mu (4\\pi kh)^{-1} \\text{Ei} (- r^2/4\\pi t), \\tag{II.109}$$   ---- ━━━ FORMAT 6: XY PLOT / CHART WITH DATA ━━━  Оси: - Ось X: ln t — линейная шкала, диапазон от 0 до 15 (с продолжением сетки за 15) - Ось Y: P, МПа — линейная шкала, диапазон от 10 до 20 (с продолжением сетки выше 20)  Данные представлены точками (экспериментальные/замеренные значения) и сплошной линией (аппроксимирующая прямая/тренд).  Точки (снято с графика, приблизительно): - ln t ≈ 4, P", "editorial_paraphrase": "Анализ единицы formula на стр. 44 (Глава 1, §4. Нестационарное движение однородной сжимаемой жидкости. Линейная теория (PDF 38–51) · формула #7).", "numbers_and_units": [{"value": "17", "unit": "МПа"}, {"value": "16.5", "unit": "МПа"}, {"value": "17.5", "unit": "МПа"}, {"value": "18", "unit": "МПа"}, {"value": "19", "unit": "МПа"}, {"value": "19.5", "unit": "МПа"}, {"value": "20", "unit": "МПа"}, {"value": "20.5", "unit": "МПа"}, {"value": "21", "unit": "МПа"}, {"value": "18.3", "unit": "МПа"}, {"value": "18.7", "unit": "МПа"}, {"value": "19.3", "unit": "МПа"}], "conditions": []}, {"unit_id": "ctrl_barenblatt_p043_eq_04", "pdf_page": 43, "printed_page": "43", "verbatim_quote": "$$\\begin{array}{l} I_0(z) \\approx e^z (2\\pi z)^{-1/2}, \\quad K_0(z) \\approx e^{-z} (\\pi/2z)^{1/2} \\quad z \\to \\infty \\\\ K_0(z) \\approx -\\ln(\\gamma z/2) \\quad \\gamma = e^C \\quad z \\to 0, \\end{array} \\tag{II.104}$$  где $C = 0,7772$ — постоянная Эйлера.  Тогда из (II.103) получим  $$\\bar{P}(r, \\sigma) = -p \\sigma^{-1} K_0(r\\nu). \\tag{II.105}$$", "editorial_paraphrase": "Анализ единицы formula на стр. 43 (Глава 1, §4. Нестационарное движение однородной сжимаемой жидкости. Линейная теория (PDF 38–51) · формула #4).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_barenblatt_p043_eq_06", "pdf_page": 43, "printed_page": "43", "verbatim_quote": "$$\\bar{P}(\\rho, \\sigma) = p^* \\sigma^{-1} \\ln(\\gamma \\rho \\nu). \\tag{II.106}$$  Отметим важное обстоятельство: соотношение (II.105) не содержит радиус скважины $\\rho$. Это означает, что в области применимости условия $\\rho^2/\\pi t \\ll 1$ распределение давления не зависит от радиуса скважины. Используя таблицы преобразований Лапласа и связь между преобразованием функции Лапласа и ее производной, получим  $$p(r, t) = 2^{-1} p^* E_i (-r^2/4\\pi t). \\tag{II.107}$$", "editorial_paraphrase": "Анализ единицы formula на стр. 43 (Глава 1, §4. Нестационарное движение однородной сжимаемой жидкости. Линейная теория (PDF 38–51) · формула #6).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_barenblatt_p043_eq_08", "pdf_page": 43, "printed_page": "43", "verbatim_quote": "$$p(\\rho, t) = -q_\\mu (4\\pi k)^{-1} \\ln(\\gamma \\rho^2/4\\pi t) = Q_\\mu (4\\pi k h)^{-1} \\ln(2,25\\pi t/\\rho^2), \\tag{II.108}$$  где $Q$ — полный дебит скважины ($q$ — дебит на единицу толщины пласта). Формулы (II.107) и (II.108) часто используются для определения параметров пласта по данным о нестационарном притоке.  Определение параметров пласта. Общий принцип исследования пластов при нестационарном течении заключается в том, что путем изменения режима эксплуатации скважин в пласте искусственно со", "editorial_paraphrase": "Анализ единицы formula на стр. 43 (Глава 1, §4. Нестационарное движение однородной сжимаемой жидкости. Линейная теория (PDF 38–51) · формула #8).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_barenblatt_p044_fig_5_06", "pdf_page": 44, "printed_page": "44", "verbatim_quote": "РИС. 5. Кривая восстановления давления", "editorial_paraphrase": "Анализ единицы РИС. 5 на стр. 44 (Глава 1, §4. Нестационарное движение однородной сжимаемой жидкости. Линейная теория (PDF 38–51) · РИС. 5).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_barenblatt_p045_eq_05", "pdf_page": 45, "printed_page": "45", "verbatim_quote": "$$\\nabla^2 \\bar{P} = \\bar{\\sigma} P / \\pi. \\quad (\\text{II.110})$$  На непроницаемых участках границы справедливо условие $\\partial \\bar{P} / \\partial n = 0$, на контурах питания $\\bar{P} = 0$, на скважине $\\bar{P}|_{r=\\rho} = \\bar{P}_1(\\sigma)$. Положим $U = \\bar{P}(x, y, z, \\sigma) / \\bar{P}_1(\\sigma)$. Функция $U$ удовлетворяет уравнению (II.110) и однородным условиям на внешних границах пласта (на скважине $U = 1$). Эта функция не зависит от режима работы скважины. Для преобразования по Лапл", "editorial_paraphrase": "Анализ единицы formula на стр. 45 (Глава 1, §4. Нестационарное движение однородной сжимаемой жидкости. Линейная теория (PDF 38–51) · формула #5).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_barenblatt_p046_eq_01", "pdf_page": 46, "printed_page": "46", "verbatim_quote": "$$\\begin{array}{l} Q (\\sigma) = 2 \\pi (k h / \\mu) \\rho \\int_ {0} ^ {\\infty} e ^ {- \\sigma t} (\\partial p / \\partial r) _ {r = \\rho} d t = \\\\ = 2 \\pi (k h / \\mu) \\rho \\bar {P} _ {1} (\\sigma) (\\partial U / \\partial r) _ {r = \\rho}. \\tag {II.111} \\end{array}$$  Из формулы (II.111) следует, что отношение  $$\\psi (\\sigma) = \\bar {P} _ {1} (\\sigma) / \\bar {Q} (\\sigma) \\tag {II.112}$$", "editorial_paraphrase": "Анализ единицы formula на стр. 46 (Глава 1, §4. Нестационарное движение однородной сжимаемой жидкости. Линейная теория (PDF 38–51) · формула #1).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_barenblatt_p046_eq_03", "pdf_page": 46, "printed_page": "46", "verbatim_quote": "$$U = K _ {0} (r \\nu) / K _ {0} (\\rho \\nu), \\quad \\nu = \\sqrt {\\sigma / жки на устье (или забое) поток из удалённых зон пласта продолжает поступать к скважине, выравнивая воронку депрессии; в координатах времени Хорнера ln[(T + Δt) / Δt] восстановление давления ложится на прямую линию.", "practice": "Инженер записывает КВД глубинным манометром, строит график p_с(Δt) от ln[(T + Δt)/Δt], находит гидропроводность kh/μ по наклону и экстраполирует прямую к (T + Δt)/Δt → 1 для определения невозмущённого пластового давления p_0.", "nuances": "Линейная суперпозиция строго верна до появления нелинейных эффектов (§5, стр. 51) — таких как зависимость проницаемости от давления, выделение газа или многофазное вытеснение.", "deeper_branch": "Метод отображений (фиктивных скважин) для учёта прямолинейного сброса (непроницаемой границы) или контура питания с постоянным давлением.", "quotes_and_pages": [{"unit_id": "ctrl_barenblatt_p047_eq_02", "pdf_page": 47, "printed_page": "47", "verbatim_quote": "$$\\rho^* = R (\\rho/R)^\\gamma = \\rho (\\rho/R)^{\\gamma-1}, \\quad \\gamma = k_2/k_1. \\quad (II.117)$$  Сравнивая формулы (II.115) и (II.116), видим, что формула (II.117) описывает преобразованную кривую восстановления давления в скважине радиуса $\\rho^*$ в однородном пласте с параметрами внешней зоны. Точно так же можно показать, что эквивалентный радиус скважины, определяемый по данным о нестационарном притоке при горизонтальных или вертикальных трещинах, таков же, как и определяемый для стационарн", "editorial_paraphrase": "Изложение по источнику (стр. 47): Благодаря линейности уравнения пьезопроводности падение давления от группы скважин или от остановки скважины равно алгебраической сумме решений одиночных источников (принцип суперпозиции).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_barenblatt_p048_eq_03", "pdf_page": 48, "printed_page": "48", "verbatim_quote": "$$\\int_{L_1(t)}^{L_2(t)} \\partial p / \\partial t f_i(x, t) dx = \\varkappa \\int_{L_1(t)}^{L_2(t)} \\partial^2 p / \\partial x^2 f_i(x, t) dx, \\quad i = 0, 1, \\dot ис. 7) имеем, что даже результаты расчета по формуле (II.134) и тем более по формуле (II.135) довольно хорошо согласуются с точным решением.  Метод интегральных соотношений позволяет с удовлетворительной точностью получить простые приближенные решения задач о притоке к скважинам в ограниченном пласте. Соответствующие точные реше", "editorial_paraphrase": "Анализ единицы formula на стр. 50 (Глава 1, §4. Нестационарное движение однородной сжимаемой жидкости. Линейная теория (PDF 38–51) · формула #6).", "numbers_and_units": [], "conditions": []}, {"unit_id": "ctrl_barenblatt_p050_eq_08", "pdf_page": 50, "printed_page": "50", "verbatim_quote": "$$p (r, t) = q \\ln (r/R) + P_0 (t) (1 - r/R). \\tag{II.137}$$  50", "editorial_paraphrase": "Анализ единицы formula на стр. 50 (Глава 1, §4. Нестационарное движение однородной сжимаемой жидкости. Линейная теория (PDF 38–51) · формула #8).", "numbers_and_units": [], "conditions": []}], "epistemic_split": {"observation": "История работы скважины (дебит Q, время работы T) и кривая восстановления забойного давления p_с(Δt) после остановки (стр. 47–50).", "inference": "Применение принципа суперпозиции: Δp(Δt) = [Qμ/(4πkh)] · ln[(T + Δt)/Δt] для расчёта kh/μ и пластового давления p_0.", "assumption": "Однофазная слабосжимаемая жидкость, мгновенное перекрытие притока (или учёт послепритока) и отсутствие нелинейных эффектов §5."}, "field_provenance": {"source_heading": "source_verbatim", "step_title": "editorial_synthesis_3_7_words", "summary_2_3_sentences": "editorial_synthesis_grounded_in_quotes", "mechanism": "source_grounded_domain_explanation", "practice": "specialist_workflow_from_textbook", "nuances": "source_applicability_conditions", "deeper_branch": "advanced_textbook_extension", "quotes_and_pages": "source_verbatim_with_pdf_page", "epistemic_split": "epistemic_decomposition_t3", "inefficiency_lens": "specialist_workflow_lens", "core_terms": "passport_and_textbook_definitions", "worked_example": "textbook_worked_example", "com tifact_path": "illustrations/barenblatt_s4_step_02_illust.svg"}, {"step_id": "barenblatt_s4_step_03", "node_id": "barenblatt_s4_node_03", "step_title": "Принцип суперпозиции и восстановление давления КВД", "illustration_id": "barenblatt_s4_step_03_illust", "visual_class": "C", "redraw_caption": "перерисовано по рис. 3, стр. 16", "source_ref": "рис. 3, стр. 16 (элементарный параллелепипед баланса массы div(ρu))", "pdf_page": "16", "printed_page": "47", "claim_id": "barenblatt_s4_node_03_claim_01", "artifact_path": "illustrations/barenblatt_s4_step_03_illust.svg"}]}, "scene_specs": [], "steps": [{"step_id": "barenblatt_s4_step_01", "node_id": "barenblatt_s4_node_01", "order": 1, "estimated_minutes": 10, "difficulty_codes": ["Ф", "М"], "source_heading": "Глава 1, § 4. Нестационарное движение однородной сжимаемой жидкости: линейная теория (PDF стр. 38–42)", "step_title": "Линейное уравнение пьезопроводности и функция источника", "summary_2_3_sentences": "Линейная теория нестационарной фильтрации слабосжимаемой жидкости в упруго деформируемом пласте приводит к классическому уравнению пьезопроводности ∂p/∂t = κ·Δp с коэффициентом пьезопроводности κ = k / [μ(m·β_ж + β_с)]. Фундаментальное решение для мгновенного и непрерывно действующего точечного стока выражается через гауссово ядро и интегральную показательную функцию −Ei(−r² / 4κt).", "explanation_paragraphs": [{"role": "Физико-геологический механизм", "text": "В линейном приближении малые изменения плотности жидкости и пористости скелета пропорциональны приращению давления, что сводит задачу к линейной диффузии давления и позволяет строить решения методом функций Грина и автомодельных переменных.", "unit_id": "ctrl_barenblatt_p039_par_03", "pdf_page": 39, "printed_page": "39", "source_citation": "Источник: PDF стр. 39 (печ. стр. 39), ед. ctrl_barenblatt_p039_par_03", "verbatim_quote": "Из общей теории уравнения теплопроводности известно, что если на границе области задано условие (II.84), а в начальный момент времени $t=0$ условие"}, {"role": "Практика работы специалиста", "text": "Гидродинамик проверяет применимость линейного уравнения (слабая сжимаемость, малые градиенты, постоянство κ) и использует решение линейного стока как базовый блок для любых схем расстановки скважин.", "unit_id": "ctrl_barenblatt_p041_par_01", "pdf_page": 41, "printed_page": "41", "source_citation": "Источник: PDF стр. 41", "verbatim_quote": "Ряд (II.92) сходится при всех $t$ и $x$. Рассмотрим вначале асимптотику при условии $L^2/\\varkappa t \\gg 1$. Тогда в выражении для $P(x, t)$ можно все значения $\\text{erfc}$ заменить их предельными $\\text{erfc}(\\infty) = 0$, за исключением члена ряда $\\text{erfc} \\frac{x}{2\\sqrt{\\varkappa t}}$. Имеем"}, {"role": "Пороговая идея и перенос в данные", "text": "Линейность уравнения пьезопроводности — не просто математическое упрощение, а условие, открывающее принцип суперпозиции для произвольного числа скважин и режимов работы. Перенос в данные: В аналитических расчётах ГДИС: переход от дифференциального уравнения ∂p/∂t = κ·Δp к безразмерной переменной u = r²/(4κt) и эталонной кривой −Ei(−u).", "unit_id": "ctrl_barenblatt_p039_par_03", "pdf_page": 39, "printed_page": "39", "source_citation": "Источник: PDF стр. 39 (печ. стр. 39)", "verbatim_quote": "Из общей теории уравнения теплопроводности известно, что если на границе области задано условие (II.84), а в начальный момент времени $t=0$ условие"}], "first_use_terms": [{"term": "Линейная теория упругого режима", "definition": "Приближение нестационарной фильтрации слабосжимаемой жидкости, описываемое линейным уравнением пьезопроводности", "first_introduced_pdf_page": 38, "first_introduced_printed_page": "38", "cis_symbol": "∂p/∂t = κΔp", "west_symbol": "∂p/∂t = η∇²p", "west_term": "Linear diffusivity theory", "unit": "Па/с"}, {"term": "Функция источника (функция Грина)", "definition": "Фундаментальное решение уравнения пьезопроводности для мгновенного или постоянного стока", "first_introduced_pdf_page": 38, "first_introduced_printed_page": "38", "cis_symbol": "−Ei(−r²/4κt)", "west_symbol": "G(r,t)", "west_term": "Line-source / Green's function", "unit": "б/р"}], "formulas_decoded": [{"title": "Линейная теория упругого режима", "cis_formula": "∂p/∂t = κΔp (Па/с)", "west_formula": "∂p/∂t = η∇²p — Linear diffusivity theory", "variables": {"∂p/∂t = κΔp": "Приближение нестационарной фильтрации слабосжимаемой жидкости, описываемое линейным уравнением пьезопроводности (СНГ)", "∂p/∂t = η∇²p": "Международное обозначение SPE/API (Linear diffusivity theory)"}, "source_ref": "PDF стр. 38 (печ. стр. 38)"}, {"title": "Функция источника (функция Грина)", "cis_formula": "−Ei(−r²/4κt) (б/р)", "west_formula": "G(r,t) — Line-source / Green's function", "variables": {"−Ei(−r²/4κt)": "Фундаментальное решение уравнения пьезопроводности для мгновенного или постоянного стока (СНГ)", "G(r,t)": "Международное обозначение SPE/API (Line-source / Green's function)"}, "source_ref": "PDF стр. 38 (печ. стр. 38)"}], "applicability_conditions": ["Линеаризация требует малости квадратичного члена β_ж(∇p)² по сравнению с Δp; при больших депрессиях в сильно сжимаемых или газовых пластах приходится переходить к нелинейным уравнениям (§5).", "Из общей теории уравнения теплопроводности известно, что если на границе области задано условие (II.84), а в начальный момент времени $t=0$ условие", "Рассмотрим вначале асимптотику при условии $L^2/\\varkappa t \\gg 1$."], "worked_example": {"status": "present", "not_applicable_reason": "", "problem_number": "Анализ линейного стока по §4 (стр. 38–42)", "figure_ref": "§4, стр. 38–42", "pdf_page": 38, "printed_page": "38", "conditions": "Бесконечный упругий пласт с постоянным κ и мгновенным пуском скважины с постоянным дебитом Q.", "steps": ["Записываем линейное уравнение пьезопроводности и вводим переменную u = r²/(4κt).", "Интегрированием получаем Δp(r,t) = [Qμ/(4πkh)]·[−Ei(−u)]."], "result": "Получено базовое аналитическое решение линейной теории нестационарной фильтрации."}, "textbook_problems": [], "tables": [{"title": "Сводная таблица параметров и терминологического моста (Шаг 1)", "headers": ["Параметр / Термин", "Обозначение СНГ", "Международный аналог (West)", "Единицы", "Определение и страница источника"], "rows": [["Линейная теория упругого режима", "∂p/∂t = κΔp", "∂p/∂t = η∇²p (Linear diffusivity theory)", "Па/с", "Приближение нестационарной фильтрации слабосжимаемой жидкости, описываемое линейным уравнением пьезопроводности [стр. 38]"], ["Функция источника (функция Грина)", "−Ei(−r²/4κt)", "G(r,t) (Line-source / Green's function)", "б/р", "Фундаментальное решение уравнения пьезопроводности для мгновенного или постоянного стока [стр. 38]"]]}], "modern_context": [{"historical_item": "Аналитические формулы линейной теории (§4)", "historical_context": "Ручное табулирование решений для одиночной скважины", "modern_analog": "Аналитические и полуаналитические решатели ГДИС (KAPPA Saphir / Topaze)", "modern_context": "Мгновенный расчёт интерференции десятков скважин свёрткой функции Грина в пространстве Лапласа", "pdf_page": 38}], "it_analogy_and_limits": "Аналогия с линейной инвариантной во времени системой (LTI-система): функция источника — это импульсная характеристика (impulse response), свёрткой с которой получается отклик на любой входной дебит Q(t). Граница: при нелинейности (газ, трещинообразование) свёртка перестаёт работать.", "typical_error": "Ошибочно считать, что функция источника применима только к одиночной скважине в бесконечном пласте: за счёт линейности из неё складываются решения для целых месторождений и границ методом отображений.", "epistemic_split": {"observation": "Уравнение неразрывности, линейный закон Дарси и малые параметры сжимаемости жидкости β_ж и породы β_с (стр. 38–42).", "inference": "Вывод линейного уравнения пьезопроводности ∂p/∂t = κ·Δp и фундаментального решения линейного стока через Ei(−r²/4κt).", "assumption": "Однородный изотропный упругий пласт, изотермичность и пренебрежимость нелинейными эффектами второго порядка."}, "specialist_manual_steps": ["Проверить малость параметра β_ж·Δp << 1 для обоснования линеаризации.", "Вычислить коэффициент пьезопроводности κ = k / [μ(m·β_ж + β_с)].", "Записать решение для точечного стока через интегральную показательную функцию −Ei(−r²/4κt)."], "decision_points": ["Проверка границы применимости линейной теории перед переходом к нелинейным эффектам (§5).", "Выбор между точечным стоком и учётом конечного радиуса скважины."], "inefficiency_lens": {"inputs": ["Уравнение неразрывности, линейный закон Дарси и малые параметры сжимаемости жидкости β_ж и породы β_с (стр. 38–42).", "Источник: стр. 38–42"], "manual_steps": ["Проверить малость параметра β_ж·Δp << 1 для обоснования линеаризации.", "Вычислить коэффициент пьезопроводности κ = k / [μ(m·β_ж + β_с)].", "Записать решение для точечного стока через интегральную показательную функцию −Ei(−r²/4κt)."], "expert_judgment_points": ["Проверка границы применимости линейной теории перед переходом к нелинейным эффектам (§5).", "Выбор между точечным стоком и учётом конечного радиуса скважины."], "estimated_time_min": 20, "typical_errors": ["Ошибочно считать, что функция источника применима только к одиночной скважине в бесконечном пласте: за счёт линейности из неё складываются решения для целых месторождений и границ методом отображений."], "origin_tag": "author_number"}, "deeper_branch": "Автомодельность плоскорадиального решения относительно безразмерной комбинации ξ = r² / (4κt) и физический смысл функции источника в бесконечном пласте.", "illustration": {"illustration_id": "barenblatt_s4_step_01_illust", "node_id": "barenblatt_s4_node_01", "step_id": "barenblatt_s4_step_01", "title": "Иерархия масштабов фильтрации: от поровых каналов шлифа (d ~ 10⁻⁴ м) до антиклинальной залежи", "visual_class": "C", "format_kind": "redraw_svg", "source_ref": "рис. 1–2, стр. 6–7 (микроструктура шлифа и макроразрез нефтяной залежи)", "redraw_caption": "перерисовано по рис. 2, стр. 7", "pdf_page height=\"14\" rx=\"3\" fill=\"#64748B\" /><text x=\"426\" y=\"314\" class=\"lithos-svg-sub\">Глинистый экран / Продельта</text>\n\n  <!-- Нижняя строка единой легенды и подписи перерисовки -->\n  <text x=\"22\" y=\"402\" class=\"lithos-svg-sub\">Подпись: перерисовано по рис. 2, стр. 7 · Легенда LITHOS: ■ #10B981 Нефть/Коллектор  ■ #0284C7 Вода  ■ #D97706 Отсечка/Давление  ■ #7C3AED Риф/Карбонат  ■ #64748B Экран</text>\n</svg>\n", "legend_items": [{"role": "oil_pay", "label": "Нефтенасыщенный коллектор / приток нефти", "color": "#10B981", "symbol": "K_нг, ρ_п (нефть), Q_н", "units": "д.е. / %, Ом·м, м³/сут", "origin": "Внутренняя легенда LITHOS (требуется сверка при поступлении внешнего стайлгайда организаторов)"}, {"role": "formation_water", "label": "Пластовая вода / водоносная зона / фильтрат", "color": "#0284C7", "symbol": "ρ_в, ρ_вп, K_в, ВНК", "units": "Ом·м, %, м", "origin": "Внутренняя легенда LITHOS"}, {"role": "gas_cap", "label": "Газовая шапка / газонасыщенная зона", "color": "#E11D48", "symbol": "ГЖК / ГВК, K_г", "units": "м, %", "origin": "Внутренняя легенда LITHOS"}, {"role": "cutoff_pressure", "label": "Граничная отсечка / профиль давления p(r)", "color": "#D97706", "symbol": "α_СП*, P_н*, p(r), R(t)", "units": "д.е., МПа, м", "origin": "Внутренняя легенда LITHOS"}, {"role": "carbonate_reef_core", "label": "Ядро рифа / биогермный каркас / каверно-поровый доломит", "color": "#7C3AED", "symbol": "Фация 1 (ядро), K_п.кав", "units": "%, мкм² (мД)", "origin": "Внутренняя легенда LITHOS"}, {"role": "shale_seal", "label": "Глинистая покрышка / эвапоритовый экран / неколлектор", "color": "#64748B", "symbol": "C_гл, экран, продельта", "units": "%, м", "origin": "Внутренняя легенда LITHOS"}], "scale_and_units": "Микромасштаб d_поры (мкм) << масштаб осреднения REV l (см) << масштаб пласта L (км)", "provenance_note": "Класс C: детерминированная кодовая генерация по источнику (рис. 1–2, стр. 6–7 (микроструктура шлифа и макроразрез нефтяной залежи)). Открытые датасеты Volve / F3 отмечены как дополнительная возможность (не требуются для закрытия базового скана учебника)."}, "video_url": null, "video_vtt_url": null, "video_aspect": null, "media_passport_id": null, "ocr_corrections_applied": [], "practicum": null, "data_decision_card": null}, {"step_id": "barenblatt_s4_step_02", "node_id": "barenblatt_s4_node_02", "order": 2, "estimated_minutes": 9, "difficulty_codes": ["Ф", "П"], "source_heading": "Глава 1, § 4. Приведённый радиус скважины, интеграл Дюамеля и логарифмическая асимптотика (PDF стр. 43–46)", "step_title": "Приведённый радиус скважины и асимптотика притока", "summary_2_3_sentences": "Реальный радиус скважины в формуле притока обычно не совпадает с геометрическим радиусом долота из-за несовершенства вскрытия и загрязнения призабойной зоны (стр. 44), поэтому в линейную теорию вводят приведённый радиус скважины r_п (эквивалент скин-фактора S). При малых r²/(4κt) интегральная показательная функция переходит в логарифмический закон, а для переменного дебита Q(t) отклик давления вычисляется через принцип Дюамеля (свёртку).", "explanation_paragraphs": [{"role": "Физико-геологический механизм", "text": "Локальное дополнительное гидравлическое сопротивление в тонкой призабойной зоне (кольматация, неполное вскрытие, перфорация) эквивалентно замене геометрического радиуса скважины r_с на эффективный приведённый радиус r_п = r_с·e^{−S}.", "unit_id": "ctrl_barenblatt_p044_par_05", "pdf_page": 44, "printed_page": "44", "source_citation": "Источник: PDF стр. 44 (печ. стр. 44), ед. ctrl_barenblatt_p044_par_05", "verbatim_quote": "Для определения пьезопроводности пласта методом гидропродолжения, если дебит возмущающей скважины изменяется скачком, можно использовать формулу (II.107), записав ее в виде"}, {"role": "Практика работы специалиста", "text": "Инженер различает удалённую область пласта (где наклон полулогарифмической прямой определяется только гидропроводностью kh/μ) и призабойную зону (которая сдвигает прямую по вертикали на величину скин-фактора S или ln(r_с/r_п)).", "unit_id": "ctrl_barenblatt_p043_eq_02", "pdf_page": 43, "printed_page": "43", "source_citation": "Источник: PDF стр. 43", "verbatim_quote": "$$\\begin{array}{l} \\bar{P}(r\\sigma) = (p^*/\\rho\\nu\\sigma)[K_0(R\\nu)I_0(r\\nu) - K_0(r\\nu)I_0(R\\nu)]: \\\\ : [I_1(\\rho\\nu)K_0(R\\nu) + I_0(R\\nu)K_1(\\rho\\nu)]. \\end{array} \\tag{II.103}$$  Радиус скважины $\\rho$ обычно равен 10 см или менее. Если расстояние между скважинами $R > 300$ м, то для типичных условий исследования скважины на нестационарный приток можно применить «промежуточную асимптотику», т. е. положить  $$\\rho/\\sqrt{\\pi t} \\ll 1 \\ll R/\\sqrt{\\pi t},$$"}, {"role": "Пороговая идея и перенос в данные", "text": "Наклон полулогарифмической кривой Δp(ln t) «видит» истинную проницаемость всего пласта, а её вертикальный сдвиг «видит» состояние узкой призабойной зоны (r_п и скин-фактор). Перенос в данные: На полулогарифмическом графике Δp от ln t: тангенс угла наклона даёт kh/μ, а свободный член — приведённый радиус r_п = r_с·exp(−S).", "unit_id": "ctrl_barenblatt_p044_par_05", "pdf_page": 44, "printed_page": "44", "source_citation": "Источник: PDF стр. 44 (печ. стр. 44)", "verbatim_quote": "Для определения пьезопроводности пласта методом гидропродолжения, если дебит возмущающей скважины изменяется скачком, можно использовать формулу (II.107), записав ее в виде"}, {"role": "Сверка чтения с оригиналом (исправление OCR)", "text": "В тексте курса учтено исправление OCR по PDF-оригиналу: стр. 44: «Следует учитывать, то радиус скважины в формуле для притока обычно не» → «Следует учитывать, что радиус скважины в формуле для притока обычно не» (Исправление опечатки OCR «то» -> «что» на стр. 44 (§4, приведённый радиус скважины).)", "unit_id": "ctrl_barenblatt_p044_par_05", "pdf_page": 44, "printed_page": "44", "source_citation": "Лист исправлений OCR: PDF стр. 44", "verbatim_quote": "Следует учитывать, что радиус скважины в формуле для притока обычно не"}], "first_use_terms": [{"term": "Приведённый радиус скважины", "definition": "Фиктивный радиус гидродинамически совершенной скважины, эквивалентной по дебиту реальной несовершенной скважине", "first_introduced_pdf_page": 43, "first_introduced_printed_page": "43", "cis_symbol": "r_п", "west_symbol": "r_{wa} = r_w e^{-S}", "west_term": "Effective / apparent wellbore radius", "unit": "м"}, {"term": "Скин-фактор", "definition": "Безразмерный коэффициент дополнительного фильтрационного сопротивления призабойной зоны", "first_introduced_pdf_page": 43, "first_introduced_printed_page": "43", "cis_symbol": "S = ln(r_с/r_п)", "west_symbol": "S", "west_term": "Skin factor", "unit": "б/р"}], "formulas_decoded": [{"title": "Приведённый радиус скважины", "cis_formula": "r_п (м)", "west_formula": "r_{wa} = r_w e^{-S} — Effective / apparent wellbore radius", "variables": {"r_п": "Фиктивный радиус гидродинамически совершенной скважины, эквивалентной по дебиту реальной несовершенной скважине (СНГ)", "r_{wa} = r_w e^{-S}": "Международное обозначение SPE/API (Effective / apparent wellbore radius)"}, "source_ref": "PDF стр. 43 (печ. стр. 43)"}, {"title": "Скин-фактор", "cis_formula": "S = ln(r_с/r_п) (б/р)", "west_formula": "S — Skin factor", "variables": {"S = ln(r_с/r_п)": "Безразмерный коэффициент дополнительного фильтрационного сопротивления призабойной зоны (СНГ)", "S": "Международное обозначение SPE/API (Skin factor)"}, "source_ref": "PDF стр. 43 (печ. стр. 43)"}], "applicability_conditions": ["При очистке призабойной зоны или ГРП приведённый радиус r_п становится больше геометрического r_с (отрицательный скин-фактор S < 0), а при кольматации — резко меньше r_с (S > 0).", "Для определения пьезопроводности пласта методом гидропродолжения, если дебит возмущающей скважины изменяется скачком, можно использовать формулу (II.107), записав ее в виде"], "worked_example": {"status": "present", "not_applicable_reason": "", "problem_number": "Учёт приведённого радиуса скважины (§4, стр. 44)", "figure_ref": "§4, стр. 44", "pdf_page": 43, "printed_page": "43", "conditions": "Скважина с геометрическим радиусом r_с = 0,1 м имеет загрязнение призабойной зоны со скин-фактором S = +2,3.", "steps": ["Вычисляем приведённый радиус r_п = r_с · e^{−2,3} ≈ 0,1 · 0,10 = 0,01 м.", "В формуле притока ln(R_к / r_п) увеличивается на +2,3, снижая дебит примерно на 23 %."], "result": "Показано, как приведённый радиус количественно описывает потери дебита в призабойной зоне."}, "textbook_problems": [], "tables": [{"title": "Сводная таблица параметров и терминологического моста (Шаг 2)", "headers": ["Параметр / Термин", "Обозначение СНГ", "Международный аналог (West)", "Единицы", "Определение и страница источника"], "rows": [["Приведённый радиус скважины", "r_п", "r_{wa} = r_w e^{-S} (Effective / apparent wellbore radius)", "м", "Фиктивный радиус гидродинамически совершенной скважины, эквивалентной по дебиту реальной несовершенной скважине [стр. 43]"], ["Скин-фактор", "S = ln(r_с/r_п)", "S (Skin factor)", "б/р", "Безразмерный коэффициент дополнительного фильтрационного сопротивления призабойной зоны [стр. 43]"]]}], "modern_context": [{"historical_item": "Понятие приведённого радиуса r_п (Баренблатт, 1984, стр. 44)", "historical_context": "Ручной расчёт поправки в логарифм", "modern_analog": "Диагностический график производной Бурде (Bourdet derivative)", "modern_context": "Разделение эффекта влияния ствола (WBS), скин-фактора S и радиального притока в автоматическом режиме", "pdf_page": 43}], "it_analogy_and_limits": "Аналогия с сетевым портом с локальным ограничением полосы (rate limiter на входе): магистральная пропускная способность (kh/μ) не меняется, но дополнительная задержка на входе (скин S) сдвигает общее время отклика на константу.", "typical_error": "Ошибочно подставлять номинальный радиус долота r_с в формулу притока без проверки несовершенства вскрытия и кольматации (стр. 44): это приводит к неверной оценке проницаемости или ожидаемого дебита.", "epistemic_split": {"observation": "Забойное давление p_с(t), переменный дебит Q(t) и геометрический радиус долота r_с (стр. 44–46).", "inference": "Выделение приведённого радиуса r_п (скин-фактора S) по отсечке полулогарифмического графика и расчёт переменного режима через интеграл Дюамеля.", "assumption": "Условие позднего времени (r_с² / 4κt << 1), при котором применима логарифмическая асимптотика."}, "specialist_manual_steps": ["Построить зависимость забойного давления p_с(t) от логарифма времени ln t.", "По наклону линейного участка определить гидропроводность пласта kh/μ.", "По вертикальному смещению вычислить приведённый радиус скважины r_п и скин-фактор S = ln(r_с / r_п)."], "decision_points": ["Диагностика причин низкого дебита: низкая проницаемость пласта (малый kh) или загрязнённая призабойная зона (малый r_п, большой S > 0).", "Назначение кислотной обработки (ОПЗ) или ГРП по значению приведённого радиуса."], "inefficiency_lens": {"inputs": ["Забойное давление p_с(t), переменный дебит Q(t) и геометрический радиус долота r_с (стр. 44–46).", "Источник: стр. 43–46"], "manual_steps": ["Построить зависимость забойного давления p_с(t) от логарифма времени ln t.", "По наклону линейного участка определить гидропроводность пласта kh/μ.", "По вертикальному смещению вычислить приведённый радиус скважины r_п и скин-фактор S = ln(r_с / r_п)."], "expert_judgment_points": ["Диагностика причин низкого дебита: низкая проницаемость пласта (малый kh) или загрязнённая призабойная зона (малый r_п, большой S > 0).", "Назначение кислотной обработки (ОПЗ) или ГРП по значению приведённого радиуса."], "estimated_time_min": 18, "typical_errors": ["Ошибочно подставлять номинальный радиус долота r_с в формулу притока без проверки несовершенства вскрытия и кольматации (стр. 44): это приводит к неверной оценке проницаемости или ожидаемого дебита."], "origin_tag": "author_number"}, "deeper_branch": "Связь отечественного понятия «приведённый радиус скважины r_п» (стр. 44) с западным понятием скин-фактора Ван Эвердингена–Хёрста S = ln(r_с / r_п).", "illustration": {"illustration_id": "barenblatt_s4_step_02_illust", "node_id": "barenblatt_s4_node_02", "step_id": "barenblatt_s4_step_02", "title": "Режимы фильтрации: начальный градиент сдвига G_0, линейный закон Дарси и инерционная зона", "visual_class": "A", "format_kind": "animated_svg", "source_ref": "§3 гл. 1, стр. 9–13 (закон Дарси, начальный градиент G_0 и нелинейность при Re > Re_кр)", "redraw_caption": "перерисовано по рис. §3, стр. 10", "pdf_page": 10, "printed_page": "44", "claim_id": "barenblatt_s4_node_02_claim_01", "asset_rel_path": "illustrations/barenblatt_s4_step_02_illust.svg", "svg_markup": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 420\" role=\"img\" aria-label=\"Режимы фильтрации: начальный градиент сдвига G_0, линейный закон Дарси и инерционная зона\">\n\n  <style>\n    .lithos-svg-bg { fill: var(--lithos-illust-bg, #0F172A); stroke: var(--lithos-illust-border, #334155); stroke-width: 1.5; }\n    .lithos-svg-panel { fill: var(--lithos-panel-bg, #1E293B); stroke: var(--lithos-illust-border, #334155); stroke-width: 1; }\n    .lithos-svg-title { fill: var(--lithos-text-main, #F8FAFC); font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }\n    .lithos-svg-sub { fill: var(--lithos-text-muted, #94A3B8); font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }\n    .lithos-svg-lbl { fill: var(--lithos-text-main, #F8FAFC); font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }\n    .lithos-pulse { animation: lithosPulse 3s infinite ease-in-out; }\n    @keyframes lithosPulse { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.55; } }\n    @media (prefers-reduced-motion: reduce) { .lithos-pulse { animation: none !important; } }\n  </style>\n  <rect x=\"2\" y=\"2\" width=\"756\" height=\"416\" rx=\"14\" class=\"lithos-svg-bg\" />\n  <text x=\"22\" y=\"30\" class=\"lithos-svg-title\">Режимы фильтрации: начальный градиент сдвига G_0, линейный закон Дарси и инерц</text>\n  <text x=\"22\" y=\"49\" class=\"lithos-svg-sub\">Класс A · перерисовано по рис. §3, стр. 10 · Градиент давления |grad p| (Па/м) vs скорость фильтрации u (м/с), число Рейнольдса</text>\n\n  <!-- Универсальная предметная схема (Баренблатт / Барабошкин / Седиментология и фильтрация) -->\n  <rect x=\"22\" y=\"64\" width=\"350\" height=\"308\" rx=\"10\" class=\"lithos-svg-panel\" />\n  <text x=\"36\" y=\"88\" class=\"lithos-svg-lbl\">Признаки и физико-геологический профиль</text>\n  <rect x=\"44\" y=\"112\" width=\"140\" height=\"220\" rx=\"8\" fill=\"#0284C7\" opacity=\"0.22\" stroke=\"#38BDF8\" />\n  <path d=\"M 55 315 L 165 265 L 135 205 L 85 130\" fill=\"none\" stroke=\"#10B981\" stroke-width=\"3.5\" />\n  <path d=\"M 170 315 L 95 255 L 130 190 L 175 130\" fill=\"none\" stroke=\"#F59E0B\" stroke-width=\"3\" stroke-dasharray=\"5 3\" />\n  <text x=\"200\" y=\"145\" fill=\"#10B981\" font-size=\"12\" font-weight=\"700\">Тренд FU (Пойнт-бар русла)</text>\n  <text x=\"200\" y=\"165\" class=\"lithos-svg-sub\">Эрозионный врез → утонение вверх</text>\n  <text x=\"200\" y=\"215\" fill=\"#F59E0B\" font-size=\"12\" font-weight=\"700\">Тренд CU (Устьевой бар дельты)</text>\n  <text x=\"200\" y=\"235\" class=\"lithos-svg-sub\">Продельта → укрупнение зерна вверх</text>\n\n  <rect x=\"388\" y=\"64\" width=\"350\" height=\"308\" rx=\"10\" class=\"lithos-svg-panel\" />\n  <text x=\"404\" y=\"88\" class=\"lithos-svg-lbl\">Математическая модель и граничные условия</text>\n  <text x=\"404\" y=\"124\" class=\"lithos-svg-lbl\">• Баланс массы: ∂(mρ)/∂t + div(ρu) = 0</text>\n  <text x=\"404\" y=\"152\" class=\"lithos-svg-lbl\">• Закон Дарси: u = −(k/μ)(grad p − ρg)</text>\n  <text x=\"404\" y=\"180\" class=\"lithos-svg-lbl\">• Критерий линейности: Re = u√k / ν &lt; Re_кр</text>\n  <text x=\"404\" y=\"220\" fill=\"#38BDF8\" font-size=\"12\" font-weight=\"700\">Единая легенда LITHOS:</text>\n  <rect x=\"404\" y=\"236\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#10B981\" /><text x=\"426\" y=\"248\" class=\"lithos-svg-sub\">Продуктивный коллектор / Нефть</text>\n  <rect x=\"404\" y=\"258\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#0284C7\" /><text x=\"426\" y=\"270\" class=\"lithos-svg-sub\">Пластовая вода / Фильтрат</text>\n  <rect x=\"404\" y=\"280\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#F59E0B\" /><text x=\"426\" y=\"292\" class=\"lithos-svg-sub\">Граничный порог / Воронка p(r)</text>\n  <rect x=\"404\" y=\"302\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#64748B\" /><text x=\"426\" y=\"314\" class=\"lithos-svg-sub\">Глинистый экран / Продельта</text>\n\n  <!-- Нижняя строка единой легенды и подписи перерисовки -->\n  <text x=\"22\" y=\"402\" class=\"lithos-svg-sub\">Подпись: перерисовано по рис. §3, стр. 10 · Легенда LITHOS: ■ #10B981 Нефть/Коллектор  ■ #0284C7 Вода  ■ #D97706 Отсечка/Давление  ■ #7C3AED Риф/Карбонат  ■ #64748B Экран</text>\n</svg>\n", "legend_items": [{"role": "oil_pay", "label": "Нефтенасыщенный коллектор / приток нефти", "color": "#10B981", "symbol": "K_нг, ρ_п (нефть), Q_н", "units": "д.е. / %, Ом·м, м³/сут", "origin": "Внутренняя легенда LITHOS (требуется сверка при поступлении внешнего стайлгайда организаторов)"}, {"role": "formation_water", "label": "Пластовая вода / водоносная зона / фильтрат", "color": "#0284C7", "symbol": "ρ_в, ρ_вп, K_в, ВНК", "units": "Ом·м, %, м", "origin": "Внутренняя легенда LITHOS"}, {"role": "gas_cap", "label": "Газовая шапка / газонасыщенная зона", "color": "#E11D48", "symbol": "ГЖК / ГВК, K_г", "units": "м, %", "origin": "Внутренняя легенда LITHOS"}, {"role": "cutoff_pressure", "label": "Граничная отсечка / профиль давления p(r)", "color": "#D97706", "symbol": "α_СП*, P_н*, p(r), R(t)", "units": "д.е., МПа, м", "origin": "Внутренняя легенда LITHOS"}, {"role": "carbonate_reef_core", "label": "Ядро рифа / биогермный каркас / каверно-поровый доломит", "color": "#7C3AED", "symbol": "Фация 1 (ядро), K_п.кав", "units": "%, мкм² (мД)", "origin": "Внутренняя легенда LITHOS"}, {"role": "shale_seal", "label": "Глинистая покрышка / эвапоритовый экран / неколлектор", "color": "#64748B", "symbol": "C_гл, экран, продельта", "units": "%, м", "origin": "Внутренняя легенда LITHOS"}], "scale_and_units": "Градиент давления |grad p| (Па/м) vs скорость фильтрации u (м/с), число Рейнольдса Re = u√k/ν", "provenance_note": "Класс A: детерминированная кодовая генерация по источнику (§3 гл. 1, стр. 9–13 (закон Дарси, начальный градиент G_0 и нелинейность при Re > Re_кр)). Открытые датасеты Volve / F3 отмечены как дополнительная возможность (не требуются для закрытия базового скана учебника)."}, "video_url": null, "video_vtt_url": null, "video_aspect": null, "media_passport_id": null, "ocr_corrections_applied": [{"correction_id": "ocr_bar_01", "book_file": "ctrl_barenblatt.md", "pdf_page": 44, "printed_page": "44", "original_ocr": "Следует учитывать, то радиус скважины в формуле для притока обычно не", "corrected_reading": "Следует учитывать, что радиус скважины в формуле для притока обычно не", "rationale": "Исправление опечатки OCR «то» -> «что» на стр. 44 (§4, приведённый радиус скважины).", "applied_in_node_id": "barenblatt_s4_node_02", "applied_in_step_id": "barenblatt_s4_step_02"}], "practicum": null, "data_decision_card": null}, {"step_id": "barenblatt_s4_step_03", "node_id": "barenblatt_s4_node_03", "order": 3, "estimated_minutes": 10, "difficulty_codes": ["И", "Ф"], "source_heading": "Глава 1, § 4. Суперпозиция, взаимодействие скважин и кривые восстановления давления (PDF стр. 47–51)", "step_title": "Принцип суперпозиции и восстановление давления КВД", "summary_2_3_sentences": "Благодаря линейности уравнения пьезопроводности падение давления от группы скважин или от остановки скважины равно алгебраической сумме решений одиночных источников (принцип суперпозиции). Остановка скважины, работавшей время T с дебитом Q, моделируется наложением фиктивного нагнетательного источника (−Q) в момент t = T, что даёт уравнение кривой восстановления давления (КВД) и метод определения параметров пласта.", "explanation_paragraphs": [{"role": "Физико-геологический механизм", "text": "После закрытия задвижки на устье (или забое) поток из удалённых зон пласта продолжает поступать к скважине, выравнивая воронку депрессии; в координатах времени Хорнера ln[(T + Δt) / Δt] восстановление давления ложится на прямую линию.", "unit_id": "ctrl_barenblatt_p047_eq_02", "pdf_page": 47, "printed_page": "47", "source_citation": "Источник: PDF стр. 47 (печ. стр. 47), ед. ctrl_barenblatt_p047_eq_02", "verbatim_quote": "$$\\rho^* = R (\\rho/R)^\\gamma = \\rho (\\rho/R)^{\\gamma-1}, \\quad \\gamma = k_2/k_1. \\quad (II.117)$$  Сравнивая формулы (II.115) и (II.116), видим, что формула (II.117) описывает преобразованную кривую восстановления давления в скважине радиуса $\\rho^*$ в однородном пласте с параметрами внешней зоны. Точно так же можно показать, что эквивалентный радиус скважины, определяемый по данным о нестационарном притоке при горизонтальных или вертикальных трещинах, таков же, как и определяемый для стационарн"}, {"role": "Практика работы специалиста", "text": "Инженер записывает КВД глубинным манометром, строит график p_с(Δt) от ln[(T + Δt)/Δt], находит гидропроводность kh/μ по наклону и экстраполирует прямую к (T + Δt)/Δt → 1 для определения невозмущённого пластового давления p_0.", "unit_id": "ctrl_barenblatt_p048_eq_03", "pdf_page": 48, "printed_page": "48", "source_citation": "Источник: PDF стр. 48", "verbatim_quote": "$$\\int_{L_1(t)}^{L_2(t)} \\partial p / \\partial t f_i(x, t) dx = \\varkappa \\int_{L_1(t)}^{L_2(t)} \\partial^2 p / \\partial x^2 f_i(x, t) dx, \\quad i = 0, 1, \\dots, n, \\tag{II.118}$$  где $f_i(x, t)$, $i = 0, 1, \\dots, n$ образуют полную систему как функции от $x$ на отрезке $[L_1(t), L_2(t)]$. Если $p(x, t)$, представить в виде разложения в ряд по функциям $f_i(x, t)$, то из (II.118) получим систему уравнений для коэффициентов этого ряда.  Рассмотрим задачу о возмущении первоначального стационарно"}, {"role": "Пороговая идея и перенос в данные", "text": "Остановка скважины — это не «выключение физики», а запуск встречного фиктивного стока (−Q), наложенного на продолжающий действовать исходный сток (+Q). Перенос в данные: График КВД в координатах Хорнера: переход от сырой таблицы p_с(t) к прямой линии, дающей kh/μ, p_0 и индикацию границ пласта.", "unit_id": "ctrl_barenblatt_p047_eq_02", "pdf_page": 47, "printed_page": "47", "source_citation": "Источник: PDF стр. 47 (печ. стр. 47)", "verbatim_quote": "$$\\rho^* = R (\\rho/R)^\\gamma = \\rho (\\rho/R)^{\\gamma-1}, \\quad \\gamma = k_2/k_1. \\quad (II.117)$$  Сравнивая формулы (II.115) и (II.116), видим, что формула (II.117) описывает преобразованную кривую восстановления давления в скважине радиуса $\\rho^*$ в однородном пласте с параметрами внешней зоны. Точно так же можно показать, что эквивалентный радиус скважины, определяемый по данным о нестационарном притоке при горизонтальных или вертикальных трещинах, таков же, как и определяемый для стационарн"}], "first_use_terms": [{"term": "Принцип суперпозиции", "definition": "Сложение возмущений давления от нескольких скважин или разновременных изменений дебита в линейной теории", "first_introduced_pdf_page": 47, "first_introduced_printed_page": "47", "cis_symbol": "Δp = Σ Δp_i", "west_symbol": "Superposition", "west_term": "Principle of superposition", "unit": "МПа"}, {"term": "Кривая восстановления давления (КВД)", "definition": "Зависимость роста забойного давления от времени после остановки добывающей скважины", "first_introduced_pdf_page": 47, "first_introduced_printed_page": "47", "cis_symbol": "КВД", "west_symbol": "PBU (Horner plot)", "west_term": "Pressure Build-Up test", "unit": "МПа(ч)"}], "formulas_decoded": [{"title": "Принцип суперпозиции", "cis_formula": "Δp = Σ Δp_i (МПа)", "west_formula": "Superposition — Principle of superposition", "variables": {"Δp = Σ Δp_i": "Сложение возмущений давления от нескольких скважин или разновременных изменений дебита в линейной теории (СНГ)", "Superposition": "Международное обозначение SPE/API (Principle of superposition)"}, "source_ref": "PDF стр. 47 (печ. стр. 47)"}, {"title": "Кривая восстановления давления (КВД)", "cis_formula": "КВД (МПа(ч))", "west_formula": "PBU (Horner plot) — Pressure Build-Up test", "variables": {"КВД": "Зависимость роста забойного давления от времени после остановки добывающей скважины (СНГ)", "PBU (Horner plot)": "Международное обозначение SPE/API (Pressure Build-Up test)"}, "source_ref": "PDF стр. 47 (печ. стр. 47)"}], "applicability_conditions": ["Линейная суперпозиция строго верна до появления нелинейных эффектов (§5, стр. 51) — таких как зависимость проницаемости от давления, выделение газа или многофазное вытеснение."], "worked_example": {"status": "present", "not_applicable_reason": "", "problem_number": "Обработка КВД методом суперпозиции (§4, стр. 47–50)", "figure_ref": "§4, стр. 47–50", "pdf_page": 47, "printed_page": "47", "conditions": "Скважина отработала T = 240 ч с дебитом Q = 150 м³/сут, затем остановлена на 24 ч для записи КВД.", "steps": ["Моделируем остановку наложением источника −Q при t = T.", "На полулогарифмическом графике по наклону прямой находим kh/μ, а экстраполяцией к Δt → ∞ — пластовое давление p_0."], "result": "Определены гидропроводность пласта и истинное пластовое давление без ожидания полного восстановления."}, "textbook_problems": [], "tables": [{"title": "Сводная таблица параметров и терминологического моста (Шаг 3)", "headers": ["Параметр / Термин", "Обозначение СНГ", "Международный аналог (West)", "Единицы", "Определение и страница источника"], "rows": [["Принцип суперпозиции", "Δp = Σ Δp_i", "Superposition (Principle of superposition)", "МПа", "Сложение возмущений давления от нескольких скважин или разновременных изменений дебита в линейной теории [стр. 47]"], ["Кривая восстановления давления (КВД)", "КВД", "PBU (Horner plot) (Pressure Build-Up test)", "МПа(ч)", "Зависимость роста забойного давления от времени после остановки добывающей скважины [стр. 47]"]]}], "modern_context": [{"historical_item": "Графоаналитическая обработка КВД по Хорнеру", "historical_context": "Линейная регрессия на полулогарифмическом бланке", "modern_analog": "Мультирежимная деконволюция (Deconvolution) в KAPPA Saphir", "modern_context": "Восстановление единого отклика постоянного дебита по всей зашумлённой истории добычи", "pdf_page": 47}], "it_analogy_and_limits": "Аналогия с линейным наложением сигналов (superposition of step functions): прямоугольный импульс длительностью T есть разность двух ступенек u(t) − u(t − T). Граница: при нелинейной сжимаемости (газ, §5) сумма решений уже не является решением.", "typical_error": "Ошибочно оценивать пластовое давление просто по последнему замеру манометра при короткой остановке: без экстраполяции по Хорнеру (или суперпозиции) давление оказывается систематически заниженным.", "epistemic_split": {"observation": "История работы скважины (дебит Q, время работы T) и кривая восстановления забойного давления p_с(Δt) после остановки (стр. 47–50).", "inference": "Применение принципа суперпозиции: Δp(Δt) = [Qμ/(4πkh)] · ln[(T + Δt)/Δt] для расчёта kh/μ и пластового давления p_0.", "assumption": "Однофазная слабосжимаемая жидкость, мгновенное перекрытие притока (или учёт послепритока) и отсутствие нелинейных эффектов §5."}, "specialist_manual_steps": ["Зафиксировать время работы скважины T до остановки и последовательность замеров p_с(Δt).", "Вычислить безразмерное время суперпозиции (T + Δt) / Δt и построить график p_с от ln[(T + Δt)/Δt].", "По наклону прямого участка рассчитать kh/μ, а по пересечению с осью ln = 0 определить пластовое давление p_0."], "decision_points": ["Отделение раннего участка влияния ствола от истинного радиального участка на КВД.", "Проверка границы перехода к нелинейным эффектам (§5, стр. 51)."], "inefficiency_lens": {"inputs": ["История работы скважины (дебит Q, время работы T) и кривая восстановления забойного давления p_с(Δt) после остановки (стр. 47–50).", "Источник: стр. 47–51"], "manual_steps": ["Зафиксировать время работы скважины T до остановки и последовательность замеров p_с(Δt).", "Вычислить безразмерное время суперпозиции (T + Δt) / Δt и построить график p_с от ln[(T + Δt)/Δt].", "По наклону прямого участка рассчитать kh/μ, а по пересечению с осью ln = 0 определить пластовое давление p_0."], "expert_judgment_points": ["Отделение раннего участка влияния ствола от истинного радиального участка на КВД.", "Проверка границы перехода к нелинейным эффектам (§5, стр. 51)."], "estimated_time_min": 20, "typical_errors": ["Ошибочно оценивать пластовое давление просто по последнему замеру манометра при короткой остановке: без экстраполяции по Хорнеру (или суперпозиции) давление оказывается систематически заниженным."], "origin_tag": "author_number"}, "deeper_branch": "Метод отображений (фиктивных скважин) для учёта прямолинейного сброса (непроницаемой границы) или контура питания с постоянным давлением.", "illustration": {"illustration_id": "barenblatt_s4_step_03_illust", "node_id": "barenblatt_s4_node_03", "step_id": "barenblatt_s4_step_03", "title": "Вывод уравнения неразрывности ∂(mρ)/∂t + div(ρu) = 0 на элементарном объёме dx·dy·dz", "visual_class": "C", "format_kind": "redraw_svg", "source_ref": "рис. 3, стр. 16 (элементарный параллелепипед баланса массы div(ρu))", "redraw_caption": "перерисовано по рис. 3, стр. 16", "pdf_page": 16, "printed_page": "47", "claim_id": "barenblatt_s4_node_03_claim_01", "asset_rel_path": "illustrations/barenblatt_s4_step_03_illust.svg", "svg_markup": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 420\" role=\"img\" aria-label=\"Вывод уравнения неразрывности ∂(mρ)/∂t + div(ρu) = 0 на элементарном объёме dx·dy·dz\">\n\n  <style>\n    .lithos-svg-bg { fill: var(--lithos-illust-bg, #0F172A); stroke: var(--lithos-illust-border, #334155); stroke-width: 1.5; }\n    .lithos-svg-panel { fill: var(--lithos-panel-bg, #1E293B); stroke: var(--lit зовый", "prompt": "Какое утверждение точно отражает ключевой физико-геологический принцип шага «Линейное уравнение пьезопроводности и функция источника» (Глава 1, § 4. Нестационарное движение однородной сжимаемой жидкости: линейная теория (PDF стр. 38–42))?", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": ["Верно по источнику: Линейность уравнения пьезопроводности — не просто математическое упрощение, а условие, открывающее принцип суперпозиции для произвольного числа скважин и режимов работы.", "Типичное заблуждение: Ошибочно считать, что функция источника применима только к одиночной скважине в бесконечном пласте: за счёт линейности из неё складываются решения для целых месторождений и границ методом отображений.", "Параметры методики применяются без учёта граничных условий и литологии пласта", "Физический механизм не зависит от структуры порового пространства и свойств флюида"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: Линейность уравнения пьезопроводности — не просто математическое упрощение, а условие, открывающее принцип суперпозиции для произвольного числа скважин и режимов работы.", "explanation": "Линейная теория нестационарной фильтрации слабосжимаемой жидкости в упруго деформируемом пласте приводит к классическому уравнению пьезопроводности ∂p/∂t = κ·Δp с коэффициентом пьезопроводности κ = k / [μ(m·β_ж + β_с)]. Фундаментальное решение для мгновенного и непрерывно действующего точечного стока выражается через гауссово ядро и интегральную показательную функцию −Ei(−r² / 4κt). (Движение жидкостей и газов в природных пластах, Глава 1, § 4. Нестационарное движение однородной сжимаемой жидкости: линейная теория (PDF стр. 38–42), PDF стр. 39 (печ. стр. 39)).", "error_analysis": {"1": "Это известная ошибка интерпретации: Ошибочно считать, что функция источника применима только к одиночной скважине в бесконечном пласте: за счёт линейности из неё складываются решения для целых месторождений и границ методом отображений.", "2": "Игнорирование граничных условий (Линеаризация требует малости квадратичного члена β_ж(∇p)² по сравнению с Δp; при больших депрессиях в сильно сжимаемых или газовых пластах приходится переходить к нелинейным уравнениям (§5).) приводит к неверному решению.", "3": "В действительности механизм основан на том, что В линейном приближении малые изменения плотности жидкости и пористости скелета пропорциональны приращению давления, что сводит задачу к линейной диффузии давления и позволяет строить решения методом функций Грина и автомодельных переменных."}, "hint_steps": ["Обратите внимание на наблюдение: Уравнение неразрывности, линейный закон Дарси и малые параметры сжимаемости жидкости β_ж и породы β_с (стр. 38–42).", "Учтите физический механизм: В линейном приближении малые изменения плотности жидкости и пористости скелета пропорциональны приращению давления, что сводит задачу к линейной диффузии давления и позволяет строить решения методом функций Грина и автомодельных переменных.", "Пороговая идея шага: Линейность уравнения пьезопроводности — не просто математическое упрощение, а условие, открывающее принцип суперпозиции для произвольного числа скважин и режимов работы."], "source_ref": "Движение жидкостей и газов в природных пластах, Глава 1, § 4. Нестационарное движение однородной сжимаемой жидкости: линейная теория (PDF стр. 38–42), PDF стр. 39 (печ. стр. 39)", "verbatim_quote": "Из общей теории уравнения теплопроводности известно, что если на границе области задано условие (II.84), а в начальный момент времени $t=0$ условие"}, {"task_id": "t3_ctrl_barenblatt_task_sc_02", "course_id": "t3_ctrl_barenblatt", "node_id": "barenblatt_s4_node_02", "step_id": "barenblatt_s4_step_02", "claim_id": "barenblatt_s4_node_02_claim_01", "pdf_page": 44, "printed_page": "44", "task_type": "single_choice", "difficulty_level": "базовый", "prompt": "Какое утверждение точно отражает ключевой физико-геологический принцип шага «Приведённый радиус скважины и асимптотика притока» (Глава 1, § 4. Приведённый радиус скважины, интеграл Дюамеля и логарифмическая асимптотика (PDF стр. 43–46))?", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": ["Верно по источнику: Наклон полулогарифмической кривой Δp(ln t) «видит» истинную проницаемость всего пласта, а её вертикальный сдвиг «видит» состояние узкой призабойной зоны (r_п и скин-фактор).", "Типичное заблуждение: Ошибочно подставлять номинальный радиус долота r_с в формулу притока без проверки несовершенства вскрытия и кольматации (стр. 44): это приводит к неверной оценке проницаемости или ожидаемого дебита.", "Параметры методики применяются без учёта граничных условий и литологии пласта", "Физический механизм не зависит от структуры порового пространства и свойств флюида"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: Наклон полулогарифмической кривой Δp(ln t) «видит» истинную проницаемость всего пласта, а её вертикальный сдвиг «видит» состояние узкой призабойной зоны (r_п и скин-фактор).", "explanation": "Реальный радиус скважины в формуле притока обычно не совпадает с геометрическим радиусом долота из-за несовершенства вскрытия и загрязнения призабойной зоны (стр. 44), поэтому в линейную теорию вводят приведённый радиус скважины r_п (эквивалент скин-фактора S). При малых r²/(4κt) интегральная показательная функция переходит в логарифмический закон, а для переменного дебита Q(t) отклик давления вычисляется через принцип Дюамеля (свёртку). (Движение жидкостей и газов в природных пластах, Глава 1, § 4. Приведённый радиус скважины, интеграл Дюамеля и логарифмическая асимптотика (PDF стр. 43–46), PDF стр. 44 (печ. стр. 44)).", "error_analysis": {"1": "Это известная ошибка интерпретации: Ошибочно подставлять номинальный радиус долота r_с в формулу притока без проверки несовершенства вскрытия и кольматации (стр. 44): это приводит к неверной оценке проницаемости или ожидаемого дебита.", "2": "Игнорирование граничных условий (При очистке призабойной зоны или ГРП приведённый радиус r_п становится больше геометрического r_с (отрицательный скин-фактор S < 0), а при кольматации — резко меньше r_с (S > 0).) приводит к неверному решению.", "3": "В действительности механизм основан на том, что Локальное дополнительное гидравлическое сопротивление в тонкой призабойной зоне (кольматация, неполное вскрытие, перфорация) эквивалентно замене геометрического радиуса скважины r_с на эффективный приведённый радиус r_п = r_с·e^{−S}."}, "hint_steps": ["Обратите внимание на наблюдение: Забойное давление p_с(t), переменный дебит Q(t) и геометрический радиус долота r_с (стр. 44–46).", "Учтите физический механизм: Локальное дополнительное гидравлическое сопротивление в тонкой призабойной зоне (кольматация, неполное вскрытие, перфорация) эквивалентно замене геометрического радиуса скважины r_с на эффективный приведённый радиус r_п = r_с·e^{−S}.", "Пороговая идея шага: Наклон полулогарифмической кривой Δp(ln t) «видит» истинную проницаемость всего пласта, а её вертикальный сдвиг «видит» состояние узкой призабойной зоны (r_п и скин-фактор)."], "source_ref": "Движение жидкостей и газов в природных пластах, Глава 1, § 4. Приведённый радиус скважины, интеграл Дюамеля и логарифмическая асимптотика (PDF стр. 43–46), PDF стр. 44 (печ. стр. 44)", "verbatim_quote": "Для определения пьезопроводности пласта методом гидропродолжения, если дебит возмущающей скважины изменяется скачком, можно использовать формулу (II.107), записав ее в виде"}, {"task_id": "t3_ctrl_barenblatt_task_sc_03", "course_id": "t3_ctrl_barenblatt", "node_id": "barenblatt_s4_node_03", "step_id": "barenblatt_s4_step_03", "claim_id": "barenblatt_s4_node_03_claim_01", "pdf_page": 47, "printed_page": "47", "task_type": "single_choice", "difficulty_level": "инженерный", "prompt": "Какое утверждение точно отражает ключевой физико-геологический принцип шага «Принцип суперпозиции и восстановление давления КВД» (Глава 1, § 4. Суперпозиция, взаимодействие скважин и кривые восстановления давления (PDF стр. 47–51))?", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": ["Верно по источнику: Остановка скважины — это не «выключение физики», а запуск встречного фиктивного стока (−Q), наложенного на продолжающий действовать исходный сток (+Q).", "Типичное заблуждение: Ошибочно оценивать пластовое давление просто по последнему замеру манометра при короткой остановке: без экстраполяции по Хорнеру (или суперпозиции) давление оказывается систематически заниженным.", "Параметры методики применяются без учёта граничных условий и литологии пласта", "Физический механизм не зависит от структуры порового пространства и свойств флюида"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: Остановка скважины — это не «выключение физики», а запуск встречного фиктивного стока (−Q), наложенного на продолжающий действовать исходный сток (+Q).", "explanation": "Благодаря линейности уравнения пьезопроводности падение давления от группы скважин или от остановки скважины равно алгебраической сумме решений одиночных источников (принцип суперпозиции). Остановка скважины, работавшей время T с дебитом Q, моделируется наложением фиктивного нагнетательного источника (−Q) в момент t = T, что даёт уравнение кривой восстановления давления (КВД) и метод определения параметров пласта. (Движение жидкостей и газов в природных пластах, Глава 1, § 4. Суперпозиция, взаимодействие скважин и кривые восстановления давления (PDF стр. 47–51), PDF стр. 47 (печ. стр. 47)).", "error_analysis": {"1": "Это известная ошибка интерпретации: Ошибочно оценивать пластовое давление просто по последнему замеру манометра при короткой остановке: без экстраполяции по Хорнеру (или суперпозиции) давление оказывается систематически заниженным.", "2": "Игнорирование граничных условий (Линейная суперпозиция строго верна до появления нелинейных эффектов (§5, стр. 51) — таких как зависимость проницаемости от давления, выделение газа или многофазное вытеснение.) приводит к неверному решению.", "3": "В действительности механизм основан на том, что После закрытия задвижки на устье (или забое) поток из удалённых зон пласта продолжает поступать к скважине, выравнивая воронку депрессии; в координатах времени Хорнера ln[(T + Δt) / Δt] восстановление давления ложится на прямую линию."}, "hint_steps": ["Обратите внимание на наблюдение: История работы скважины (дебит Q, время работы T) и кривая восстановления забойного давления p_с(Δt) после остановки (стр. 47–50).", "Учтите физический механизм: После закрытия задвижки на устье (или забое) поток из удалённых зон пласта продолжает поступать к скважине, выравнивая воронку депрессии; в координатах времени Хорнера ln[(T + Δt) / Δt] восстановление давления ложится на прямую линию.", "Пороговая идея шага: Остановка скважины — это не «выключение физики», а запуск встречного фиктивного стока (−Q), наложенного на продолжающий действовать исходный сток (+Q)."], "source_ref": "Движение жидкостей и газов в природных пластах, Глава 1, § 4. Суперпозиция, взаимодействие скважин и кривые восстановления давления (PDF стр. 47–51), PDF стр. 47 (печ. стр. 47)", "verbatim_quote": "$$\\rho^* = R (\\rho/R)^\\gamma = \\rho (\\rho/R)^{\\gamma-1}, \\quad \\gamma = k_2/k_1. \\quad (II.117)$$  Сравнивая формулы (II.115) и (II.116), видим, что формула (II.117) описывает преобразованную кривую восстановления давления в скважине радиуса $\\rho^*$ в однородном пласте с параметрами внешней зоны. Точно так же можно показать, что эквивалентный радиус скважины, определяемый по данным о нестационарном притоке при горизонтальных или вертикальных трещинах, таков же, как и определяемый для стационарн"}, {"task_id": "t3_ctrl_barenblatt_task_sc_04", "course_id": "t3_ctrl_barenblatt", "node_id": "barenblatt_s4_node_01", "step_id": "barenblatt_s4_step_01", "claim_id": "barenblatt_s4_node_01_claim_01", "pdf_page": 39, "printed_page": "39", "task_type": "single_choice", "difficulty_level": "инженерный", "prompt": "Какое утверждение точно отражает ключевой физико-геологический принцип шага «Линейное уравнение пьезопроводности и функция источника» (Глава 1, § 4. Нестационарное движение однородной сжимаемой жидкости: линейная теория (PDF стр. 38–42))?", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": ["Верно по источнику: Линейность уравнения пьезопроводности — не просто математическое упрощение, а условие, открывающее принцип суперпозиции для произвольного числа скважин и режимов работы.", "Типичное заблуждение: Ошибочно считать, что функция источника применима только к одиночной скважине в бесконечном пласте: за счёт линейности из неё складываются решения для целых месторождений и границ методом отображений.", "Параметры методики применяются без учёта граничных условий и литологии пласта", "Физический механизм не зависит от структуры порового пространства и свойств флюида"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: Линейность уравнения пьезопроводности — не просто математическое упрощение, а условие, открывающее принцип суперпозиции для произвольного числа скважин и режимов работы.", "explanation": "Линейная теория нестационарной фильтрации слабосжимаемой жидкости в упруго деформируемом пласте приводит к классическому уравнению пьезопроводности ∂p/∂t = κ·Δp с коэффициентом пьезопроводности κ = k / [μ(m·β_ж + β_с)]. Фундаментальное решение для мгновенного и непрерывно действующего точечного стока выражается через гауссово ядро и интегральную показательную функцию −Ei(−r² / 4κt). (Движение жидкостей и газов в природных пластах, Глава 1, § 4. Нестационарное движение однородной сжимаемой жидкости: линейная теория (PDF стр. 38–42), PDF стр. 39 (печ. стр. 39)).", "error_analysis": {"1": "Это известная ошибка интерпретации: Ошибочно считать, что функция источника применима только к одиночной скважине в бесконечном пласте: за счёт линейности из неё складываются решения для целых месторождений и границ методом отображений.", "2": "Игнорирование граничных условий (Линеаризация требует малости квадратичного члена β_ж(∇p)² по сравнению с Δp; при больших депрессиях в сильно сжимаемых или газовых пластах приходится переходить к нелинейным уравнениям (§5).) приводит к неверному решению.", "3": "В действительности механизм основан на том, что В линейном приближении малые изменения плотности жидкости и пористости скелета пропорциональны приращению давления, что сводит задачу к линейной диффузии давления и позволяет строить решения методом функций Грина и автомодельных переменных."}, "hint_steps": ["Обратите внимание на наблюдение: Уравнение неразрывности, линейный закон Дарси и малые параметры сжимаемости жидкости β_ж и породы β_с (стр. 38–42).", "Учтите физический механизм: В линейном приближении малые изменения плотности жидкости и пористости скелета пропорциональны приращению давления, что сводит задачу к линейной диффузии давления и позволяет строить решения методом функций Грина и автомодельных переменных.", "Пороговая идея шага: Линейность уравнения пьезопроводности — не просто математическое упрощение, а условие, открывающее принцип суперпозиции для произвольного числа скважин и режимов работы."], "source_ref": "Движение жидкостей и газов в природных пластах, Глава 1, § 4. Нестационарное движение однородной сжимаемой жидкости: линейная теория (PDF стр. 38–42), PDF стр. 39 (печ. стр. 39)", "verbatim_quote": "Из общей теории уравнения теплопроводности известно, что если на границе области задано условие (II.84), а в начальный момент времени $t=0$ условие"}, {"task_id": "t3_ctrl_barenblatt_task_sc_05", "course_id": "t3_ctrl_barenblatt", "node_id": "barenblatt_s4_node_02", "step_id": "barenblatt_s4_step_02", "claim_id": "barenblatt_s4_node_02_claim_01", "pdf_page": 44, "printed_page": "44", "task_type": "single_choice", "difficulty_level": "инженерный", "prompt": "Какое утверждение точно отражает ключевой физико-геологический принцип шага «Приведённый радиус скважины и асимптотика притока» (Глава 1, § 4. Приведённый радиус скважины, интеграл Дюамеля и логарифмическая асимптотика (PDF стр. 43–46))?", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": ["Верно по источнику: Наклон полулогарифмической кривой Δp(ln t) «видит» истинную проницаемость всего пласта, а её вертикальный сдвиг «видит» состояние узкой призабойной зоны (r_п и скин-фактор).", "Типичное заблуждение: Ошибочно подставлять номинальный радиус долота r_с в формулу притока без проверки несовершенства вскрытия и кольматации (стр. 44): это приводит к неверной оценке проницаемости или ожидаемого дебита.", "Параметры методики применяются без учёта граничных условий и литологии пласта", "Физический механизм не зависит от структуры порового пространства и свойств флюида"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: Наклон полулогарифмической кривой Δp(ln t) «видит» истинную проницаемость всего пласта, а её вертикальный сдвиг «видит» состояние узкой призабойной зоны (r_п и скин-фактор).", "explanation": "Реальный радиус скважины в формуле притока обычно не совпадает с геометрическим радиусом долота из-за несовершенства вскрытия и загрязнения призабойной зоны (стр. 44), поэтому в линейную теорию вводят приведённый радиус скважины r_п (эквивалент скин-фактора S). При малых r²/(4κt) интегральная показательная ф елинейным эффектам (§5).", "Игнорировать граничное условие (Линеаризация требует малости квадратичного члена β_ж(∇p)² по сравнению) и применить формулу вслепую", "Принять ошибочную трактовку: Ошибочно считать, что функция источника применима только к одиночной скважине в ", "Отказаться от количественной интерпретации при выполнении всех условий применимости"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Ход решения: Признаки → Правило → Вывод: Признаки подтверждают критерий применимости → Вывод и решение специалиста: Проверка границы применимости линейной теории перед переходом к нелинейным эффектам (§5).", "explanation": "По цепочке «признаки → правило → вывод»: Признаки (данные): Уравнение неразрывности, линейный закон Дарси и малые параметры сжимаемости жидкости β_ж и породы β_с (стр. 38–42). Кроме того, зафиксировано: В аналитических расчётах ГДИС: переход от дифференциального уравнения ∂p/∂t = κ·Δp к безразмерной переменной u = r²/(4κt) и эталонной кривой −Ei(−u). → Правило (критерий по учебнику, стр. 39): Линейность уравнения пьезопроводности — не просто математическое упрощение, а условие, открывающее принцип суперпозиции для произвольного числа скважин и режимов работы. (с учётом ограничения: Линеаризация требует малости квадратичного члена β_ж(∇p)² по сравнению с Δp; при больших депрессиях в сильно сжимаемых или газовых пластах приходится переходить к нелинейным уравнениям (§5).) → Вывод и решение специалиста: Проверка границы применимости линейной теории перед переходом к нелинейным эффектам (§5). (Движение жидкостей и газов в природных пластах, Глава 1, § 4. Нестационарное движение однородной сжимаемой жидкости: линейная теория (PDF стр. 38–42), PDF стр. 39).", "error_analysis": {"1": "Применение методики без проверки граничного условия приводит к грубой ошибке в подсчётных параметрах.", "2": "Сработала типичная ловушка: Ошибочно считать, что функция источника применима только к одиночной скважине в бесконечном пласте: за счёт линейности из неё складываются решения для целых месторождений и границ методом отображений.", "3": "Все условия применимости выполнены, поэтому отказ от интерпретации необоснован."}, "hint_steps": ["Шаг 1 (Признаки): выделите ключевой диагностический сигнал в данных — В аналитических расчётах ГДИС: переход от дифференциального уравнения ∂p/∂t = κ·Δp к безразмерной переменной u = r²/(4κt) и эталонной кривой −Ei(−u).", "Шаг 2 (Правило): сопоставьте сигнал с пороговым критерием — Линейность уравнения пьезопроводности — не просто математическое упрощение, а условие, открывающее принцип суперпозиции для произвольного числа скважин и режимов работы.", "Шаг 3 (Вывод): сформулируйте решение с учётом точки контроля — Вывод и решение специалиста: Проверка границы применимости линейной теории перед переходом к нелинейным эффектам (§5)."], "source_ref": "Движение жидкостей и газов в природных пластах, Глава 1, § 4. Нестационарное движение однородной сжимаемой жидкости: линейная теория (PDF стр. 38–42), PDF стр. 39", "verbatim_quote": "Из общей теории уравнения теплопроводности известно, что если на границе области задано условие (II.84), а в начальный момент времени $t=0$ условие"}, {"task_id": "t3_ctrl_barenblatt_task_case_02", "course_id": "t3_ctrl_barenblatt", "node_id": "barenblatt_s4_node_02", "step_id": "barenblatt_s4_step_02", "claim_id": "barenblatt_s4_node_02_claim_01", "pdf_page": 44, "printed_page": "44", "task_type": "case_decision", "difficulty_level": "продвинутый", "prompt": "Кейс принятия решения по данным («признаки → правило → вывод») по шагу «Приведённый радиус скважины и асимптотика притока».\n1) Признаки (данные): Забойное давление p_с(t), переменный дебит Q(t) и геометрический радиус долота r_с (стр. 44–46). Кроме того, зафиксировано: На полулогарифмическом графике Δp от ln t: тангенс угла наклона даёт kh/μ, а свободный член — приведённый радиус r_п = r_с·exp(−S).\n2) Правило (критерий по учебнику, стр. 44): Наклон полулогарифмической кривой Δp(ln t) «видит» истинную проницаемость всего пласта, а её вертикальный сдвиг «видит» состояние узкой призабойной зоны (r_п и скин-фактор). (с учётом ограничения: При очистке призабойной зоны или ГРП приведённый радиус r_п становится больше геометрического r_с (отрицательный скин-фактор S < 0), а при кольматации — резко меньше r_с (S > 0).)\nКакой инженерный вывод следует сделать специалисту?", "case_observation": "Признаки (данные): Забойное давление p_с(t), переменный дебит Q(t) и геометрический радиус долота r_с (стр. 44–46). Кроме того, зафиксировано: На полулогарифмическом графике Δp от ln t: тангенс угла наклона даёт kh/μ, а свободный член — приведённый радиус r_п = r_с·exp(−S).", "case_rule": "Правило (критерий по учебнику, стр. 44): Наклон полулогарифмической кривой Δp(ln t) «видит» истинную проницаемость всего пласта, а её вертикальный сдвиг «видит» состояние узкой призабойной зоны (r_п и скин-фактор). (с учётом ограничения: При очистке призабойной зоны или ГРП приведённый радиус r_п становится больше геометрического r_с (отрицательный скин-фактор S < 0), а при кольматации — резко меньше r_с (S > 0).)", "case_conclusion": "Вывод и решение специалиста: Диагностика причин низкого дебита: низкая проницаемость пласта (малый kh) или загрязнённая призабойная зона (малый r_п, большой S > 0).", "options": ["Признаки подтверждают критерий применимости → Вывод и решение специалиста: Диагностика причин низкого дебита: низкая проницаемость пласта (малый kh) или загрязнённая призабойная зона (малый r_п, большой S > 0).", "Игнорировать граничное условие (При очистке призабойной зоны или ГРП приведённый радиус r_п становится) и применить формулу вслепую", "Принять ошибочную трактовку: Ошибочно подставлять номинальный радиус долота r_с в формулу притока без проверк", "Отказаться от количественной интерпретации при выполнении всех условий применимости"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Ход решения: Признаки → Правило → Вывод: Признаки подтверждают критерий применимости → Вывод и решение специалиста: Диагностика причин низкого дебита: низкая проницаемость пласта (малый kh) или загрязнённая призабойная зона (малый r_п, большой S > 0).", "explanation": "По цепочке «признаки → правило → вывод»: Признаки (данные): Забойное давление p_с(t), переменный дебит Q(t) и геометрический радиус долота r_с (стр. 44–46). Кроме того, зафиксировано: На полулогарифмическом графике Δp от ln t: тангенс угла наклона даёт kh/μ, а свободный член — приведённый радиус r_п = r_с·exp(−S). → Правило (критерий по учебнику, стр. 44): Наклон полулогарифмической кривой Δp(ln t) «видит» истинную проницаемость всего пласта, а её вертикальный сдвиг «видит» состояние узкой призабойной зоны (r_п и скин-фактор). (с учётом ограничения: При очистке призабойной зоны или ГРП приведённый радиус r_п становится больше геометрического r_с (отрицательный скин-фактор S < 0), а при кольматации — резко меньше r_с (S > 0).) → Вывод и решение специалиста: Диагностика причин низкого дебита: низкая проницаемость пласта (малый kh) или загрязнённая призабойная зона (малый r_п, большой S > 0). (Движение жидкостей и газов в природных пластах, Глава 1, § 4. Приведённый радиус скважины, интеграл Дюамеля и логарифмическая асимптотика (PDF стр. 43–46), PDF стр. 44).", "error_analysis": {"1": "Применение методики без проверки граничного условия приводит к грубой ошибке в подсчётных параметрах.", "2": "Сработала типичная ловушка: Ошибочно подставлять номинальный радиус долота r_с в формулу притока без проверки несовершенства вскрытия и кольматации (стр. 44): это приводит к неверной оценке проницаемости или ожидаемого дебита.", "3": "Все условия применимости выполнены, поэтому отказ от интерпретации необоснован."}, "hint_steps": ["Шаг 1 (Признаки): выделите ключевой диагностический сигнал в данных — На полулогарифмическом графике Δp от ln t: тангенс угла наклона даёт kh/μ, а свободный член — приведённый радиус r_п = r_с·exp(−S).", "Шаг 2 (Правило): сопоставьте сигнал с пороговым критерием — Наклон полулогарифмической кривой Δp(ln t) «видит» истинную проницаемость всего пласта, а её вертикальный сдвиг «видит» состояние узкой призабойной зоны (r_п и скин-фактор).", "Шаг 3 (Вывод): сформулируйте решение с учётом точки контроля — Вывод и решение специалиста: Диагностика причин низкого дебита: низкая проницаемость пласта (малый kh) или загрязнённая призабойная зона (малый r_п, большой S > 0)."], "source_ref": "Движение жидкостей и газов в природных пластах, Глава 1, § 4. Приведённый радиус скважины, интеграл Дюамеля и логарифмическая асимптотика (PDF стр. 43–46), PDF стр. 44", "verbatim_quote": "Для определения пьезопроводности пласта методом гидропродолжения, если дебит возмущающей скважины изменяется скачком, можно использовать формулу (II.107), записав ее в виде"}, {"task_id": "t3_ctrl_barenblatt_task_case_03", "course_id": "t3_ctrl_barenblatt", "node_id": "barenblatt_s4_node_03", "step_id": "barenblatt_s4_step_03", "claim_id": "barenblatt_s4_node_03_claim_01", "pdf_page": 47, "printed_page": "47", "task_type": "case_decision", "difficulty_level": "продвинутый", "prompt": "Кейс принятия решения по данным («признаки → правило → вывод») по шагу «Принцип суперпозиции и восстановление давления КВД».\n1) Признаки (данные): История работы скважины (дебит Q, время работы T) и кривая восстановления забойного давления p_с(Δt) после остановки (стр. 47–50). Кроме того, зафиксировано: График КВД в координатах Хорнера: переход от сырой таблицы p_с(t) к прямой линии, дающей kh/μ, p_0 и индикацию границ пласта.\n2) Правило (критерий по учебнику, стр. 47): Остановка скважины — это не «выключение физики», а запуск встречного фиктивного стока (−Q), наложенного на продолжающий действовать исходный сток (+Q). (с учётом ограничения: Линейная суперпозиция
