угого запаса жидкости (стр. 474–476)", "step_title": "Упругий режим и упругий запас пласта", "summary_2_3_sentences": "При снижении пластового давления жидкость расширяется, а пористый скелет сжимается под весом вышележащих пород — высвобождаемый объём формирует упругий режим работы пласта. Даже малые коэффициенты сжимаемости жидкости β_ж и породы β_с на масштабах огромного пласта дают существенный упругий запас жидкости, пропорциональный коэффициенту упругоёмкости β* = m·β_ж + β_с.", "primary_difficulty": "conceptual_mechanism", "secondary_difficulty": "mathematical_derivation", "primary_difficulty_code": "М", "secondary_difficulty_code": "Ф", "estimated_minutes": 8, "mechanism": "Снижение порового давления Δp вызывает одновременно два вклада в приток: упругое расширение поровой жидкости (m·β_ж·Δp) и уменьшение объёма пор за счёт роста эффективного напряжения на скелет породы (β_с·Δp).", "practice": "Инженер оценивает упругий запас жидкости в замкнутой залежи или крупной водонапорной системе ΔV = β*·V_пл·Δp до прихода контурных вод или запуска ППД.", "nuances": "Пренебрегать сжимаемостью породы β_с нельзя: для слабосцементированных коллекторов β_с сопоставима с m·β_ж, а для водонасыщенных пластов оба слагаемых одного порядка.", "deeper_branch": "Различие между коэффициентом сжимаемости пор β_п и объёмной сжимаемостью породы β_с = m·β_п в формуле упругоёмкости β* = m·β_ж + β_с.", "quotes_and_pages": [{"unit_id": "train_basniev_p476_eq_03", "pdf_page": 476, "printed_page": "476", "verbatim_quote": "$$- \\beta_{\\text{ж}} V_{0\\text{ж}} \\Delta p = \\Delta V_{\\text{ж}} \\quad \\text{и} \\quad \\beta_{\\text{с}} V_0 \\Delta p = \\Delta V_{\\text{п}}.$$  Для дальнейшего использования этих формул необходимо внести некоторые уточнения. При определении формулы для коэффициента объемного сжатия жидкости $\\beta_{\\text{ж}}$ считалось, что на жидкость действует только сжимающее гидростатическое давление, поэтому при увеличении давления (сжатие) объем жидкости уменьшается и, наоборот, при уменьшении давления объе", "editorial_paraphrase": "Изложение по источнику (стр. 476): При снижении пластового давления жидкость расширяется, а пористый скелет сжимается под весом вышележащих пород — высвобождаемый объём формирует упругий режим работы пласта.", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p476_eq_05", "pdf_page": 476, "printed_page": "476", "verbatim_quote": "$$V_{0\\text{ж}} = m V_0, \\quad (23.2)$$  $m$ – пористость пласта.  Тогда формулу (23.1) с учетом равенства (23.2) можно переписать в следующем виде:  $$\\Delta V_{\\text{з}} = (m \\beta_{\\text{ж}} + \\beta_{\\text{с}}) V_0 \\Delta p, \\quad (23.3)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 476 (§2. Подсчет упругого запаса жидкости в пласте · формула #5).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p476_eq_06", "pdf_page": 476, "printed_page": "476", "verbatim_quote": "$$\\Delta V_{\\text{з}} = \\beta^* V_0 \\Delta p, \\quad (23.4)$$  где  $$\\beta^* = m \\beta_{\\text{ж}} + \\beta_{\\text{с}}. \\quad (23.5)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 476 (§2. Подсчет упругого запаса жидкости в пласте · формула #6).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p476_eq_08", "pdf_page": 476, "printed_page": "476", "verbatim_quote": "$$\\beta^* = \\frac{\\Delta V_{\\text{з}}}{V_0 \\Delta p}.$$  Если формулы (23.3) или (23.4) относить к разрабатываемому в условиях замкнуто-упругого режима нефтяному месторождению, то под $V_0$ следует понимать объем пласта, в котором к данному моменту времени про-", "editorial_paraphrase": "Анализ единицы formula на стр. 476 (§2. Подсчет упругого запаса жидкости в пласте · формула #8).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p474_par_01", "pdf_page": 474, "printed_page": "474", "verbatim_quote": "При разработке и эксплуатации месторождений углеводородного сырья в пластах часто возникают неустановившиеся процессы, обусловленные пуском или остановкой скважин, изменением темпов отбора флюида из скважин и т.д. Для неустановившихся процессов характерно перераспределение пластового давления, изменение во времени скоростей фильтрационных потоков, дебитов скважин. Количественные характеристики неустановившихся процессов (величины изменения давления, скоростей, дебитов) зависят от упругих свойств пластов и насыщающих их жидкостей. Последнее означает, что основной формой пластовой энергии, обеспечивающей приток жидкости к скважинам в рассматриваемых неустановившихся процессах, является энергия упругой деформации жидкостей (нефти и/или воды) и твердого скелета пласта.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 474 (§1. Упругий режим пласта и его характерные особенности · абзац #1).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p474_par_02", "pdf_page": 474, "printed_page": "474", "verbatim_quote": "Математическая модель, которая будет сформулирована далее, учитывает проявление упругих сил в однофазном фильтрационном потоке, т.е. далее будет считаться, что давление в любой точке потока выше давления насыщения жидкости газом.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 474 (§1. Упругий режим пласта и его характерные особенности · абзац #2).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p474_par_03", "pdf_page": 474, "printed_page": "474", "verbatim_quote": "При пуске скважины в эксплуатацию в условиях упругого режима движение жидкости начинается за счет использования потенциальной энергии упругой деформации пласта и жидкости сначала в ближайших окрестностях забоя, затем во все более удаленных областях пласта. В самом деле, при снижении пластового давления упругое противодействие пласта вышележащему горному массиву уменьшается, и это приводит к уменьшению объема порового пространства, что, в свою очередь, увеличивает сжатие жидкости. Все это способствует вытеснению жидкости из пласта в скважину. И несмотря на то, что коэффициенты объемной упругой деформации жидкости и твердого скелета пласта очень малы, из-за того, что очень велики объемы пласта и насыщающих его флюидов, объемы жидкости, извлекаемой из пласта за счет упругости пласта и жидкости, могут быть весьма значительными.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 474 (§1. Упругий режим пласта и его характерные особенности · абзац #3).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p474_par_04", "pdf_page": 474, "printed_page": "474", "verbatim_quote": "В некоторых случаях приток жидкости к забоям скважин поддерживается и напором воды, поступающей в пласт из области питания. Тогда ре-", "editorial_paraphrase": "Анализ единицы paragraph на стр. 474 (§1. Упругий режим пласта и его характерные особенности · абзац #4).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p475_par_01", "pdf_page": 475, "printed_page": "475", "verbatim_quote": "НЕУСТАНОВИВШЕЕСЯ ДВИЖЕНИЕ УПРУГОЙ ЖИДКОСТИ", "editorial_paraphrase": "Анализ единицы paragraph на стр. 475 (§1. Упругий режим пласта и его характерные особенности · абзац #1).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p475_par_02", "pdf_page": 475, "printed_page": "475", "verbatim_quote": "жим пласта следует называть упруговодонапорным. Различают и вторую разновидность упругого режима – замкнуто-упругий режим. Встречаются залежи нефти в закрытых со всех сторон пластовых «ловушках», когда на небольших расстояниях от нефтяной залежи продуктивный пласт либо выклинивается, либо экранирован сбросом. В начальной стадии разработки такой залежи, до тех пор, пока пластовое давление не снизилось до давления насыщения, имеет место замкнуто-упругий режим движения флюида.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 475 (§1. Упругий режим пласта и его характерные особенности · абзац #2).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p475_par_03", "pdf_page": 475, "printed_page": "475", "verbatim_quote": "Характерная особенность проявления упругого режима в процессе разработки нефтяных месторождений проявляется в длительности во времени процесса перераспределения пластового давления после начала работы скважины или изменения темпа отбора жидкости из скважины. Это связано с тем, что при фильтрации вязкой жидкости в пласте возникают очень большие силы сопротивления. Неустановившиеся процессы протекают тем быстрее, чем больше коэффициент проницаемости $k$, и тем медленнее, чем больше вязкость жидкости $\\mu$ и коэффициенты объемной упругости жидкости $\\beta_\\text{ж}$ и твердого скелета пласта $\\beta_\\text{с}$.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 475 (§1. Упругий режим пласта и его характерные особенности · абзац #3).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p475_par_04", "pdf_page": 475, "printed_page": "475", "verbatim_quote": "Первыми исследователями, разрабатывавшими теорию упругого режима в 30-х годах 20-го века, были Маскет, Шилсуиз, Херст, Тсейс и Джекоб. Однако они не учитывали объемную упругость пласта. Наиболее полно теория упругого режима с учетом упругих свойств твердого скелета пласта и насыщающих жидкостей была разработана В.Н.Щелкачевым.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 475 (§1. Упругий режим пласта и его характерные особенности · абзац #4).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p475_par_05", "pdf_page": 475, "printed_page": "475", "verbatim_quote": "Под упругим запасом жидкости в пласте понимают количество жидкости, которое можно извлечь из пласта при снижении давления в нем за счет объемной упругости твердого скелета пласта и насыщающих его жидкостей. Хотя коэффициенты объемной упругой деформации жидкости и твердого скелета пласта очень малы (см. гл. XIX), очень велики объемы пласта, поэтому упругий запас жидкости в пласте может быть весьма существенным. При снижении давления в пласте упругий запас жидкости естественно убывает, а при повышении давления происходит накопление упругого запаса жидкости в нем.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 475 (§2. Подсчет упругого запаса жидкости в пласте · абзац #5).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p475_par_06", "pdf_page": 475, "printed_page": "475", "verbatim_quote": "Упругий запас жидкости в пласте можно подсчитать следующим образом. Выделим мысленно элемент объема пласта $V_0$. Пусть $V_{0\\text{ж}}$ есть объем жидкости, насыщающей этот элемент объема пласта $V_0$ при начальном давлении $p_0$. Упругий запас жидкости будем определять по ее объему, замеряемому при начальном пластовом давлении. Обозначим через $\\Delta V_\\text{з}$ изменение упругого запаса жидкости внутри объема пласта $V_0$ при изменении давления во всех его точках на величину $\\Delta p$. В соответствии с форму-", "editorial_paraphrase": "Анализ единицы paragraph на стр. 475 (§2. Подсчет упругого запаса жидкости в пласте · абзац #6).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p476_par_01", "pdf_page": 476, "printed_page": "476", "verbatim_quote": "ГЛАВА XXIII", "editorial_paraphrase": "Анализ единицы paragraph на стр. 476 (§2. Подсчет упругого запаса жидкости в пласте · абзац #1).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p476_par_02", "pdf_page": 476, "printed_page": "476", "verbatim_quote": "лами (19.22) и (19.40), заменив дифференциалы давления и объемов пор и жидкости на конечные разности, имеем", "editorial_paraphrase": "Анализ единицы paragraph на стр. 476 (§2. Подсчет упругого запаса жидкости в пласте · абзац #2).", "numbers_and_units": [], "conditions": []}], "epistemic_split": {"observation": "Объём пласта V_пл, пористость m, коэффициенты сжимаемости жидкости β_ж и скелета β_с, среднее падение давления Δp.", "inference": "Вычисление упругоёмкости β* = m·β_ж + β_с = 3,16·10⁻¹⁰ Па⁻¹ и упругого з жидкости за счёт упругой энергии.", "misconception_to_fix": "Ошибочно считать, что при упругом режиме расширяется только нефть: сжатие поровых каналов скелета даёт до 30–50 % суммарной упругоёмкости β*.", "data_transfer": "В паспорте расчёта 3D Hydro Lab: при m = 0,18, β_ж = 1,2·10⁻⁹ Па⁻¹, β_с = 1,0·10⁻¹⁰ Па⁻¹ получаем β* = 3,16·10⁻¹⁰ Па⁻¹.", "it_analogy_and_limits": "Аналогия с буферным пулом (elastic buffer) огромного объёма: малый процент сжатия на каждом узле суммируется в заметный резерв при падении давления. Граница: при падении давления ниже давления насыщения выделяется газ, и линейная упругоёмкость нарушается.", "specialist_manual_steps": ["Перевести коэффициенты сжимаемости β_ж и β_с в единицы СИ (Па⁻¹).", "Вычислить коэффициент упругоёмкости пласта β* = m·β_ж + β_с.", "Рассчитать упругий запас ΔV = β*·V_пл·Δp при заданном среднем снижении давления Δp."], "decision_points": ["Оценка доли упругого запаса в материальном балансе залежи на ранней стадии разработки.", "Проверка сохранения однофазного состояния (p > p_нас) для применимости линейной формулы."], "inefficiency_lens": {"inputs": ["Объём пласта V_пл, пористость m, коэффициенты сжимаемости жидкости β_ж и скелета β_с, среднее падение давления Δp.", "Источник: стр. 474–476"], "manual_steps": ["Перевести коэффициенты сжимаемости β_ж и β_с в единицы СИ (Па⁻¹).", "Вычислить коэффициент упругоёмкости пласта β* = m·β_ж + β_с.", "Рассчитать упругий запас ΔV = β*·V_пл·Δp при заданном среднем снижении давления Δp."], "expert_judgment_points": ["Оценка доли упругого запаса в материальном балансе залежи на ранней стадии разработки.", "Проверка сохранения однофазного состояния (p > p_нас) для применимости линейной формулы."], "estimated_time_min": 16, "typical_errors": ["Ошибочно считать, что при упругом режиме расширяется только нефть: сжатие поровых каналов скелета даёт до 30–50 % суммарной упругоёмкости β*."], "origin_tag": "computed"}, "worked_example": {"status": "present", "not_applicable_reason": "", "probl роводности κ = k / (μ·β*) в единицах СИ (м²/с), чтобы оценить характерное время релаксации давления t ~ L² / κ и выбрать длительность ГДИС.", "nuances": "Линеаризация уравнения пьезопроводности (отбрасывание квадратичного члена β_ж·(∇p)²) правомерна только для слабосжимаемых жидкостей при умеренных градиентах давления.", "deeper_branch": "Аналогия между уравнением пьезопроводности (давление p, пьезопроводность κ) и уравнением теплопроводности (температура T, температуропроводность a), позволяющая переносить готовые аналитические решения.", "quotes_and_pages": [{"unit_id": "train_basniev_p477_eq_03", "pdf_page": 477, "printed_page": "477", "verbatim_quote": "$$\\Delta p = p_\\kappa - \\bar{p}, \\quad (23.6)$$  где $p_\\kappa$ – начальное пластовое давление; $\\bar{p}$ – средневзвешенное по объему возмущенной части пласта $V_0$ давление.  Вычислить средневзвешенное пластовое давление $\\bar{p}$ можно, если известна геометрия возмущенной части пласта и конкретное распределение давления в ней.  Дифференцируя равенство (23.4), получим  $$d(\\Delta V_3) = \\beta^* d[V_0(t) \\Delta p].$$", "editorial_paraphrase": "Изложение по источнику (стр. 477): Совместная запись уравнения неразрывности, линейного закона Дарси и линейных уравнений состояния жидкости и скелета породы приводит к дифференциальному уравнению пьезопроводности: ∂p/∂t = κ·∇²p.", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p477_eq_05", "pdf_page": 477, "printed_page": "477", "verbatim_quote": "$$d(\\Delta V_3) = Q(t) dt,$$  где $Q(t)$ – дебит всех скважин, эксплуатирующих данную нефтяную залежь.  Приравняв правые части двух последних равенств, получим дифференциальное уравнение истощения нефтяной залежи в условиях замкнуто-упругого режима  $$\\beta^* d[V_0(t) \\Delta p] = Q(t) dt. \\quad (23.7)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 477 (§2. Подсчет упругого запаса жидкости в пласте · формула #5).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p478_eq_04", "pdf_page": 478, "printed_page": "478", "verbatim_quote": "$$\\frac{\\partial m\\rho}{\\partial t} + \\text{div } \\rho\\bar{w} = 0,$$  $$\\bar{w} = -\\frac{k}{\\mu}(\\text{grad } p + \\rho\\bar{f}), \\quad (23.8)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 478 (§3. Математическая модель неустановившейся фильтрации упругой жидкости в упругой пористой среде · формула #4).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p478_eq_05", "pdf_page": 478, "printed_page": "478", "verbatim_quote": "$$\\rho = \\rho(p), \\ m = m(p), \\ k = k(p), \\ \\mu = \\mu(p),$$  которая после пренебрежения массовыми силами и введения обобщенной функции Лейбензона, преобразуется к виду (19.21)  $$\\frac{\\partial m\\rho}{\\partial t} - \\Delta P = 0,$$", "editorial_paraphrase": "Анализ единицы formula на стр. 478 (§3. Математическая модель неустановившейся фильтрации упругой жидкости в упругой пористой среде · формула #5).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p478_eq_06", "pdf_page": 478, "printed_page": "478", "verbatim_quote": "$$\\rho\\bar{w} = -\\text{grad } P,$$  $$\\rho = \\rho(p), \\ m = m(p), \\ k = k(p), \\ \\mu = \\mu(p), \\quad (23.9)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 478 (§3. Математическая модель неустановившейся фильтрации упругой жидкости в упругой пористой среде · формула #6).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p478_eq_07", "pdf_page": 478, "printed_page": "478", "verbatim_quote": "$$P = \\int \\frac{k(p)}{\\mu(p)} \\rho(p) \\, dp.$$  В качестве уравнений состояния среды и жидкости воспользуемся уравнениями состояния упругой жидкости и упругой пористой среды в ранее полученной форме (19.24) и (19.42):  $$\\rho = \\rho_0 [1 + \\beta_\\infty (p - p_0)], \\quad (23.10)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 478 (§3. Математическая модель неустановившейся фильтрации упругой жидкости в упругой пористой среде · формула #7).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p478_eq_08", "pdf_page": 478, "printed_page": "478", "verbatim_quote": "$$m = m_0 + \\beta_c (p - p_0). \\quad (23.11)$$  Для проницаемости и вязкости примем $k = \\text{const}$ и $\\mu = \\text{const}$, однако заметим, что, как показывают результаты лабораторных экспериментов, а также опыт разработки месторождений, в ряде случаев наряду с изменением пористости вследствие возникающих деформаций, происходят и изменения проницаемости пластов. Особенно это относится к глубоко залегающим месторождениям углеводородов. Понятно, что данное обстоятельство не учитывается в рассма", "editorial_paraphrase": "Анализ единицы formula на стр. 478 (§3. Математическая модель неустановившейся фильтрации упругой жидкости в упругой пористой среде · формула #8).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p479_eq_04", "pdf_page": 479, "printed_page": "479", "verbatim_quote": "$$\\frac{\\partial m\\rho}{\\partial t} - \\Delta P = 0,$$  $$\\rho\\dot{w} = -\\text{grad } P,$$", "editorial_paraphrase": "Анализ единицы formula на стр. 479 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #4).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p479_eq_05", "pdf_page": 479, "printed_page": "479", "verbatim_quote": "$$\\rho = \\rho_0[1 + \\beta_\\infty(p - p_0)],$$  $$m = m_0 + \\beta_c(p - p_0),$$", "editorial_paraphrase": "Анализ единицы formula на стр. 479 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #5).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p479_eq_06", "pdf_page": 479, "printed_page": "479", "verbatim_quote": "$$k = \\text{const}, \\mu = \\text{const},$$  $$P = \\frac{k}{\\mu} \\int \\rho \\, dp.$$", "editorial_paraphrase": "Анализ единицы formula на стр. 479 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #6).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p479_eq_09", "pdf_page": 479, "printed_page": "479", "verbatim_quote": "$$\\frac{\\partial(m\\rho)}{\\partial t} = \\frac{k}{\\mu} \\Delta \\int \\rho \\, dp. \\quad (23.12)$$  Теперь преобразуем выражение в левой части уравнения (23.12), для чего используем уравнения состояния упругой жидкости и упругой пористой среды (23.10) и (23.11)  $$\\rho = \\rho_0[1 + \\beta_\\infty(p - p_0)], \\quad m = m_0 + \\beta_c(p - p_0),$$", "editorial_paraphrase": "Анализ единицы formula на стр. 479 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #9).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p479_eq_11", "pdf_page": 479, "printed_page": "479", "verbatim_quote": "$$m\\rho = m_0\\rho_0 + (m_0\\rho_0\\beta_\\infty + \\rho_0\\beta_c)(p - p_0) + \\rho_0\\beta_c\\beta_\\infty(p - p_0)^2.$$  Последним слагаемым в правой части полученного выражения ввиду его малости по сравнению с двумя другими слагаемыми можно пренебречь", "editorial_paraphrase": "Анализ единицы formula на стр. 479 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #11).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p480_eq_03", "pdf_page": 480, "printed_page": "480", "verbatim_quote": "$$m\\rho = m_0\\rho_0 \\left[ 1 + \\beta^* (p - p_0)/m_0 \\right],$$  откуда после дифференцирования выражения по времени $t$ находим  $$\\frac{\\partial(m\\rho)}{\\partial t} = \\rho_0\\beta^* \\frac{\\partial p}{\\partial t}. \\quad (23.13)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 480 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #3).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p480_eq_05", "pdf_page": 480, "printed_page": "480", "verbatim_quote": "$$\\frac{k}{\\mu} \\Delta \\left( \\int \\rho dp \\right).$$  Подставив под знак интеграла уравнение состояния упругой жидкости (23.10), получим  $$\\frac{k}{\\mu} \\Delta \\left( \\int \\rho dp \\right) = \\frac{k}{\\mu} \\Delta \\left( \\rho_0 p + \\rho_0 \\beta_\\text{ж} \\left( \\frac{p^2}{2} - p_0 p \\right) + C \\right), \\quad (23.14)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 480 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #5).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p480_eq_07", "pdf_page": 480, "printed_page": "480", "verbatim_quote": "$$\\frac{k}{\\mu} \\Delta \\left( \\int \\rho dp \\right) = \\frac{k}{\\mu} \\rho_0 \\Delta p. \\quad (23.15)$$  Подставив (23.13) и (23.15) в исходное дифференциальное уравнение (23.12), получим дифференциальное уравнение относительно давления  $$\\beta^* \\frac{\\partial p}{\\partial t} = \\frac{k}{\\mu} \\Delta p, \\quad (23.16)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 480 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #7).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p480_eq_09", "pdf_page": 480, "printed_page": "480", "verbatim_quote": "$$\\frac{\\partial p}{\\partial t} = \\kappa \\left( \\frac{\\partial^2 p}{\\partial x^2} + \\frac{\\partial^2 p}{\\partial y^2} + \\frac{\\partial^2 p}{\\partial z^2} \\right), \\quad (23.17)$$  где введено обозначение  $$\\kappa = k / (\\mu \\beta^*). \\quad (23.18)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 480 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #9).", "numbers_and_units": [], "conditions": []}], "epistemic_split": {"observation": "Закон Дарси w = −( 3_24", "order": 3, "order_rationale": "Следует после узла #2, опираясь на уже введённые термины и переходя от механизма к количественной оценке и принятию решения (стр. 481–493).", "source_heading": "Глава XXIII, § 5 (5.1–5.2). Одномерные потоки и основная формула упругого режима (Рис. 23.1–23.4, стр. 481–493)", "step_title": "Точные решения и формула упругого режима Ei", "summary_2_3_sentences": "Для прямолинейно-параллельного потока (§5.1, рис. 23.1–23.2) решение уравнения пьезопроводности выражается через интеграл вероятностей erf(x / 2√(κt)), а для плоскорадиального притока к точечной скважине с постоянным дебитом Q (§5.2, рис. 23.3–23.4) — через основную формулу упругого режима с интегральной показательной функцией: Δp(r, t) = [Qμ / (4πkh)] · [−Ei(−r² / 4κt)]. При малых значениях аргумента u = r² / (4κt) < 0,01 справедлива логарифмическая асимптотика −Ei(−u) ≈ ln(2,25·κt / r²), лежащая в основе интерпретации ГДИС.", "primary_difficulty": "mathematical_derivation", "secondary_difficulty": "multi_curve_reading", "primary_difficulty_code": "Ф", "secondary_difficulty_code": "И", "estimated_minutes": 11, "mechanism": "Пуск скважины с постоянным дебитом Q действует как линейный сток в бесконечном упругом пласте: воронка депрессии непрерывно углубляется и расширяется, а безразмерный аргумент u = r²/(4κt) объединяет пространство и время в единую автомодельную переменную.", "practice": "Инженер вычисляет u = r²/(4κt), снимает −Ei(−u) по графику рис. 23.3 (или логарифмическому приближению при u < 0,01) и строит пьезометрические кривые p(r, t) (рис. 23.4) или определяет гидропроводность kh/μ по наклону графика Δp от ln t.", "nuances": "Логарифмическое приближение −Ei(−u) ≈ ln(2,25κt/r²) даёт погрешность менее 1 % только при u ≤ 0,01; при больших u (малых временах или больших расстояниях r) необходимо использовать точные значения функции Ei (рис. 23.3).", "deeper_branch": "Принцип суперпозиции для расчёта взаимодействия нескольких скважин и кривой восстановления давления (КВД) после остановки скважины.", "quotes_and_pages": [{"unit_id": "train_basniev_p484_vlmfig_05", "pdf_page": 484, "printed_page": "484", "verbatim_quote": "━━━ FORMAT 6: XY PLOT / CHART WITH DATA ━━━\n**График изменения давления p в зависимости от координаты x для разных моментов времени**\nОси:\n- Вертикальная ось — p (давление), линейная шкала, без числовых делений, кроме двух отмеченных горизонтальными штриховыми линиями уровней: pₖ (верхний уровень) и p₁ (нижний уровень, у оси x).\n- Горизонтальная ось — x (расстояние/координата), линейная шкала, без числовых делений.\nКривые (снято с графика, приблизительно):\n- Три кривые, каждая начинается в точке (x=0, p=p₁) и монотонно возрастает, приближаясь к уровню pₖ при увеличении x.\n- Кривые подписаны св", "editorial_paraphrase": "Изложение по источнику (стр. 484): Для прямолинейно-параллельного потока (§5.", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p484_fig_23_1_06", "pdf_page": 484, "printed_page": "484", "verbatim_quote": "Рис. 23.1. Кривые распределения давления в различные моменты времени в неустановившемся прямолинейно-параллельном потоке упругой жидкости при условии $p_{\\mathrm{r}} = \\text{const}$", "editorial_paraphrase": "Анализ единицы Рис. 23.1 на стр. 484 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · Рис. 23.1).", "numbers_and_units": [], "conditions": ["Кривые распределения давления в различные моменты времени в неустановившемся прямолинейно-параллельном потоке упругой жидкости при условии $p_{\\mathrm{r}} = \\text{const}$"]}, {"unit_id": "train_basniev_p485_fig_23_2_07", "pdf_page": 485, "printed_page": "485", "verbatim_quote": "Рис. 23.2. Зависимости дебита и добычи жидкости от времени после пуска галереи при условии $p_г = \\text{const}$", "editorial_paraphrase": "Анализ единицы Рис. 23.2 на стр. 485 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · Рис. 23.2).", "numbers_and_units": [], "conditions": ["Зависимости дебита и добычи жидкости от времени после пуска галереи при условии $p_г = \\text{const}$"]}, {"unit_id": "train_basniev_p493_par_03", "pdf_page": 493, "printed_page": "493", "verbatim_quote": "Для расчетов пластового давления в любой точке открытого кругового пласта в случае r ≤ 0,1 Rк, можно с высокой степенью точности (до 0,2%) пользоваться формулой (23.52) для бесконечного пласта, если при этом Rк ≥ 10⁵ rc, Fo ≤ 0,2.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 493 (5.2. Плоскорадиальный фильтрационный поток упругой жидкости. Основная формула теории упругого режима фильтрации · абзац #3).", "numbers_and_units": [], "conditions": ["Для расчетов пластового давления в любой точке открытого кругового пласта в случае r ≤ 0,1 Rк, можно с высокой степенью точности (до 0,2%) пользоваться формулой (23.52) для бесконечного пласта, если при этом Rк ≥ 10⁵ rc, Fo ≤ 0,2."]}, {"unit_id": "train_basniev_p493_par_04", "pdf_page": 493, "printed_page": "493", "verbatim_quote": "В дополнение к указанным оценкам можно еще отметить, что различие в величинах забойных давлений в условиях конечного (открытого и закрытого) и бесконечного пластов не превзойдет 1%, если Fo ≤ 0,33, Rк ≥ 50 rc или если Fo ≤ 0,35, Rк ≥ 1000 rc.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 493 (5.2. Плоскорадиальный фильтрационный поток упругой жидкости. Основная формула теории упругого режима фильтрации · абзац #4).", "numbers_and_units": [], "conditions": ["В дополнение к указанным оценкам можно еще отметить, что различие в величинах забойных давлений в условиях конечного (открытого и закрытого) и бесконечного пластов не превзойдет 1%, если Fo ≤ 0,33, Rк ≥ 50 rc или если Fo ≤ 0,35, Rк ≥ 1000 rc."]}, {"unit_id": "train_basniev_p481_eq_04", "pdf_page": 481, "printed_page": "481", "verbatim_quote": "$$[\\kappa] = \\frac{h}{[\\mu][\\beta^*]} = \\frac{L^2}{L^{-1}MT^{-1}LM^{-1}T^2} = \\frac{L^2}{T},$$  где $L$, $M$, $T$ – соответственно, размерности длины, массы и времени. Наиболее часто встречающиеся в нефтепромысловой практике значения коэффициента пьезопроводности заключены в пределах от 0,1 до 5 м²/с.  Отметим, что уравнение пьезопроводности (23.16) применимо только для слабосжимаемой упругой жидкости, для которой $\\beta_*(p - p_0) << 1$. Если же это условие не выполняется, то при переходе от (2", "editorial_paraphrase": "Анализ единицы formula на стр. 481 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #4).", "numbers_and_units": [{"value": "5", "unit": "м²/с"}], "conditions": []}, {"unit_id": "train_basniev_p482_eq_03", "pdf_page": 482, "printed_page": "482", "verbatim_quote": "$$p(x, t) = p_\\kappa \\quad \\text{при} \\quad t = 0;$$  $$p(x, t) = p_\\tau \\quad \\text{при} \\quad x = 0, \\quad t > 0; \\tag{23.20}$$", "editorial_paraphrase": "Анализ единицы formula на стр. 482 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #3).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p482_eq_04", "pdf_page": 482, "printed_page": "482", "verbatim_quote": "$$p(x, t) = p_\\kappa \\quad \\text{при} \\quad x = \\infty, \\quad t \\geq 0.$$  Задача заключается в определении дебита галереи $Q(t)$ и давления в любой точке потока, в любой момент времени, то есть функции $p(x, t)$.  Используя анализ размерностей, покажем, что поставленная задача автомодельна, т. е. из аргументов, от которых зависит давление, можно составить один безразмерный комплекс, от которого будет зависеть искомая функция $p(x, t)$.  Обозначим через $P = (p - p_\\tau)/(p_\\kappa - p_\\tau)$ без", "editorial_paraphrase": "Анализ единицы formula на стр. 482 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #4).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p482_eq_06", "pdf_page": 482, "printed_page": "482", "verbatim_quote": "$$P = 0 \\quad \\text{при} \\quad u = 0,$$  $$P = 1 \\quad \\text{при} \\quad u = \\infty. \\tag{23.21}$$", "editorial_paraphrase": "Анализ единицы formula на стр. 482 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #6).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p482_eq_08", "pdf_page": 482, "printed_page": "482", "verbatim_quote": "$$\\frac{\\partial P}{\\partial t} = \\kappa \\frac{\\partial^2 P}{\\partial x^2}. \\tag{23.22}$$  Используя правило дифференцирования сложных функций, частные производные по координате и времени можно выразить через производные по безразмерной (автомодельной) переменной. Выполняя дифференцирования, находим  $$\\frac{\\partial P}{\\partial x} = \\frac{dP}{du} \\frac{\\partial u}{\\partial x} = \\frac{dP}{du} \\frac{1}{2\\sqrt{\\kappa t}},$$", "editorial_paraphrase": "Анализ единицы formula на стр. 482 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #8).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p482_eq_09", "pdf_page": 482, "printed_page": "482", "verbatim_quote": "$$\\frac{\\partial P}{\\partial t} = \\frac{dP}{du} \\frac{\\partial u}{\\partial t} = \\frac{dP}{du} \\frac{x}{2\\sqrt{\\kappa}} \\left( -\\frac{1}{2\\sqrt{t^3}} \\right) = \\frac{dp}{du} \\left( -\\frac{u}{2t} \\right),$$  $$\\frac{\\partial^2 P}{\\partial x^2} = \\frac{\\partial}{\\partial x} \\left( \\frac{\\partial P}{\\partial x} \\right) = \\frac{\\partial}{\\partial x} \\left( \\frac{dP}{du} \\frac{1}{2\\sqrt{\\kappa t}} \\right) = \\frac{1}{2\\sqrt{\\kappa t}} \\frac{d^2 P}{du^2} \\frac{\\partial u}{\\partial x} = \\frac{1}{4\\kappa ", "editorial_paraphrase": "Анализ единицы formula на стр. 482 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #9).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p483_eq_03", "pdf_page": 483, "printed_page": "483", "verbatim_quote": "$$\\frac{d^2P}{du^2} + 2u \\frac{dP}{du} = 0, \\quad (23.23)$$  которое должно быть решено при условиях (23.21). Для решения уравнения (23.23) обозначим $dP/du = \\xi$, тогда уравнение (23.23) принимает вид  $$\\frac{d\\xi}{du} + 2u\\xi = 0. \\quad (23.24)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 483 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #3).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p483_eq_05", "pdf_page": 483, "printed_page": "483", "verbatim_quote": "$$\\frac{d\\xi}{\\xi} = -2udu$$  и далее, проинтегрировав, получим  $$\\ln \\xi = -u^2 + \\ln C_1,$$", "editorial_paraphrase": "Анализ единицы formula на стр. 483 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #5).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p483_eq_07", "pdf_page": 483, "printed_page": "483", "verbatim_quote": "$$\\xi = \\frac{dP}{du} = C_1 e^{-u^2}, \\quad (23.25)$$  где $C_1$ – постоянная интегрирования.  Проинтегрировав (23.25) с учетом первого из условий (23.21), получим:  $$P = C_1 \\int_0^u e^{-u^2} du.$$", "editorial_paraphrase": "Анализ единицы formula на стр. 483 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #7).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p483_eq_09", "pdf_page": 483, "printed_page": "483", "verbatim_quote": "$$1 = C_1 \\int_0^\\infty e^{-u^2} du.$$  Из интегрального исчисления известно, что $\\int_0^\\infty e^{-u^2} du = \\sqrt{\\pi}/2$, поэтому предыдущее соотношение дает $C_1 = 2/\\sqrt{\\pi}$, и окончательно получим  $$P = \\frac{2}{\\sqrt{\\pi}} \\int_0^{\\frac{x}{2\\sqrt{\\pi}}} e^{-u^2} du. \\quad (23.26)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 483 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #9).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p484_eq_03", "pdf_page": 484, "printed_page": "484", "verbatim_quote": "$$\\frac{2}{\\sqrt{\\pi}} \\int_0^{\\frac{x}{2\\sqrt{\\kappa t}}} e^{-u^2} du = \\operatorname{erf}\\left(\\frac{x}{2\\sqrt{\\kappa t}}\\right).$$  Таким образом, $P = \\operatorname{erf}\\left(\\frac{x}{2\\sqrt{\\kappa t}}\\right)$, и закон распределения давления в неустановившемся прямолинейно-параллельном фильтрационном потоке упругой жидкости имеет вид  $$p = p_{\\mathrm{r}} + (p_{\\mathrm{k}} - p_{\\mathrm{r}}) \\operatorname{erf}\\left(\\frac{x}{2\\sqrt{\\kappa t}}\\right). \\quad (23.27)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 484 (§4. Вывод дифференциального уравнения фильтрации упругой жидкости в упругой пористой среде по закону Дарси · формула #3).", "numbers_and_units": [], "conditions": []}], "epistemic_split": {"observation": "Дебит Q, гидропроводность kh/μ, пьезопроводность κ, расстояние r и время работы t (рис. 23.3–23.4).", "inference": "Расчёт падения давления Δp(r, t) по формуле Тейса–Щелкачёва через −Ei(−r² / 4κt) и сравнение с логарифмической асимптотикой.", "assumption": "Бесконечный однородный пласт, точечный сток (r_с → 0), постоянный дебит Q = const и отсутствие влияния границ."}, "field_provenance": {"source_heading": "source_verbatim", "step_title": "editorial_synthesis_3_7_words", "summary_2_3_sentences": "editorial_synthesis_grounded_in_quotes", "mechanism": "source_grounded_domain_explanation", "practice": "specialist_workflow_from_textbook", "nuances": "source_applicability_conditions", "deeper_branch": "advanced_textbook_extension", "quotes_and_pages": "source_verbatim_with_pdf_page", "epistemic_split": "epistemic_decomposition_t3", "inefficiency_lens": "specialist_workflow_lens", "core_terms": "passport_and_textbook_definitions", "worked_example": "textbook_worked_example", "computed_values": "physics_engine_deterministic"}, "typed_links": [{"source_node_id": "basniev_ch23_24_node_02", "target_node_id": "basniev_ch23_24_node_03", "link_type": "prerequisite", "link_label_ru": "предпосылка", "rationale": "Узел 2 вводит базовые понятия и физические предпосылки, необходимые для шага 3."}, {"source_node_id": "basniev_ch23_24_node_02", "target_node_id": "basniev_ch23_24_node_03", "link_type": "data_transfer", "link_label_ru": "переход к данным", "rationale": "Перенос механизма и параметров из шага 2 в практическую интерпретацию шага 3."}, {"source_node_id": "basniev_ch23_24_node_03", "target_node_id": "basniev_ch23_24_node_03", "link_type": "refutes_misconception", "link_label_ru": "опровергает заблуждение", "rationale": "Ошибочно применять логарифмическую формулу Δp ~ ln(2,25κt/r²) при u > 0,1 (например, в удалённой наблюдательной скважине в первые минуты): она может выдать даже отрицательную депрессию вместо точного значения −Ei(−u) > 0."}], "core_terms": [{"term": "Интегральная показательная функция", "definition": "Специальная функция −Ei(−u) = ∫_u^∞ (e^{-x}/x) dx, задающая точное решение для линейного стока", "first_introduced_pdf_page": 481, "first_introduced_printed_page": "481", "cis_symbol": "−Ei(−u)", "west_symbol": "−Ei(−u) / W(u)", "west_term": "Exponential integral (Theis well function)", "unit": "б/р"}, {"term": "Основная формула упругого режима", "definition": "Зависимость падения давления Δp(r,t) = [Qμ/(4πkh)]·[−Ei(−r²/4κt)] при пуске скважины с постоянным дебитом", "first_introduced_pdf_page": 481, "first_introduced_printed_page": "481", "cis_symbol": "Δp(r,t)", "west_symbol": "Δp(r,t)", "west_term": "Line-source / Theis solution", "unit": "Па (МПа)"}], "threshold_concept": "Автомодельная переменная u = r²/(4κt) означает, что вдвое более далёкая точка пласта почувствует ту же депрессию в 4 раза позже.", "misconception_to_fix": "Ошибочно применять логарифмическую формулу Δp ~ ln(2,25κt/r²) при u > 0,1 (например, в удалённой наблюдательной скважине в первые минуты): она может выдать даже отрицательную депрессию вместо точного значения −Ei(−u) > 0.", "data_transfer": "На рис. 23.3 (стр. 491) и рис. 23.4 (стр. 493), а также в 4 синхронных панелях ролика 16:9: прямое сопоставление кривых p(r, t) по точному решению Ei и приближению ПССС.", "it_analogy_and_limits": "Аналогия с импульсной переходной характеристикой (impulse / step response) линейной системы: −Ei(−u) — это эталонный отклик пласта на ступенчатый запуск дебита Q. Граница: при достижении внешней границы пласта отклик отклоняется от бесконечного решения.", "specialist_manual_steps": ["Вычислить безразмерный аргумент u = r² / (4κt).", "Проверить условие применимости асимптотики: при u ≤ 0,01 использовать ln(2,25κt/r²), иначе взять −Ei(−u) по рис. 23.3.", "Вычислить Δp(r, t) = [Qμ / (4πkh)] · [−Ei(−u)] и построить профиль давления p(r, t) = p_0 − Δp."], "decision_points": ["Выбор между точным значением −Ei(−u) и логарифмической асимптотикой по критерию u ≤ 0,01.", "Определение момента, когда возмущение достигает соседней скважины (гидропрослушивание)."], "inefficiency_lens": {"inputs": ["Дебит Q, гидропроводность kh/μ, пьезопроводность κ, расстояние r и время работы t (рис. 23.3–23.4).", "Источник: стр. 481–493"], "manual_steps": ["Вычислить безразмерный аргумент u = r² / (4κt).", "Проверить условие применимости асимптотики: при u ≤ 0,01 использовать ln(2,25κt/r²), иначе взять −Ei(−u) по рис. 23.3.", "Вычислить Δp(r, t) = [Qμ / (4πkh)] · [−Ei(−u)] и построить профиль давления p(r, t) = p_0 − Δp."], "expert_judgment_points": ["Выбор между точным значением −Ei(−u) и логарифмической асимптотикой по критерию u ≤ 0,01.", "Определение момента, когда возмущение достигает соседней скважины (гидропрослушивание)."], "estimated_time_min": 22, "typical_errors": ["Ошибочно применять логарифмическую формулу Δp ~ ln(2,25κt/r²) при u > 0,1 (наприм , "order_rationale": "Следует после узла #3, опираясь на уже введённые термины и переходя от механизма к количественной оценке и принятию решения (стр. 494–500).", "source_heading": "Глава XXIV, § 1. Метод последовательной смены стационарных состояний И.А. Чарного (Рис. 24.1–24.3, стр. 494–500)", "step_title": "Метод последовательной смены стационарных состояний", "summary_2_3_sentences": "Метод последовательной смены стационарных состояний (ПССС) И.А. Чарного заменяет сложную неустановившуюся задачу цепочкой квазистационарных воронок Дюпюи, ограниченных подвижным радиусом возмущённой области R(t) (рис. 24.1–24.3). За пределами R(t) пласт считается невозмущённым (p = p_0), а закон роста R(t) находится из уравнения материального баланса упругой жидкости: для плоскорадиального потока R(t) ~ √(κt).", "primary_difficulty": "conceptual_mechanism", "secondary_difficulty": "mathematical_derivation", "primary_difficulty_code": "М", "secondary_difficulty_code": "Ф", "estimated_minutes": 10, "mechanism": "Объём жидкости, отобранный скважиной за время t, приравнивается к объёму упругой жидкости, высвободившейся внутри возмущённой области радиуса R(t) при логарифмическом распределении давления Дюпюи — это даёт явный закон расширения фронта возмущения R(t).", "practice": "Инженер использует метод ПССС для быстрой наглядной оценки радиуса исследования R(t), средневзвешенного давления и дебита при переменном режиме, проверяя его расхождение с точным решением Ei.", "nuances": "На рис. 24.2–24.3 видно, что метод ПССС точно воспроизводит забойное давление и интегральный баланс, но искусственно обрывает воронку на конечном радиусе R(t), тогда как в точном решении Ei «хвост» возмущения тянется дальше.", "deeper_branch": "Сопоставление метода ПССС (§1 гл. XXIV) с интегральным методом А.М. Пирвердяна (§2, стр. 500, рис. 24.4) по точности описания профиля давления.", "quotes_and_pages": [{"unit_id": "train_basniev_p495_vlmfig_11", "pdf_page": 495, "printed_page": "495", "verbatim_quote": "━━━ FORMAT 6: XY PLOT / CHART WITH DATA ━━━\nОси: вертикальная ось — p (давление), без указанных единиц; горизонтальная ось — x (координата, направление вдоль пласта), без указанных единиц. Тип осей — линейный, диапазоны численно не подписаны, шкала качественная.\nОтмеченные (подписанные) уровни давления на вертикальной оси:\n- p_R — верхний горизонтальный уровень (максимальное/пластовое давление), обозначен пунктирной горизонтальной линией.\n- p_r1 — промежуточный уровень давления, ниже p_R.\n- p_r2 — нижний уровень давления, ниже p_r1.\nКривые/линии на графике:\n- Горизонтальная штриховая линия на ", "editorial_paraphrase": "Изложение по источнику (стр. 495): Метод последовательной смены стационарных состояний (ПССС) И.", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p496_par_11", "pdf_page": 496, "printed_page": "496", "verbatim_quote": "Случай 2. Приток к галерее, на которой поддерживается постоянное забойное давление $p_{\\mathrm{r}} = \\text{const}$. В таком же пласте, как и в случае 1, в момент времени $t = 0$ пущена эксплуатационная галерея с постоянным забойным давлением $p_{\\mathrm{r}} = \\text{const}$. До пуска галереи давление во всем пласте было одинаковым и равным $p_{\\mathrm{k}}$. Требуется найти распределение давления, закон перемещения границы возмущенной области $l(t)$ и изменение дебита галереи во времени $Q(t)$.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 496 (§1. Метод последовательной смены стационарных состояний · абзац #11).", "numbers_and_units": [], "conditions": ["В таком же пласте, как и в случае 1, в момент времени $t = 0$ пущена эксплуатационная галерея с постоянным забойным давлением $p_{\\mathrm{r}} = \\text{const}$."]}, {"unit_id": "train_basniev_p497_par_08", "pdf_page": 497, "printed_page": "497", "verbatim_quote": "Погрешность расчета дебита галереи по приближенной формуле (24.8) по сравнению с расчетами по точной формуле (23.27) составляет 11%. Следовательно, методом последовательной смены стационарных состояний лучше пользоваться в случае неустановившихся прямолинейно-параллельных потоков при заданной постоянной депрессии.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 497 (§1. Метод последовательной смены стационарных состояний · абзац #8).", "numbers_and_units": [], "conditions": ["Следовательно, методом последовательной смены стационарных состояний лучше пользоваться в случае неустановившихся прямолинейно-параллельных потоков при заданной постоянной депрессии."]}, {"unit_id": "train_basniev_p500_par_03", "pdf_page": 500, "printed_page": "500", "verbatim_quote": "Распределение давления в области фильтрации, получаемое по методу ПССС, является довольно грубым приближением; гораздо точнее этим методом дается связь между дебитом и депрессией, особенно в случае радиальной фильтрации.", "editorial_paraphrase": "Анализ единицы paragraph на стр. 500 (§1. Метод последовательной смены стационарных состояний · абзац #3).", "numbers_and_units": [], "conditions": ["Распределение давления в области фильтрации, получаемое по методу ПССС, является довольно грубым приближением; гораздо точнее этим методом дается связь между дебитом и депрессией, особенно в случае радиальной фильтрации."]}, {"unit_id": "train_basniev_p495_eq_08", "pdf_page": 495, "printed_page": "495", "verbatim_quote": "$$p(x, t) = p_к - \\frac{Q\\mu}{kBh} (l(t) - x), \\quad 0 \\leq x \\leq l(t). \\quad (24.1)$$  Требуется найти закон перемещения во времени внешней границы возмущенной области $l(t)$.  Воспользуемся соотношением (23.7), которое выражает условие того, что количество добытой продукции за время $dt$ равно изменению упругого запаса жидкости в возмущенной зоне пласта за тот же промежуток времени,  $$Qdt = \\beta^* d[V(t)\\Delta p], \\quad (24.2)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 495 (§1. Метод последовательной смены стационарных состояний · формула #8).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p495_eq_10", "pdf_page": 495, "printed_page": "495", "verbatim_quote": "$$V(t) = Bh l(t); \\quad (24.3)$$  $$\\Delta p = p_к - \\bar{p} = p_к - \\frac{p_к + p_г}{2} = \\frac{p_к - p_г}{2}. \\quad (24.4)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 495 (§1. Метод последовательной смены стационарных состояний · формула #10).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p495_fig_24_1_12", "pdf_page": 495, "printed_page": "495", "verbatim_quote": "Рис. 24.1. Кривые распределения давления в прямолинейно-параллельном потоке по методу ПССС", "editorial_paraphrase": "Анализ единицы Рис. 24.1 на стр. 495 (§1. Метод последовательной смены стационарных состояний · Рис. 24.1).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p496_eq_03", "pdf_page": 496, "printed_page": "496", "verbatim_quote": "$$Q = \\frac{k}{\\mu} \\frac{p_{\\mathrm{k}} - p_{\\mathrm{r}}}{l(t)} Bh,$$  откуда  $$\\frac{Q \\mu l(t)}{2kBh} = \\frac{p_{\\mathrm{k}} - p_{\\mathrm{r}}}{2}. \\quad (24.5.)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 496 (§1. Метод последовательной смены стационарных состояний · формула #3).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p496_eq_05", "pdf_page": 496, "printed_page": "496", "verbatim_quote": "$$Q = \\beta^* \\frac{d}{dt} \\left( Bhl \\frac{Q \\mu l}{2kBh} \\right),$$  или, так как $Q = \\text{const}$,  $$2Q = \\frac{\\beta^* \\mu}{k} Q \\frac{d}{dt} (l^2),$$", "editorial_paraphrase": "Анализ единицы formula на стр. 496 (§1. Метод последовательной смены стационарных состояний · формула #5).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p496_eq_07", "pdf_page": 496, "printed_page": "496", "verbatim_quote": "$$2\\kappa dt = dl^2 \\quad (\\kappa = k/(\\mu \\beta^*)).$$  Проинтегрируем полученное соотношение и найдем  $$l(t) = \\sqrt{2\\kappa t}. \\quad (24.6)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 496 (§1. Метод последовательной смены стационарных состояний · формула #7).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p496_eq_09", "pdf_page": 496, "printed_page": "496", "verbatim_quote": "$$p(x, t) = p_{\\mathrm{k}} - \\frac{Q \\mu}{kBh} (\\sqrt{2\\kappa t} - x), \\quad 0 \\leq x \\leq \\sqrt{2\\kappa t}, \\quad (24.7)$$  $$p(x, t) = p_{\\mathrm{k}}, \\quad x > \\sqrt{2\\kappa t}.$$", "editorial_paraphrase": "Анализ единицы formula на стр. 496 (§1. Метод последовательной смены стационарных состояний · формула #9).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p496_eq_13", "pdf_page": 496, "printed_page": "496", "verbatim_quote": "$$Q(t) = \\frac{k(p_{\\mathrm{k}} - p_{\\mathrm{r}})}{\\mu l(t)} Bh = \\frac{k}{\\mu} Bh \\left. \\frac{\\partial p}{\\partial x} \\right|_{x=0}.$$", "editorial_paraphrase": "Анализ единицы formula на стр. 496 (§1. Метод последовательной смены стационарных состояний · формула #13).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p497_eq_03", "pdf_page": 497, "printed_page": "497", "verbatim_quote": "$$V(t) = B h l(t),$$  $$\\Delta p = p_\\kappa - \\bar{p} = p_\\kappa - \\frac{p_\\kappa + p_\\tau}{2} = \\frac{p_\\kappa - p_\\tau}{2},$$", "editorial_paraphrase": "Анализ единицы formula на стр. 497 (§1. Метод последовательной смены стационарных состояний · формула #3).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p497_eq_04", "pdf_page": 497, "printed_page": "497", "verbatim_quote": "$$Q(t) = \\frac{k(p_\\kappa - p_\\tau)}{\\mu l(t)} Bh.$$  Таким образом, в результате получим  $$\\frac{k(p_\\kappa - p_\\tau)}{\\mu l(t)} Bh dt = \\beta^* d \\left[ Bhl \\frac{p_\\kappa - p_\\tau}{2} \\right].$$", "editorial_paraphrase": "Анализ единицы formula на стр. 497 (§1. Метод последовательной смены стационарных состояний · формула #4).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p497_eq_06", "pdf_page": 497, "printed_page": "497", "verbatim_quote": "$$l(t) = 2\\sqrt{\\kappa t}.$$  Следовательно, распределение давления в возмущенной зоне пласта определяется соотношением  $$p(x, t) = p_\\kappa - (p_\\kappa - p_\\tau) \\left( 1 - \\frac{x}{2\\sqrt{\\kappa t}} \\right), \\quad 0 < x \\leq 2\\sqrt{\\kappa t}, \\quad (24.8)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 497 (§1. Метод последовательной смены стационарных состояний · формула #6).", "numbers_and_units": [], "conditions": []}, {"unit_id": "train_basniev_p497_eq_07", "pdf_page": 497, "printed_page": "497", "verbatim_quote": "$$p(x, t) = p_\\kappa, \\quad x > 2\\sqrt{\\kappa t},$$  а дебит галереи – соотношением  $$Q(t) = \\frac{k(p_\\kappa - p_\\tau)}{\\mu 2\\sqrt{\\kappa t}} Bh. \\quad (24.9)$$", "editorial_paraphrase": "Анализ единицы formula на стр. 497 (§1. Метод последовательной смены стационарных состояний · формула #7).", "numbers_and_units": [], "conditions": []}], "epistemic_split": {"observation": "Параметры пласта (k, μ, h, κ), режим работы скважины и время t (рис. 24.1–24.3).", "inference": "Расчёт подвижного радиуса возмущённой области R(t) = √(r_с² + 4κt) (27,6 м за 0,25 ч; 67,5 м за 1,5 ч; 135,0 м за 6 ч) и сопоставление с точным решением −Ei(−u).", "assumption": "Допущение квазистационарного логарифмического профиля давления внутри r ≤ R(t) и невозмущённого пласта при r > R(t)."}, "field_provenance": {"source_heading": "source_verbatim", "step_title": "editorial_synthesis_3_7_words", "summary_2_3_sentences": "editorial_synthesis_grounded_in_quotes", "mechanism": "source_grounded_domain_explanation", "practice": "specialist_workflow_from_textbook", "nuances": "source_applicability_conditions", "deeper_branch": "advanced_textbook_extension", "quotes_and_pages": "source_verbatim_with_pdf_page", "epistemic_split": "epistemic_decomposition_t3", "inefficiency_lens": "specialist_workflow_lens", "core_terms": "passport_and_textbook_definitions", "worked_example": "textbook_worked_example", "computed_values": "physics_engine_deterministic" riants": ["PHYS-BAS-01..07: кадр 1:1 перед растяжением ×12,5, поток к низкому давлению, баланс массы Q = const, R(t) ~ √(4κt)"], "assumptions": ["Однородный изотропный пласт постоянной толщины h = 14 м", "Слабосжимаемая однофазная жидкость", "Линейный закон Дарси (Re < Re_кр)"], "scales": {"true_scale": "1:1 (h=14 м против R_к=250 м, 1:17,86)", "vertical_exaggeration": 12.5, "resolution": "1920x1080@30fps"}, "synchronized_views": ["Разрез пласта (1:1 и ×12,5)", "Воронка депрессии p(r, t)", "Профиль скорости w(r)", "Шкала решения: Ei vs ПССС R(t)"], "source": {"book_file": "train_basniev.md", "chapter_id": "basniev_ch23_24", "pdf_pages": "474–500", "layer_hash": "f15d4a8ccf9523c6"}}], "steps": [{"step_id": "basniev_ch23_24_step_01", "node_id": "basniev_ch23_24_node_01", "order": 1, "estimated_minutes": 8, "difficulty_codes": ["М", "Ф"], "source_heading": "Глава XXIII, § 1–§ 2. Упругий режим пласта и подсчёт упругого запаса жидкости (стр. 474–476)", "step_title": "Упругий режим и упругий запас пласта", "summary_2_3_sentences": "При снижении пластового давления жидкость расширяется, а пористый скелет сжимается под весом вышележащих пород — высвобождаемый объём формирует упругий режим работы пласта. Даже малые коэффициенты сжимаемости жидкости β_ж и породы β_с на масштабах огромного пласта дают существенный упругий запас жидкости, пропорциональный коэффициенту упругоёмкости β* = m·β_ж + β_с.", "explanation_paragraphs": [{"role": "Физико-геологический механизм", "text": "Снижение порового давления Δp вызывает одновременно два вклада в приток: упругое расширение поровой жидкости (m·β_ж·Δp) и уменьшение объёма пор за счёт роста эффективного напряжения на скелет породы (β_с·Δp).", "unit_id": "train_basniev_p476_eq_03", "pdf_page": 476, "printed_page": "476", "source_citation": "Источник: PDF стр. 476 (печ. стр. 476), ед. train_basniev_p476_eq_03", "verbatim_quote": "$$- \\beta_{\\text{ж}} V_{0\\text{ж}} \\Delta p = \\Delta V_{\\text{ж}} \\quad \\text{и} \\quad \\beta_{\\text{с}} V_0 \\Delta p = \\Delta V_{\\text{п}}.$$  Для дальнейшего использования этих формул необходимо внести некоторые уточнения. При определении формулы для коэффициента объемного сжатия жидкости $\\beta_{\\text{ж}}$ считалось, что на жидкость действует только сжимающее гидростатическое давление, поэтому при увеличении давления (сжатие) объем жидкости уменьшается и, наоборот, при уменьшении давления объе"}, {"role": "Практика работы специалиста", "text": "Инженер оценивает упругий запас жидкости в замкнутой залежи или крупной водонапорной системе ΔV = β*·V_пл·Δp до прихода контурных вод или запуска ППД.", "unit_id": "train_basniev_p476_eq_05", "pdf_page": 476, "printed_page": "476", "source_citation": "Источник: PDF стр. 476", "verbatim_quote": "$$V_{0\\text{ж}} = m V_0, \\quad (23.2)$$  $m$ – пористость пласта.  Тогда формулу (23.1) с учетом равенства (23.2) можно переписать в следующем виде:  $$\\Delta V_{\\text{з}} = (m \\beta_{\\text{ж}} + \\beta_{\\text{с}}) V_0 \\Delta p, \\quad (23.3)$$"}, {"role": "Пороговая идея и перенос в данные", "text": "«Несжимаемая» нефть и твёрдая порода на масштабе пласта ведут себя как гигантская сжатая пружина, способная выдавать миллионы кубометров жидкости за счёт упругой энергии. Перенос в данные: В паспорте расчёта 3D Hydro Lab: при m = 0,18, β_ж = 1,2·10⁻⁹ Па⁻¹, β_с = 1,0·10⁻¹⁰ Па⁻¹ получаем β* = 3,16·10⁻¹⁰ Па⁻¹.", "unit_id": "train_basniev_p476_eq_03", "pdf_page": 476, "printed_page": "476", "source_citation": "Источник: PDF стр. 476 (печ. стр. 476)", "verbatim_quote": "$$- \\beta_{\\text{ж}} V_{0\\text{ж}} \\Delta p = \\Delta V_{\\text{ж}} \\quad \\text{и} \\quad \\beta_{\\text{с}} V_0 \\Delta p = \\Delta V_{\\text{п}}.$$  Для дальнейшего использования этих формул необходимо внести некоторые уточнения. При определении формулы для коэффициента объемного сжатия жидкости $\\beta_{\\text{ж}}$ считалось, что на жидкость действует только сжимающее гидростатическое давление, поэтому при увеличении давления (сжатие) объем жидкости рость распространения возмущений давления в пласте.", "explanation_paragraphs": [{"role": "Физико-геологический механизм", "text": "Локальный дисбаланс притока и оттока массы жидкости в элементарном объёме породы компенсируется изменением массы за счёт упругого сжатия/расширения, что математически эквивалентно уравнению теплопроводности Фурье.", "unit_id": "train_basniev_p477_eq_03", "pdf_page": 477, "printed_page": "477", "source_citation": "Источник: PDF стр. 477 (печ. стр. 477), ед. train_basniev_p477_eq_03", "verbatim_quote": "$$\\Delta p = p_\\kappa - \\bar{p}, \\quad (23.6)$$  где $p_\\kappa$ – начальное пластовое давление; $\\bar{p}$ – средневзвешенное по объему возмущенной части пласта $V_0$ давление.  Вычислить средневзвешенное пластовое давление $\\bar{p}$ можно, если известна геометрия возмущенной части пласта и конкретное распределение давления в ней.  Дифференцируя равенство (23.4), получим  $$d(\\Delta V_3) = \\beta^* d[V_0(t) \\Delta p].$$"}, {"role": "Практика работы специалиста", "text": "Инженер вычисляет коэффициент пьезопроводности κ = k / (μ·β*) в единицах СИ (м²/с), чтобы оценить характерное время релаксации давления t ~ L² / κ и выбрать длительность ГДИС.", "unit_id": "train_basniev_p477_eq_05", "pdf_page": 477, "printed_page": "477", "source_citation": "Источник: PDF стр. 477", "verbatim_quote": "$$d(\\Delta V_3) = Q(t) dt,$$  где $Q(t)$ – дебит всех скважин, эксплуатирующих данную нефтяную залежь.  Приравняв правые части двух последних равенств, получим дифференциальное уравнение истощения нефтяной залежи в условиях замкнуто-упругого режима  $$\\beta^* d[V_0(t) \\Delta p] = Q(t) dt. \\quad (23.7)$$"}, {"role": "Пороговая идея и перенос в данные", "text": "Давление в упругом пласте не «бежит» как ударная волна со скоростью звука, а диффундирует как тепло — со сглаживанием фронтов и масштабом времени t ~ r² / (4κ). Перенос в данные: В расчёте 3D Hydro Lab и паспорте ролика 16:9: при k = 120 мД, μ = 1,8 мПа·с, β* = 3,16·10⁻¹⁰ Па⁻¹ коэффициент κ = 0,211 м²/с.", "unit_id": "train_basniev_p477_eq_03", "pdf_page": 477, "printed_page": "477", "source_citation": "Источник: PDF стр. 477 (печ. стр. 477)", "verbatim_quote": "$$\\Delta p = p_\\kappa - \\bar{p}, \\quad (23.6)$$  где $p_\\kappa$ – начальное пластовое давление; $\\bar{p}$ – средневзвешенное по объему возмущенной части пласта $V_0$ давление.  Вычислить средневзвешенное пластовое давление $\\bar{p}$ можно, если известна геометрия возмущенной части пласта и конкретное распределение давления в ней.  Дифференцируя равенство (23.4), получим  $$d(\\Delta V_3) = \\beta^* d[V_0(t) \\Delta p].$$"}, {"role": "Сверка чтения с оригиналом (исправление OCR)", "text": "В тексте курса учтено исправление OCR по PDF-оригиналу: стр. 479: «∂p/∂t = χ Δp» → «\\frac{\\partial p}{\\partial t} = \\kappa \\nabla^2 p» (Унификация обозначения коэффициента пьезопроводности и оператора Лапласа в уравнении §4 главы XXIII.)", "unit_id": "train_basniev_p477_eq_03", "pdf_page": 479, "printed_page": "479", "source_citation": "Лист исправлений OCR: PDF стр. 479", "verbatim_quote": "\\frac{\\partial p}{\\partial t} = \\kappa \\nabla^2 p"}], "first_use_terms": [{"term": "Коэффициент пьезопроводности", "definition": "Параметр скорости перераспределения давления в упругом пласте κ = k / (μ·β*)", "first_introduced_pdf_page": 477, "first_introduced_printed_page": "477", "cis_symbol": "κ (χ)", "west_symbol": "η / D_h", "west_term": "Hydraulic diffusivity", "unit": "м²/с"}, {"term": "Уравнение пьезопроводности", "definition": "Дифференциальное уравнение параболического типа ∂p/∂t = κ·∇²p для нестационарной фильтрации", "first_introduced_pdf_page": 477, "first_introduced_printed_page": "477", "cis_symbol": "∂p/∂t = κ∇²p", "west_symbol": "∂p/∂t = η∇²p", "west_term": "Diffusivity equation", "unit": "Па/с"}], "formulas_decoded": [{"title": "Коэффициент пьезопроводности", "cis_formula": "κ (χ) (м²/с)", "west_formula": "η / D_h — Hydraulic diffusivity", "variables": {"κ (χ)": "Параметр скорости перера
