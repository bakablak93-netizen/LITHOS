istorical_context": "Ручная постановка линейной краевой задачи", "modern_analog": "Конечно-объёмные решатели (Eclipse / tNavigator / OPM Flow)", "modern_context": "Численное решение нелинейного уравнения с переменными k(x,y), μ(p), B(p)", "pdf_page": 477}], "it_analogy_and_limits": "Аналогия с диффузионным сглаживанием (Gaussian blur / heat kernel) на сетке: параметр κ играет роль коэффициента диффузии. Граница: при сильной неоднородности пласта κ становится тензором κ(x, y).", "typical_error": "Ошибочно путать коэффициент пьезопроводности κ (м²/с) с проницаемостью k (м²): при росте вязкости нефти μ или сжимаемости β* пьезопроводность κ падает, даже если проницаемость k высока.", "epistemic_split": {"observation": "Закон Дарси w = −(k/μ)∇p, уравнение неразрывности div(ρw) + ∂(ρm)/∂t = 0 и линейные законы сжимаемости.", "inference": "Вывод параболического уравнения ∂p/∂t = κ·∇²p и расчёт κ = 1,2·10⁻¹³ / (1,8·10⁻³ · 3,16·10⁻¹⁰) = 0,211 м²/с.", "assumption": "Однородный изотропный пласт, слабосжимаемая однофазная жидкость, пренебрежение членом (∇p)²."}, "specialist_manual_steps": ["Записать уравнение неразрывности с учётом зависимости ρ(p) и m(p).", "Подставить закон Дарси и оценить малость нелинейного слагаемого (∇p)².", "Вычислить коэффициент пьезопроводности κ = k / (μ·β*) в м²/с."], "decision_points": ["Проверка допустимости линейного уравнения пьезопроводности (жидкость vs газ).", "Выбор краевых и начальных условий (постоянный дебит Q = const или постоянное забойное давление p_с = const)."], "inefficiency_lens": {"inputs": ["Закон Дарси w = −(k/μ)∇p, уравнение неразрывности div(ρw) + ∂(ρm)/∂t = 0 и линейные законы сжимаемости.", "Источник: стр. 477–480"], "manual_steps": ["Записать уравнение неразрывности с учётом зависимости ρ(p) и m(p).", "Подставить закон Дарси и оценить малость нелинейного слагаемого (∇p)².", "Вычислить коэффициент пьезопроводности κ = k / (μ·β*) в м²/с."], "expert_judgment_points": ["Проверка допустимости линейного уравнения пьезопроводности (жидкость vs газ).", "Выбор краевых и начальных условий (постоянный дебит Q = const или постоянное забойное давление p_с = const)."], "estimated_time_min": 20, "typical_errors": ["Ошибочно путать коэффициент пьезопроводности κ (м²/с) с проницаемостью k (м²): при росте вязкости нефти μ или сжимаемости β* пьезопроводность κ падает, даже если проницаемость k высока."], "origin_tag": "computed"}, "deeper_branch": "Аналогия между уравнением пьезопроводности (давление p, пьезопроводность κ) и уравнением теплопроводности (температура T, температуропроводность a), позволяющая переносить готовые аналитические решения.", "illustration": {"illustration_id": "basniev_ch23_24_step_02_illust", "node_id": "basniev_ch23_24_node_02", "step_id": "basniev_ch23_24_step_02", "title": "Схема фильтрационной колонны Дарси и область линейного закона фильтрации", "visual_class": "C", "format_kind": "redraw_svg", "source_ref": "рис. 18.5, стр. 360 (установка Дарси и границы Re_кр)", "redraw_caption": "перерисовано по рис. 18.5, стр. 360", "pdf_page": 360, "printed_page": "477", "claim_id": "basniev_ch23_24_node_02_claim_01", "asset_rel_path": "illustrations/basniev_ch23_24_step_02_illust.svg", "svg_markup": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 420\" role=\"img\" aria-label=\"Схема фильтрационной колонны Дарси и область линейного закона фильтрации\">\n\n  <style>\n    .lithos-svg-bg { fill: var(--lithos-illust-bg, #0F172A); stroke: var(--lithos-illust-border, #334155); stroke-width: 1.5; }\n    .lithos-svg-panel { fill: var(--lithos-panel-bg, #1E293B); stroke: var(--lithos-illust-border, #334155); stroke-width: 1; }\n    .lithos-svg-title { fill: var(--lithos-text-main, #F8FAFC); font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }\n    .lithos-svg-sub { fill: var(--lithos-text-muted, #94A3B8); font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }\n    .lithos-svg-lbl { fill: var(--lithos-text-main, #F8FAFC); font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }\n    .lithos-pulse { animation: lithosPulse 3s infinite ease-in-out; }\n    @keyframes lithosPulse { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.55; } }\n    @media (prefers-reduced-motion: reduce) { .lithos-pulse { animation: none !important; } }\n  </style>\n  <rect x=\"2\" y=\"2\" width=\"756\" height=\"416\" rx=\"14\" class=\"lithos-svg-bg\" />\n  <text x=\"22\" y=\"30\" class=\"lithos-svg-title\">Схема фильтрационной колонны Дарси и область линейного закона фильтрации</text>\n  <text x=\"22\" y=\"49\" class=\"lithos-svg-sub\">Класс C · перерисовано по рис. 18.5, стр. 360 · Градиент давления Δp/L (МПа/м) vs скорость фильтрации w (м/сут), граница Re_кр</text>\n\n  <!-- Универсальная предметная схема (Баренблатт / Барабошкин / Седиментология и фильтрация) -->\n  <rect x=\"22\" y=\"64\" width=\"350\" height=\"308\" rx=\"10\" class=\"lithos-svg-panel\" />\n  <text x=\"36\" y=\"88\" class=\"lithos-svg-lbl\">Признаки и физико-геологический профиль</text>\n  <rect x=\"44\" y=\"112\" width=\"140\" height=\"220\" rx=\"8\" fill=\"#0284C7\" opacity=\"0.22\" stroke=\"#38BDF8\" />\n  <path d=\"M 55 315 L 165 265 L 135 205 L 85 130\" fill=\"none\" stroke=\"#10B981\" stroke-width=\"3.5\" />\n  <path d=\"M 170 315 L 95 255 L 130 190 L 175 130\" fill=\"none\" stroke=\"#F59E0B\" stroke-width=\"3\" stroke-dasharray=\"5 3\" />\n  <text x=\"200\" y=\"145\" fill=\"#10B981\" font-size=\"12\" font-weight=\"700\">Тренд FU (Пойнт-бар русла)</text>\n  <text x=\"200\" y=\"165\" class=\"lithos-svg-sub\">Эрозионный врез → утонение вверх</text>\n  <text x=\"200\" y=\"215\" fill=\"#F59E0B\" font-size=\"12\" font-weight=\"700\">Тренд CU (Устьевой бар дельты)</text>\n  <text x=\"200\" y=\"235\" class=\"lithos-svg-sub\">Продельта → укрупнение зерна вверх</text>\n\n  <rect x=\"388\" y=\"64\" width=\"350\" height=\"308\" rx=\"10\" class=\"lithos-svg-panel\" />\n  <text x=\"404\" y=\"88\" class=\"lithos-svg-lbl\">Математическая модель и граничные условия</text>\n  <text x=\"404\" y=\"124\" class=\"lithos-svg-lbl\">• Баланс массы: ∂(mρ)/∂t + div(ρu) = 0</text>\n  <text x=\"404\" y=\"152\" class=\"lithos-svg-lbl\">• Закон Дарси: u = −(k/μ)(grad p − ρg)</text>\n  <text x=\"404\" y=\"180\" class=\"lithos-svg-lbl\">• Критерий линейности: Re = u√k / ν &lt; Re_кр</text>\n  <text x=\"404\" y=\"220\" fill=\"#38BDF8\" font-size=\"12\" font-weight=\"700\">Единая легенда LITHOS:</text>\n  <rect x=\"404\" y=\"236\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#10B981\" /><text x=\"426\" y=\"248\" class=\"lithos-svg-sub\">Продуктивный коллектор / Нефть</text>\n  <rect x=\"404\" y=\"258\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#0284C7\" /><text x=\"426\" y=\"270\" class=\"lithos-svg-sub\">Пластовая вода / Фильтрат</text>\n  <rect x=\"404\" y=\"280\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#F59E0B\" /><text x=\"426\" y=\"292\" class=\"lithos-svg-sub\">Граничный порог / Воронка p(r)</text>\n  <rect x=\"404\" y=\"302\" width=\"14\" height=\"14\" rx=\"3\" fill=\"#64748B\" /><text x=\"426\" y=\"314\" class=\"lithos-svg-sub\">Глинистый экран / Продельта</text>\n\n  <!-- Нижняя строка единой легенды и подписи перерисовки -->\n  <text x=\"22\" y=\"402\" class=\"lithos-svg-sub\">Подпись: перерисовано по рис. 18.5, стр. 360 · Легенда LITHOS: ■ #10B981 Нефть/Коллектор  ■ #0284C7 Вода  ■ #D97706 Отсечка/Давление  ■ #7C3AED Риф/Карбонат  ■ #64748B Экран</text>\n</svg>\n", "legend_items": [{"role": "oil_pay", "label": "Нефтенасыщенный коллектор / приток нефти", "color": "#10B981", "symbol": "K_нг, ρ_п (нефть), Q_н", "units": "д.е. / %, Ом·м, м³/сут", "origin": "Внутренняя легенда LITHOS (требуется сверка при поступлении внешнего стайлгайда организаторов)"}, {"role": "formation_water", "label": "Пластовая вода / водоносная зона / фильтрат", "color": "#0284C7", "symbol": "ρ_в, ρ_вп, K_в, ВНК", "units": "Ом·м, %, м", "origin": "Внутренняя легенда LITHOS"}, {"role": "gas_cap", "label": "Газовая шапка / газонасыщенная зона", "color": "#E11D48", "symbol": "ГЖК / ГВК, K_г", "units": "м, %", "origin": "Внутренняя легенда LITHOS"}, {"role": "cutoff_pressure", "label": "Граничная отсечка / профиль давления p(r)", "color": "#D97706", "symbol": "α_СП*, P_н*, p(r), R(t)", "units": "д.е., МПа, м", "origin": "Внутренняя легенда LITHOS"}, {"role": "carbonate_reef_core", "label": "Ядро рифа / биогермный каркас / каверно-поровый доломит", "color": "#7C3AED", "symbol": "Фация 1 (ядро), K_п.кав", "units": "%, мкм² (мД)", "origin": "Внутренняя легенда LITHOS"}, {"role": "shale_seal", "label": "Глинистая покрышка / эвапоритовый экран / неколлектор", "color": "#64748B", "symbol": "C_гл, экран, продельта", "units": "%, м", "origin": "Внутренняя легенда LITHOS"}], "scale_and_units": "Градиент давления Δp/L (МПа/м) vs скорость фильтрации w (м/сут), граница Re_кр", "provenance_note": "Класс C: детерминированная кодовая генерация по источнику (рис. 18.5, стр. 360 (установка Дарси и границы Re_кр)). Открытые датасеты Volve / F3 отмечены как дополнительная возможность (не требуются для закрытия базового скана учебника)."}, "video_url": null, "video_vtt_url": null, "video_aspect": null, "media_passport_id": null, "ocr_corrections_applied": [{"correction_id": "ocr_bas_01", "book_file": "train_basniev.md", "pdf_page": 479, "printed_page": "479", "original_ocr": "∂p/∂t = χ Δp", "corrected_reading": "\\frac{\\partial p}{\\partial t} = \\kappa \\nabla^2 p", "rationale": "Унификация обозначения коэффициента пьезопроводности и оператора Лапласа в уравнении §4 главы XXIII.", "applied_in_node_id": "basniev_ch23_24_node_02", "applied_in_step_id": "basniev_ch23_24_step_02"}], "practicum": null, "data_decision_card": null}, {"step_id": "basniev_ch23_24_step_03", "node_id": "basniev_ch23_24_node_03", "order": 3, "estimated_minutes": 11, "difficulty_codes": ["Ф", "И"], "source_heading": "Глава XXIII, § 5 (5.1–5.2). Одномерные потоки и основная формула упругого режима (Рис. 23.1–23.4, стр. 481–493)", "step_title": "Точные решения и формула упругого режима Ei", "summary_2_3_sentences": "Для прямолинейно-параллельного потока (§5.1, рис. 23.1–23.2) решение уравнения пьезопроводности выражается через интеграл вероятностей erf(x / 2√(κt)), а для плоскорадиального притока к точечной скважине с постоянным дебитом Q (§5.2, рис. 23.3–23.4) — через основную формулу упругого режима с интегральной показательной функцией: Δp(r, t) = [Qμ / (4πkh)] · [−Ei(−r² / 4κt)]. При малых значениях аргумента u = r² / (4κt) < 0,01 справедлива логарифмическая асимптотика −Ei(−u) ≈ ln(2,25·κt / r²), лежащая в основе интерпретации ГДИС.", "explanation_paragraphs": [{"role": "Физико-геологический механизм", "text": "Пуск скважины с постоянным дебитом Q действует как линейный сток в бесконечном упругом пласте: воронка депрессии непрерывно углубляется и расширяется, а безразмерный аргумент u = r²/(4κt) объединяет пространство и время в единую автомодельную переменную.", "unit_id": "train_basniev_p484_vlmfig_05", "pdf_page": 484, "printed_page": "484", "source_citation": "Источник: PDF стр. 484 (печ. стр. 484), ед. train_basniev_p484_vlmfig_05", "verbatim_quote": "━━━ FORMAT 6: XY PLOT / CHART WITH DATA ━━━\n**График изменения давления p в зависимости от координаты x для разных моментов времени**\nОси:\n- Вертикальная ось — p (давление), линейная шкала, без числовых делений, кроме двух отмеченных горизонтальными штриховыми линиями уровней: pₖ (верхний уровень) и p₁ (нижний уровень, у оси x).\n- Горизонтальная ось — x (расстояние/координата), линейная шкала, без числовых делений.\nКривые (снято с графика, приблизительно):\n- Три кривые, каждая начинается в точке (x=0, p=p₁) и монотонно возрастает, приближаясь к уровню pₖ при увеличении x.\n- Кривые подписаны св"}, {"role": "Практика работы специалиста", "text": "Инженер вычисляет u = r²/(4κt), снимает −Ei(−u) по графику рис. 23.3 (или логарифмическому приближению при u < 0,01) и строит пьезометрические кривые p(r, t) (рис. 23.4) или определяет гидропроводность kh/μ по наклону графика Δp от ln t.", "unit_id": "train_basniev_p484_fig_23_1_06", "pdf_page": 484, "printed_page": "484", "source_citation": "Источник: PDF стр. 484", "verbatim_quote": "Рис. 23.1. Кривые распределения давления в различные моменты времени в неустановившемся прямолинейно-параллельном потоке упругой жидкости при условии $p_{\\mathrm{r}} = \\text{const}$"}, {"role": "Пороговая идея и перенос в данные", "text": "Автомодельная переменная u = r²/(4κt) означает, что вдвое более далёкая точка пласта почувствует ту же депрессию в 4 раза позже. Перенос в данные: На рис. 23.3 (стр. 491) и рис. 23.4 (стр. 493), а также в 4 синхронных панелях ролика 16:9: прямое сопоставление кривых p(r, t) по точному решению Ei и приближению ПССС.", "unit_id": "train_basniev_p484_vlmfig_05", "pdf_page": 484, "printed_page": "484", "source_citation": "Источник: PDF стр. 484 (печ. стр. 484)", "verbatim_quote": "━━━ FORMAT 6: XY PLOT / CHART WITH DATA ━━━\n**График изменения давления p в зависимости от координаты x для разных моментов времени**\nОси:\n- Вертикальная ось — p (давление), линейная шкала, без числовых делений, кроме двух отмеченных горизонтальными штриховыми линиями уровней: pₖ (верхний уровень) и p₁ (нижний уровень, у оси x).\n- Горизонтальная ось — x (расстояние/координата), линейная шкала, без числовых делений.\nКривые (снято с графика, приблизительно):\n- Три кривые, каждая начинается в точке (x=0, p=p₁) и монотонно возрастает, приближаясь к уровню pₖ при увеличении x.\n- Кривые подписаны св"}], "first_use_terms": [{"term": "Интегральная показательная функция", "definition": "Специальная функция −Ei(−u) = ∫_u^∞ (e^{-x}/x) dx, задающая точное решение для линейного стока", "first_introduced_pdf_page": 481, "first_introduced_printed_page": "481", "cis_symbol": "−Ei(−u)", "west_symbol": "−Ei(−u) / W(u)", "west_term": "Exponential integral (Theis well function)", "unit": "б/р"}, {"term": "Основная формула упругого режима", "definition": "Зависимость падения давления Δp(r,t) = [Qμ/(4πkh)]·[−Ei(−r²/4κt)] при пуске скважины с постоянным дебитом", "first_introduced_pdf_page": 481, "first_introduced_printed_page": "481", "cis_symbol": "Δp(r,t)", "west_symbol": "Δp(r,t)", "west_term": "Line-source / Theis solution", "unit": "Па (МПа)"}], "formulas_decoded": [{"title": "Интегральная показательная функция", "cis_formula": "−Ei(−u) (б/р)", "west_formula": "−Ei(−u) / W(u) — Exponential integral (Theis well function)", "variables": {"−Ei(−u)": "Специальная функция −Ei(−u) = ∫_u^∞ (e^{-x}/x) dx, задающая точное решение для линейного стока (СНГ)", "−Ei(−u) / W(u)": "Международное обозначение SPE/API (Exponential integral (Theis well function))"}, "source_ref": "PDF стр. 481 (печ. стр. 481)"}, {"title": "Основная формула упругого режима", "cis_formula": "Δp(r,t) (Па (МПа))", "west_formula": "Δp(r,t) — Line-source / Theis solution", "variables": {"Δp(r,t)": "Международное обозначение SPE/API (Line-source / Theis solution)"}, "source_ref": "PDF стр. 481 (печ. стр. 481)"}], "applicability_conditions": ["Логарифмическое приближение −Ei(−u) ≈ ln(2,25κt/r²) даёт погрешность менее 1 % только при u ≤ 0,01; при больших u (малых временах или больших расстояниях r) необходимо использовать точные значения функции Ei (рис. 23.3).", "Кривые распределения давления в различные моменты времени в неустановившемся прямолинейно-параллельном потоке упругой жидкости при условии $p_{\\mathrm{r}} = \\text{const}$", "Зависимости дебита и добычи жидкости от времени после пуска галереи при условии $p_г = \\text{const}$", "Для расчетов пластового давления в любой точке открытого кругового пласта в случае r ≤ 0,1 Rк, можно с высокой степенью точности (до 0,2%) пользоваться формулой (23.52) для бесконечного пласта, если при этом Rк ≥ 10⁵ rc, Fo ≤ 0,2."], "worked_example": {"status": "present", "not_applicable_reason": "", "problem_number": "Расчёт депрессии по рис. 23.3–23.4 (§5.2 гл. XXIII, стр. 491–493)", "figure_ref": "Рис. 23.3, Рис. 23.4", "pdf_page": 481, "printed_page": "481", "conditions": "Скважина пущена с Q = 180 м³/сут (2,083·10⁻³ м³/с) в пласте с kh/μ = 9,33·10⁻¹⁰ м³/(Па·с), κ = 0,211 м²/с; найти Δp на r = 20 м через t = 6 ч.", "steps": ["Вычисляем u = 20² / (4 · 0,211 · 21600) = 400 / 18230,4 = 0,02194.", "По рис. 23.3 находим −Ei(−0,02194) ≈ 3,26.", "Получаем Δp = [2,083·10⁻³ / (4π · 9,33·10⁻¹⁰)] · 3,26 ≈ 0,58 МПа."], "result": "На расстоянии 20 м от скважины давление снизится на 0,58 МПа за 6 часов."}, "textbook_problems": [], "tables": [{"title": "Сводная таблица параметров и терминологического моста (Шаг 3)", "headers": ["Параметр / Термин", "Обозначение СНГ", "Международный аналог (West)", "Единицы", "Определение и страница источника"], "rows": [["Интегральная показательная функция", "−Ei(−u)", "−Ei(−u) / W(u) (Exponential integral (Theis well function))", "б/р", "Специальная функция −Ei(−u) = ∫_u^∞ (e^{-x}/x) dx, задающая точное решение для линейного стока [стр. 481]"], ["Основная формула упругого режима", "Δp(r,t)", "Δp(r,t) (Line-source / Theis solution)", "Па (МПа)", "Зависимость падения давления Δp(r,t) = [Qμ/(4πkh)]·[−Ei(−r²/4κt)] при пуске скважины с постоянным дебитом [стр. 481]"]]}], "modern_context": [{"historical_item": "График −Ei(−u) (рис. 23.3) и таблицы Янке–Эмде", "historical_context": "Ручной расчёт депрессии по табличным значениям", "modern_analog": "Интерпретация ГДИС в KAPPA Saphir / PanSystem", "modern_context": "Автоматическая подгонка кривой давления и её производной Бурде с учётом скин-фактора и границ", "pdf_page": 481}], "it_analogy_and_limits": "Аналогия с импульсной переходной характеристикой (impulse / step response) линейной системы: −Ei(−u) — это эталонный отклик пласта на ступенчатый запуск дебита Q. Граница: при достижении внешней границы пласта отклик отклоняется от бесконечного решения.", "typical_error": "Ошибочно применять логарифмическую формулу Δp ~ ln(2,25κt/r²) при u > 0,1 (например, в удалённой наблюдательной скважине в первые минуты): она может выдать даже отрицательную депрессию вместо точного значения −Ei(−u) > 0.", "epistemic_split": {"observation": "Дебит Q, гидропроводность kh/μ, пьезопроводность κ, расстояние r и время работы t (рис. 23.3–23.4).", "inference": "Расчёт падения давления Δp(r, t) по формуле Тейса–Щелкачёва через −Ei(−r² / 4κt) и сравнение с логарифмической асимптотикой.", "assumption": "Бесконечный однородный пласт, точечный сток (r_с → 0), постоянный дебит Q = const и отсутствие влияния границ."}, "specialist_manual_steps": ["Вычислить безразмерный аргумент u = r² / (4κt).", "Проверить условие применимости асимптотики: при u ≤ 0,01 использовать ln(2,25κt/r²), иначе взять −Ei(−u) по рис. 23.3.", "Вычислить Δp(r, t) = [Qμ / (4πkh)] · [−Ei(−u)] и построить профиль давления p(r, t) = p_0 − Δp."], "decision_points": ["Выбор между точным значением −Ei(−u) и логарифмической асимптотикой по критерию u ≤ 0,01.", "Определение момента, когда возмущение достигает соседней скважины (гидропрослушивание)."], "inefficiency_lens": {"inputs": ["Дебит Q, гидропроводность kh/μ, пьезопроводность κ, расстояние r и время работы t (рис. 23.3–23.4).", "Источник: стр. 481–493"], "manual_steps": ["Вычислить безразмерный аргумент u = r² / (4κt).", "Проверить условие применимости асимптотики: при u ≤ 0,01 использовать ln(2,25κt/r²), иначе взять −Ei(−u) по рис. 23.3.", "Вычислить Δp(r, t) = [Qμ / (4πkh)] · [−Ei(−u)] и построить профиль давления p(r, t) = p_0 − Δp."], "expert_judgment_points": ["Выбор между точным значением −Ei(−u) и логарифмической асимптотикой по критерию u ≤ 0,01.", "Определение момента, когда возмущение достигает соседней скважины (гидропрослушивание)."], "estimated_time_min": 22, "typical_errors": ["Ошибочно применять логарифмическую формулу Δp ~ ln(2,25κt/r²) при u > 0,1 (например, в удалённой наблюдательной скважине в первые минуты): она может выдать даже отрицательную депрессию вместо точного значения −Ei(−u) > 0."], "origin_tag": "computed"}, "deeper_branch": "Принцип суперпозиции для расчёта взаимодействия нескольких скважин и кривой восстановления давления (КВД) после остановки скважины.", "illustration": {"illustration_id": "basniev_ch23_24_step_03_illust", "node_id": "basniev_ch23_24_node_03", "step_id": "basniev_ch23_24_step_03", "title": "Плоскорадиальный приток к скважине, логарифмическая воронка депрессии p(r) и w(r) ~ 1/r", "visual_class": "A", "format_kind": "animated_svg", "source_ref": "рис. 20.3, стр. 416 (расчёт simulate_dupuit_flow: Q = 247,54 м³/сут)", "redraw_caption": "перерисовано по рис. 20.3, стр. 416", "pdf_page": 416, "printed_page": "484", "claim_id": "basniev_ch23_24_node_03_claim_01", "asset_rel_path": "illustrations/basniev_ch23_24_step_03_illust.svg", "svg_markup": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 420\" role=\"img\" aria-label=\"Плоскорадиальный приток к скважине, логарифмическая воронка депрессии p(r) и w(r) ~ 1/r\">\n\n  <style>\n    .lithos-svg-bg { fill: var(--lithos-illust-bg, #0F172A); stroke: var(--lithos-illust-border, #334155); stroke-width: 1.5; }\n    .lithos-svg-panel { fill: var(--lithos-panel-bg, #1E293B); stroke: var(--lithos-illust-border, #334155); stroke-width: 1; }\n    .lithos-svg-title { fill: var(--lithos-text-main, #F8FAFC); font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; }\n    .lithos-svg-sub { fill: var(--lithos-text-muted, #94A3B8); font-family: system-ui, -apple-system, sans-serif; font-size: 12px; }\n    .lithos-svg-lbl { fill: var(--lithos-text-main, #F8FAFC); font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 600; }\n    .lithos-pulse { animation: lithosPulse 3s infinite ease-in-out; }\n    @keyframes lithosPulse { 0%, 100% { opacity: 0.95; } 50% { opacity: 0.55; } }\n    @media (prefers-reduced-motion: reduce) { .lithos-pulse { animation: none !important; } }\n  </style>\n  <rect x=\"2\" y=\"2\" width=\"756\" height=\"416\" rx=\"14\" class=\"lithos-svg-bg\" />\n  <text x=\"22\" y=\"30\" class=\"lithos-svg-title\">Плоскорадиальный приток к скважине, логарифмическая воронка депрессии p(r) и w</text>\n  <text x=\"22\" y=\"49\" class=\"lithos-svg-sub\">Класс A · перерисовано по рис. 20.3, стр. 416 · Радиус r (0,1–250 м), давление p(r) (16,5–24,0 МПа), толщина h = 14 м</text>\n\n  <!-- Синхронный разрез пласта и график логарифмической воронки депрессии Дюпюи / ПССС -->\n  <rect x=\"22\" y=\"64\" width=\"440\" height=\"308\" rx=\"10\" class=\"lithos-svg-panel\" />\n  <text x=\"36\" y=\"86\" class=\"lithos-svg-lbl\">Профиль давления p(r) и подвижный фронт R(t) = √(r_с² + 4κt)</text>\n  <!-- Оси r (0..250 м) и p (16.5..24.0 МПа) -->\n  <line x1=\"64\" y1=\"110\" x2=\"64\" y2=\"325\" stroke=\"#94A3B8\" stroke-width=\"1.5\" />\n  <line x1=\"64\" y1=\"325\" x2=\"438\" y2=\"325\" stroke=\"#94A3B8\" stroke-width=\"1.5\" />\n  <line x1=\"64\" y1=\"128\" x2=\"438\" y2=\"128\" stroke=\"#0284C7\" stroke-width=\"1.5\" stroke-dasharray=\"5 3\" />\n  <text x=\"315\" y=\"122\" fill=\"#38BDF8\" font-size=\"11\" font-weight=\"700\">p_к = 24,0 МПа (R_к = 250 м)</text>\n  <!-- Логарифмическая кривая воронки депрессии -->\n  <path d=\"M 66 312 Q 86 185, 165 152 T 432 128\" fill=\"none\" stroke=\"#F59E0B\" stroke-width=\"3.5\" />\n  <path d=\"M 66 312 Q 82 210, 145 168 L 265 128\" fill=\"none\" stroke=\"#10B981\" stroke-width=\"2.5\" stroke-dasharray=\"6 3\" class=\"lithos-pulse\" />\n  <circle cx=\"66\" cy=\"312\" r=\"5\" fill=\"#E11D48\" />\n  <text x=\"76\" y=\"315\" fill=\"#F43F5E\" font-size=\"11\" font-weight=\"700\">p_с = 16,5 МПа (r_с = 0,1 м)</text>\n  <text x=\"155\" y=\"195\" fill=\"#10B981\" font-size=\"11\" font-weight=\"700\">Фронт ПССС R(6 ч) = 135,0 м</text>\n  <text x=\"180\" y=\"350\" class=\"lithos-svg-sub\">Радиус r, м (основная потеря напора — в призабойной зоне r &lt; 10 м)</text>\n\n  <!-- Правая панель: Истинный масштаб пласта vs вертикальное преувеличение -->\n  <rect x=\"478\" y=\"64\" width=\"260\" height=\"308\" rx=\"10\" class=\"lithos-svg-panel\" />\n  <text x=\"492\" y=\"86\" class=\"lithos-svg-lbl\">Масштаб пласта и расчёт Дюпюи</text>\n  <text x=\"492\" y=\"112\" class=\"lithos-svg-sub\">1) Истинный масштаб 1:1 (h=14м, R_к=250м):</text>\n  <rect x=\"492\" y=\"124\" width=\"228\" height=\"13\" fill=\"#10B981\" stroke=\"#A7F3D0\" stroke-width=\"1\" />\n  <line x1=\"606\" y1=\"116\" x2=\"606\" y2=\"144\" stroke=\"#F43F5E\" stroke-width=\"2\" />\n  <text x=\"492\" y=\"156\" class=\"lithos-svg-sub\">Отношение h / R_к = 14 / 250 = 1 : 17,9</text>\n  <text x=\"492\" y=\"186\" fill=\"#F59E0B\" font-size=\"12\" font-weight=\"700\">Метрики модели (Вычисление):</text>\n  <text x=\"492\" y=\"210\" class=\"lithos-svg-lbl\">• Q = 247,54 м³/сут</text>\n  <text x=\"492\" y=\"232\" class=\"lithos-svg-lbl\">• C = 33,01 м³/(сут·МПа)</text>\n  <text x=\"492\" y=\"254\" class=\"lithos-svg-lbl\">• κ = 0,211 м²/с</text>\n  <text x=\"492\" y=\"276\" class=\"lithos-svg-lbl\">• w(r_с) = 2,38 мм/с</text>\n  <text x=\"492\" y=\"314\" class=\"lithos-svg-sub\">[Допущение]: однофазный изотермический</text>\n  <text x=\"492\" y=\"330\" class=\"lithos-svg-sub\">поток Дарси в однородном пласте</text>\n\n  <!-- Нижняя строка единой легенды и подписи перерисовки -->\n  <text x=\"22\" y=\"402\" class=\"lithos-svg-sub\">Подпись: перерисовано по рис. 20.3, стр. 416 · Легенда LITHOS: ■ #10B981 Нефть/Коллектор  ■ #0284C7 Вода  ■ #D97706 Отсечка/Давление  ■ #7C3AED Риф/Карбонат  ■ #64748B Экран</text>\n</svg>\n", "legend_items": [{"role": "oil_pay", "label": "Нефтенасыщенный коллектор / приток нефти", "color": "#10B981", "symbol": "K_нг, ρ_п (нефть), Q_н", "units": "д.е. / %, Ом·м, м³/сут", "origin": "Внутренняя легенда LITHOS (требуется сверка при поступлении внешнего стайлгайда организаторов)"}, {"role": "formation_water", "label": "Пластовая вода / водоносная зона / фильтрат", "color": "#0284C7", "symbol": "ρ_в, ρ_вп, K_в, ВНК", "units": "Ом·м, %, м", "origin": "Внутренняя легенда LITHOS"}, {"role": "gas_cap", "label": "Газовая шапка / газонасыщенная зона", "color": "#E11D48", "symbol": "ГЖК / ГВК, K_г", "units": "м, %", "origin": "Внутренняя легенда LITHOS"}, {"role": "cutoff_pressure", "label": "Граничная отсечка / профиль давления p(r)", "color": "#D97706", "symbol": "α_СП*, P_н*, p(r), R(t)", "units": "д.е., МПа, м", "origin": "Внутренняя легенда LITHOS"}, {"role": "carbonate_reef_core", "label": "Ядро рифа / биогермный каркас / каверно-поровый доломит", "color": "#7C3AED", "symbol": "Фация 1 (ядро), K_п.кав", "units": "%, мкм² (мД)", "origin": "Внутренняя легенда LITHOS"}, {"role": "shale_seal", "label": "Глинистая покрышка / эвапоритовый экран / неколлектор", "color": "#64748B", "symbol": "C_гл, экран, продельта", "units": "%, м", "origin": "Внутренняя легенда LITHOS"}], "scale_and_units": "Радиус r (0,1–250 м), давление p(r) (16,5–24,0 МПа), толщина h = 14 м", "provenance_note": "Класс A: детерминированная кодовая генерация по источнику (рис. 20.3, стр. 416 (расчёт simulate_dupuit_flow: Q = 247,54 м³/сут)). Открытые датасеты Volve / F3 отмечены как дополнительная возможность (не требуются для закрытия базового скана учебника)."}, "video_url": null, "video_vtt_url": null, "video_aspect": null, "media_passport_id": null, "ocr_corrections_applied": [], "practicum": null, "data_decision_card": {"title": "Решение на данных: выбор способа интенсификации притока по воронке депрессии и ПССС", "origin_and_assumptions": "Симуляция `basniev_hydro` (Дюпюи + ПССС И.А. Чарного, Гл. XX–XXIV, стр. 416–500): однородный пласт h=14 м, k=120 мД, μ=1,8 мПа·с, R_к=250 м, r_с=0,10 м; линейный закон Дарси.", "observed_features": [{"label": "Забойное давление p_с / Контурное p_к", "value": "9,0 / 24,0 МПа (Δp = 15,0 МПа)"}, {"label": "Падение давления в первых 5 м от ствола", "value": "7,5 МПа (50% всей депрессии)"}, {"label": "Рост дебита при удвоении r_с (0,10 → 0,20 м)", "value": "247,5 → 272,2 м³/сут (+9,9%)"}, {"label": "Фронт возмущения ПССС R(t) при t=6 ч и κ=0,211 м²/с", "value": "135,0 м (квадратичный рост t ~ R²)"}], "decision_rule": "Если Δp сосредоточена в призабойной зоне (r < 5 м), геометрическое расширение r_с под логарифмом ln(R_к/r_с) даёт <10% эффекта — требуется обработка призабойной зоны (рост k_пзп) или ГРП; для увеличения радиуса исследования в N раз время t увеличивают в N² раз.", "rule_limits": "Правило Дюпюи и ПССС перестаёт работать при нелинейной фильтрации (большие числа Рейнольдса у забоя при газе), двухфазном притоке ниже давления насыщения или наличии тектонических экранов ближе R(t).", "question": "К какому решению ведут эти данные, если цель — удвоить дебит скважины при текущем пластовом давлении?", "options": [{"id": "opt_rc", "label": "Разбурить ствол скважины r_с с 0,10 до 0,20 м (даст кратный рост дебита)", "correct": false, "feedback": "Неверно: r_с стоит под знаком ln(R_к/r_с), удвоение r_с даёт лишь +9,9% дебита."}, {"id": "opt_opz", "label": "Провести ОПЗ/ГРП для повышения проницаемости призабойной зоны (где теряется 50% депрессии)", "correct": true, "feedback": "Верно! Проницаемость k входит в формулу Дюпюи линейно, а основная потеря давления происходит именно в первых метрах у ствола."}, {"id": "opt_time", "label": "Увеличить время пуска в 2 раза — это вдвое поднимет установившийся дебит Дюпюи", "correct": false, "feedback": "Неверно: время t увеличивает радиус воронки R(t) ~ √t, но не меняет установившийся перепад Δp."}]}}, {"step_id": "basniev_ch23_24_step_04", "node_id": "basniev_ch23_24_node_04", "order": 4, "estimated_minutes": 10, "difficulty_codes": ["М", "Ф"], "source_heading": "Глава XXIV, § 1. Метод последовательной смены стационарных состояний И.А. Чарного (Рис. 24.1–24.3, стр. 494–500)", "step_title": "Метод последовательной смены стационарных состояний", "summary_2_3_sentences": "Метод последовательной смены стационарных состояний (ПССС) И.А. Чарного заменяет сложную неустановившуюся задачу цепочкой квазистационарных воронок Дюпюи, ограниченных подвижным радиусом возмущённой области R(t) (рис. 24.1–24.3). За пределами R(t) пласт считается невозмущённым (p = p_0), а закон роста R(t) находится из уравнения материального баланса упругой жидкости: для плоскорадиального потока R(t) ~ √(κt).", "explanation_paragraphs": [{"role": "Физико-геологический механизм", "text": "Объём жидкости, отобранный скважиной за время t, приравнивается к объёму упругой жидкости, высвободившейся внутри возмущённой области радиуса R(t) при логарифмическом распределении давления Дюпюи — это даёт явный закон расширения фронта возмущения R(t).", "unit_id": "train_basniev_p495_vlmfig_11", "pdf_page": 495, "printed_page": "495", "source_citation": "Источник: PDF стр. 495 (печ. стр. 495), ед. train_basniev_p495_vlmfig_11", "verbatim_quote": "━━━ FORMAT 6: XY PLOT / CHART WITH DATA ━━━\nОси: вертикальная ось — p (давление), без указанных единиц; горизонтальная ось — x (координата, направление вдоль пласта), без указанных единиц. Тип осей — линейный, диапазоны численно не подписаны, шкала качественная.\nОтмеченные (подписанные) уровни давления на вертикальной оси:\n- p_R — верхний горизонтальный уровень (максимальное/пластовое давление), обозначен пунктирной горизонтальной линией.\n- p_r1 — промежуточный уровень давления, ниже p_R.\n- p_r2 — нижний уровень давления, ниже p_r1.\nКривые/линии на графике:\n- Горизонтальная штриховая линия на "}, {"role": "Практика работы специалиста", "text": "Инженер использует метод ПССС для быстрой наглядной оценки радиуса исследования R(t), средневзвешенного давления и дебита при переменном режиме, проверяя его расхождение с точным решением Ei.", "unit_id": "train_basniev_p496_par_11", "pdf_page": 496, "printed_page": "496", "source_citation": "Источник: PDF стр. 496", "verbatim_quote": "Случай 2. Приток к галерее, на которой поддерживается постоянное забойное давление $p_{\\mathrm{r}} = \\text{const}$. В таком же пласте, как и в случае 1, в момент времени $t = 0$ пущена эксплуатационная галерея с постоянным забойным давлением $p_{\\mathrm{r}} = \\text{const}$. До пуска галереи давление во всем пласте было одинаковым и равным $p_{\\mathrm{k}}$. Требуется найти распределение давления, закон перемещения границы возмущенной области $l(t)$ и изменение дебита галереи во времени $Q(t)$."}, {"role": "Пороговая идея и перенос в данные", "text": "ПССС делает невидимую диффузию давления физически осязаемой: нестационарный приток — это та же формула Дюпюи, но с расширяющимся контуром питания R(t) ~ √(κt). Перенос в данные: В 3D Hydro Lab и ролике 16:9 (Explainer по Басниеву): при κ = 0,211 м²/с радиус фронта ПССС растёт от 27,6 м (0,25 ч) до 67,5 м (1,5 ч) и 135,0 м (6,0 ч) с истинным масштабом 1:1 и вертикальным растяжением ×12,5.", "unit_id": "train_basniev_p495_vlmfig_11", "pdf_page": 495, "printed_page": "495", "source_citation": "Источник: PDF стр. 495 (печ. стр. 495)", "verbatim_quote": "━━━ FORMAT 6: XY PLOT / CHART WITH DATA ━━━\nОси: вертикальная ось — p (давление), без указанных единиц; горизонтальная ось — x (координата, направление вдоль пласта), без указанных единиц. Тип осей — линейный, диапазоны численно не подписаны, шкала качественная.\nОтмеченные (подписанные) уровни давления на вертикальной оси:\n- p_R — верхний горизонтальный уровень (максимальное/пластовое давление), обозначен пунктирной горизонтальной линией.\n- p_r1 — промежуточный уровень давления, ниже p_R.\n- p_r2 — нижний уровень давления, ниже p_r1.\nКривые/линии на графике:\n- Горизонтальная штриховая линия на "}, {"role": "Сверка чтения с оригиналом (исправление OCR)", "text": "В тексте курса учтено исправление OCR по PDF-оригиналу: стр. 498: «R(t) / r_c» → «R(t) / r_{\\text{с}}» (Восстановление кириллического индекса радиуса скважины («с») в формулах метода ПССС (§1 главы XXIV).)", "unit_id": "train_basniev_p495_vlmfig_11", "pdf_page": 498, "printed_page": "498", "source_citation": "Лист исправлений OCR: PDF стр. 498", "verbatim_quote": "R(t) / r_{\\text{с}}"}], "first_use_terms": [{"term": "Метод ПССС", "definition": "Метод последовательной смены стационарных состояний И.А. Чарного с подвижным контуром возмущения R(t)", "first_introduced_pdf_page": 494, "first_introduced_printed_page": "494", "cis_symbol": "ПССС", "west_symbol": "SSS", "west_term": "Successive Steady States method", "unit": "метод"}, {"term": "Радиус возмущённой области", "definition": "Подвижная граница R(t), до которой дошло ощутимое снижение давления к моменту времени t", "first_introduced_pdf_page": 494, "first_introduced_printed_page": "494", "cis_symbol": "R(t)", "west_symbol": "r_{inv}(t)", "west_term": "Radius of investigation", "unit": "м"}], "formulas_decoded": [{"title": "Метод ПССС", "cis_formula": "ПССС (метод)", "west_formula": "SSS — Successive Steady States method", "variables": {"ПССС": "Метод последовательной смены стационарных состояний И.А. Чарного с подвижным контуром возмущения R(t) (СНГ)", "SSS": "Международное обозначение SPE/API (Successive Steady States method)"}, "source_ref": "PDF стр. 494 (печ. стр. 494)"}, {"title": "Радиус возмущённой области", "cis_formula": "R(t) (м)", "west_formula": "r_{inv}(t) — Radius of investigation", "variables": {"R(t)": "Подвижная граница R(t), до которой дошло ощутимое снижение давления к моменту времени t (СНГ)", "r_{inv}(t)": "Международное обозначение SPE/API (Radius of investigation)"}, "source_ref": "PDF стр. 494 (печ. стр. 494)"}], "applicability_conditions": ["На рис. 24.2–24.3 видно, что метод ПССС точно воспроизводит забойное давление и интегральный баланс, но искусственно обрывает воронку на конечном радиусе R(t), тогда как в точном решении Ei «хвост» возмущения тянется дальше.", "В таком же пласте, как и в случае 1, в момент времени $t = 0$ пущена эксплуатационная галерея с постоянным забойным давлением $p_{\\mathrm{r}} = \\text{const}$.", "Следовательно, методом последовательной смены стационарных состояний лучше пользоваться в случае неустановившихся прямолинейно-параллельных потоков при заданной постоянной депрессии.", "Распределение давления в области фильтрации, получаемое по методу ПССС, является довольно грубым приближением; гора иуса дренирования и переход к псевдоустановившемуся режиму (PSS)", "pdf_page": 494}], "it_analogy_and_limits": "Аналогия с аппроксимацией гладкого ядра размытия окном конечного радиуса (truncated kernel): интегральная масса сохраняется точно, а вычислительная сложность падает в разы. Граница: вблизи самого фронта r ≈ R(t) профиль давления имеет искусственный излом.", "typical_error": "Ошибочно считать, что за 4 раза большее время фронт возмущения R(t) уйдёт в 4 раза дальше: из-за диффузионного закона √(κt) радиус охвата возрастает лишь в 2 раза.", "epistemic_split": {"observation": "Параметры пласта (k, μ, h, κ), режим работы скважины и время t (рис. 24.1–24.3).", "inference": "Расчёт подвижного радиуса возмущённой области R(t) = √(r_с² + 4κt) (27,6 м за 0,25 ч; 67,5 м за 1,5 ч; 135,0 м за 6 ч) и сопоставление с точным решением −Ei(−u).", "assumption": "Допущение квазистационарного логарифмического профиля давления внутри r ≤ R(t) и невозмущённого пласта при r > R(t)."}, "specialist_manual_steps": ["Записать стационарное распределение давления (формула Дюпюи) на отрезке от r_с до подвижного радиуса R(t).", "Из баланса упругого запаса в области r ≤ R(t) найти закон роста R(t) (рис. 24.3).", "Построить семейство кривых p(r, t) (рис. 24.2) и сверить забойное давление с точным решением Ei."], "decision_points": ["Выбор между быстрым инженерным расчётом ПССС и точным решением Ei в зависимости от требуемой точности на периферии r ≈ R(t).", "Оценка времени выхода воронки депрессии на реальную границу пласта R_к."], "inefficiency_lens": {"inputs": ["Параметры пласта (k, μ, h, κ), режим работы скважины и время t (рис. 24.1–24.3).", "Источник: стр. 494–500"], "manual_steps": ["Записать стационарное распределение давления (формула Дюпюи) на отрезке от r_с до подвижного радиуса R(t).", "Из баланса упругого запаса в области r ≤ R(t) найти закон роста R(t) (рис. 24.3).", "Построить семейство кривых p(r, t) (рис. 24.2) и сверить забойное давление с точным решением Ei."], "expert_j  масштабе пласта ведут себя как гигантская сжатая пружина, способная выдавать миллионы кубометров жидкости за счёт упругой энергии.", "Типичное заблуждение: Ошибочно считать, что при упругом режиме расширяется только нефть: сжатие поровых каналов скелета даёт до 30–50 % суммарной упругоёмкости β*.", "Параметры методики применяются без учёта граничных условий и литологии пласта", "Физический механизм не зависит от структуры порового пространства и свойств флюида"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: «Несжимаемая» нефть и твёрдая порода на масштабе пласта ведут себя как гигантская сжатая пружина, способная выдавать миллионы кубометров жидкости за счёт упругой энергии.", "explanation": "При снижении пластового давления жидкость расширяется, а пористый скелет сжимается под весом вышележащих пород — высвобождаемый объём формирует упругий режим работы пласта. Даже малые коэффициенты сжимаемости жидкости β_ж и породы β_с на масштабах огромного пласта дают существенный упругий запас жидкости, пропорциональный коэффициенту упругоёмкости β* = m·β_ж + β_с. (Нефтегазовая гидромеханика, Глава XXIII, § 1–§ 2. Упругий режим пласта и подсчёт упругого запаса жидкости (стр. 474–476), PDF стр. 476 (печ. стр. 476)).", "error_analysis": {"1": "Это известная ошибка интерпретации: Ошибочно считать, что при упругом режиме расширяется только нефть: сжатие поровых каналов скелета даёт до 30–50 % суммарной упругоёмкости β*.", "2": "Игнорирование граничных условий (Пренебрегать сжимаемостью породы β_с нельзя: для слабосцементированных коллекторов β_с сопоставима с m·β_ж, а для водонасыщенных пластов оба слагаемых одного порядка.) приводит к неверному решению.", "3": "В действительности механизм основан на том, что Снижение порового давления Δp вызывает одновременно два вклада в приток: упругое расширение поровой жидкости (m·β_ж·Δp) и уменьшение объёма пор за счёт роста эффективного напряжения на скелет породы (β_с·Δp)."}, "hint_steps": ["Обратите внимание на наблюдение: Объём пласта V_пл, пористость m, коэффициенты сжимаемости жидкости β_ж и скелета β_с, среднее падение давления Δp.", "Учтите физический механизм: Снижение порового давления Δp вызывает одновременно два вклада в приток: упругое расширение поровой жидкости (m·β_ж·Δp) и уменьшение объёма пор за счёт роста эффективного напряжения на скелет породы (β_с·Δp).", "Пороговая идея шага: «Несжимаемая» нефть и твёрдая порода на масштабе пласта ведут себя как гигантская сжатая пружина, способная выдавать миллионы кубометров жидкости за счёт упругой энергии."], "source_ref": "Нефтегазовая гидромеханика, Глава XXIII, § 1–§ 2. Упругий режим пласта и подсчёт упругого запаса жидкости (стр. 474–476), PDF стр. 476 (печ. стр. 476)", "verbatim_quote": "$$- \\beta_{\\text{ж}} V_{0\\text{ж}} \\Delta p = \\Delta V_{\\text{ж}} \\quad \\text{и} \\quad \\beta_{\\text{с}} V_0 \\Delta p = \\Delta V_{\\text{п}}.$$  Для дальнейшего использования этих формул необходимо внести некоторые уточнения. При определении формулы для коэффициента объемного сжатия жидкости $\\beta_{\\text{ж}}$ считалось, что на жидкость действует только сжимающее гидростатическое давление, поэтому при увеличении давления (сжатие) объем жидкости уменьшается и, наоборот, при уменьшении давления объе"}, {"task_id": "t3_train_basniev_task_sc_02", "course_id": "t3_train_basniev", "node_id": "basniev_ch23_24_node_02", "step_id": "basniev_ch23_24_step_02", "claim_id": "basniev_ch23_24_node_02_claim_01", "pdf_page": 477, "printed_page": "477", "task_type": "single_choice", "difficulty_level": "базовый", "prompt": "Какое утверждение точно отражает ключевой физико-геологический принцип шага «Математическая модель и уравнение пьезопроводности» (Глава XXIII, § 3–§ 4. Математическая модель и вывод уравнения пьезопроводности (стр. 477–480))?", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": ["Верно по источнику: Давление в упругом пласте не «бежит» как ударная волна со скоростью звука, а диффундирует как тепло — со сглаживанием фронтов и масштабом времени t ~ r² / (4κ).", "Типичное заблуждение: Ошибочно путать коэффициент пьезопроводности κ (м²/с) с проницаемостью k (м²): при росте вязкости нефти μ или сжимаемости β* пьезопроводность κ падает, даже если проницаемость k высока.", "Параметры методики применяются без учёта граничных условий и литологии пласта", "Физический механизм не зависит от структуры порового пространства и свойств флюида"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: Давление в упругом пласте не «бежит» как ударная волна со скоростью звука, а диффундирует как тепло — со сглаживанием фронтов и масштабом времени t ~ r² / (4κ).", "explanation": "Совместная запись уравнения неразрывности, линейного закона Дарси и линейных уравнений состояния жидкости и скелета породы приводит к дифференциальному уравнению пьезопроводности: ∂p/∂t = κ·∇²p. Коэффициент пьезопроводности κ = k / (μ·β*) (м²/с) объединяет фильтрационную подвижность k/μ и упругоёмкость β*, задавая скорость распространения возмущений давления в пласте. (Нефтегазовая гидромеханика, Глава XXIII, § 3–§ 4. Математическая модель и вывод уравнения пьезопроводности (стр. 477–480), PDF стр. 477 (печ. стр. 477)).", "error_analysis": {"1": "Это известная ошибка интерпретации: Ошибочно путать коэффициент пьезопроводности κ (м²/с) с проницаемостью k (м²): при росте вязкости нефти μ или сжимаемости β* пьезопроводность κ падает, даже если проницаемость k высока.", "2": "Игнорирование граничных условий (Линеаризация уравнения пьезопроводности (отбрасывание квадратичного члена β_ж·(∇p)²) правомерна только для слабосжимаемых жидкостей при умеренных градиентах давления.) приводит к неверному решению.", "3": "В действительности механизм основан на том, что Локальный дисбаланс притока и оттока массы жидкости в элементарном объёме породы компенсируется изменением массы за счёт упругого сжатия/расширения, что математически эквивалентно уравнению теплопроводности Фурье."}, "hint_steps": ["Обратите внимание на наблюдение: Закон Дарси w = −(k/μ)∇p, уравнение неразрывности div(ρw) + ∂(ρm)/∂t = 0 и линейные законы сжимаемости.", "Учтите физический механизм: Локальный дисбаланс притока и оттока массы жидкости в элементарном объёме породы компенсируется изменением массы за счёт упругого сжатия/расширения, что математически эквивалентно уравнению теплопроводности Фурье.", "Пороговая идея шага: Давление в упругом пласте не «бежит» как ударная волна со скоростью звука, а диффундирует как тепло — со сглаживанием фронтов и масштабом времени t ~ r² / (4κ)."], "source_ref": "Нефтегазовая гидромеханика, Глава XXIII, § 3–§ 4. Математическая модель и вывод уравнения пьезопроводности (стр. 477–480), PDF стр. 477 (печ. стр. 477)", "verbatim_quote": "$$\\Delta p = p_\\kappa - \\bar{p}, \\quad (23.6)$$  где $p_\\kappa$ – начальное пластовое давление; $\\bar{p}$ – средневзвешенное по объему возмущенной части пласта $V_0$ давление.  Вычислить средневзвешенное пластовое давление $\\bar{p}$ можно, если известна геометрия возмущенной части пласта и конкретное распределение давления в ней.  Дифференцируя равенство (23.4), получим  $$d(\\Delta V_3) = \\beta^* d[V_0(t) \\Delta p].$$"}, {"task_id": "t3_train_basniev_task_sc_03", "course_id": "t3_train_basniev", "node_id": "basniev_ch23_24_node_03", "step_id": "basniev_ch23_24_step_03", "claim_id": "basniev_ch23_24_node_03_claim_01", "pdf_page": 484, "printed_page": "484", "task_type": "single_choice", "difficulty_level": "инженерный", "prompt": "Какое утверждение точно отражает ключевой физико-геологический принцип шага «Точные решения и формула упругого режима Ei» (Глава XXIII, § 5 (5.1–5.2). Одномерные потоки и основная формула упругого режима (Рис. 23.1–23.4, стр. 481–493))?", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": ["Верно по источнику: Автомодельная переменная u = r²/(4κt) означает, что вдвое более далёкая точка пласта почувствует ту же депрессию в 4 раза позже.", "Типичное заблуждение: Ошибочно применять логарифмическую формулу Δp ~ ln(2,25κt/r²) при u > 0,1 (например, в удалённой наблюдательной скважине в первые минуты): она может выдать даже отрицательную депрессию вместо точного значения −Ei(−u) > 0.", "Параметры методики применяются без учёта граничных условий и литологии пласта", "Физический механизм не зависит от структуры порового пространства и свойств флюида"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: Автомодельная переменная u = r²/(4κt) означает, что вдвое более далёкая точка пласта почувствует ту же депрессию в 4 раза позже.", "explanation": "Для прямолинейно-параллельного потока (§5.1, рис. 23.1–23.2) решение уравнения пьезопроводности выражается через интеграл вероятностей erf(x / 2√(κt)), а для плоскорадиального притока к точечной скважине с постоянным дебитом Q (§5.2, рис. 23.3–23.4) — через основную формулу упругого режима с интегральной показательной функцией: Δp(r, t) = [Qμ / (4πkh)] · [−Ei(−r² / 4κt)]. При малых значениях аргумента u = r² / (4κt) < 0,01 справедлива логарифмическая асимптотика −Ei(−u) ≈ ln(2,25·κt / r²), лежащая в основе интерпретации ГДИС. (Нефтегазовая гидромеханика, Глава XXIII, § 5 (5.1–5.2). Одномерные потоки и основная формула упругого режима (Рис. 23.1–23.4, стр. 481–493), PDF стр. 484 (печ. стр. 484)).", "error_analysis": {"1": "Это известная ошибка интерпретации: Ошибочно применять логарифмическую формулу Δp ~ ln(2,25κt/r²) при u > 0,1 (например, в удалённой наблюдательной скважине в первые минуты): она может выдать даже отрицательную депрессию вместо точного значения −Ei(−u) > 0.", "2": "Игнорирование граничных условий (Логарифмическое приближение −Ei(−u) ≈ ln(2,25κt/r²) даёт погрешность менее 1 % только при u ≤ 0,01; при больших u (малых временах или больших расстояниях r) необходимо использовать точные значения функции Ei (рис. 23.3).) приводит к неверному решению.", "3": "В действительности механизм основан на том, что Пуск скважины с постоянным дебитом Q действует как линейный сток в бесконечном упругом пласте: воронка депрессии непрерывно углубляется и расширяется, а безразмерный аргумент u = r²/(4κt) объединяет пространство и время в единую автомодельную переменную."}, "hint_steps": ["Обратите внимание на наблюдение: Дебит Q, гидропроводность kh/μ, пьезопроводность κ, расстояние r и время работы t (рис. 23.3–23.4).", "Учтите физический механизм: Пуск скважины с постоянным дебитом Q действует как линейный сток в бесконечном упругом пласте: воронка депрессии непрерывно углубляется и расширяется, а безразмерный аргумент u = r²/(4κt) объединяет пространство и время в единую автомодельную переменную.", "Пороговая идея шага: Автомодельная переменная u = r²/(4κt) означает, что вдвое более далёкая точка пласта почувствует ту же депрессию в 4 раза позже."], "source_ref": "Нефтегазовая гидромеханика, Глава XXIII, § 5 (5.1–5.2). Одномерные потоки и основная формула упругого режима (Рис. 23.1–23.4, стр. 481–493), PDF стр. 484 (печ. стр. 484)", "verbatim_quote": "━━━ FORMAT 6: XY PLOT / CHART WITH DATA ━━━\n**График изменения давления p в зависимости от координаты x для разных моментов времени**\nОси:\n- Вертикальная ось — p (давление), линейная шкала, без числовых делений, кроме двух отмеченных горизонтальными штриховыми линиями уровней: pₖ (верхний уровень) и p₁ (нижний уровень, у оси x).\n- Горизонтальная ось — x (расстояние/координата), линейная шкала, без числовых делений.\nКривые (снято с графика, приблизительно):\n- Три кривые, каждая начинается в точке (x=0, p=p₁) и монотонно возрастает, приближаясь к уровню pₖ при увеличении x.\n- Кривые подписаны св"}, {"task_id": "t3_train_basniev_task_sc_04", "course_id": "t3_train_basniev", "node_id": "basniev_ch23_24_node_04", "step_id": "basniev_ch23_24_step_04", "claim_id": "basniev_ch23_24_node_04_claim_01", "pdf_page": 495, "printed_page": "495", "task_type": "single_choice", "difficulty_level": "инженерный", "prompt": "Какое утверждение точно отражает ключевой физико-геологический принцип шага «Метод последовательной смены стационарных состояний» (Глава XXIV, § 1. Метод последовательной смены стационарных состояний И.А. Чарного (Рис. 24.1–24.3, стр. 494–500))?", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": ["Верно по источнику: ПССС делает невидимую диффузию давления физически осязаемой: нестационарный приток — это та же формула Дюпюи, но с расширяющимся контуром питания R(t) ~ √(κt).", "Типичное заблуждение: Ошибочно считать, что за 4 раза большее время фронт возмущения R(t) уйдёт в 4 раза дальше: из-за диффузионного закона √(κt) радиус охвата возрастает лишь в 2 раза.", "Параметры методики применяются без учёта граничных условий и литологии пласта", "Физический механизм не зависит от структуры порового пространства и свойств флюида"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: ПССС делает невидимую диффузию давления физически осязаемой: нестационарный приток — это та же формула Дюпюи, но с расширяющимся контуром питания R(t) ~ √(κt).", "explanation": "Метод последовательной смены стационарных состояний (ПССС) И.А. Чарного заменяет сложную неустановившуюся задачу цепочкой квазистационарных воронок Дюпюи, ограниченных подвижным радиусом возмущённой области R(t) (рис. 24.1–24.3). За пределами R(t) пласт считается невозмущённым (p = p_0), а закон роста R(t) находится из уравнения материального баланса упругой жидкости: для плоскорадиального потока R(t) ~ √(κt). х единиц. Тип осей — линейный, диапазоны численно не подписаны, шкала качественная.\nОтмеченные (подписанные) уровни давления на вертикальной оси:\n- p_R — верхний горизонтальный уровень (максимальное/пластовое давление), обозначен пунктирной горизонтальной линией.\n- p_r1 — промежуточный уровень давления, ниже p_R.\n- p_r2 — нижний уровень давления, ниже p_r1.\nКривые/линии на графике:\n- Горизонтальная штриховая линия на "}, {"task_id": "t3_train_basniev_task_sc_05", "course_id": "t3_train_basniev", "node_id": "basniev_ch23_24_node_01", "step_id": "basniev_ch23_24_step_01", "claim_id": "basniev_ch23_24_node_01_claim_01", "pdf_page": 476, "printed_page": "476", "task_type": "single_choice", "difficulty_level": "инженерный", "prompt": "Какое утверждение точно отражает ключевой физико-геологический принцип шага «Упругий режим и упругий запас пласта» (Глава XXIII, § 1–§ 2. Упругий режим пласта и подсчёт упругого запаса жидкости (стр. 474–476))?", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": ["Верно по источнику: «Несжимаемая» нефть и твёрдая порода на масштабе пласта ведут себя как гигантская сжатая пружина, способная выдавать миллионы кубометров жидкости за счёт упругой энергии.", "Типичное заблуждение: Ошибочно считать, что при упругом режиме расширяется только нефть: сжатие поровых каналов скелета даёт до 30–50 % суммарной упругоёмкости β*.", "Параметры методики применяются без учёта граничных условий и литологии пласта", "Физический механизм не зависит от структуры порового пространства и свойств флюида"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Вариант 1: Верно по источнику: «Несжимаемая» нефть и твёрдая порода на масштабе пласта ведут себя как гигантская сжатая пружина, способная выдавать миллионы кубометров жидкости за счёт упругой энергии.", "explanation": "При снижении пластового давления жидкость расширяется, а пористый скелет сжимается под весом вышележащих пород — высвобождаемый объём формирует упругий режим работы пласта. Даже малые коэффициенты сжимаемости жидкости β_ж и породы β_с на масштабах огромного пласта дают существенный упругий запас жидкости, пропорциональный коэффициенту упругоёмкости β* = m·β_ж + β_с. (Нефтегазовая гидромеханика, Глава XXIII, § 1–§ 2. Упругий режим пласта и подсчёт упругого запаса жидкости (стр. 474–476), PDF стр. 476 (печ. стр. 476)).", "error_analysis": {"1": "Это известная ошибка интерпретации: Ошибочно считать, что при упругом режиме расширяется только нефть: сжатие поровых каналов скелета даёт до 30–50 % суммарной упругоёмкости β*.", "2": "Игнорирование граничных условий (Пренебрегать сжимаемостью породы β_с нельзя: для слабосцементированных коллекторов β_с сопоставима с m·β_ж, а для водонасыщенных пластов оба слагаемых одного порядка.) приводит к неверному решению.", "3": "В действительности механизм основан на том, что Снижение порового давления Δp вызывает одновременно два вклада в приток: упругое расширение поровой жидкости (m·β_ж·Δp) и уменьшение объёма пор за счёт роста эффективного напряжения на скелет породы (β_с·Δp)."}, "hint_steps": ["Обратите внимание на наблюдение: Объём пласта V_пл, пористость m, коэффициенты сжимаемости жидкости β_ж и скелета β_с, среднее падение давления Δp.", "Учтите физический механизм: Снижение порового давления Δp вызывает одновременно два вклада в приток: упругое расширение поровой жидкости (m·β_ж·Δp) и уменьшение объёма пор за счёт роста эффективного напряжения на скелет породы (β_с·Δp).", "Пороговая идея шага: «Несжимаемая» нефть и твёрдая порода на масштабе пласта ведут себя как гигантская сжатая пружина, способная выдавать миллионы кубометров жидкости за счёт упругой энергии."], "source_ref": "Нефтегазовая гидромеханика, Глава XXIII, § 1–§ 2. Упругий режим пласта и подсчёт упругого запаса жидкости (стр. 474–476), PDF стр. 476 (печ. стр. 476)", "verbatim_quote": "$$- \\beta_{\\tex  пористость m, коэффициенты сжимаемости жидкости β_ж и скелета β_с, среднее падение давления Δp. Кроме того, зафиксировано: В паспорте расчёта 3D Hydro Lab: при m = 0,18, β_ж = 1,2·10⁻⁹ Па⁻¹, β_с = 1,0·10⁻¹⁰ Па⁻¹ получаем β* = 3,16·10⁻¹⁰ Па⁻¹.", "case_rule": "Правило (критерий по учебнику, стр. 476): «Несжимаемая» нефть и твёрдая порода на масштабе пласта ведут себя как гигантская сжатая пружина, способная выдавать миллионы кубометров жидкости за счёт упругой энергии. (с учётом ограничения: Пренебрегать сжимаемостью породы β_с нельзя: для слабосцементированных коллекторов β_с сопоставима с m·β_ж, а для водонасыщенных пластов оба слагаемых одного порядка.)", "case_conclusion": "Вывод и решение специалиста: Оценка доли упругого запаса в материальном балансе залежи на ранней стадии разработки.", "options": ["Признаки подтверждают критерий применимости → Вывод и решение специалиста: Оценка доли упругого запаса в материальном балансе залежи на ранней стадии разработки.", "Игнорировать граничное условие (Пренебрегать сжимаемостью породы β_с нельзя: для слабосцементированных) и применить формулу вслепую", "Принять ошибочную трактовку: Ошибочно считать, что при упругом режиме расширяется только нефть: сжатие поровы", "Отказаться от количественной интерпретации при выполнении всех условий применимости"], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": [], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": 0, "answer_key_display": "Ход решения: Признаки → Правило → Вывод: Признаки подтверждают критерий применимости → Вывод и решение специалиста: Оценка доли упругого запаса в материальном балансе залежи на ранней стадии разработки.", "explanation": "По цепочке «признаки → правило → вывод»: Признаки (данные): Объём пласта V_пл, пористость m, коэффициенты сжимаемости жидкости β_ж и скелета β_с, среднее падение давления Δp. Кроме того, зафиксировано: В паспорте расчёта 3D Hydro Lab: при m = 0,18, β_ж = 1,2·10⁻⁹ Па⁻¹, β_с = 1,0·10⁻¹⁰ Па⁻¹ получаем β* = 3,16·10⁻¹⁰ Па⁻¹. → Правило (критерий по учебнику, стр. 476): «Несжимаемая» нефть и твёрдая порода на масштабе пласта ведут себя как гигантская сжатая пружина, способная выдавать миллионы кубометров жидкости за счёт упругой энергии. (с учётом ограничения: Пренебрегать сжимаемостью породы β_с нельзя: для слабосцементированных коллекторов β_с сопоставима с m·β_ж, а для водонасыщенных пластов оба слагаемых одного порядка.) → Вывод и решение специалиста: Оценка доли упругого запаса в материальном балансе залежи на ранней стадии разработки. (Нефтегазовая гидромеханика, Глава XXIII, § 1–§ 2. Упругий режим пласта и подсчёт упругого запаса жидкости (стр. 474–476), PDF стр. 476).", "error_analysis": {"1": "Применение методики без проверки граничного условия приводит к грубой ошибке в подсчётных параметрах.", "2": "Сработала типичная ловушка: Ошибочно считать, что при упругом режиме расширяется только нефть: сжатие поровых каналов скелета даёт до 30–50 % суммарной упругоёмкости β*.", "3": "Все условия применимости выполнены, поэтому отказ от интерпретации необоснован."}, "hint_steps": ["Шаг 1 (Признаки): выделите ключевой диагностический сигнал в данных — В паспорте расчёта 3D Hydro Lab: при m = 0,18, β_ж = 1,2·10⁻⁹ Па⁻¹, β_с = 1,0·10⁻¹⁰ Па⁻¹ получаем β* = 3,16·10⁻¹⁰ Па⁻¹.", "Шаг 2 (Правило): сопоставьте сигнал с пороговым критерием — «Несжимаемая» нефть и твёрдая порода на масштабе пласта ведут себя как гигантская сжатая пружина, способная выдавать миллионы кубометров жидкости за счёт упругой энергии.", "Шаг 3 (Вывод): сформулируйте решение с учётом точки контроля — Вывод и решение специалиста: Оценка доли упругого запаса в материальном балансе залежи на ранней стадии разработки."], "source_ref": "Нефтегазовая гидромеханика, Глава XXIII, § 1–§ 2. Упругий режим пласта и подсчёт упругого запаса жидкости (стр. 474–476), PDF стр. 476", "verbatim_quote": "$$- \\beta_{\\text{ж}} V_{0\\text{ж}} \\Delta p = \\Delta V_{\\text{ж}} \\quad \\text{и} \\quad \\beta_{\\tex _unit": "", "calculation_tolerance": 0.05, "correct_answer": [0, 1], "answer_key_display": "Верны пункты 1 и 2 (наблюдение и допущение модели из источника).", "explanation": "Пункты 1 и 2 соответствуют эпистемическому разложению узла (Нефтегазовая гидромеханика, Глава XXIII, § 3–§ 4. Математическая модель и вывод уравнения пьезопроводности (стр. 477–480), PDF стр. 477); пункт 3 воспроизводит типичное заблуждение.", "error_analysis": {"2": "Типичное заблуждение: Ошибочно путать коэффициент пьезопроводности κ (м²/с) с проницаемостью k (м²): при росте вязкости нефти μ или сжимаемости β* пьезопроводность κ падает, даже если проницаемость k высока.", "3": "Нарушение границ применимости делает расчёт недостоверным."}, "hint_steps": ["Сверьте наблюдения и допущения шага «Математическая модель и уравнение пьезопроводности».", "Отбросьте типичное заблуждение: Ошибочно путать коэффициент пьезопроводности κ (м²/с) с проницаемостью k (м²): при росте в", "В данном задании верны два утверждения."], "source_ref": "Нефтегазовая гидромеханика, Глава XXIII, § 3–§ 4. Математическая модель и вывод уравнения пьезопроводности (стр. 477–480), PDF стр. 477", "verbatim_quote": "$$\\Delta p = p_\\kappa - \\bar{p}, \\quad (23.6)$$  где $p_\\kappa$ – начальное пластовое давление; $\\bar{p}$ – средневзвешенное по объему возмущенной части пласта $V_0$ давление.  Вычислить средневзвешенное пластовое давление $\\bar{p}$ можно, если известна геометрия возмущенной части пласта и конкретное распределение давления в ней.  Дифференцируя равенство (23.4), получим  $$d(\\Delta V_3) = \\beta^* d[V_0(t) \\Delta p].$$"}, {"task_id": "t3_train_basniev_task_blank_01", "course_id": "t3_train_basniev", "node_id": "basniev_ch23_24_node_02", "step_id": "basniev_ch23_24_step_02", "claim_id": "basniev_ch23_24_node_02_claim_01", "pdf_page": 477, "printed_page": "477", "task_type": "fill_in_blank", "difficulty_level": "базовый", "prompt": "Заполните пропуск (термин или обозначение из шага «Математическая модель и ура 24_node_03_claim_01", "pdf_page": 484, "printed_page": "484", "task_type": "fill_in_blank", "difficulty_level": "базовый", "prompt": "Заполните пропуск (термин или обозначение из шага «Точные решения и формула упругого режима Ei», стр. 484): «_______ — это специальная функция −ei(−u) = ∫_u^∞ (e^{-x}/x) dx, задающая точное решение для линейного стока».", "case_observation": "", "case_rule": "", "case_conclusion": "", "options": [], "ordering_items": [], "matching_pairs": [], "blank_acceptable_answers": ["интегральная показательная функция", "−ei(−u)", "−ei(−u) / w(u)"], "calculation_unit": "", "calculation_tolerance": 0.05, "correct_answer": "Интегральная показательная функция", "answer_key_display": "Интегральная показательная функция (допускаются также: интегральная показательная функция, −ei(−u), −ei(−u) / w(u))", "explanation": "По определению при первом употреблении на стр. 484: Интегральная показательная функция — Специальная функция −Ei(−u) = ∫_u^∞ (e^{-x}/x) dx, задающая точное решение для линейного стока (Нефтегазовая гидромеханика, Глава XXIII, § 5 (5.1–5.2). Одномерные потоки и основная формула упругого режима (Рис. 23.1–23.4, стр. 481–493), PDF стр. 484).", "error_analysis": {"wrong_text": "Проверьте орфографию опорного термина или его каноническое обозначение (СНГ/Запад) в глоссарии шага."}, "hint_steps": ["Откройте блок опорных терминов шага «Точные решения и формула упругого режима Ei».", "СНГ-обозначение: −Ei(−u), западное: −Ei(−u) / W(u).", "Первое слово ответа: «Интегральная»."], "source_ref": "Нефтегазовая гидромеханика, Глава XXIII, § 5 (5.1–5.2). Одномерные потоки и основная формула упругого режима (Рис. 23.1–23.4, стр. 481–493), PDF стр. 484", "verbatim_quote": "━━━ FORMAT 6: XY PLOT / CHART WITH DATA ━━━\n**График изменения давления p в зависимости от координаты x для разных моментов времени**\nОси:\n- Вертикальная ось — p (давление), линейная шкала, без числовых делений, кроме двух отмеченных горизонтальными штриховыми линиями уровней: pₖ (верхний уровень) и p₁ (нижний уровень, у оси x).\n- Горизонтальная ось — x (расстояние/координата), линейная шкала, без числовых делений.\nКривые (снято с графика, приблизительно):\n- Три кривые, каждая начинается в точке (x=0, p=p₁) и монотонно возрастает, приближаясь к уровню pₖ при увеличении x.\n- Кривые подписаны св"}], "flashcards": [{"card_id": "basniev_ch23_24_step_01_card_01", "node_id": "basniev_ch23_24_node_01", "step_id": "basniev_ch23_24_step_01", "front_question": "Что означает термин «Коэффициент упругоёмкости пласта» (β*) и каков его международный эквивалент?", "back_answer": "Суммарная сжимаемость поровой жидкости и скелета породы в единице объёма пласта β* = m·β_ж + β_с. Международный эквивалент (SPE): φ·c_t (Total storage compressibility). Единица: Па⁻¹.", "term_or_formula": "β* ↔ φ·c_t", "pdf_page": 474, "printed_page": "474", "source_ref": "Нефтегазовая гидромеханика, стр. 474"}, {"card_id": "basniev_ch23_24_step_01_card_02", "node_id": "basniev_ch23_24_node_01", "step_id": "basniev_ch23_24_step_01", "front_question": "Что означает термин «Упругий запас пласта» (ΔV) и каков его международный эквивалент?", "back_answer": "Объём жидкости, выделяющийся из пласта при снижении давления на Δp за счёт упругих сил. Международный эквивалент (SPE): ΔV_e (Elastic drive expansion volume). Единица: м³.", "term_or_formula": "ΔV ↔ ΔV_e", "pdf_page": 474, "printed_page": "474", "source_ref": "Нефтегазовая гидромеханика, стр. 474"}, {"card_id": "basniev_ch23_24_step_01_card_03", "node_id": "basniev_ch23_24_node_01", "step_id": "basniev_ch23_24_step_01", "front_question": "Пороговая идея и типичная ошибка шага «Упругий режим и упругий запас пласта»", "back_answer": "Идея: «Несжимаемая» нефть и твёрдая порода на масштабе пласта ведут себя как гигантская сжатая пружина, способная выдавать миллионы кубометров жидкости за счёт упругой энергии.\nОшибка, которую нужно избегать: Ошибочно считать, что при упругом режиме расширяется только нефть: сжатие поровых каналов скелета даёт до 30–50 % суммарной упругоёмкости β*.", "term_or_formula": "Упругий режим и упругий запас пласта", "pdf_page": 476, "printed_page": "476", "source_ref": "Нефтегазовая гидромеханика, PDF стр. 476 (печ. стр. 476)"}, {"card_id": "basniev_ch23_24_step_02_card_04", "node_id": "basniev_ch23_24_node_02", "step_id": "basniev_ch23_24_step_02", "front_question": "Что означает термин «Коэффициент пьезопроводности» (κ (χ)) и каков его международный эквивалент?", "back_answer": "Параметр скорости перераспределения давления в упругом пласте κ = k / (μ·β*). Международный эквивалент (SPE): η / D_h (Hydraulic diffusivity). Единица: м²/с.", "term_or_formula": "κ (χ) ↔ η / D_h", "pdf_page": 477, "printed_page": "477", "source_ref": "Нефтегазовая гидромеханика, стр. 477"}, {"card_id": "basniev_ch23_24_step_02_card_05", "node_id": "basniev_ch23_24_node_02", "step_id": "basniev_ch23_24_step_02", "front_question": "Что означает термин «Уравнение пьезопроводности» (∂p/∂t = κ∇²p) и каков его международный эквивалент?", "back_answer": "Дифференциальное уравнение параболического типа ∂p/∂t = κ·∇²p для нестационарной фильтрации. Международный эквивалент (SPE): ∂p/∂t = η∇²p (Diffusivity equation). Единица: Па/с.", "term_or_formula": "∂p/∂t = κ∇²p ↔ ∂p/∂t = η∇²p", "pdf_page": 477, "printed_page": "477", "source_ref": "Нефтегазовая гидромеханика, стр. 477"}, {"card_id": "basniev_ch23_24_step_02_card_06", "node_id": "basniev_ch23_24_node_02", "step_id": "basniev_ch23_24_step_02", "front_question": "Пороговая идея и типичная ошибка шага «Математическая модель и уравнение пьезопроводности»", "back_answer": "Идея: Давление в упругом пласте не «бежит» как ударная волна со скоростью звука, а диффундирует как тепло — со сглаживанием фронтов и масштабом времени t ~ r² / (4κ).\nОшибка, которую нужно избегать: Ошибочно путать коэффициент пьезопроводности κ (м²/с) с проницаемостью k (м²): при росте вязкости нефти μ или сжимаемости β* пьезопроводность κ падает, даже если проницаемость k высока.", "term_or_formula": "Математическая модель и уравнение пьезопроводности", "pdf_page": 477, "printed_page": "477", "source_ref": "Нефтегазовая гидромеханика, PDF стр. 477 (печ. стр. 477)"}, {"card_id": "basniev_ch23_24_step_03_card_07", "node_id": "basniev_ch23_24_node_03", "step_id": "basniev_ch23_24_step_03", "front_question": "Что означает термин «Интегральная показательная функция» (−Ei(−u)) и каков его международный эквивалент?", "back_answer": "Специальная функция −Ei(−u) = ∫_u^∞ (e^{-x}/x) dx, задающая точное решение для линейного стока. Международный эквивалент (SPE): −Ei(−u) / W(u) (Exponential integral (Theis well function)). Единица: б/р.", "term_or_formula": "−Ei(−u) ↔ −Ei(−u) / W(u)", "pdf_page": 481, "printed_page": "481", "source_ref": "Нефтегазовая гидромеханика, стр. 481"}, {"card_id": "basniev_ch23_24_step_03_card_08", "node_id": "basniev_ch23_24_node_03", "step_id": "basniev_ch23_24_step_03", "front_question": "Что означает термин «Основная формула упругого режима» (Δp(r,t)) и каков его международный эквивалент?", "back_answer": "Зависимость падения давления Δp(r,t) = [Qμ/(4πkh)]·[−Ei(−r²/4κt)] при пуске скважины с постоянным дебитом. Международный эквивалент (SPE): Δp(r,t) (Line-source / Theis solution). Единица: Па (МПа).", "term_or_formula": "Δp(r,t) ↔ Δp(r,t)", "pdf_page": 481, "printed_page": "481", "source_ref": "Нефтегазовая гидромеханика, стр. 481"}, {"card_id": "basniev_ch23_24_step_03_card_09", "node_id": "basniev_ch23_24_node_03", "step_id": "basniev_ch23_24_step_03", "front_question": "Пороговая идея и типичная ошибка шага «Точные решения и формула упругого режима Ei»", "back_answer": "Идея: Автомодельная переменная u = r²/(4κt) означает, что вдвое более далёкая точка пласта почувствует ту же депрессию в 4 раза позже.\nОшибка, которую нужно избегать: Ошибочно применять логарифмическую формулу Δp ~ ln(2,25κt/r²) при u > 0,1 (например, в удалённой наблюдательной скважине в первые минуты): она может выдать даже отрицательную депрессию вместо точного значения −Ei(−u) > 0.", "term_or_formula": "Точные решения и формула упругого режима Ei", "pdf_page": 484, "printed_page": "484", "source_ref": "Нефтегазовая гидромеханика, PDF стр. 484 (печ. стр. 484)"}, {"card_id": "basniev_ch23_24_step_04_card_10", "node_id": "basniev_ch23_24_node_04", "step_id": "basniev_ch23_24_step_04", "front_question": "Что означает термин «Метод ПССС» (ПССС) и каков его международный эквивалент?", "back_answer": "Метод последовательной смены стационарных состояний И.А. Чарного с подвижным контуром возмущения R(t). Международный эквивалент (SPE): SSS (Successive Steady States method). Единица: метод.", "term_or_formula": "ПССС ↔ SSS", "pdf_page": 494, "printed_page": "494", "source_ref": "Нефтегазовая гидромеханика, стр. 494"}, {"card_id": "basniev_ch23_24_step_04_card_11", "node_id": "basniev_ch23_24_node_04", "step_id": "basniev_ch23_24_step_04", "front_question": "Что означает термин «Радиус возмущённой области» (R(t)) и каков его международный эквивалент?", "back_answer": "Подвижная граница R(t), до которой дошло ощутимое снижение давления к моменту времени t. Международный эквивалент (SPE): r_{inv}(t) (Radius of investigation). Единица: м.", "term_or_formula": "R(t) ↔ r_{inv}(t)", "pdf_page": 494, "printed_page": "494", "source_ref": "Нефтегазовая гидромеханика, стр. 494"}, {"card_id": "basniev_ch23_24_step_04_card_12", "node_id": "basniev_ch23_24_node_04", "step_id": "basniev_ch23_24_step_04", "front_question": "Пороговая идея и типичная ошибка шага «Метод последовательной смены стационарных состояний»", "back_answer": "Идея: ПССС делает невидимую диффузию давления физически осязаемой: нестационарный приток — это та же формула Дюпюи, но с расширяющимся контуром питания R(t) ~ √(κt).\nОшибка, которую нужно избегать: Ошибочно считать, что за 4 раза большее время фронт возмущения R(t) уйдёт в 4 раза дальше: из-за диффузионного закона √(κt) радиус охвата возрастает лишь в 2 раза.", "term_or_formula": "Метод последовательной смены стационарных состояний", "pdf_page": 495, "printed_page": "495", "source_ref": "Нефтегазовая гидромеханика, PDF стр. 495 (печ. стр. 495)"}], "summary_notes_markdown": "# Конспект главы: Глава XXIII и Глава XXIV (§1): Неустановившееся движение упругой жидкости, уравнение пьезопроводности и метод ПССС (PDF 474–500)\n**Книга:** Нефтегазовая гидромеханика (Басниев К. С., Дмитриев Н. М., Розенберг Г. Д.)  \n**Файл источника:** `Басниев и др - Нефтегазовая гидромеханика - 2005.pdf` (SHA-256: `191808991d8b0fc9...`)  \n\n## Шаг 1. Упругий режим и упругий запас пласта\n*Раздел источника:* Глава XXIII, § 1–§ 2. Упругий режим пласта и подсчёт упругого запаса жидкости (стр. 474–476) (PDF стр. 476 (печ. стр. 476))  \n**Суть:** При снижении пластового давления жидкость расширяется, а пористый скелет сжимается под весом вышележащих пород — высвобождаемый объём формирует упругий режим работы пласта. Даже малые коэффициенты сжимаемости жидкости β_ж и породы β_с на масштабах огромного пласта дают существенный упругий запас жидкости, пропорциональный коэффициенту упругоёмкости β* = m·β_ж + β_с.\n- **Механизм:** Снижение порового давления Δp вызывает одновременно два вклада в приток: упругое расширение поровой жидкости (m·β_ж·Δp) и уменьшение объёма пор за счёт роста эффективного напряжения на скелет породы (β_с·Δp).\n- **Пороговая идея:** «Несжимаемая» нефть и твёрдая порода на масштабе пласта ведут себя как гигантская сжатая пружина, способная выдавать миллионы кубометров жидкости за счёт упругой энергии.\n- **Типичная ошибка:** Ошибочно считать, что при упругом режиме расширяется только нефть: сжатие поровых каналов скелета даёт до 30–50 % суммарной упругоёмкости β*.\n- **Иллюстрация:** Соотношение фиктивной скорости фильтрации w и истинной скорости в порах v = w / m (перерисовано по рис. 18.4, стр. 358)\n\n## Шаг 2. Математическая модель и уравнение пьезопроводности\n*Раздел источника:* Глава XXIII, § 3–§ 4. Математическая модель и вывод уравнения пьезопроводности (стр. 477–480) (PDF стр. 477 (печ. стр. 477))  \n**Суть:** Совместная запись уравнения неразрывности, линейного закона Дарси и линейных уравнений состояния жидкости и скелета породы приводит к дифференциальному уравнению пьезопроводности: ∂p/∂t = κ·∇²p. Коэффициент пьезопроводности κ = k / (μ·β*) (м²/с) объединяет фильтрационную подвижность k/μ и упругоёмкость β*, задавая скорость распространения возмущений давления в пласте.\n- **Механизм:** Локальный дисбаланс притока и оттока массы жидкости в элементарном объёме породы компенсируется изменением массы за счёт упругого сжатия/расширения, что математически эквивалентно уравнению теплопроводности Фурье.\n- **Пороговая идея:** Давление в упругом пласте не «бежит» как ударная волна со скоростью звука, а диффундирует как тепло — со сглаживанием фронтов и масштабом времени t ~ r² / (4κ).\n- **Типичная ошибка:** Ошибочно путать коэффициент пьезопроводности κ (м²/с) с проницаемостью k (м²): при росте вязкости нефти μ или сжимаемости β* пьезопроводность κ падает, даже если проницаемость k высока.\n- **Иллюстрация:** Схема фильтрационной колонны Дарси и область линейного закона фильтрации (перерисовано по рис. 18.5, стр. 360)\n\n## Шаг 3. Точные решения и формула упругого режима Ei\n*Раздел источника:* Глава XXIII, § 5 (5.1–5.2). Одномерные потоки и основная формула упругого режима (Рис. 23.1–23.4, стр. 481–493) (PDF стр. 484 (печ. стр. 484))  \n**Суть:** Для прямолинейно-параллельного потока (§5.1, рис. 23.1–23.2) решение уравнения пьезопроводности выражается через интеграл вероятностей erf(x / 2√(κt)), а для плоскорадиального притока к точечной скважине с постоянным дебитом Q (§5.2, рис. 23.3–23.4) — через основную формулу упругого режима с интегральной показательной функцией: Δp(r, t) = [Qμ / (4πkh)] · [−Ei(−r² / 4κt)]. При малых значениях аргумента u = r² / (4κt) < 0,01 справедлива логарифмическая асимптотика −Ei(−u) ≈ ln(2,25·κt / r²), лежащая в основе интерпретации ГДИС.\n- **Механизм:** Пуск скважины с постоянным дебитом Q действует как линейный сток в бесконечном упругом пласте: воронка депрессии непрерывно углубляется и расширяется, а безразмерный аргумент u = r²/(4κt) объединяет пространство и время в единую автомодельную переменную.\n- **Пороговая идея:** Автомодельная переменная u = r²/(4κt) означает, что вдвое более далёкая точка пласта почувствует ту же депрессию в 4 раза позже.\n- **Типичная ошибка:** Ошибочно применять логарифмическую формулу Δp ~ ln(2,25κt/r²) при u > 0,1 (например, в удалённой наблюдательной скважине в первые минуты): она может выдать даже отрицательную депрессию вместо точного значения −Ei(−u) > 0.\n- **Иллюстрация:** Плоскорадиальный приток к скважине, логарифмическая воронка депрессии p(r) и w(r) ~ 1/r (перерисовано по рис. 20.3, стр. 416)\n\n## Шаг 4. Метод последовательной смены стационарных состояний\n*Раздел источника:* Глава XXIV, § 1. Метод последовательной смены стационарных состояний И.А. Чарного (Рис. 24.1–24.3, стр. 494–500) (PDF стр. 495 (печ. стр. 495))  \n**Суть:** Метод последовательной смены стационарных состояний (ПССС) И.А. Чарного заменяет сложную неустановившуюся задачу цепочкой квазистационарных воронок Дюпюи, ограниченных подвижным радиусом возмущённой области R(t) (рис. 24.1–24.3). За пределами R(t) пласт считается невозмущённым (p = p_0), а закон роста R(t) находится из уравнения материального баланса упругой жидкости: для плоскорадиального потока R(t) ~ √(κt).\n- **Механизм:** Объём жидкости, отобранный скважиной за время t, приравнивается к объёму упругой жидкости, высвободившейся внутри возмущённой области радиуса R(t) при логарифмическом распределении давления Дюпюи — это даёт явный закон расширения фронта возмущения R(t).\n- **Пороговая идея:** ПССС делает невидимую диффузию давления физически осязаемой: нестационарный приток — это та же формула Дюпюи, но с расширяющимся контуром питания R(t) ~ √(κt).\n- **Типичная ошибка:** Ошибочно считать, что за 4 раза большее время фронт возмущения R(t) уйдёт в 4 раза дальше: из-за диффузионного закона √(κt) радиус охвата возрастает лишь в 2 раза.\n- **Иллюстрация:** Эволюция радиуса возмущения R(t) = √(r_с² + 4κt) в методе ПССС Чарного и решение Ei (перерисовано по рис. 24.1, стр. 495)\n", "media_passports": [{"passport_id": "passport_explainer_16_9_t3_train_basniev", "course_id": "t3_train_basniev", "chapter_id": "basniev_ch23_24", "book_file": "train_basniev.md", "format_kind": "explainer_16_9", "aspect_ratio": "16:9", "resolution": "1920x1080", "fps": 30, "duration_sec": 104.12, "video_rel_path": "/outputs/t3_train_basniev/media/explainer_16_9_basniev.mp4", "srt_rel_path": "/outputs/t3_train_basniev/media/explainer_16_9_basniev.srt", "audio_rel_path": "/outputs/t3_train_basniev/media/explainer_16_9_basniev.mp3", "scene_spec_rel_path": "/outputs/t3_train_basniev/scene_specs/explainer_16_9_basniev.json", "vtt_rel_path": "/outputs/t3_train_basniev/media/explainer_16_9_basniev.vtt", "file_size_bytes": 4571030, "hook_question_0_3s": "Где теряется половина пластового давления на пути нефти от контура питания 250 метров до скважины радиуса 10 сантиметров?", "prediction_pause_sec": 1.4, "prediction_pause_window": "36,0–37,4 с (Сцена 2)", "transfer_question_end": "Во сколько раз нужно увеличить время исследования скважины t, чтобы радиус охвата воронки депрессии R(t) вырос ровно в 3 раза?", "counterexample_included": "Двукратное расширение радиуса скважины r_с под знаком логарифма ln(R_к/r_с) даёт прирост дебита <10%, в отличие от кратного эффекта обработки призабойной зоны (роста k).", "historical_to_modern_bridge": "Песчаная колонна Дарси с водяными пьезометрами и таблицы Ei(−x) → Кварцевые глубинные манометры ПДГ, интерпретация производной Бурде и 3D гидродинамические симуляторы.", "true_scale_frame_timecode": "00:24–00:52 (Сцена 2, панель разреза 1:1: h = 14 м против R_к = 250 м, отношение 1:17,86)", "vertical_exaggeration_label": "Вертикальное преувеличение ×12,5 (явно подписано на рабочем разрезе пласта)", "unified_legend": [{"role": "oil_pay", "label": "Нефте
