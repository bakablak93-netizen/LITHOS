<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" role="img" aria-label="Схема шага: 4.1.2. ПРИЧИНЫ ПОСТУПЛЕНИЯ ПЛАСТОВЫХ ФЛЮИДОВ В"><rect width="760" height="290" rx="14" fill="#11141B" /><path d="M0 245 Q190 225 380 245 T760 240 L760 290 L0 290 Z" fill="#1A202B" /><path d="M0 264 Q220 250 440 266 T760 258 L760 290 L0 290 Z" fill="#232A38" /><text x="44" y="42" fill="#D97736" font-size="13" font-weight="600" font-family="system-ui, sans-serif">Схема по источнику · стр. 239–314</text><text x="44" y="68" fill="#F4F1EA" font-size="18" font-weight="700" font-family="system-ui, sans-serif">4.1.2. ПРИЧИНЫ ПОСТУПЛЕНИЯ ПЛАСТОВЫХ ФЛЮИДОВ В</text><rect x="44" y="84" width="672" height="42" rx="8" fill="#181C24" stroke="#2A3140" /><circle cx="66" cy="105" r="5" fill="#E5954A" /><text x="84" y="110" fill="#F4F1EA" font-size="14" font-family="system-ui, sans-serif">знак проявления — увеличение объема бурового раствора в приемной емкости</text><rect x="44" y="138" width="672" height="42" rx="8" fill="#181C24" stroke="#2A3140" /><circle cx="66" cy="159" r="5" fill="#D97736" /><text x="84" y="164" fill="#F4F1EA" font-size="14" font-family="system-ui, sans-serif">Если вытесняемый объем превышает расчетный и в скважине не прекращается </text><rect x="44" y="192" width="672" height="42" rx="8" fill="#181C24" stroke="#2A3140" /><circle cx="66" cy="213" r="5" fill="#38BDF8" /><text x="84" y="218" fill="#F4F1EA" font-size="14" font-family="system-ui, sans-serif">Объем вытесняемой жидкости при спуске труб можно контролировать по объем</text></svg>